:root{--sky:#cfe5ff;--cream:#fff8ec;--card:#fffdf8;--ink:#2c2550;--ink2:#575079;--mut:#8f88ad;--line:#e9e1f5;--lilac:#a996f2;--lilac2:#e9e3ff;--mint:#7fd6ae;--mint2:#dcf5e8;
  --butter:#ffd86b;--butter2:#fff1c4;--coral:#ff8b7b;--coral2:#ffe2dc;--sh:0 3px 0 rgba(44,37,80,.10),0 16px 34px -18px rgba(44,37,80,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:linear-gradient(180deg,var(--sky) 0,#e8f1ff 260px,var(--cream) 520px) no-repeat,var(--cream)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.disp{font-family:'Fraunces',Georgia,serif;font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 72;letter-spacing:-.015em}
.hand{font-family:'Caveat',cursive;font-weight:700}
.cloud{position:absolute;z-index:-1;opacity:.9;pointer-events:none}
.app{max-width:1060px;margin:0 auto;padding:16px 16px 130px;position:relative;isolation:isolate}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.crest{width:46px;height:46px;flex:none}
.lv{flex:1;min-width:0}
.lv b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:9px;background:rgba(255,255,255,.75);overflow:hidden;margin-top:5px;box-shadow:inset 0 0 0 1.5px rgba(44,37,80,.08)}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--lilac),#7f6be6)}
.flame{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;box-shadow:var(--sh);flex:none}
.flame svg{width:22px;height:22px}
.ib{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh);font-size:18px;color:var(--ink2)}
h1.page{font-size:34px;line-height:1.05}
.sub{color:var(--ink2);margin:6px 0 16px;line-height:1.45}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;min-width:0;position:relative}
.card h2{font-family:'Fraunces',Georgia,serif;font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:21px;letter-spacing:-.01em}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.app{padding-top:24px}}
.row{display:flex;align-items:center;gap:12px;min-width:0}.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--lilac2);color:#5b48c9;white-space:nowrap}
.pill.mint{background:var(--mint2);color:#1f8a5c}.pill.coral{background:var(--coral2);color:#c2493a}.pill.butter{background:var(--butter2);color:#9a6b00}
/* greeting */
.greet{background:linear-gradient(135deg,#fff,#f4efff);overflow:hidden}
.greet .big{font-size:30px;line-height:1.05}
.greet .stk{display:flex;align-items:center;gap:14px;margin-top:14px;background:var(--butter2);border-radius:18px;padding:12px 14px}
.greet .stk svg{width:44px;height:44px;flex:none}
.greet .stk b{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:30px;line-height:1}
/* chore rows */
.chore{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line);min-width:0}
.chore:last-child{border-bottom:0}
.chore .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.chore b{display:block;font-weight:600;line-height:1.25}
.chore small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.chore small .late{color:#c2493a;font-weight:600}
.go{width:44px;height:44px;border-radius:14px;background:var(--mint);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 #4fae84;font-size:20px;font-weight:800;transition:transform .1s}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #4fae84}
.later{font-size:12px;font-weight:600;color:var(--mut);padding:6px 4px;flex:none}
.done-row b{text-decoration:line-through;color:var(--mut)}
.done-row .go{background:var(--line);box-shadow:none;color:var(--mut)}
.qw{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.q{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--butter2);text-align:left;font-weight:600;min-width:0;border:2px solid transparent}
.q span:nth-child(2){flex:1;min-width:0}
.q .xp{font-size:12px;font-weight:700;color:#9a6b00;white-space:nowrap}
.q .bx{width:26px;height:26px;border-radius:9px;border:2.5px solid #e5b93d;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:#fff}
.q.on{background:#fff;border-color:var(--butter2)}.q.on span:nth-child(2){text-decoration:line-through;color:var(--mut)}.q.on .bx{background:#e5b93d}
/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;box-shadow:0 4px 0 #120d2b;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #120d2b}
.btn.lil{background:#7f6be6;box-shadow:0 4px 0 #5a48c2}.btn.mint{background:#3fbf86;box-shadow:0 4px 0 #2a9467}.btn.coral{background:var(--coral);box-shadow:0 4px 0 #d9604f}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:13px}
.btn.danger{background:#fff;color:#c2493a;box-shadow:none;border:2px solid var(--coral2)}
.sprint{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.sprint button{padding:12px 4px;border-radius:14px;background:var(--lilac2);color:#5b48c9;font-weight:800;font-family:'Fraunces',Georgia,serif;font-size:20px}
.sprint button small{display:block;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600}
/* castle */
.keep{position:relative;text-align:center;padding:10px 10px 4px;overflow:hidden}
.keep svg.cas{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.keep .pct{position:absolute;top:14px;right:16px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:var(--sh);text-align:center}
.keep .pct b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:26px;line-height:1}
.keep .pct small{font-size:11px;color:var(--mut);font-weight:600}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:50px 14px;margin-top:48px}
@media(min-width:700px){.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.rooms{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tower{position:relative;background:var(--card);border-radius:8px 8px 22px 22px;padding:16px 14px 14px;box-shadow:var(--sh);cursor:pointer;text-align:center;min-width:0}
.tower .cren{position:absolute;left:0;right:0;top:-14px;height:16px;display:flex;justify-content:space-between;padding:0 4px}
.tower .cren i{width:18%;height:16px;background:var(--card);border-radius:4px 4px 0 0}
.tower .flag{position:absolute;top:-44px;left:50%;width:2px;height:32px;background:var(--ink2)}
.tower .flag::after{content:"";position:absolute;left:2px;top:0;border-left:22px solid var(--fc);border-top:8px solid transparent;border-bottom:8px solid transparent;transition:border-color .3s}
.tower .win{width:62px;height:72px;border-radius:31px 31px 10px 10px;margin:0 auto 8px;display:grid;place-items:center;font-size:30px;position:relative}
.tower b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .sp{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.tower .sp i{display:block;height:100%;border-radius:9px}
.tower small{font-size:12px;color:var(--mut);font-weight:600}
.bunnies{position:absolute;bottom:6px;left:6px;display:flex;gap:1px}
.bunnies svg{width:18px;height:16px}
/* dragon */
.lair{background:linear-gradient(180deg,#f1ecff,#fff);text-align:center;overflow:hidden}
.lair svg.drg{width:min(280px,80%);height:auto;display:block;margin:0 auto}
.hp{display:flex;gap:3px;margin:12px 0 6px}
.hp i{flex:1;height:14px;border-radius:5px;background:var(--coral);transition:background .3s}
.hp i.gone{background:var(--line)}
.load{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.load:last-child{border-bottom:0}
.load .nm{font-weight:700;min-width:90px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1;min-width:230px}
.steps button{padding:9px 2px;border-radius:12px;font-size:13px;font-weight:700;background:var(--lilac2);color:#7366b3}
.steps button.hit{background:var(--mint);color:#fff}
.steps button.next{background:var(--coral);color:#fff;box-shadow:0 3px 0 #d9604f}
.x{width:30px;height:30px;border-radius:50%;color:var(--mut);font-size:15px;flex:none}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.types button{padding:9px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:14px}
/* hero */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.stats div{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);text-align:center;min-width:0}
.stats b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:28px;line-height:1.1}
.stats small{font-size:12px;color:var(--mut);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.bdg{text-align:center;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.bdg .md{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:28px;background:var(--butter2);border:3px solid #ffd86b}
.bdg.off{opacity:.45}.bdg.off .md{background:var(--line);border:3px dashed #cfc6e6;filter:grayscale(1)}
.log{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log:last-child{border-bottom:0}
.log span:first-child{flex:1;min-width:0}
.log b{color:#5b48c9;white-space:nowrap}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;background:var(--ink);padding:6px;border-radius:22px;z-index:20;box-shadow:0 18px 40px -12px rgba(44,37,80,.7);max-width:calc(100vw - 20px)}
nav:empty{display:none}
nav button{color:rgba(255,255,255,.62);padding:8px 14px;border-radius:17px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px}
nav button span{font-size:20px;line-height:1.1}
nav button.on{background:#fff;color:var(--ink)}
/* modal */
.bg{position:fixed;inset:0;background:rgba(44,37,80,.4);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;overflow-x:hidden;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1.2)}
@media(min-width:700px){.bg{align-items:center}.modal{border-radius:28px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h3{font-family:'Fraunces',Georgia,serif;font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:26px}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.inp{width:100%;min-width:0;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--lilac)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>*{min-width:0}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:22px;background:var(--lilac2);border:2px solid transparent}
.emojis button.on{border-color:#7f6be6;background:#fff}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.picks button{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;text-align:left;min-width:0}
.picks button.on{border-color:#7f6be6;background:var(--lilac2)}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.toast{max-width:92vw;text-align:center;position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;z-index:70;animation:up .25s,out .3s 2.3s forwards}
@keyframes out{to{opacity:0}}
.float{position:fixed;z-index:75;pointer-events:none;font-weight:800;color:#5b48c9;font-family:'Fraunces',Georgia,serif;font-size:22px;animation:rise 1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.spark{position:fixed;z-index:76;pointer-events:none;width:10px;height:10px;border-radius:50%}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
.empty .disp{font-size:22px;color:var(--ink);margin-bottom:4px}
.timer{text-align:center}
.timer svg{width:220px;height:220px;display:block;margin:10px auto}
.victory{text-align:center}
.victory .disp{font-size:34px;margin:6px 0}
/* welcome */
.hero{text-align:center;padding:2vh 6px 10px;max-width:540px;margin:0 auto}
.hero svg.cas{width:100%;max-width:400px;height:auto}
.hero h1{font-size:clamp(40px,11vw,62px);line-height:.95;margin-top:8px}
.hero h1 i{color:#7f6be6;font-style:normal}
.hero p{color:var(--ink2);font-size:17px;max-width:440px;margin:14px auto 22px;line-height:1.5}
@media(max-width:400px){nav button{min-width:0;padding:8px 11px}h1.page{font-size:30px}.load .nm{min-width:0;width:100%}.steps{min-width:0}}

const isDue = c => !c.last || since(c.last) >= c.every;

  ${W(67,92,0)}${W(279,92,1)}${W(173,74,2)}${W(67,136,3)}${W(279,136,4)}${W(122,128,5)}${W(224,128,6)}

/* ── feedback ── */
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2700); }
function burst(x, y, n=14){ const cols = ["#ffd86b","#a996f2","#7fd6ae","#ff8b7b","#7fc8f8"]; for(let i=0;i<n;i++){ const s = document.createElement("div"); s.className = "spark";
  s.style.left = x+"px"; s.style.top = y+"px"; s.style.background = cols[i%cols.length]; document.body.appendChild(s); const a = Math.random()*Math.PI*2, r = 40+Math.random()*60;
  s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:700+Math.random()*300,easing:"ease-out"}).onfinish = () => s.remove(); } }
function floatXp(n, el){ const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/3, width:0};
  const f = document.createElement("div"); f.className = "float"; f.textContent = `+${n} XP`; f.style.left = (r.left + r.width/2 - 30) + "px"; f.style.top = (r.top - 10) + "px";
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000); burst(r.left + r.width/2, r.top + 10, 12); }
function modal(html, mount){ close(); const bg = document.createElement("div"); bg.className = "bg"; bg.id = "modal"; bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("mousedown", e => { if(e.target === bg && !document.getElementById("tmr")) close(); }); document.body.appendChild(bg); mount && mount(bg.querySelector(".modal")); }
function close(){ document.getElementById("modal")?.remove(); clearInterval(tick); }
document.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
function award(id){ if(S.badges[id]) return; S.badges[id] = today(); const b = BADGES.find(x=>x[0]===id); setTimeout(() => toast(`Badge earned: ${b[2]} ${b[1]}`), 900); }
function gain(n, what, el){ const before = lvlOf(S.xp); S.xp += n; S.act[today()] = (S.act[today()]||0) + 1; S.log.unshift({d:today(), what, xp:n}); S.log = S.log.slice(0,60);
  const st = streak(); S.best = Math.max(S.best||0, st); if(st >= 3) award("s3"); if(st >= 7) award("s7"); if(st >= 30) award("s30");
  if(castleSparkle() > .8) award("castle"); if(S.rooms.some(r => roomChores(r).length && sparkle(r) === 1)) award("room");
  save(); floatXp(n, el); const after = lvlOf(S.xp); if(after > before) setTimeout(() => { burst(innerWidth/2, innerHeight/3, 40); toast(`Level ${after}! You are now a ${titleOf(after)}`); }, 600); }

/* ── views ── */
let view = {tab:"today"}, tick = null, showAll = false;
function render(){ const app = document.getElementById("app");
  if(!S.hero){ app.innerHTML = welcome(); document.getElementById("nav").innerHTML = ""; return; }
  app.innerHTML = hdr() + ({today:todayView, castle:castleView, dragon:dragonView, hero:heroView}[view.tab] || todayView)(); nav(); }
function hdr(){ const l = lvlOf(S.xp), f = (S.xp - xpAt(l)) / (xpAt(l+1) - xpAt(l));
  return `<header class="hdr">${crest()}<div class="lv"><b>Lv ${l} · ${titleOf(l)}</b><div class="xpbar"><i style="width:${f*100}%"></i></div></div>
  <div class="flame">${flameSvg}${streak()}</div><button class="ib" data-a="settings" aria-label="Settings">⚙︎</button></header>`; }
function nav(){ document.getElementById("nav").innerHTML = [["today","☀️","Today"],["castle","🏰","Castle"],["dragon","🐉","Dragon"],["hero","🛡️","Hero"]].map(([k,i,l]) =>
  `<button class="${view.tab===k?"on":""}" data-tab="${k}"><span>${i}</span>${l}</button>`).join(""); }
function welcome(){ return `<div class="hero">${castleSvg(.9)}<h1 class="disp">Home <i>Quest</i></h1>
  <p>Chores, but it is a game. Your home is a castle, every room is a tower to keep sparkling, and the Laundry Dragon will not slay itself.</p>
  <button class="btn lil" data-a="setup" style="padding:16px 30px;font-size:17px">Start my quest</button><div style="margin-top:16px"><button class="btn ghost sm" data-a="demo">Peek at a castle in progress</button></div>
  <p class="note" style="margin-top:20px">Made for brains that hate boring lists. Small steps, quick wins, and no guilt for a rest day.</p></div>`; }
const dueList = () => S.chores.filter(c => isDue(c) && !snoozed(c)).sort((a,b) => late(b) - late(a) || (a.effort||1) - (b.effort||1));
function choreRow(c, doneToday){ const r = roomOf(c.roomId) || {name:"", icon:"🧹", color:"#a996f2"}; const l = late(c);
  return `<div class="chore ${doneToday?"done-row":""}" id="c-${c.id}"><div class="ic" style="background:${r.color}33">${r.icon}</div>
   <div class="grow"><b>${esc(c.name)}</b><small>${esc(r.name)} · ${EFFORT[c.effort||1][1]} XP${!doneToday && c.last && l > 0 ? ` · <span class="late">${l} day${l===1?"":"s"} late</span>` : !c.last && !doneToday ? " · first time" : ""}</small></div>
   ${doneToday ? "" : `<button class="later" data-a="snooze" data-id="${c.id}">Later</button>`}<button class="go" data-a="do" data-id="${c.id}" aria-label="Done">✓</button></div>`; }
function todayView(){ const due = dueList(); const doneToday = S.chores.filter(c => c.last === today()); const qi = todaysQuick(), qd = S.quick[today()] || [];
  const h = new Date().getHours(); const hi = h < 12 ? "Morning" : h < 18 ? "Afternoon" : "Evening"; const st = streak();
  return `<div class="cols"><div>
  <section class="card greet"><div class="disp big">${hi}, ${esc(S.hero)}.</div><div class="sub" style="margin:6px 0 0">${due.length ? `${due.length} chore${due.length===1?"":"s"} ready for you. Start with the smallest one.` : "Nothing due. The castle is sparkling."}</div>
    <div class="stk">${flameSvg}<div class="grow"><b>${st}</b> <span style="font-weight:700">day streak</span><div class="note">${S.rest ? "Rest days are allowed: one missed day will not break it." : "Do one thing a day to keep it going."} Best: ${S.best||st}</div></div></div></section>
  <div class="card"><div class="ch"><h2>Today's quick wins</h2><span class="pill butter">${qd.length}/3</span></div><div class="qw">
    ${qi.map(i => `<button class="q ${qd.includes(i)?"on":""}" data-a="quick" data-i="${i}"><span class="bx">${qd.includes(i)?"✓":""}</span><span>${QUICK[i]}</span><span class="xp">+10 XP</span></button>`).join("")}</div>
    <p class="note" style="margin-top:10px">Three tiny jobs, new ones every day. Each takes under five minutes.</p></div>
  <div class="card"><h2>Can't get started?</h2><p class="note">Set a timer and do whatever you can until it rings. Stopping when it ends is allowed.</p>
    <div class="sprint">${[5,10,15,25].map(m=>`<button data-a="sprint" data-m="${m}">${m}<small>minutes</small></button>`).join("")}</div></div></div><div>
  <div class="card"><div class="ch"><h2>Ready to do</h2>${due.length > 1 ? `<button class="btn sm lil" data-a="pick">Pick one for me</button>` : ""}</div>
    ${due.slice(0, showAll ? 999 : 6).map(c => choreRow(c)).join("")}${due.length > 6 && !showAll ? `<button class="btn ghost sm" data-a="more" style="width:100%;margin-top:10px">Show all ${due.length}</button>` : ""}${due.length ? "" : `<div class="empty"><div class="disp">All clear</div>Every tower is sparkling. Go and rest, you earned it.</div>`}</div>
  ${doneToday.length ? `<div class="card"><h2>Done today</h2>${doneToday.map(c => choreRow(c, true)).join("")}</div>` : ""}</div></div>`; }
function castleView(){ const f = castleSparkle();
  return `<h1 class="page disp">Your <span style="color:#7f6be6">castle</span></h1><p class="sub">Each tower is a room. Keep its chores done and the flag flies.</p>
  <div class="card keep">${castleSvg(f)}<div class="pct"><b>${Math.round(f*100)}%</b><small>sparkle</small></div></div>
  <div class="rooms">${S.rooms.map(r => { const s = sparkle(r), cs = roomChores(r), due = cs.filter(isDue).length; const lateN = Math.min(4, cs.filter(c => isDue(c) && late(c) > 0).length);
    const col = s >= .8 ? "#3fbf86" : s >= .5 ? "#ffc23d" : "#ff8b7b";
    return `<div class="tower" data-a="room" data-id="${r.id}" style="--fc:${s >= .8 ? r.color : "#d8d2e8"}"><div class="flag"></div><div class="cren"><i></i><i></i><i></i><i></i></div>
      <div class="win" style="background:${r.color}40">${r.icon}</div><b>${esc(r.name)}</b><div class="sp"><i style="width:${s*100}%;background:${col}"></i></div>
      <small>${due ? `${due} to do` : "Sparkling"} · ${Math.round(s*100)}%</small>${lateN ? `<div class="bunnies">${bunny.repeat(lateN)}</div>` : ""}</div>`; }).join("")}
    <button class="tower" data-a="newRoom" style="border:2.5px dashed #cfc6e6;background:transparent;box-shadow:none"><div class="win" style="background:var(--lilac2);font-size:26px">+</div><b>Add a room</b><small>New tower</small></button></div>`; }
function dragonView(){ const d = S.dragon, max = d.loads.length*4, hp = d.loads.reduce((t,l)=>t + 4 - l.step, 0); const mood = !d.loads.length ? "asleep" : hp/max > .6 ? "angry" : "hurt";
  return `<h1 class="page disp">The Laundry <span style="color:#ff8b7b">Dragon</span></h1><p class="sub">Every load is four hits: wash, dry, fold, put away. Land them all and the dragon goes down.</p>
  <div class="cols"><div><div class="card lair">${dragonSvg(mood)}
    ${d.loads.length ? `<div class="hp">${[...Array(max)].map((_,i)=>`<i class="${i >= hp ? "gone" : ""}"></i>`).join("")}</div><div class="row" style="justify-content:space-between"><b>${hp} / ${max} HP</b><span class="pill">${d.wins} defeated so far</span></div>`
      : `<div class="disp" style="font-size:22px;margin-top:6px">The dragon is asleep</div><p class="note">It wakes up when the basket fills. Add a load when you are ready to fight.</p><div style="margin-top:8px"><span class="pill">${d.wins} defeated so far</span></div>`}</div></div><div>
  <div class="card"><div class="ch"><h2>The pile</h2><span class="note">${d.loads.length} load${d.loads.length===1?"":"s"}</span></div>

      <button class="x" data-a="dropLoad" data-id="${l.id}" aria-label="Remove load">✕</button></div>`).join("") || `<p class="note">No laundry waiting. Enjoy the quiet.</p>`}
    <label class="f">Add a load to the pile</label><div class="types">${["Darks","Lights","Towels","Bedding","Mixed","Kids' clothes","Sportswear"].map(k=>`<button data-a="addLoad" data-k="${k}">+ ${k}</button>`).join("")}</div></div></div></div>`; }
function heroView(){ const l = lvlOf(S.xp), st = streak(); const roomsDone = S.chores.length;
  return `<h1 class="page disp">${esc(S.hero)}, <span style="color:#7f6be6">${titleOf(l)}</span></h1><p class="sub">Level ${l} · ${S.xp} XP · ${xpAt(l+1) - S.xp} XP to level ${l+1}</p>
  <div class="stats" style="margin-bottom:14px"><div><b>${st}</b><small>day streak</small></div><div><b>${S.best||st}</b><small>best streak</small></div><div><b>${S.total}</b><small>chores done</small></div><div><b>${S.dragon.wins}</b><small>dragons defeated</small></div></div>
  <div class="cols"><div class="card"><h2 style="margin-bottom:12px">Badges</h2><div class="badges">${BADGES.map(([k,i,n])=>`<div class="bdg ${S.badges[k]?"":"off"}"><div class="md">${i}</div>${n}</div>`).join("")}</div></div>
  <div class="card"><h2 style="margin-bottom:6px">Quest log</h2>${S.log.slice(0,12).map(x=>`<div class="log"><span>${esc(x.what)}</span><span class="note">${x.d===today()?"today":since(x.d)===1?"yesterday":`${since(x.d)} days ago`}</span><b>+${x.xp}</b></div>`).join("")
    || `<p class="note">Your wins will show up here.</p>`}<p class="note" style="margin-top:10px">${roomsDone} chores across ${S.rooms.length} rooms.</p></div></div>`; }

/* ── actions + forms ── */
function doChore(c, el){ c.last = today(); c.snooze = ""; S.total = (S.total||0) + 1; award("first"); if(S.total >= 50) award("c50"); if(S.total >= 200) award("c200");
  gain(EFFORT[c.effort||1][1], c.name, el); setTimeout(render, 450); }
function setupForm(){ let pick = new Set([0,1,2,3,4]);
  modal(`<h3>Create your hero</h3><label class="f">Your name</label><input class="inp" id="n" placeholder="What should we call you?">
   <label class="f">Which rooms are in your castle?</label><div class="picks">${ROOM_SET.map(([n,i],k)=>`<button class="${pick.has(k)?"on":""}" data-k="${k}"><span>${i}</span>${n}</button>`).join("")}</div>
   <p class="note" style="margin-top:8px">Each room comes with a few starter chores. You can change everything later.</p>
   <div class="acts"><button class="btn ghost" data-close>Back</button><button class="btn lil" id="ok">Begin</button></div>`, m => {
    m.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = +b.dataset.k; pick.has(k) ? pick.delete(k) : pick.add(k); b.classList.toggle("on", pick.has(k)); });
    m.querySelector("#ok").onclick = () => { const n = v(m,"#n"); if(!n) return toast("Pick a hero name"); if(!pick.size) return toast("Choose at least one room");
      S.hero = n; [...pick].sort((a,b)=>a-b).forEach(k => addRoom(...ROOM_SET[k])); save(); close(); render(); toast("Your quest begins. Try one quick win."); };
  }); }
function addRoom(name, icon, color, chores){ const id = uid(); S.rooms.push({id, name, icon, color}); (chores||[]).forEach(([n,every,effort]) => S.chores.push({id:uid(), roomId:id, name:n, every, effort, last:"", snooze:""})); return id; }
function roomSheet(r){ const cs = roomChores(r).sort((a,b)=>a.every-b.every);
  modal(`<div class="row"><div class="ic" style="width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:${r.color}40">${r.icon}</div>
    <div class="grow"><h3>${esc(r.name)}</h3><div class="note">${Math.round(sparkle(r)*100)}% sparkling</div></div><button class="btn ghost sm" id="er">Edit</button></div>
   <div style="margin-top:8px">${cs.map(c => { const due = isDue(c); return `<div class="chore ${due?"":"done-row"}"><div class="grow" data-ec="${c.id}" style="cursor:pointer"><b style="${due?"":"text-decoration:none;color:var(--ink)"}">${esc(c.name)}</b>
     <small>${everyName(c.every)} · ${EFFORT[c.effort||1][1]} XP · ${!c.last ? "not done yet" : c.last===today() ? "done today" : `done ${since(c.last)} day${since(c.last)===1?"":"s"} ago`}${due && late(c) > 0 ? ` · <span class="late">${late(c)} late</span>` : ""}</small></div>
     ${due ? `<button class="go" data-do="${c.id}">✓</button>` : `<span class="pill mint">✓ fresh</span>`}</div>`; }).join("") || `<p class="note" style="padding:10px 0">No chores in this room yet.</p>`}</div>
   <div class="card" style="background:var(--lilac2);box-shadow:none;margin:14px 0 0"><label class="f" style="margin-top:0">New chore</label><input class="inp" id="cn" placeholder="Descale the kettle">
     <div class="two" style="margin-top:8px"><select class="inp" id="ce">${EVERY.map(([d,l])=>`<option value="${d}" ${d===7?"selected":""}>${l}</option>`).join("")}</select>
     <select class="inp" id="cf">${Object.entries(EFFORT).map(([k,[l,x]])=>`<option value="${k}">${l} · ${x} XP</option>`).join("")}</select></div>
     <button class="btn lil" id="add" style="width:100%;margin-top:10px">+ Add chore</button></div>
   <div class="acts"><button class="btn ghost" data-close>Close</button></div>`, m => {
    m.querySelectorAll("[data-do]").forEach(b => b.onclick = () => { const c = S.chores.find(x=>x.id===b.dataset.do); doChore(c, b); setTimeout(() => roomSheet(r), 460); });
    m.querySelectorAll("[data-ec]").forEach(b => b.onclick = () => choreForm(S.chores.find(x=>x.id===b.dataset.ec), r));
    m.querySelector("#add").onclick = () => { const n = v(m,"#cn"); if(!n) return m.querySelector("#cn").focus(); S.chores.push({id:uid(), roomId:r.id, name:n, every:+v(m,"#ce"), effort:+v(m,"#cf"), last:"", snooze:""}); save(); render(); roomSheet(r); };
    m.querySelector("#er").onclick = () => roomForm(r);

function choreForm(c, r){ modal(`<h3>Edit chore</h3><label class="f">Chore</label><input class="inp" id="n" value="${esc(c.name)}">

   <div><label class="f">Effort</label><select class="inp" id="f">${Object.entries(EFFORT).map(([k,[l,x]])=>`<option value="${k}" ${+k===(c.effort||1)?"selected":""}>${l} · ${x} XP</option>`).join("")}</select></div></div>
   <label class="f">Last done</label><input class="inp" type="date" id="l" value="${c.last||""}">
   <div class="acts"><button class="btn danger" id="del">Delete</button><button class="btn lil" id="ok">Save</button></div>`, m => {
    m.querySelector("#ok").onclick = () => { Object.assign(c, {name:v(m,"#n")||c.name, every:+v(m,"#e"), effort:+v(m,"#f"), last:v(m,"#l")}); save(); render(); roomSheet(r); };
    m.querySelector("#del").onclick = () => { S.chores = S.chores.filter(x=>x.id!==c.id); save(); render(); roomSheet(r); };
  }); }
function roomForm(r){ const e = !!r; r = r || {name:"", icon:ICONS[8], color:COLORS[S.rooms.length % COLORS.length]}; let icon = r.icon, color = r.color;
  modal(`<h3>${e?"Edit room":"New room"}</h3><label class="f">Name</label><input class="inp" id="n" value="${esc(r.name)}" placeholder="Utility room">
   <label class="f">Icon</label><div class="emojis">${ICONS.map(i=>`<button class="${i===icon?"on":""}" data-i="${i}">${i}</button>`).join("")}</div>
   <label class="f">Flag colour</label><div class="emojis">${COLORS.map(c=>`<button class="${c===color?"on":""}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
   <div class="acts">${e?`<button class="btn danger" id="del">Delete room</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn lil" id="ok">Save</button></div>`, m => {
    m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { icon = b.dataset.i; m.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("on",x===b)); });
    m.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { color = b.dataset.c; m.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===b)); });
    m.querySelector("#ok").onclick = () => { const n = v(m,"#n"); if(!n) return toast("Name the room");
      if(e){ Object.assign(r, {name:n, icon, color}); save(); render(); roomSheet(r); } else { const id = addRoom(n, icon, color, []); save(); render(); roomSheet(roomOf(id)); } };
    if(e) m.querySelector("#del").onclick = () => { if(!confirm(`Knock down the ${r.name} tower and its chores?`)) return; S.rooms = S.rooms.filter(x=>x.id!==r.id); S.chores = S.chores.filter(c=>c.roomId!==r.id); save(); close(); render(); };
  }); }
function sprint(min){ const end = Date.now() + min*6e4, R = 96, C = 2*Math.PI*R;
  modal(`<div class="timer" id="tmr"><h3>${min}-minute sprint</h3><p class="note">Pick any job and keep going until the ring empties.</p>
   <svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="${R}" fill="none" stroke="#e9e3ff" stroke-width="16"/><circle id="ring" cx="110" cy="110" r="${R}" fill="none" stroke="#7f6be6" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 110 110)"/>
   <text id="tt" x="110" y="124" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="44" fill="#2c2550">${min}:00</text></svg>
   <div class="acts"><button class="btn ghost" id="quit">Stop</button><button class="btn mint" id="fin">I'm done</button></div></div>`, m => {
    const finish = full => { clearInterval(tick); S.sprints = (S.sprints||0) + 1; award("sprint"); close(); const xp = full ? 15 + min : 10; gain(xp, `${min}-minute sprint`, null); render();
      try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){} toast(full ? "Time! Brilliant sprint." : "Sprint logged. Every minute counts."); };
    const upd = () => { const left = Math.max(0, end - Date.now()); const s = Math.ceil(left/1000); const tt = document.getElementById("tt"); if(!tt) return clearInterval(tick);
      tt.textContent = `${Math.floor(s/60)}:${pad(s%60)}`; document.getElementById("ring").setAttribute("stroke-dashoffset", C*(1 - left/(min*6e4))); if(left <= 0) finish(true); };
    clearInterval(tick); tick = setInterval(upd, 250); upd();
    m.querySelector("#quit").onclick = () => close(); m.querySelector("#fin").onclick = () => finish(false);
  }); }
function victory(){ burst(innerWidth/2, innerHeight/3, 60); setTimeout(() => burst(innerWidth/3, innerHeight/2, 40), 300);
  modal(`<div class="victory">${dragonSvg("ko")}<div class="disp">Dragon defeated!</div><p class="note">Every load washed, dried, folded and put away. +50 bonus XP.</p>
   <p class="hand" style="font-size:24px;color:#7f6be6;margin-top:8px">It will be back. It always comes back. But not today.</p><div class="acts"><button class="btn lil" data-close>Victory</button></div></div>`); }
function settings(){ modal(`<h3>Settings</h3><p class="note">Your castle is saved on this device only.</p>
  <label class="f">Hero name</label><input class="inp" id="n" value="${esc(S.hero)}">
  <label class="f">Streak rule</label><div class="picks"><button class="${S.rest?"on":""}" data-r="1">😌 Rest days allowed</button><button class="${!S.rest?"on":""}" data-r="0">🔥 Strict, every day</button></div>
  <p class="note" style="margin-top:6px">With rest days on, one missed day keeps your streak. Two in a row resets it.</p>
  <label class="f">Your data</label><div class="two"><button class="btn ghost sm" id="ex">Backup file</button><button class="btn ghost sm" id="im">Restore backup</button></div>
  <div class="two" style="margin-top:10px"><button class="btn ghost sm" id="demo">Load sample castle</button><button class="btn danger sm" id="wipe">Erase everything</button></div>
  <div class="acts"><button class="btn lil" id="ok">Done</button></div>`, m => {
    let rest = S.rest; m.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { rest = b.dataset.r === "1"; m.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b)); });
    m.querySelector("#ok").onclick = () => { S.hero = v(m,"#n") || S.hero; S.rest = rest; save(); close(); render(); };
    m.querySelector("#ex").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download = `home-quest-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("Backup downloaded"); };
    m.querySelector("#im").onclick = () => document.getElementById("imp").click();
    m.querySelector("#demo").onclick = () => { if(confirm("Replace your castle with the sample one?")){ demo(); close(); view.tab = "today"; render(); } };
    m.querySelector("#wipe").onclick = () => { if(confirm("Erase your whole quest? Download a backup first if you want to keep it.")){ localStorage.removeItem(KEY); S = blank(); view = {tab:"today"}; close(); render(); } };
  }); }
document.getElementById("imp").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(d.v!==1 || !Array.isArray(d.rooms) || !Array.isArray(d.chores)) throw 0; S = Object.assign(blank(), d); save(); close(); render(); toast("Backup restored"); }catch(err){ toast("That is not a Home Quest backup"); } }; r.readAsText(f); e.target.value = ""; };

function demo(){ S = blank(); S.hero = "Sam"; S.xp = 1180; S.total = 74; S.best = 12; S.sprints = 6;
  [0,1,2,3,4].forEach(k => addRoom(...ROOM_SET[k]));
  const ago = {"Wash up or load the dishwasher":0,"Wipe the counters":1,"Take out the rubbish":2,"Clean the hob":9,"Mop the floor":4,"Clear out the fridge":20,"Ten-thing tidy":0,"Plump cushions, fold throws":1,"Vacuum":3,
    "Dust the surfaces":5,"Make the bed":0,"Clothes off the chair":5,"Change the sheets":8,"Wipe the sink and mirror":1,"Clean the toilet":2,"Fresh towels":3,"Scrub the shower or bath":11,"Shoes away":4,"Sort the post":1,"Sweep or vacuum":6};
  const seen = {}; S.chores.forEach(c => { let d = ago[c.name]; if(c.name==="Vacuum"){ seen.v = (seen.v||0) + 1; d = seen.v === 1 ? 3 : 8; } c.last = plus(today(), -(d ?? 2)); });
  [0,1,2,3,4,5,7,8,9,10,11].forEach(i => S.act[plus(today(),-i)] = 2);
  S.quick[today()] = [todaysQuick()[0]];
  S.dragon = {wins:4, loads:[{id:uid(), kind:"Towels", step:3},{id:uid(), kind:"Darks", step:2},{id:uid(), kind:"Lights", step:0},{id:uid(), kind:"Bedding", step:0}]};
  ["first","s3","s7","dragon","room","c50","sprint","quick"].forEach((k,i) => S.badges[k] = plus(today(), -30+i*3));
  const L = [[0,"Ten-thing tidy",10],[0,"Make the bed",10],[0,"Wash up or load the dishwasher",10],[0,QUICK[todaysQuick()[0]],10],[1,"10-minute sprint",25],[1,"Wipe the counters",10],[1,"Clean the bathroom sink",10],[2,"Laundry Dragon: fold",5],[2,"Clean the toilet",20],[3,"Vacuum",20]];
  S.log = L.map(([d,what,xp]) => ({d:plus(today(),-d), what, xp})); save(); }

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ view = {tab:tb.dataset.tab}; render(); scrollTo({top:0}); return; }
  if(e.target.closest("[data-close]")) return close();
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a, id = b.dataset.id;
  if(a==="setup") setupForm(); else if(a==="demo"){ demo(); render(); toast("Sample castle loaded"); } else if(a==="settings") settings();
  else if(a==="do") doChore(S.chores.find(x=>x.id===id), b);
  else if(a==="snooze"){ const c = S.chores.find(x=>x.id===id); c.snooze = plus(today(),1); save(); render(); toast("Moved to tomorrow. No guilt."); }
  else if(a==="quick"){ const i = +b.dataset.i; const q = S.quick[today()] = S.quick[today()] || []; if(q.includes(i)) return; q.push(i);
    Object.keys(S.quick).forEach(k => { if(since(k) > 14) delete S.quick[k]; }); if(q.length === 3) award("quick"); gain(10, QUICK[i], b); render(); }
  else if(a==="pick"){ const due = dueList(); const c = due[Math.floor(Math.random()*due.length)]; const el = document.getElementById("c-"+c.id);
    if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.animate([{background:"#fff1c4"},{background:"transparent"}],{duration:1800}); } toast(`Do this one: ${c.name}`); }
  else if(a==="sprint") sprint(+b.dataset.m); else if(a==="more"){ showAll = true; render(); }
  else if(a==="room") roomSheet(roomOf(id)); else if(a==="newRoom") roomForm();
  else if(a==="addLoad"){ S.dragon.loads.push({id:uid(), kind:b.dataset.k, step:0}); save(); render(); if(S.dragon.loads.length === 1) toast("The Laundry Dragon wakes up!"); }
  else if(a==="dropLoad"){ S.dragon.loads = S.dragon.loads.filter(l=>l.id!==id); save(); render(); }
  else if(a==="hit"){ const l = S.dragon.loads.find(x=>x.id===id), k = +b.dataset.k;
    if(k < l.step){ l.step = k; save(); return render(); }               // tap a done step to undo back to it
    if(k > l.step) return toast(`${STEPS[l.step]} comes first`);
    l.step++; gain(5, `Laundry Dragon: ${STEPS[k].toLowerCase()}`, b);
    if(S.dragon.loads.every(x=>x.step >= 4)){ S.dragon.wins++; S.dragon.loads = []; award("dragon"); if(S.dragon.wins >= 5) award("dragon5"); S.xp += 50; S.log.unshift({d:today(), what:"Defeated the Laundry Dragon", xp:50}); save(); render(); victory(); }
    else render(); }
});
render();
</script>
</body>
</html>
