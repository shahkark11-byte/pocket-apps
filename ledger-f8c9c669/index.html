:root{--paper:#f4eee2;--paper2:#fbf8f1;--ink:#16213b;--ink2:#46506a;--mut:#7c8197;--line:#e2d9c6;--line2:#d4c8b0;
  --in:#0f7b5f;--in-bg:#e2f2ea;--out:#b8492a;--out-bg:#f8e5dc;--tax:#b07d12;--tax-bg:#f7edd2;--acc:#16213b;--shadow:0 1px 0 rgba(22,33,59,.04),0 10px 30px -12px rgba(22,33,59,.18)}
:root[data-theme="dark"]{--paper:#10172a;--paper2:#18213a;--ink:#f1ece0;--ink2:#c9c3b4;--mut:#8f97ad;--line:#26304b;--line2:#34405f;
  --in:#5fd3a6;--in-bg:rgba(95,211,166,.12);--out:#ff9c7a;--out-bg:rgba(255,156,122,.12);--tax:#f2c25c;--tax-bg:rgba(242,194,92,.12);--acc:#f1ece0;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(22,33,59,.035) 1px,transparent 1px);background-size:18px 18px}
:root[data-theme="dark"] body{background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.serif{font-family:'Fraunces',Georgia,serif}
.num{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 110px}
/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.mast .eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.mast h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:-.02em;margin-top:6px}
.mast h1 em{font-style:italic;font-weight:400;color:var(--in)}
.rule2{height:1px;background:var(--ink);margin-bottom:20px;opacity:.5}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--paper2);font-size:13px;font-weight:600;color:var(--ink2)}
.chipbtn:hover{border-color:var(--ink)}
/* tabs */
.tabs{display:flex;gap:4px;margin:0 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper)}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}
@media(max-width:860px){.g4{grid-template-columns:1fr 1fr}.g2,.g2e{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative}
.kpi small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:8px 0 4px}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.in b{color:var(--in)}.kpi.out b{color:var(--out)}.kpi.tax b{color:var(--tax)}
.kpi .tag{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.kpi.in .tag{background:var(--in-bg);color:var(--in)}.kpi.out .tag{background:var(--out-bg);color:var(--out)}.kpi.tax .tag{background:var(--tax-bg);color:var(--tax)}.kpi.net .tag{background:var(--line);color:var(--ink)}
h2.sec{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.01em;margin-bottom:4px}
p.secsub{color:var(--mut);font-size:14px;margin-bottom:16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
/* chart */
.chart{width:100%;height:240px}
.chart text{font-size:11px;fill:var(--mut);font-family:'Outfit',sans-serif}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px 10px;border-bottom:1px solid var(--ink)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(22,33,59,.025)}
.tbl .r{text-align:right}
.tbl .amt{font-weight:600;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink2);white-space:nowrap}
.badge.in{background:var(--in-bg);color:var(--in)}.badge.out{background:var(--out-bg);color:var(--out)}.badge.tax{background:var(--tax-bg);color:var(--tax)}
.muted{color:var(--mut)}.pos{color:var(--in)}.neg{color:var(--out)}
.rowbtn{width:32px;height:32px;border-radius:9px;color:var(--mut);display:inline-grid;place-items:center}
.rowbtn:hover{background:var(--line);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .t{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .serif{font-size:22px;color:var(--ink);margin-bottom:6px}
/* mobile list (tables collapse) */
.mlist{display:none}
@media(max-width:700px){.tbl.collapse{display:none}.mlist{display:flex;flex-direction:column;gap:8px}}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper2)}
.mrow .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;flex:none}
.mrow .ic.in{background:var(--in-bg);color:var(--in)}.mrow .ic.out{background:var(--out-bg);color:var(--out)}.mrow .ic.mi{background:var(--tax-bg);color:var(--tax)}
.mrow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow small{color:var(--mut);font-size:13px}
.grow{flex:1;min-width:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:13px;font-weight:600;font-size:15px;background:var(--ink);color:var(--paper);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.in-f{padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--paper2);font-size:14px;outline:none;min-width:0}
.in-f:focus{border-color:var(--ink)}
/* fab */
.fab{position:fixed;right:max(18px,calc(50% - 520px));bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
.fab .btn{box-shadow:0 12px 28px -8px rgba(22,33,59,.45);padding:15px 20px;border-radius:16px}
/* modal */
.bg{position:fixed;inset:0;background:rgba(16,23,42,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@media(max-width:600px){.bg{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(16px);opacity:0}}
.modal h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;letter-spacing:-.01em}
.modal p.sub{color:var(--mut);margin:4px 0 14px}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--paper);font-size:16px;outline:none}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,33,59,.08)}
.inp.big{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;text-align:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}.inp{min-width:0}.modal{overflow-x:hidden}
.seg{display:flex;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on.in{background:var(--in);color:#fff}.seg button.on.out{background:var(--out);color:#fff}.seg button.on{background:var(--ink);color:var(--paper)}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1}
.calc{margin-top:10px;font-size:14px;color:var(--mut);display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;
  animation:pop .25s,out .3s 2.2s forwards;box-shadow:var(--shadow)}
@keyframes out{to{opacity:0;transform:translate(-50%,-8px)}}
.pot{background:linear-gradient(135deg,var(--tax-bg),transparent 70%)}
.potbar{height:12px;border-radius:7px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.potbar i{display:block;height:100%;background:var(--tax);border-radius:7px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.welcome{max-width:560px;margin:8vh auto;text-align:center}
.welcome .mark{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:'Fraunces',Georgia,serif;font-size:38px;font-weight:600;font-style:italic}
.welcome h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(34px,7vw,52px);line-height:1.02;letter-spacing:-.02em;font-weight:600}
.welcome h1 em{color:var(--in);font-weight:400}
.welcome p{color:var(--ink2);font-size:17px;margin:14px auto 22px;max-width:440px;line-height:1.5}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0;text-align:left}
.features div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper2);font-size:13px;color:var(--ink2)}
.features b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
@media(max-width:560px){.features{grid-template-columns:1fr}}
@media(max-width:600px){.wrap{padding:16px 14px 110px}.mast{flex-direction:column;align-items:stretch}.tools{justify-content:flex-start;margin-top:4px}
  .chipbtn{padding:7px 11px;font-size:12px}.card{padding:15px;border-radius:16px}.mrow{padding:10px 11px;gap:10px}.mrow .ic{width:32px;height:32px;border-radius:9px}
  .mrow b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.25}.mrow .rowbtn{width:26px}
  .filters select,.filters input{flex:1 1 45%}.chart{height:200px}.fab .btn{padding:13px 16px}}
/* print */
@media print{body{background:#fff}.tabs,.fab,.tools,.noprint{display:none!important}.card{box-shadow:none;break-inside:avoid}.wrap{padding:0}
  .tbl.collapse{display:table!important}.mlist{display:none!important}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
"use strict";
const KEY = "sidehustle.ledger.v1";
const blank = () => ({v:1, setup:null, tx:[], miles:[], owed:[], theme:"light"});
let S; try{ S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); }catch(e){ S = blank(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device"); } };
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const fd = (s,o={day:"numeric",month:"short",year:"numeric"}) => parse(s).toLocaleDateString(undefined,o);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = a => a.reduce((t,x)=>t+(+x||0),0);
function money(n, whole){ n = +n||0; try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.setup?.cur||"USD",
  minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(n); }catch(e){ return n.toFixed(whole?0:2); } }
const CURS = ["USD","GBP","EUR","CAD","AUD","NZD","INR","PKR","AED","ZAR","SGD","IEP"].filter(c=>c!=="IEP");
const SOURCES = ["Etsy","Shopify","Amazon","eBay","TikTok Shop","Fiverr","Upwork","Direct client","Market or fair","Cash","Other"];
const CATS = [["materials","Materials & supplies"],["postage","Shipping & postage"],["fees","Platform & payment fees"],["ads","Advertising & marketing"],
  ["software","Software & subscriptions"],["equipment","Equipment & tools"],["phone","Phone & internet"],["travel","Travel"],["homeoffice","Home office"],
  ["professional","Accountant & legal"],["training","Training & books"],["packaging","Packaging"],["other","Other"]];
const CATCOL = ["#b8492a","#d17a3a","#b07d12","#7a8f2a","#2f8f74","#2c7da0","#5a5fc9","#8f4fbf","#c2457e","#7c8197","#3d6b5a","#a8653b","#9aa0b3"];
const catName = k => (CATS.find(c=>c[0]===k)||CATS[CATS.length-1])[1];
const catCol = k => CATCOL[Math.max(0, CATS.findIndex(c=>c[0]===k))];
function applyTheme(){ document.documentElement.dataset.theme = S.theme; document.querySelector('meta[name=theme-color]').content = S.theme==="dark" ? "#10172a" : "#f4eee2"; }

/* ── tax year ── */
function taxYear(offset=0){ const [sm, sd] = (S.setup?.tyStart || "01-01").split("-").map(Number); const t = new Date();
  let y = t.getFullYear(); if(t < new Date(y, sm-1, sd)) y -= 1; y += offset;
  const start = iso(new Date(y, sm-1, sd)), end = iso(new Date(y+1, sm-1, sd));
  const label = sm===1 && sd===1 ? String(y) : `${y}/${String(y+1).slice(2)}`; return {start, end, label, y}; }
const inR = (d,r) => d >= r.start && d < r.end;
function months(r){ const out = []; let d = parse(r.start); d = new Date(d.getFullYear(), d.getMonth(), 1);
  const e = parse(r.end); while(d < e){ out.push({key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`, label:d.toLocaleDateString(undefined,{month:"short"}), d:new Date(d)});
    d = new Date(d.getFullYear(), d.getMonth()+1, 1); } return out; }
let TY = 0; // 0 = current tax year, -1 previous
function totals(r){
  const tx = S.tx.filter(t=>inR(t.date,r)); const inc = tx.filter(t=>t.type==="in"), exp = tx.filter(t=>t.type==="out");
  const gross = sum(inc.map(t=>t.amt)), fees = sum(inc.map(t=>t.fees||0)), expenses = sum(exp.map(t=>t.amt));
  const mi = S.miles.filter(m=>inR(m.date,r)); const miles = sum(mi.map(m=>m.miles)); const mileVal = miles * (S.setup?.mileRate||0);
  const profit = gross - fees - expenses - mileVal; const pot = Math.max(0, profit) * (S.setup?.taxPct||0) / 100;
  return {tx, inc, exp, gross, fees, expenses, miles, mileVal, profit, pot, net: gross - fees};
}
const unit = () => S.setup?.unit || "mi";

/* ── ui helpers ── */
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function modal(html, mount){ close(); const bg = document.createElement("div"); bg.className = "bg"; bg.id = "modal"; bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("mousedown", e => { if(e.target===bg) close(); }); document.body.appendChild(bg); mount && mount(bg);
  const f = bg.querySelector(".inp"); if(f && innerWidth > 700) setTimeout(()=>f.focus(), 60); }
function close(){ document.getElementById("modal")?.remove(); }
document.addEventListener("keydown", e => { if(e.key==="Escape") close(); });
const v = (r,s) => r.querySelector(s).value.trim();

/* ── views ── */
let tab = "overview", filt = {q:"", type:"all", month:"all", cat:"all"};
function render(){ applyTheme(); const root = document.getElementById("root");
  if(!S.setup){ root.innerHTML = welcome(); document.querySelector(".fab")?.remove(); return; }
  const r = taxYear(TY);
  root.innerHTML = `<header class="mast"><div><div class="eyebrow">${esc(S.setup.name)} · Tax year ${r.label}</div><h1>Side Hustle <em>Ledger</em></h1></div>
    <div class="tools noprint"><button class="chipbtn" data-a="ty">${TY===0?"◂ Last year":"This year ▸"}</button><button class="chipbtn" data-a="theme">${S.theme==="dark"?"☀︎ Light":"☾ Dark"}</button>
    <button class="chipbtn" data-a="settings">⚙︎ Settings</button></div></header><div class="rule2"></div>
    <nav class="tabs">${[["overview","Overview"],["ledger","Ledger"],["owed","Owed to me"],["miles","Mileage"],["report","Year-end report"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</nav>
    ${({overview, ledger, owed, miles, report})[tab](r)}`;
  if(!document.querySelector(".fab")){ const f = document.createElement("div"); f.className = "fab noprint";
    f.innerHTML = `<button class="btn out" data-a="add" data-t="out">− Expense</button><button class="btn in" data-a="add" data-t="in">+ Income</button>`; document.body.appendChild(f); }
}
function welcome(){ return `<div class="welcome"><div class="mark">L</div><h1>Side Hustle <em>Ledger</em></h1>
  <p>The simple money book for your small business. Every sale and every cost in one place, with tax money set aside as you go.</p>
  <div class="features"><div><b>Know your profit</b>Income, fees and costs, month by month.</div><div><b>Tax pot</b>See what to put aside before it is due.</div><div><b>Accountant-ready</b>Year-end report and a spreadsheet export.</div></div>
  <button class="btn" data-a="setup" style="padding:15px 26px">Open my ledger</button><div style="margin-top:12px"><button class="chipbtn" data-a="demo">Explore with sample data</button></div></div>`; }

function kpis(t){ return `<div class="grid g4">
  <div class="card kpi in"><span class="tag">↑</span><small>Income</small><b class="num">${money(t.gross,true)}</b><span>${money(t.fees,true)} in platform fees</span></div>
  <div class="card kpi out"><span class="tag">↓</span><small>Expenses</small><b class="num">${money(t.expenses + t.mileVal,true)}</b><span>${t.mileVal ? `incl. ${money(t.mileVal,true)} mileage` : `${t.exp.length} costs logged`}</span></div>
  <div class="card kpi net"><span class="tag">=</span><small>Profit</small><b class="num ${t.profit<0?"neg":""}">${money(t.profit,true)}</b><span>${t.gross ? Math.round(t.profit/t.gross*100) : 0}% margin</span></div>
  <div class="card kpi tax pot"><span class="tag">%</span><small>Tax pot</small><b class="num">${money(t.pot,true)}</b><span>${S.setup.taxPct}% of profit set aside</span></div></div>`; }
function chart(r){ const ms = months(r); const data = ms.map(m => { const tx = S.tx.filter(t=>t.date.slice(0,7)===m.key);
    return {m, inc: sum(tx.filter(t=>t.type==="in").map(t=>t.amt - (t.fees||0))), exp: sum(tx.filter(t=>t.type==="out").map(t=>t.amt)) + sum(S.miles.filter(x=>x.date.slice(0,7)===m.key).map(x=>x.miles))*(S.setup.mileRate||0)}; });
  const mx = Math.max(1, ...data.map(d=>Math.max(d.inc,d.exp))); const W = 720, H = 240, L = 46, B = 26, cw = (W-L-8)/data.length, bw = Math.min(16, cw/3.2);
  const y = val => H - B - (val/mx)*(H-B-14); const ticks = [0, .5, 1].map(f => mx*f);
  const nowKey = today().slice(0,7); let profit = data.map((d,i) => d.m.key <= nowKey ? `${L + cw*i + cw/2},${y(Math.max(0,d.inc - d.exp))}` : "").filter(Boolean).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${ticks.map(t=>`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?"3 4":""}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${compact(t)}</text>`).join("")}
    ${data.map((d,i) => { const x = L + cw*i + cw/2; return `<rect x="${x-bw-1}" y="${y(d.inc)}" width="${bw}" height="${H-B-y(d.inc)}" rx="3" fill="var(--in)"><title>${d.m.label} income ${money(d.inc)}</title></rect>
      <rect x="${x+1}" y="${y(d.exp)}" width="${bw}" height="${H-B-y(d.exp)}" rx="3" fill="var(--out)" opacity=".85"><title>${d.m.label} costs ${money(d.exp)}</title></rect>
      <text x="${x}" y="${H-8}" text-anchor="middle">${d.m.label}</text>`; }).join("")}
    <polyline points="${profit}" fill="none" stroke="var(--tax)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`; }
function compact(n){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.setup.cur,notation:"compact",maximumFractionDigits:1}).format(n); }catch(e){ return Math.round(n); } }
function overview(r){ const t = totals(r);
  const byCat = {}; t.exp.forEach(e => byCat[e.cat] = (byCat[e.cat]||0) + e.amt); const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6); const cm = cats[0]?.[1] || 1;
  const bySrc = {}; t.inc.forEach(e => bySrc[e.src] = (bySrc[e.src]||0) + e.amt - (e.fees||0)); const srcs = Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).slice(0,6); const sm = srcs[0]?.[1] || 1;
  const owedOpen = S.owed.filter(o=>!o.paid); const recent = [...t.tx].sort((a,b)=> a.date < b.date ? 1 : -1).slice(0,6);
  const thisM = today().slice(0,7); const mt = S.tx.filter(x=>x.date.slice(0,7)===thisM); const mProfit = sum(mt.filter(x=>x.type==="in").map(x=>x.amt-(x.fees||0))) - sum(mt.filter(x=>x.type==="out").map(x=>x.amt));
  return `${kpis(t)}
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="head"><div><h2 class="sec">Month by month</h2><p class="secsub">Income after fees against costs, with profit traced in gold.</p></div>
      <div class="legend"><span><i style="background:var(--in)"></i>Income</span><span><i style="background:var(--out)"></i>Costs</span></div></div>${chart(r)}</div>
    <div class="grid" style="gap:16px">
      <div class="card"><h2 class="sec">This month</h2><p class="secsub">${new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"})}</p>
        <div class="serif num ${mProfit<0?"neg":"pos"}" style="font-size:34px;font-weight:600">${money(mProfit)}</div><div class="muted" style="font-size:14px">profit so far · ${mt.length} entries</div></div>
      <div class="card"><div class="head"><div><h2 class="sec">Owed to me</h2><p class="secsub">${owedOpen.length} unpaid invoice${owedOpen.length===1?"":"s"}</p></div><button class="chipbtn" data-tab="owed">Open</button></div>
        <div class="serif num" style="font-size:30px;font-weight:600">${money(sum(owedOpen.map(o=>o.amt)))}</div>
        ${owedOpen.some(o=>o.due < today()) ? `<span class="badge out" style="margin-top:8px">${owedOpen.filter(o=>o.due<today()).length} overdue</span>` : ""}</div>
    </div>
  </div>
  <div class="grid g2e" style="margin-top:16px">
    <div class="card"><h2 class="sec">Where the money comes from</h2><p class="secsub">Income after fees, by platform.</p>
      ${srcs.length ? `<div class="bars">${srcs.map(([k,v])=>`<div class="bar"><div class="l"><span>${esc(k)}</span><b class="num">${money(v)}</b></div><div class="t"><i style="width:${v/sm*100}%;background:var(--in)"></i></div></div>`).join("")}</div>` : `<div class="empty">No income yet this tax year.</div>`}</div>
    <div class="card"><h2 class="sec">Where it goes</h2><p class="secsub">Your biggest costs.</p>
      ${cats.length ? `<div class="bars">${cats.map(([k,v])=>`<div class="bar"><div class="l"><span><span class="dot" style="background:${catCol(k)}"></span>${catName(k)}</span><b class="num">${money(v)}</b></div><div class="t"><i style="width:${v/cm*100}%;background:${catCol(k)}"></i></div></div>`).join("")}</div>` : `<div class="empty">No costs logged yet.</div>`}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="head"><div><h2 class="sec">Latest entries</h2><p class="secsub">The last six things you logged.</p></div><button class="chipbtn" data-tab="ledger">Full ledger</button></div>
    ${recent.length ? txTable(recent, false) : `<div class="empty"><div class="serif">A clean page.</div>Use the buttons at the bottom to log your first sale or cost.</div>`}</div>`; }

function txTable(list, foot){
  const rows = list.map(t => `<tr><td class="num muted" style="white-space:nowrap">${fd(t.date,{day:"numeric",month:"short"})}</td>
    <td><b style="font-weight:600">${esc(t.note || (t.type==="in" ? t.src : catName(t.cat)))}</b>${t.ref?`<div class="muted" style="font-size:13px">Ref ${esc(t.ref)}</div>`:""}</td>
    <td>${t.type==="in" ? `<span class="badge in">${esc(t.src)}</span>` : `<span class="badge out"><span class="dot" style="background:${catCol(t.cat)};margin-right:5px"></span>${catName(t.cat)}</span>`}</td>
    <td class="r num muted">${t.type==="in" && t.fees ? "−"+money(t.fees) : ""}</td>
    <td class="r num amt ${t.type==="in"?"pos":"neg"}">${t.type==="in"?"+":"−"}${money(t.amt)}</td>
    <td class="r noprint" style="white-space:nowrap"><button class="rowbtn" data-a="edit" data-id="${t.id}" title="Edit">✎</button></td></tr>`).join("");
  const mob = list.map(t => `<div class="mrow"><div class="ic ${t.type}">${t.type==="in"?"↑":"↓"}</div><div class="grow"><b>${esc(t.note || (t.type==="in" ? t.src : catName(t.cat)))}</b>
    <small>${fd(t.date,{day:"numeric",month:"short"})} · ${t.type==="in" ? esc(t.src) + (t.fees?` · fees ${money(t.fees)}`:"") : catName(t.cat)}</small></div>
    <b class="num ${t.type==="in"?"pos":"neg"}" style="flex:none">${t.type==="in"?"+":"−"}${money(t.amt)}</b><button class="rowbtn" data-a="edit" data-id="${t.id}">✎</button></div>`).join("");
  const inc = sum(list.filter(t=>t.type==="in").map(t=>t.amt)), fees = sum(list.filter(t=>t.type==="in").map(t=>t.fees||0)), exp = sum(list.filter(t=>t.type==="out").map(t=>t.amt));
  return `<table class="tbl collapse"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Fees</th><th class="r">Amount</th><th class="noprint"></th></tr></thead><tbody>${rows}</tbody>
    ${foot ? `<tfoot><tr><td></td><td>${list.length} entries</td><td class="num">In ${money(inc)} · Out ${money(exp)}</td><td class="r num">−${money(fees)}</td><td class="r num ${inc-fees-exp<0?"neg":"pos"}">${money(inc-fees-exp)}</td><td class="noprint"></td></tr></tfoot>` : ""}</table>
    <div class="mlist">${mob}</div>`; }
function ledger(r){
  const t = totals(r); const ms = months(r);
  let list = t.tx.filter(x => (filt.type==="all" || x.type===filt.type) && (filt.month==="all" || x.date.slice(0,7)===filt.month) && (filt.cat==="all" || (x.type==="out" ? x.cat===filt.cat : x.src===filt.cat))
    && (!filt.q || `${x.note} ${x.src||""} ${catName(x.cat)} ${x.ref||""}`.toLowerCase().includes(filt.q.toLowerCase())));
  list.sort((a,b)=> a.date===b.date ? (b.t||0)-(a.t||0) : a.date < b.date ? 1 : -1);
  return `<div class="card"><div class="head"><div><h2 class="sec">The ledger</h2><p class="secsub">Every entry in tax year ${r.label}.</p></div>
    <button class="chipbtn noprint" data-a="csv">⇩ Export CSV</button></div>
    <div class="filters noprint"><input class="in-f" id="q" placeholder="Search…" value="${esc(filt.q)}" style="flex:1;min-width:140px">
      <select class="in-f" id="ft"><option value="all">All entries</option><option value="in" ${filt.type==="in"?"selected":""}>Income</option><option value="out" ${filt.type==="out"?"selected":""}>Expenses</option></select>
      <select class="in-f" id="fm"><option value="all">All months</option>${ms.map(m=>`<option value="${m.key}" ${filt.month===m.key?"selected":""}>${m.d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</option>`).join("")}</select>
      <select class="in-f" id="fc"><option value="all">Any category</option><optgroup label="Income">${SOURCES.map(s=>`<option ${filt.cat===s?"selected":""}>${s}</option>`).join("")}</optgroup>
        <optgroup label="Expenses">${CATS.map(([k,n])=>`<option value="${k}" ${filt.cat===k?"selected":""}>${n}</option>`).join("")}</optgroup></select></div>
    ${list.length ? txTable(list, true) : `<div class="empty"><div class="serif">Nothing here.</div>${S.tx.length ? "Try clearing the filters." : "Log your first entry with the buttons below."}</div>`}</div>`; }

function owed(){
  const open = S.owed.filter(o=>!o.paid).sort((a,b)=>a.due<b.due?-1:1), done = S.owed.filter(o=>o.paid).slice(-8).reverse();
  return `<div class="card"><div class="head"><div><h2 class="sec">Owed to me</h2><p class="secsub">Invoices you have sent and are waiting on. Mark one paid and it moves into your income.</p></div>
    <button class="btn sm" data-a="addOwed">+ Invoice</button></div>
    ${open.length ? `<div class="mlist" style="display:flex">${open.map(o => { const late = o.due < today(); return `<div class="mrow"><div class="ic ${late?"out":"mi"}">${late?"!":"…"}</div>
      <div class="grow"><b>${esc(o.client)}${o.ref?` · <span class="muted">#${esc(o.ref)}</span>`:""}</b><small>${late ? `<span class="neg">Overdue since ${fd(o.due,{day:"numeric",month:"short"})}</span>` : `Due ${fd(o.due,{day:"numeric",month:"short"})}`}</small></div>
      <b class="num" style="flex:none">${money(o.amt)}</b><button class="btn sm in" data-a="paidOwed" data-id="${o.id}">Paid</button><button class="rowbtn" data-a="delOwed" data-id="${o.id}" title="Remove">✕</button></div>`; }).join("")}</div>`
      : `<div class="empty"><div class="serif">Nobody owes you a thing.</div>Add an invoice to keep track of who still has to pay.</div>`}</div>
    ${done.length ? `<div class="card" style="margin-top:16px"><h2 class="sec">Recently paid</h2><div class="mlist" style="display:flex;margin-top:12px">${done.map(o=>`<div class="mrow"><div class="ic in">✓</div>
      <div class="grow"><b>${esc(o.client)}</b><small>Paid ${fd(o.paid,{day:"numeric",month:"short"})}</small></div><b class="num pos">${money(o.amt)}</b></div>`).join("")}</div></div>` : ""}`; }

function miles(r){ const list = S.miles.filter(m=>inR(m.date,r)).sort((a,b)=>a.date<b.date?1:-1); const total = sum(list.map(m=>m.miles));
  return `<div class="grid g2"><div class="card"><div class="head"><div><h2 class="sec">Mileage log</h2><p class="secsub">Business trips in your own vehicle. Supplier runs, post office, client visits, markets.</p></div>

    ${list.length ? `<div class="mlist" style="display:flex">${list.map(m=>`<div class="mrow"><div class="ic mi">⟶</div><div class="grow"><b>${esc(m.purpose)}</b>
      <small>${fd(m.date,{day:"numeric",month:"short"})}${m.route?` · ${esc(m.route)}`:""}</small></div><span class="num" style="flex:none;font-weight:600">${m.miles} ${unit()}</span>
      <span class="num muted" style="flex:none;min-width:70px;text-align:right">${money(m.miles*(S.setup.mileRate||0))}</span><button class="rowbtn" data-a="delMile" data-id="${m.id}">✕</button></div>`).join("")}</div>`
      : `<div class="empty"><div class="serif">No trips yet.</div>Every business ${unit()==="km"?"kilometre":"mile"} counts toward your costs.</div>`}</div>
    <div class="card pot"><h2 class="sec">This tax year</h2><div class="serif num" style="font-size:44px;font-weight:600;margin-top:10px">${Math.round(total*10)/10} <span style="font-size:20px">${unit()}</span></div>
      <div class="muted">${list.length} trips · worth ${money(total*(S.setup.mileRate||0))} at ${money(S.setup.mileRate||0)} per ${unit()}</div>
      <p class="note" style="margin-top:14px">Set your rate in Settings. Mileage rates are set by your tax office and change from time to time, so check the current figure.</p></div></div>`; }

function report(r){ const t = totals(r); const byCat = {}; t.exp.forEach(e => byCat[e.cat] = (byCat[e.cat]||0) + e.amt);
  const bySrc = {}; t.inc.forEach(e => bySrc[e.src] = (bySrc[e.src]||0) + e.amt);
  const q = [0,1,2,3].map(i => { const s = parse(r.start); const a = iso(new Date(s.getFullYear(), s.getMonth()+i*3, s.getDate())), b = iso(new Date(s.getFullYear(), s.getMonth()+i*3+3, s.getDate()));
    const qt = totals({start:a, end:b}); return {a, b, qt}; });
  return `<div class="card"><div class="head"><div><div class="muted" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600">${esc(S.setup.name)}</div>
    <h2 class="sec" style="font-size:30px;margin-top:6px">Profit &amp; loss · ${r.label}</h2><p class="secsub">${fd(r.start)} to ${fd(new Date(parse(r.end)-864e5).toISOString().slice(0,10))}</p></div>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="chipbtn" data-a="print">⎙ Print or save PDF</button><button class="chipbtn" data-a="csv">⇩ CSV</button></div></div>
    <table class="tbl"><thead><tr><th>Income</th><th class="r">Amount</th></tr></thead><tbody>
      ${Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num">${money(v)}</td></tr>`).join("") || `<tr><td class="muted">No income recorded</td><td></td></tr>`}
      <tr><td><b>Gross income</b></td><td class="r num"><b>${money(t.gross)}</b></td></tr></tbody></table>
    <table class="tbl" style="margin-top:22px"><thead><tr><th>Expenses</th><th class="r">Amount</th></tr></thead><tbody>
      <tr><td>Platform &amp; payment fees taken from sales</td><td class="r num">${money(t.fees)}</td></tr>
      ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td><span class="dot" style="background:${catCol(k)}"></span>${catName(k)}</td><td class="r num">${money(v)}</td></tr>`).join("")}
      ${t.miles ? `<tr><td>Mileage · ${Math.round(t.miles*10)/10} ${unit()} at ${money(S.setup.mileRate)}</td><td class="r num">${money(t.mileVal)}</td></tr>` : ""}
      <tr><td><b>Total expenses</b></td><td class="r num"><b>${money(t.fees + t.expenses + t.mileVal)}</b></td></tr></tbody>
      <tfoot><tr><td>Net profit</td><td class="r num ${t.profit<0?"neg":"pos"}">${money(t.profit)}</td></tr>
      <tr><td style="font-weight:500;border-top:0">Tax pot at ${S.setup.taxPct}% of profit</td><td class="r num" style="border-top:0;color:var(--tax)">${money(t.pot)}</td></tr></tfoot></table>
    <h2 class="sec" style="margin-top:28px">Quarter by quarter</h2><p class="secsub">Handy if you pay tax in instalments.</p>
    <table class="tbl"><thead><tr><th>Quarter</th><th class="r">Income</th><th class="r">Costs</th><th class="r">Profit</th><th class="r">Tax pot</th></tr></thead><tbody>
      ${q.map((x,i)=>`<tr><td>Q${i+1} <span class="muted">${fd(x.a,{day:"numeric",month:"short"})} to ${fd(iso(new Date(parse(x.b)-864e5)),{day:"numeric",month:"short"})}</span></td>
      <td class="r num">${money(x.qt.gross)}</td><td class="r num">${money(x.qt.fees+x.qt.expenses+x.qt.mileVal)}</td><td class="r num ${x.qt.profit<0?"neg":""}">${money(x.qt.profit)}</td><td class="r num">${money(x.qt.pot)}</td></tr>`).join("")}</tbody></table>
    <p class="note" style="margin-top:18px">This report is a record of what you entered. It is not tax advice. Rules on what counts as an allowable expense differ by country, so check with your tax office or an accountant.</p></div>`; }

function txForm(t, type){ const e = !!t; t = t || {type, date:today(), amt:"", fees:"", src:S.setup.lastSrc||"Etsy", cat:"materials", note:"", ref:""}; let ty = t.type;
  const body = () => `<h3>${e ? "Edit entry" : ty==="in" ? "Money in" : "Money out"}</h3><p class="sub">${ty==="in" ? "A sale, a client payment, a market day." : "Anything you bought to run the business."}</p>
    <div class="seg"><button class="in ${ty==="in"?"on":""}" data-ty="in">↑ Income</button><button class="out ${ty==="out"?"on":""}" data-ty="out">↓ Expense</button></div>

      ${ty==="in" ? `<div><label class="f">Platform fees</label><input class="inp num" id="fe" inputmode="decimal" placeholder="0.00" value="${t.fees||""}"></div>`

  modal(body(), function mount(bg){

    const k = () => { const el = m.querySelector("#keep"); if(el) el.textContent = money(num(v(m,"#a")) - num(m.querySelector("#fe")?.value||0)); };
    m.querySelector("#a").oninput = k; m.querySelector("#fe") && (m.querySelector("#fe").oninput = k);
    m.querySelector("#ok").onclick = () => { const a = num(v(m,"#a")); if(a <= 0) return m.querySelector("#a").focus();
      const o = {type:ty, amt:a, date:v(m,"#d")||today(), note:v(m,"#n")};
      if(ty==="in"){ o.src = v(m,"#c"); o.fees = num(m.querySelector("#fe").value); S.setup.lastSrc = o.src; delete t.cat; } else { o.cat = v(m,"#c"); o.ref = v(m,"#rf"); o.fees = 0; }
      if(e) Object.assign(t, o); else S.tx.push({id:uid(), t:Date.now(), ...o}); save(); close(); render(); toast(e ? "Saved" : ty==="in" ? "Income added" : "Expense added"); };
    if(e) m.querySelector("#del").onclick = () => { if(!confirm("Delete this entry?")) return; S.tx = S.tx.filter(x=>x.id!==t.id); save(); close(); render(); };
  }); }
function owedForm(){ modal(`<h3>New invoice</h3><p class="sub">Track money a client still has to pay you.</p>
  <label class="f">Client</label><input class="inp" id="c" placeholder="Bloom & Co">
  <div class="two"><div><label class="f">Amount</label><input class="inp num" id="a" inputmode="decimal" placeholder="0.00"></div><div><label class="f">Invoice no.</label><input class="inp" id="r" placeholder="Optional"></div></div>
  <div class="two"><div><label class="f">Sent</label><input class="inp" type="date" id="s" value="${today()}"></div><div><label class="f">Due</label><input class="inp" type="date" id="d" value="${iso(new Date(Date.now()+14*864e5))}"></div></div>
  <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="ok">Add invoice</button></div>`, bg => {
    bg.querySelector("#ok").onclick = () => { const c = v(bg,"#c"), a = num(v(bg,"#a")); if(!c || a<=0) return toast("Add the client and amount");
      S.owed.push({id:uid(), client:c, amt:a, ref:v(bg,"#r"), sent:v(bg,"#s"), due:v(bg,"#d")||today(), paid:""}); save(); close(); render(); }; }); }
function mileForm(){ modal(`<h3>Log a trip</h3><p class="sub">A business journey in your own vehicle.</p>
  <label class="f">Purpose</label><input class="inp" id="p" placeholder="Post office, 12 parcels">
  <div class="two"><div><label class="f">Distance (${unit()})</label><input class="inp num" id="m" inputmode="decimal" placeholder="0"></div><div><label class="f">Date</label><input class="inp" type="date" id="d" value="${today()}"></div></div>

    bg.querySelector("#ok").onclick = () => { const p = v(bg,"#p"), m = num(v(bg,"#m")); if(!p || m<=0) return toast("Add the purpose and distance");
      S.miles.push({id:uid(), purpose:p, miles:m, date:v(bg,"#d")||today(), route:v(bg,"#r")}); save(); close(); render(); }; }); }
const DEF = {USD:["01-01",25,0.70,"mi"], GBP:["04-06",20,0.45,"mi"], CAD:["01-01",25,0.72,"km"], AUD:["07-01",25,0.88,"km"], NZD:["04-01",25,1.04,"km"], EUR:["01-01",25,0.30,"km"], INR:["04-01",20,0,"km"], PKR:["07-01",20,0,"km"]};
function guessCur(){ try{ const r = (Intl.DateTimeFormat().resolvedOptions().locale||"en-US").split("-")[1]||"US"; return {GB:"GBP",CA:"CAD",AU:"AUD",NZ:"NZD",IN:"INR",PK:"PKR",IE:"EUR",DE:"EUR",FR:"EUR",ES:"EUR",AE:"AED",ZA:"ZAR",SG:"SGD"}[r]||"USD"; }catch(e){ return "USD"; } }
function setupForm(first){ const s = S.setup || (()=>{ const c = guessCur(), d = DEF[c] || DEF.USD; return {name:"", cur:c, tyStart:d[0], taxPct:d[1], mileRate:d[2], unit:d[3]}; })();
  modal(`<h3>${first?"Set up your ledger":"Settings"}</h3><p class="sub">${first?"Thirty seconds. You can change any of this later.":"Your data is saved on this device only."}</p>
  <label class="f">Business name</label><input class="inp" id="n" placeholder="Mercer Candle Co" value="${esc(s.name)}">
  <div class="two"><div><label class="f">Currency</label><select class="inp" id="c">${CURS.map(c=>`<option ${c===s.cur?"selected":""}>${c}</option>`).join("")}</select></div>
    <div><label class="f">Tax year starts</label><select class="inp" id="ty">${[["01-01","1 January"],["04-06","6 April (UK)"],["04-01","1 April"],["07-01","1 July"],["10-01","1 October"]].map(([k,l])=>`<option value="${k}" ${k===s.tyStart?"selected":""}>${l}</option>`).join("")}</select></div></div>
  <div class="two"><div><label class="f">Set aside for tax (%)</label><input class="inp num" id="tp" inputmode="decimal" value="${s.taxPct}"></div>
    <div><label class="f">Mileage rate per</label><div style="display:flex;gap:6px"><input class="inp num" id="mr" inputmode="decimal" value="${s.mileRate}"><select class="inp" id="u" style="width:86px"><option ${s.unit==="mi"?"selected":""}>mi</option><option ${s.unit==="km"?"selected":""}>km</option></select></div></div></div>
  <p class="note" style="margin-top:10px">The tax pot is a simple percentage of your profit so you are never caught short. Your real bill depends on your country and total income.</p>
  <div class="acts">${first?"":`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">${first?"Open my ledger":"Save"}</button></div>
  ${first?"":`<label class="f" style="margin-top:24px">Your data</label><div class="two"><button class="btn ghost sm" id="ex">⇩ Backup file</button><button class="btn ghost sm" id="im">⇧ Restore backup</button></div>
  <div class="two" style="margin-top:10px"><button class="btn ghost sm" id="csv">⇩ Spreadsheet (CSV)</button><button class="btn danger sm" id="wipe">Erase everything</button></div>`}`, bg => {
    const cSel = bg.querySelector("#c"); cSel.onchange = () => { const d = DEF[cSel.value]; if(!d) return; bg.querySelector("#ty").value = d[0]; bg.querySelector("#tp").value = d[1]; bg.querySelector("#mr").value = d[2]; bg.querySelector("#u").value = d[3]; };
    bg.querySelector("#ok").onclick = () => { S.setup = Object.assign(S.setup||{}, {name:v(bg,"#n")||"My business", cur:v(bg,"#c"), tyStart:v(bg,"#ty"), taxPct:num(v(bg,"#tp")), mileRate:num(v(bg,"#mr")), unit:v(bg,"#u")}); save(); close(); render(); };
    if(!first){ bg.querySelector("#ex").onclick = backup; bg.querySelector("#im").onclick = () => document.getElementById("imp").click(); bg.querySelector("#csv").onclick = csv;
      bg.querySelector("#wipe").onclick = () => { if(confirm("Erase every entry and start again? Download a backup first if you want to keep it.")){ localStorage.removeItem(KEY); S = blank(); close(); render(); } }; }
  }); }
function download(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function backup(){ download(`ledger-backup-${today()}.json`, JSON.stringify(S,null,1), "application/json"); toast("Backup downloaded"); }
function csv(){ const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const rows = [["Date","Type","Platform or category","Description","Reference","Gross","Fees","Net"]];
  [...S.tx].sort((a,b)=>a.date<b.date?-1:1).forEach(t => rows.push([t.date, t.type==="in"?"Income":"Expense", t.type==="in"?t.src:catName(t.cat), t.note, t.ref||"",
    (t.type==="in"?t.amt:-t.amt).toFixed(2), (t.fees||0).toFixed(2), (t.type==="in"?t.amt-(t.fees||0):-t.amt).toFixed(2)]));
  S.miles.forEach(m => rows.push([m.date,"Mileage",`${m.miles} ${unit()}`,m.purpose,m.route||"",(-m.miles*(S.setup.mileRate||0)).toFixed(2),"0.00",(-m.miles*(S.setup.mileRate||0)).toFixed(2)]));
  download(`ledger-${today()}.csv`, "﻿" + rows.map(r=>r.map(q).join(",")).join("\r\n"), "text/csv"); toast("Spreadsheet downloaded"); }
document.getElementById("imp").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(d.v!==1 || !Array.isArray(d.tx)) throw 0; S = Object.assign(blank(), d); save(); close(); render(); toast("Backup restored"); }catch(err){ toast("That is not a ledger backup file"); } };
  r.readAsText(f); e.target.value = ""; };

function demo(){ const c = guessCur(), d = DEF[c] || DEF.USD; S = blank(); S.setup = {name:"Willow & Wick Candles", cur:c, tyStart:d[0], taxPct:d[1], mileRate:d[2] || 0.45, unit:d[3]};
  const r = taxYear(0); const start = parse(r.start), now = new Date(); const D = (mo, day) => iso(new Date(start.getFullYear(), start.getMonth()+mo, day));
  let mcount = 0; for(let x = new Date(start); x <= now; x = new Date(x.getFullYear(), x.getMonth()+1, 1)) mcount++;
  const seed = n => { const s = Math.sin(n*9301+49297)*233280; return s - Math.floor(s); };
  for(let m=0; m<mcount; m++){ const lim = m === mcount-1 ? now.getDate() : 28; const g = 1 + m*0.09;
    for(let k=0; k<6; k++){ const day = 2 + Math.floor(seed(m*10+k)*(lim-2)); if(day > lim) continue; const amt = Math.round((90 + seed(m*7+k)*260)*g*100)/100;
      const src = ["Etsy","Etsy","Etsy","Shopify","Market or fair","Direct client"][k]; S.tx.push({id:uid(), t:m*100+k, type:"in", date:D(m,day), amt, fees: src==="Etsy"||src==="Shopify" ? Math.round(amt*0.095*100)/100 : 0,
      src, note: src==="Market or fair" ? "Saturday craft market" : src==="Direct client" ? "Wedding favours order" : `Order batch ${m+1}${"abcdef"[k]}`}); }
    [["materials","Soy wax and wicks",140],["packaging","Jars and gift boxes",64],["postage","Postage",48],["ads","Etsy ads",30],["software","Shop subscription",29]].forEach(([cat,note,base],k) => {
      const day = 3 + k*4; if(m === mcount-1 && day > now.getDate()) return; S.tx.push({id:uid(), t:m*100+50+k, type:"out", date:D(m,day), amt:Math.round(base*(0.85+seed(m*13+k)*0.4)*100)/100, cat, note, fees:0, ref:""}); });
    if(m % 2 === 0 && !(m===mcount-1 && now.getDate() < 15)) S.miles.push({id:uid(), purpose:"Supplier run and post office", miles:Math.round(18+seed(m)*20), date:D(m,15), route:"Workshop to wholesaler"}); }
  S.tx.push({id:uid(), t:9999, type:"out", date:D(Math.max(0,mcount-3),10), amt:389, cat:"equipment", note:"Wax melter", fees:0, ref:"INV-2231"});
  S.owed = [{id:uid(), client:"Bloom Florist", amt:420, ref:"014", sent:iso(new Date(Date.now()-20*864e5)), due:iso(new Date(Date.now()-6*864e5)), paid:""},
    {id:uid(), client:"The Corner Café", amt:185, ref:"015", sent:iso(new Date(Date.now()-3*864e5)), due:iso(new Date(Date.now()+11*864e5)), paid:""}];
  save(); }

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ tab = tb.dataset.tab; render(); scrollTo({top:0, behavior:"smooth"}); return; }
  if(e.target.closest("[data-close]")) return close();
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a, id = b.dataset.id;
  if(a==="setup") setupForm(true); else if(a==="settings") setupForm(false);
  else if(a==="demo"){ demo(); render(); toast("Sample shop loaded. Erase it in Settings when you are ready."); }
  else if(a==="theme"){ S.theme = S.theme==="dark" ? "light" : "dark"; save(); render(); }
  else if(a==="ty"){ TY = TY===0 ? -1 : 0; render(); }
  else if(a==="add") txForm(null, b.dataset.t); else if(a==="edit") txForm(S.tx.find(t=>t.id===id));
  else if(a==="csv") csv(); else if(a==="print") print();
  else if(a==="addOwed") owedForm(); else if(a==="addMile") mileForm();
  else if(a==="paidOwed"){ const o = S.owed.find(x=>x.id===id); o.paid = today(); S.tx.push({id:uid(), t:Date.now(), type:"in", date:today(), amt:o.amt, fees:0, src:"Direct client", note:`${o.client}${o.ref?" invoice #"+o.ref:""}`}); save(); render(); toast("Paid. Added to your income."); }
  else if(a==="delOwed"){ if(confirm("Remove this invoice?")){ S.owed = S.owed.filter(x=>x.id!==id); save(); render(); } }
  else if(a==="delMile"){ S.miles = S.miles.filter(x=>x.id!==id); save(); render(); }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ filt.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); } });
document.addEventListener("change", e => { const m = {ft:"type", fm:"month", fc:"cat"}[e.target.id]; if(m){ filt[m] = e.target.value; render(); } });
render();
</script>
