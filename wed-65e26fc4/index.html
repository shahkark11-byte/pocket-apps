:root{--ivory:#f8f4ee;--card:#fffdfa;--ink:#2f2a2c;--ink2:#5d5457;--mut:#9a8f90;--line:#ebe2d8;--sage:#71866d;--sage2:#a8b8a0;--sage3:#e7eee2;
  --rose:#bf8584;--blush:#f5e6e1;--gold:#ad8c58;--gold2:#dcc69c;--red:#a8453f;--shadow:0 1px 0 rgba(47,42,44,.03),0 18px 40px -24px rgba(83,62,52,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased;min-height:100vh;font-weight:400;
  background-image:radial-gradient(ellipse at 0% 0%,rgba(191,133,132,.10),transparent 45%),radial-gradient(ellipse at 100% 100%,rgba(113,134,109,.10),transparent 45%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit}
.serif,h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:300;font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.01em}
.kick{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.app{max-width:1100px;margin:0 auto;padding:18px 16px 130px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.mono{display:flex;align-items:center;gap:10px;min-width:0}
.mono .ring{width:40px;height:40px;flex:none}
.mono b{font-family:'Fraunces',Georgia,serif;font-weight:300;font-variation-settings:"SOFT" 100,"opsz" 144;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono b i{color:var(--rose);font-style:italic;padding:0 2px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink2)}
.ib svg{width:20px;height:20px}
h1.page{font-size:38px;line-height:1.05}
h1.page i{color:var(--rose)}
.sub{color:var(--mut);margin:6px 0 18px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.card h2{font-size:23px;margin-bottom:2px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch a,.lnk{font-size:13px;font-weight:600;color:var(--sage);text-decoration:none;white-space:nowrap}
/* home arch */
.arch{position:relative;text-align:center;background:linear-gradient(180deg,#fffdfa,#f6ece6);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:999px 999px 26px 26px/220px 220px 26px 26px;padding:58px 22px 26px;margin-bottom:14px;overflow:hidden;isolation:isolate}
.arch::before{content:"";position:absolute;inset:9px;border:1px solid var(--gold2);border-radius:inherit;pointer-events:none}
.arch .spr{position:absolute;width:120px;height:120px;z-index:-1;opacity:.9}
.arch .spr.l{left:-6px;bottom:20px}.arch .spr.r{right:-6px;bottom:20px;transform:scaleX(-1)}
.arch h1{font-size:clamp(38px,10vw,58px);line-height:1;margin:14px 0 10px}
.arch h1 i{display:block;font-size:.55em;color:var(--rose);margin:4px 0}
.arch .when{color:var(--ink2);font-size:15px}
.arch .cd{margin:20px auto 0;display:inline-flex;flex-direction:column;align-items:center;padding:12px 26px;border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2)}
.arch .cd b{font-family:'Fraunces',Georgia,serif;font-weight:300;font-variation-settings:"SOFT" 100,"opsz" 144;font-size:64px;line-height:1;color:var(--ink)}
.arch .cd small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:6px;font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.trio div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow);min-width:0}
.trio b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:400;font-variation-settings:"SOFT" 100,"opsz" 144;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trio small{font-size:12px;color:var(--mut)}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media(min-width:900px){.hgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.app{padding-top:28px}}
/* rows */
.row{display:flex;align-items:center;gap:12px;min-width:0}.grow{flex:1;min-width:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}

/* budget */
.sum4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin:12px 0 16px}
@media(min-width:620px){.sum4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.cats{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
@media(min-width:820px){.cats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.cat{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.cat .top3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}

.cat .top3 span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.it{display:flex;gap:10px;font-size:14px;padding:6px 0 0;color:var(--ink2);cursor:pointer;min-width:0}

.guide{font-size:12px;color:var(--mut);margin-top:6px}

/* guests */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}

@media(min-width:820px){.glist{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.gr{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:'Fraunces',Georgia,serif;font-size:16px;color:#fff}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}

/* tasks */
.phase{font-family:'Fraunces',Georgia,serif;font-weight:400;font-variation-settings:"SOFT" 100,"opsz" 144;font-size:20px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phase span{font-family:'Outfit',sans-serif;font-size:13px;color:var(--mut);font-weight:400}
.prog{display:flex;align-items:center;gap:16px}

/* vendors */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}

  -webkit-backdrop-filter:blur(14px);padding:6px;border-radius:26px;z-index:20;border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(83,62,52,.5);max-width:calc(100vw - 20px)}

/* buttons + modal */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:500;font-size:15px;background:var(--ink);color:var(--ivory)}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border:1px solid #e6c2bd}
.add{width:100%;padding:15px;border:1px dashed var(--gold2);border-radius:18px;color:var(--gold);font-weight:500;background:transparent;margin-top:6px}
.bg{position:fixed;inset:0;background:rgba(47,42,44,.35);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;overflow-x:hidden;background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:700px){.bg{align-items:center}.modal{border-radius:28px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h3{font-size:28px}
.modal .sub{margin:4px 0 8px}
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:16px 2px 6px}
.inp{width:100%;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ivory);font-size:16px;outline:none}
.inp:focus{border-color:var(--sage2);box-shadow:0 0 0 3px rgba(113,134,109,.15)}
textarea.inp{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>*{min-width:0}
.three{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px}.three>*{min-width:0}
.acts{display:flex;gap:10px;margin-top:22px}.acts .btn{flex:1}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink2)}

.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px;align-items:center;margin-top:8px}

.x{width:32px;height:32px;border-radius:50%;color:var(--mut);font-size:16px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.toast{max-width:92vw;text-align:center;position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:11px 20px;border-radius:999px;font-size:14px;z-index:70;animation:up .25s,out .3s 2.3s forwards}
@keyframes out{to{opacity:0}}
.petal{position:fixed;top:-20px;width:12px;height:16px;z-index:80;pointer-events:none;border-radius:60% 0 60% 0}

.empty .serif{font-size:22px;color:var(--ink);margin-bottom:4px}
/* welcome */
.hero{text-align:center;padding:4vh 6px 10px;max-width:520px;margin:0 auto}
.hero .art{width:200px;height:220px;margin:0 auto}
.hero h1{font-size:clamp(40px,10vw,60px);line-height:1;margin:16px 0 0}
.hero h1 i{color:var(--rose)}
.hero p{color:var(--ink2);font-size:17px;margin:16px auto 24px;line-height:1.55}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:26px 0 0;text-align:left}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.feat b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:17px;color:var(--ink)}
@media(max-width:400px){nav button{min-width:0;padding:8px 9px}h1.page{font-size:32px}.trio b{font-size:20px}.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.prow .x{justify-self:end}}

<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
"use strict";
const KEY = "weddingplanner.v1";
const MEALS = ["Chicken","Fish","Vegetarian","Vegan","Child's meal"];
const blank = () => ({v:1, cur:"", p1:"", p2:"", date:"", venue:"", total:0, meals:MEALS.slice(), items:[], guests:[], tasks:[], vendors:[], married:false});
let S; try{ S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); }catch(e){ S = blank(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device"); } };
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const days = s => Math.round((parse(s) - parse(today()))/864e5);
const plus = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const fd = (s,o={day:"numeric",month:"short"}) => parse(s).toLocaleDateString(undefined,o);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = a => a.reduce((t,x)=>t+(+x||0),0);
const v = (r,s) => r.querySelector(s).value.trim();
function guessCur(){ try{ const r = (Intl.DateTimeFormat().resolvedOptions().locale||"en-US").split("-")[1]||"US"; return {GB:"GBP",CA:"CAD",AU:"AUD",NZ:"NZD",IN:"INR",PK:"PKR",AE:"AED",SA:"SAR",IE:"EUR",DE:"EUR",FR:"EUR",ES:"EUR",IT:"EUR",NL:"EUR",ZA:"ZAR",SG:"SGD",MY:"MYR"}[r]||"USD"; }catch(e){ return "USD"; } }
if(!S.cur) S.cur = guessCur();
const money = (n, whole) => { n = +n||0; if(whole===undefined) whole = Math.abs(n) >= 1000 || Number.isInteger(n);
  try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur,minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(n); }catch(e){ return n.toFixed(whole?0:2); } };

/* budget categories: key, name, share of budget in a common split (a guide, not a rule) */
const CATS = [["venue","Venue",28],["catering","Catering and drinks",22],["attire","Attire and beauty",8],["photo","Photo and video",11],["flowers","Flowers and décor",8],
  ["ent","Entertainment",7],["cake","Cake",2],["stationery","Stationery",2],["rings","Rings",4],["transport","Transport",2],["favours","Favours and gifts",2],["honeymoon","Honeymoon",0],["other","Other",4]];
const catName = k => (CATS.find(c=>c[0]===k)||CATS[CATS.length-1])[1];
/* checklist phases by days before the wedding */
const PHASES = [[365,"A year or more to go"],[270,"9 to 12 months"],[180,"6 to 9 months"],[120,"4 to 6 months"],[60,"2 to 4 months"],[30,"1 to 2 months"],[14,"2 to 4 weeks"],[1,"The final fortnight"],[0,"On the day"]];
const phaseOf = off => PHASES.find(p => off >= p[0]) || PHASES[PHASES.length-1];
const DEFAULT_TASKS = [["Agree the budget together",400],["Draft the guest list",390],["Set the date",380],["Book the venue",365],["Decide on a planner or coordinator",355],
  ["Book the photographer",330],["Book the caterer",310],["Choose your wedding party",300],["Start shopping for the dress or suit",290],["Book the officiant",280],["Set up a wedding website",270],
  ["Send save the dates",240],["Book the florist",230],["Book entertainment",220],["Book hair and makeup",210],["Plan the honeymoon",200],["Cake tasting",190],["Reserve a hotel room block for guests",180],
  ["Order the invitations",150],["Buy the rings",140],["Book transport",130],["Choose the menu",125],["Plan the rehearsal dinner",120],
  ["Send the invitations",75],["Check marriage licence rules and book an appointment",65],["Book outfit fittings",60],["Write your vows",50],["Buy favours and wedding party gifts",45],
  ["RSVP deadline: chase the late replies",30],["Give the final headcount to the caterer",25],["Finish the seating plan",21],["Confirm times with every vendor",21],["Break in your shoes",18],
  ["Pay the final balances",14],["Write the day's timeline for the wedding party",12],["Pack for the honeymoon",10],["Prepare thank-you envelopes for vendors",8],
  ["Collect outfits",5],["Drop décor at the venue",3],["Rehearsal",1],["Early night",1],["Eat a proper breakfast",0],["Hand the rings to someone you trust",0]];
const taskDue = t => plus(S.date, -t.off);
const SIDE_COL = ["#bf8584","#71866d","#ad8c58"];

const I = {
 home:`<path d="M5 20V11a7 7 0 0 1 14 0v9z"/><path d="M9.5 20v-5a2.5 2.5 0 0 1 5 0v5"/>`,
 budget:`<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M16 15h2"/>`,
 guests:`<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14c2.4 0 4 1.4 4.6 4"/>`,
 tasks:`<rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8.5 12.3l2.4 2.4 4.6-5.2"/>`,
 vendors:`<rect x="3.5" y="7" width="17" height="12" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/>`,
 gear:`<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>`,
 check:`<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>`};
const ico = (k, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[k]}</svg>`;
const rings = cls => `<svg class="${cls}" viewBox="0 0 40 40"><circle cx="15" cy="22" r="9" fill="none" stroke="#ad8c58" stroke-width="2"/><circle cx="25" cy="22" r="9" fill="none" stroke="#bf8584" stroke-width="2"/><path d="M22 9l3-4 3 4-3 3z" fill="#dcc69c"/></svg>`;
const sprig = (c="#71866d", cls="spr") => `<svg class="${cls}" viewBox="0 0 120 120" fill="none"><path d="M18 116C30 82 52 50 92 18" stroke="${c}" stroke-width="1.6"/>
  ${[[30,92,-30],[40,76,-40],[52,62,-45],[64,48,-50],[76,36,-55]].map(([x,y,r])=>`<ellipse cx="${x-9}" cy="${y-2}" rx="10" ry="4.6" transform="rotate(${r+70} ${x-9} ${y-2})" fill="${c}" opacity=".55"/><ellipse cx="${x+8}" cy="${y+4}" rx="10" ry="4.6" transform="rotate(${r} ${x+8} ${y+4})" fill="${c}" opacity=".38"/>`).join("")}
  <circle cx="94" cy="16" r="4" fill="#dcc69c"/><circle cx="86" cy="12" r="2.6" fill="#bf8584" opacity=".7"/></svg>`;
const archArt = () => `<svg class="art" viewBox="0 0 200 220" fill="none"><path d="M30 210V95a70 70 0 0 1 140 0v115" stroke="#dcc69c" stroke-width="1.6"/><path d="M42 210V97a58 58 0 0 1 116 0v113" stroke="#ebe2d8" stroke-width="1.2"/>
  <g transform="translate(-6 96)">${sprig("#71866d","").replace('<svg class="" viewBox="0 0 120 120" fill="none">','<g>').replace("</svg>","</g>")}</g>
  <g transform="translate(206 96) scale(-1 1)">${sprig("#a8b8a0","").replace('<svg class="" viewBox="0 0 120 120" fill="none">','<g>').replace("</svg>","</g>")}</g>
  <circle cx="88" cy="138" r="20" stroke="#ad8c58" stroke-width="2.4"/><circle cx="112" cy="138" r="20" stroke="#bf8584" stroke-width="2.4"/><path d="M106 112l6-8 6 8-6 6z" fill="#dcc69c"/></svg>`;

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2700); }
function petals(){ const cols = ["#f5e6e1","#e9c6c0","#dcc69c","#ffffff","#d9a7a4"]; for(let i=0;i<46;i++){ const c = document.createElement("div"); c.className = "petal";
  c.style.left = Math.random()*100 + "vw"; c.style.background = cols[i%cols.length]; document.body.appendChild(c);
  c.animate([{transform:"translateY(0) rotate(0)"},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*540}deg)`}],{duration:2600+Math.random()*2200,easing:"cubic-bezier(.3,.5,.5,1)"}).onfinish = () => c.remove(); } }
function modal(html, mount){ close(); const bg = document.createElement("div"); bg.className = "bg"; bg.id = "modal"; bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("mousedown", e => { if(e.target === bg) close(); }); document.body.appendChild(bg); mount && mount(bg.querySelector(".modal")); }
function close(){ document.getElementById("modal")?.remove(); }
document.addEventListener("keydown", e => { if(e.key === "Escape") close(); });

/* ── numbers ── */
function budgetStats(){ const est = sum(S.items.map(i=>i.est)), act = sum(S.items.map(i=>i.actual));
  const paid = sum(S.vendors.flatMap(x=>x.payments.filter(p=>p.paid).map(p=>p.amount)));
  return {est, act, paid, left: S.total - act}; }
function guestStats(){ const g = S.guests; const by = r => g.filter(x=>x.rsvp===r).length;
  const meals = {}; g.filter(x=>x.rsvp==="yes").forEach(x => { const m = x.meal || "Not chosen"; meals[m] = (meals[m]||0) + 1; });
  return {all:g.length, yes:by("yes"), no:by("no"), pending:by("pending"), meals}; }
const allPays = () => S.vendors.flatMap(x => x.payments.map(p => ({...p, vendor:x})));
const sideName = s => s==="a" ? (S.p1||"Partner 1") : s==="b" ? (S.p2||"Partner 2") : "Both";
const initials = n => esc(String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());

/* ── views ── */
let view = {tab:"home"}, gv = "list", gf = "all", gq = "", tf = "todo";
function render(){ const app = document.getElementById("app");
  if(!S.date){ app.innerHTML = welcome(); document.getElementById("nav").innerHTML = ""; return; }
  app.innerHTML = bar() + ({home, budget, guests, tasks, vendors}[view.tab] || home)(); nav();
  const q = document.getElementById("gq"); if(q) q.oninput = () => { gq = q.value; document.getElementById("glist").innerHTML = guestRows(); }; }
function bar(){ return `<header class="bar"><div class="mono">${rings("ring")}<b>${esc(S.p1)} <i>&amp;</i> ${esc(S.p2)}</b></div><button class="ib" data-a="settings" aria-label="Settings">${ico("gear")}</button></header>`; }
function nav(){ document.getElementById("nav").innerHTML = [["home","Home"],["budget","Budget"],["guests","Guests"],["tasks","Checklist"],["vendors","Vendors"]].map(([k,l]) =>
  `<button class="${view.tab===k?"on":""}" data-tab="${k}">${ico(k)}${l}</button>`).join(""); }
function welcome(){ return `<div class="hero">${archArt()}<div class="kick" style="margin-top:6px">Wedding planner</div><h1 class="serif">Plan the day,<br><i>calmly.</i></h1>
  <p>Your budget, guest list, checklist and vendors in one quiet place, counting down to the day you say yes.</p>
  <button class="btn" data-a="setup" style="padding:15px 30px">Start planning</button><div style="margin-top:12px"><button class="btn ghost sm" data-a="demo">Look around with a sample wedding</button></div>
  <div class="feat"><div><b>Budget</b>Estimated against actual, by category</div><div><b>Guests</b>RSVPs, meals and tables</div><div><b>Checklist</b>Every task, timed to your date</div><div><b>Vendors</b>Contacts and payments due</div></div></div>`; }

function home(){ const d = days(S.date), b = budgetStats(), g = guestStats(); const done = S.tasks.filter(t=>t.done).length;
  const next = S.tasks.filter(t=>!t.done).sort((a,b)=>b.off-a.off).slice(0,5);
  const pays = allPays().filter(p=>!p.paid).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
  const cd = d > 0 ? `<b>${d}</b><small>${d===1?"day to go":"days to go"}</small>` : d === 0 ? `<b>Today</b><small>the big day</small>` : `<b>Married</b><small>${fd(S.date,{month:"long",year:"numeric"})}</small>`;
  return `<div class="hgrid"><div>
  <section class="arch">${sprig("#a8b8a0","spr l")}${sprig("#a8b8a0","spr r")}<div class="kick">The wedding of</div>
    <h1>${esc(S.p1)}<i>&amp;</i>${esc(S.p2)}</h1><div class="when">${fd(S.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}${S.venue?`<br>${esc(S.venue)}`:""}</div>
    <div class="cd">${cd}</div></section>
  <div class="trio"><div><b>${money(b.left,true)}</b><small>${b.left<0?"over budget":"left to spend"}</small></div><div><b>${g.yes}<span style="color:var(--mut);font-size:.7em"> / ${g.all}</span></b><small>attending</small></div>
    <div><b>${S.tasks.length?Math.round(done/S.tasks.length*100):0}%</b><small>planned</small></div></div></div><div>
  <div class="card"><div class="ch"><h2>Next on the list</h2><a href="#" data-tab="tasks">Checklist</a></div>
    ${next.map(taskRow).join("") || `<p class="note">Every task is done. Enjoy it.</p>`}</div>
  <div class="card"><div class="ch"><h2>Payments due</h2><a href="#" data-tab="vendors">Vendors</a></div>
    ${pays.map(p => { const dd = days(p.due); return `<div class="li"><div class="grow"><b>${esc(p.vendor.name)}</b><small class="${dd<0?"late":""}">${esc(p.label||"Payment")} · ${dd<0?`overdue since ${fd(p.due)}`:dd===0?"due today":`due ${fd(p.due)}`}</small></div><div class="amt">${money(p.amount)}</div></div>`; }).join("")
     || `<p class="note">Nothing waiting to be paid. Add vendors and their payment dates to see them here.</p>`}</div>
  <div class="card"><div class="ch"><h2>Replies</h2><a href="#" data-tab="guests">Guest list</a></div>${rsvpBar(g)}</div></div></div>`; }
function rsvpBar(g){ const w = n => g.all ? n/g.all*100 : 0;
  return `<div class="stack"><i style="width:${w(g.yes)}%;background:var(--sage)"></i><i style="width:${w(g.pending)}%;background:var(--gold2)"></i><i style="width:${w(g.no)}%;background:#d8cfc8"></i></div>
  <div class="legend"><span style="--c:var(--sage)">${g.yes} attending</span><span style="--c:var(--gold2)">${g.pending} awaiting</span><span style="--c:#d8cfc8">${g.no} declined</span></div>
  ${Object.keys(g.meals).length ? `<div class="filters" style="margin-bottom:0">${Object.entries(g.meals).map(([m,n])=>`<span class="chip gold">${esc(m)} · ${n}</span>`).join("")}</div>` : ""}`; }
function taskRow(t){ const due = taskDue(t), dd = days(due);
  return `<div class="li ${t.done?"done":""}"><button class="tick ${t.done?"on":""}" data-a="task" data-id="${t.id}" aria-label="Done">${ico("check")}</button>
    <div class="grow" data-a="editTask" data-id="${t.id}" style="cursor:pointer"><b>${esc(t.name)}</b><small class="${!t.done&&dd<0?"late":""}">${t.done ? "Done" : dd<0 ? `Overdue · was due ${fd(due)}` : dd===0 ? "Due today" : `Due ${fd(due,{day:"numeric",month:"short",year:dd>300?"numeric":undefined})}`}</small></div></div>`; }

function budget(){ const b = budgetStats(); const f = S.total ? b.act/S.total : 0; const ef = S.total ? Math.min(1, b.est/S.total) : 0;
  return `<h1 class="page">The <i>budget</i></h1><p class="sub">What you planned against what you actually spent, by category.</p>
  <div class="card"><div class="sum4"><div><small>Total budget</small><b>${money(S.total,true)}</b></div><div><small>Estimated</small><b>${money(b.est,true)}</b></div>
    <div><small>Spent so far</small><b>${money(b.act,true)}</b></div><div><small>${b.left<0?"Over by":"Left"}</small><b class="${b.left<0?"late":""}">${money(Math.abs(b.left),true)}</b></div></div>
    <div class="meter"><i class="${f>1?"over":""}" style="width:${Math.min(100,f*100)}%"></i>${S.total?`<u style="left:calc(${ef*100}% - 1px)" title="Estimated"></u>`:""}</div>
    <div class="legend" style="margin-top:8px"><span style="--c:var(--sage)">Spent</span><span style="--c:var(--gold)">Estimated</span><span style="--c:var(--mut)">Paid to vendors: ${money(b.paid,true)}</span></div></div>
  ${S.total && b.est > S.total ? `<div class="warn">Your estimates come to ${money(b.est - S.total,true)} more than the budget. Something may need to give.</div>` : ""}
  <div class="card"><div class="ch"><h2>By category</h2><button class="btn sm sage" data-a="newItem">+ Add a cost</button></div><div class="cats">
  ${CATS.map(([k,n,pct]) => { const its = S.items.filter(i=>i.cat===k); if(!its.length && !pct) return "";
    const e = sum(its.map(i=>i.est)), a = sum(its.map(i=>i.actual)); const base = Math.max(e, S.total*pct/100, a) || 1;
    return `<div class="cat"><div class="top3"><b>${n}</b><span>${money(a,true)} of ${money(e,true)}</span></div>
      <div class="meter"><i class="${e && a>e?"over":""}" style="width:${Math.min(100,a/base*100)}%"></i>${e?`<u style="left:calc(${Math.min(100,e/base*100)}% - 1px)"></u>`:""}</div>
      ${its.map(i=>`<div class="it" data-a="editItem" data-id="${i.id}"><span>${esc(i.name)}</span><span>${money(i.est,true)}</span><span style="min-width:64px;text-align:right;color:var(--ink)">${i.actual?money(i.actual,true):"–"}</span></div>`).join("")
        || `<div class="guide">Nothing added yet.</div>`}
      ${pct && S.total ? `<div class="guide">A common share: about ${pct}% (${money(S.total*pct/100,true)})</div>` : ""}</div>`; }).join("")}</div></div>`; }

function guests(){ const g = guestStats();
  return `<div class="row" style="align-items:flex-end"><div class="grow"><h1 class="page">The <i>guests</i></h1></div><button class="btn sm sage" data-a="newGuest">+ Guest</button></div>
  <p class="sub">${g.all} invited · ${g.yes} attending · ${g.pending} awaiting a reply</p>
  <div class="card">${rsvpBar(g)}</div>
  <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><div class="seg"><button class="${gv==="list"?"on":""}" data-gv="list">Guest list</button><button class="${gv==="tables"?"on":""}" data-gv="tables">Seating</button></div>
    ${gv==="list" ? `<input class="inp" id="gq" placeholder="Search names" value="${esc(gq)}" style="max-width:240px;padding:10px 14px;border-radius:999px">` : ""}</div>
  ${gv==="list" ? `<div class="filters">${[["all","Everyone"],["yes","Attending"],["pending","Awaiting"],["no","Declined"]].map(([k,l])=>`<button class="${gf===k?"on":""}" data-gf="${k}">${l}</button>`).join("")}</div>
    <div class="card" style="padding:4px 18px"><div class="glist" id="glist">${guestRows()}</div></div>` : tablesView()}`; }
function guestRows(){ const q = gq.toLowerCase(); const list = S.guests.filter(x => (gf==="all" || x.rsvp===gf) && (!q || x.name.toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="serif">${S.guests.length ? "No one matches" : "No guests yet"}</div>${S.guests.length ? "Try another filter." : "Add guests one at a time or paste a whole list."}</div>`;
  return list.map(x => `<div class="li gr" data-a="editGuest" data-id="${x.id}"><div class="av" style="background:${SIDE_COL[{a:0,b:1}[x.side]??2]}">${initials(x.name)}</div>
    <div class="grow"><b>${esc(x.name)}</b><small>${esc(sideName(x.side))}${x.side!=="both"?"'s side":""}${x.group?` · ${esc(x.group)}`:""}${x.table?` · Table ${esc(x.table)}`:""}${x.meal&&x.rsvp==="yes"?` · ${esc(x.meal)}`:""}</small></div>
    <button class="rsvp ${x.rsvp}" data-a="rsvp" data-id="${x.id}">${{yes:"Attending",no:"Declined",pending:"Awaiting"}[x.rsvp]}</button></div>`).join(""); }
function tablesView(){ const seated = S.guests.filter(x=>x.rsvp!=="no"); const by = {}; seated.forEach(x => { const t = x.table || ""; (by[t] = by[t] || []).push(x); });
  const keys = Object.keys(by).filter(Boolean).sort((a,b)=> (isNaN(a)||isNaN(b)) ? a.localeCompare(b) : a-b);
  return `<p class="note" style="margin:12px 4px">Everyone not declined, grouped by table. Tap a name to change their table.</p><div class="tables">
   ${keys.map(t => `<div class="tbl"><div class="row"><div class="disc"><b>${esc(t.length>3?t.slice(0,2):t)}</b></div><div class="grow"><div class="serif" style="font-size:20px">${isNaN(t)?esc(t):`Table ${esc(t)}`}</div><small class="note">${by[t].length} seated</small></div></div>
     ${by[t].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="nm" data-a="editGuest" data-id="${x.id}"><span>${esc(x.name)}${x.rsvp==="pending"?` <span class="chip gold" style="padding:1px 7px">?</span>`:""}</span><span>${esc(x.meal||"")}</span></div>`).join("")}</div>`).join("")}
   ${by[""] ? `<div class="tbl" style="border-style:dashed"><div class="serif" style="font-size:20px;margin-bottom:6px">Not seated yet</div>${by[""].map(x=>`<div class="nm" data-a="editGuest" data-id="${x.id}"><span>${esc(x.name)}</span><span>add table</span></div>`).join("")}</div>` : ""}
   ${!seated.length ? `<div class="card empty"><div class="serif">No one to seat yet</div>Add guests, then give each one a table.</div>` : ""}</div>`; }

function tasks(){ const done = S.tasks.filter(t=>t.done).length, n = S.tasks.length, f = n ? done/n : 0; const late = S.tasks.filter(t=>!t.done && days(taskDue(t))<0).length;
  const r = 34, c = 2*Math.PI*r; const list = S.tasks.filter(t => tf==="all" || !t.done);
  const groups = PHASES.map(p => [p, list.filter(t => phaseOf(t.off)===p).sort((a,b)=>b.off-a.off)]).filter(([,l])=>l.length);
  return `<div class="row" style="align-items:flex-end"><div class="grow"><h1 class="page">The <i>checklist</i></h1></div><button class="btn sm sage" data-a="newTask">+ Task</button></div>
  <p class="sub">Every date moves with your wedding date.</p>
  <div class="card prog"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#ebe2d8" stroke-width="7"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="#71866d" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="18" fill="#2f2a2c">${Math.round(f*100)}%</text></svg>
    <div class="grow"><div class="serif" style="font-size:22px">${done} of ${n} done</div><div class="note">${late ? `<span class="late">${late} overdue.</span> Pick one and it is a step closer.` : "Nothing overdue. You are on track."}</div>
    <div class="filters" style="margin-bottom:0"><button class="${tf==="todo"?"on":""}" data-tf="todo">To do</button><button class="${tf==="all"?"on":""}" data-tf="all">Show done too</button></div></div></div>
  ${groups.map(([p,l]) => `<div class="phase">${p[1]}<span>${p[0] ? `by ${fd(plus(S.date,-p[0]),{day:"numeric",month:"short",year:"numeric"})}` : fd(S.date,{day:"numeric",month:"short"})}</span></div><div class="card" style="padding:2px 18px">${l.map(taskRow).join("")}</div>`).join("")
   || `<div class="card empty"><div class="serif">All done</div>Every task is ticked off.</div>`}`; }

function vendors(){ const pays = allPays(); const due = pays.filter(p=>!p.paid).sort((a,b)=>a.due.localeCompare(b.due)); const owed = sum(due.map(p=>p.amount));
  return `<div class="row" style="align-items:flex-end"><div class="grow"><h1 class="page">The <i>vendors</i></h1></div><button class="btn sm sage" data-a="newVendor">+ Vendor</button></div>
  <p class="sub">${S.vendors.length} booked · ${money(owed,true)} still to pay${due.length?`, next on ${fd(due[0].due)}`:""}</p>
  <div class="vgrid">${S.vendors.map(x => { const tot = sum(x.payments.map(p=>p.amount)), pd = sum(x.payments.filter(p=>p.paid).map(p=>p.amount));
    return `<div class="card ven" data-a="editVendor" data-id="${x.id}" style="margin:0"><div class="row"><div class="grow"><div class="kick">${esc(catName(x.cat))}</div><h3>${esc(x.name)}</h3>${x.contact?`<div class="note">${esc(x.contact)}</div>`:""}</div>
      <div class="amt" style="text-align:right"><div class="serif" style="font-size:20px">${money(tot,true)}</div><small class="note">${money(pd,true)} paid</small></div></div>
      ${tot?`<div class="meter" style="margin-top:12px"><i style="width:${pd/tot*100}%"></i></div>`:""}
      ${x.payments.length ? `<div class="pays">${x.payments.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(p => { const dd = days(p.due); return `<div class="pay"><button class="tick ${p.paid?"on":""}" data-a="pay" data-v="${x.id}" data-id="${p.id}" aria-label="Paid">${ico("check")}</button>
        <span class="grow ${p.paid?"note":""}">${esc(p.label||"Payment")} <small class="note ${!p.paid&&dd<0?"late":""}">· ${p.paid?"paid":dd<0?"overdue":fd(p.due)}</small></span><span style="font-variant-numeric:tabular-nums">${money(p.amount)}</span></div>`; }).join("")}</div>` : ""}
      ${x.phone||x.email ? `<div class="cts">${x.phone?`<a href="tel:${esc(x.phone.replace(/[^0-9+]/g,""))}">Call ${esc(x.phone)}</a>`:""}${x.email?`<a href="mailto:${esc(x.email)}">Email</a>`:""}</div>` : ""}</div>`; }).join("")}
  ${!S.vendors.length ? `<div class="card empty" style="grid-column:1/-1"><div class="serif">No vendors yet</div>Add your venue, photographer, florist and the rest, with what you owe and when.</div>` : ""}</div>`; }

/* ── forms ── */
function setupForm(first){ const e = !first;
  modal(`<h3>${e ? "Your wedding" : "Tell us about the day"}</h3><p class="sub">You can change any of this later in Settings.</p>
   <div class="two"><div><label class="f">Your name</label><input class="inp" id="p1" value="${esc(S.p1)}" placeholder="Amira"></div><div><label class="f">Partner's name</label><input class="inp" id="p2" value="${esc(S.p2)}" placeholder="Daniel"></div></div>
   <label class="f">Wedding date</label><input class="inp" type="date" id="d" value="${S.date}">
   <label class="f">Venue (optional)</label><input class="inp" id="ve" value="${esc(S.venue)}" placeholder="Where it is happening">
   <div class="two"><div><label class="f">Total budget</label><input class="inp" id="t" inputmode="decimal" value="${S.total||""}" placeholder="${money(15000,true)}"></div>
     <div><label class="f">Currency</label><select class="inp" id="c">${["USD","GBP","EUR","CAD","AUD","NZD","INR","PKR","AED","SAR","ZAR","SGD","MYR"].map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select></div></div>
   <div class="acts">${e?`<button class="btn ghost" data-close>Cancel</button>`:""}<button class="btn" id="ok">${e?"Save":"Start planning"}</button></div>`, m => {
    m.querySelector("#ok").onclick = () => { const d = v(m,"#d"); if(!d) return toast("Pick your wedding date");
      Object.assign(S, {p1:v(m,"#p1")||"You", p2:v(m,"#p2")||"Your partner", date:d, venue:v(m,"#ve"), total:num(v(m,"#t")), cur:v(m,"#c")});
      if(!S.tasks.length) S.tasks = DEFAULT_TASKS.map(([name,off]) => ({id:uid(), name, off, done:false}));
      save(); close(); render(); if(!e) toast(`${S.tasks.length} tasks are ready on your checklist`); };
  }); }
function itemForm(it){ const e = !!it; it = it || {cat:"venue", name:"", est:"", actual:"", note:""};
  modal(`<h3>${e?"Edit cost":"Add a cost"}</h3>
   <label class="f">Category</label><select class="inp" id="c">${CATS.map(([k,n])=>`<option value="${k}" ${k===it.cat?"selected":""}>${n}</option>`).join("")}</select>
   <label class="f">What is it?</label><input class="inp" id="n" value="${esc(it.name)}" placeholder="Venue hire, flowers for the arch…">
   <div class="two"><div><label class="f">Estimated</label><input class="inp" id="es" inputmode="decimal" value="${it.est||""}" placeholder="0"></div><div><label class="f">Actual</label><input class="inp" id="ac" inputmode="decimal" value="${it.actual||""}" placeholder="Once you know"></div></div>
   <label class="f">Notes</label><textarea class="inp" id="no" placeholder="Quote reference, what is included">${esc(it.note||"")}</textarea>
   <div class="acts">${e?`<button class="btn danger" id="del">Delete</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">Save</button></div>`, m => {
    m.querySelector("#ok").onclick = () => { const n = v(m,"#n"); if(!n) return toast("Give it a name"); const o = {cat:v(m,"#c"), name:n, est:num(v(m,"#es")), actual:num(v(m,"#ac")), note:v(m,"#no")};
      if(e) Object.assign(it,o); else S.items.push({id:uid(), ...o}); save(); close(); render(); };
    if(e) m.querySelector("#del").onclick = () => { S.items = S.items.filter(x=>x.id!==it.id); save(); close(); render(); };
  }); }
function guestForm(g){ const e = !!g; g = g || {name:"", side:"a", group:"Family", rsvp:"pending", meal:"", table:"", note:""}; let side = g.side, rsvp = g.rsvp, many = false;
  modal(`<h3>${e?"Edit guest":"Add guests"}</h3>
   <div id="one"><label class="f">Name</label><input class="inp" id="n" value="${esc(g.name)}" placeholder="Full name"></div>
   ${e?"":`<div id="lots" style="display:none"><label class="f">One name per line</label><textarea class="inp" id="ns" style="min-height:140px" placeholder="Aunt Sara&#10;Uncle Tom&#10;Priya Shah"></textarea></div>
     <button class="lnk" id="tog" style="margin-top:8px">Paste a whole list instead</button>`}
   <label class="f">Whose side</label><div class="opts" id="sd">${[["a",S.p1],["b",S.p2],["both","Both"]].map(([k,l])=>`<button class="${side===k?"on":""}" data-s="${k}">${esc(l)}</button>`).join("")}</div>
   <div class="two"><div><label class="f">Group</label><select class="inp" id="gr">${["Family","Friends","Work","Plus one","Other"].map(x=>`<option ${x===g.group?"selected":""}>${x}</option>`).join("")}</select></div>
     <div><label class="f">Table</label><input class="inp" id="tb" value="${esc(g.table)}" placeholder="1, 2, Top table"></div></div>
   <label class="f">Reply</label><div class="opts" id="rs">${[["pending","Awaiting"],["yes","Attending"],["no","Declined"]].map(([k,l])=>`<button class="${rsvp===k?"on":""}" data-r="${k}">${l}</button>`).join("")}</div>
   <label class="f">Meal</label><select class="inp" id="me"><option value="">Not chosen</option>${S.meals.map(x=>`<option ${x===g.meal?"selected":""}>${esc(x)}</option>`).join("")}</select>
   <label class="f">Dietary needs or notes</label><input class="inp" id="no" value="${esc(g.note||"")}" placeholder="Nut allergy, needs step-free access">
   <div class="acts">${e?`<button class="btn danger" id="del">Delete</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">Save</button></div>`, m => {
    m.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { side = b.dataset.s; m.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b)); });
    m.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { rsvp = b.dataset.r; m.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b)); });
    const tog = m.querySelector("#tog"); if(tog) tog.onclick = () => { many = !many; m.querySelector("#one").style.display = many?"none":""; m.querySelector("#lots").style.display = many?"":"none"; tog.textContent = many ? "Add just one guest" : "Paste a whole list instead"; };
    m.querySelector("#ok").onclick = () => { const o = {side, rsvp, group:v(m,"#gr"), table:v(m,"#tb"), meal:v(m,"#me"), note:v(m,"#no")};
      if(many){ const ns = m.querySelector("#ns").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); if(!ns.length) return toast("Add at least one name");
        ns.forEach(n => S.guests.push({id:uid(), name:n, ...o})); save(); close(); render(); return toast(`${ns.length} guests added`); }
      const n = v(m,"#n"); if(!n) return toast("Add a name"); if(e) Object.assign(g, {name:n, ...o}); else S.guests.push({id:uid(), name:n, ...o}); save(); close(); render(); };
    if(e) m.querySelector("#del").onclick = () => { if(!confirm(`Remove ${g.name} from the guest list?`)) return; S.guests = S.guests.filter(x=>x.id!==g.id); save(); close(); render(); };
  }); }
function taskForm(t){ const e = !!t; t = t || {name:"", off:30, done:false, note:""};
  modal(`<h3>${e?"Edit task":"New task"}</h3><label class="f">Task</label><input class="inp" id="n" value="${esc(t.name)}" placeholder="Order the welcome sign">
   <label class="f">Do it by</label><input class="inp" type="date" id="d" value="${taskDue(t)}"><p class="note" style="margin-top:6px">If you move the wedding date, this moves with it.</p>

    m.querySelector("#ok").onclick = () => { const n = v(m,"#n"); if(!n) return toast("Name the task"); const d = v(m,"#d") || S.date;
      const off = Math.max(0, Math.round((parse(S.date)-parse(d))/864e5)); if(e) Object.assign(t, {name:n, off, note:v(m,"#no")}); else S.tasks.push({id:uid(), name:n, off, done:false, note:v(m,"#no")}); save(); close(); render(); };

function vendorForm(x){ const e = !!x; x = x || {name:"", cat:"venue", contact:"", phone:"", email:"", note:"", payments:[]}; let pays = x.payments.map(p=>({...p}));

      const o = {name:n, cat:v(m,"#c"), contact:v(m,"#ct"), phone:v(m,"#ph"), email:v(m,"#em"), note:v(m,"#no"), payments:pays.filter(p=>p.amount||p.label).map(p=>({...p, due:p.due||today()}))};
      if(e) Object.assign(x,o); else S.vendors.push({id:uid(), ...o}); save(); close(); render(); };
    if(e) m.querySelector("#del").onclick = () => { if(!confirm(`Delete ${x.name}?`)) return; S.vendors = S.vendors.filter(y=>y.id!==x.id); save(); close(); render(); };
  }); }
function settings(){ modal(`<h3>Settings</h3><p class="sub">Everything is saved on this device only.</p>

  <label class="f">Meal choices</label><input class="inp" id="me" value="${esc(S.meals.join(", "))}"><p class="note" style="margin-top:6px">Separate with commas.</p>

  <div class="acts"><button class="btn" id="ok">Done</button></div>`, m => {

    m.querySelector("#ok").onclick = () => { keep(); close(); render(); };

    m.querySelector("#ex").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download = `wedding-planner-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("Backup downloaded"); };
    m.querySelector("#im").onclick = () => document.getElementById("imp").click();

document.getElementById("imp").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(d.v!==1 || !Array.isArray(d.guests) || !Array.isArray(d.tasks)) throw 0; S = Object.assign(blank(), d); save(); close(); render(); toast("Backup restored"); }catch(err){ toast("That is not a Wedding Planner backup"); } }; r.readAsText(f); e.target.value = ""; };

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ e.preventDefault(); view = {tab:tb.dataset.tab}; render(); scrollTo({top:0}); return; }
  const gvb = e.target.closest("[data-gv]"); if(gvb){ gv = gvb.dataset.gv; render(); return; }

  else if(a==="task"){ const t = S.tasks.find(x=>x.id===id); t.done = !t.done; save(); render(); if(t.done && S.tasks.every(x=>x.done)){ petals(); toast("Every task is done. All that is left is the day itself."); } }
  else if(a==="newVendor") vendorForm(); else if(a==="editVendor") vendorForm(S.vendors.find(x=>x.id===id));
  else if(a==="pay"){ e.stopPropagation(); const p = S.vendors.find(x=>x.id===b.dataset.v).payments.find(x=>x.id===id); p.paid = !p.paid; save(); render(); if(p.paid) toast("Marked as paid"); }

(function(){
  var FOLDER = "wed-65e26fc4", NAME = "Wedding Planner", KEY = "pwa.card." + FOLDER, DAY = 864e5;
  var ua = navigator.userAgent || "";
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {

    var box = pwaEl("div"); box.appendChild(pwaEl("p", "pwa-title", "Add " + NAME + " to your home screen"));
    var t = pwaEl("p", "pwa-text"), btns = pwaEl("div", "pwa-btns");
    if (isIOS) {
      if (/CriOS|FxiOS|EdgiOS/.test(ua)) t.textContent = "Open this link in Safari, then tap Share and Add to Home Screen.";

    } else if (pwaDeferred) {
