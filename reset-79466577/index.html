<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Reset Quest</title>
<style>
:root{--bg:#141833;--bg2:#251c43;--ink:#f7f1e8;--mut:#b9b2cc;--dim:#8a83a3;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --sun:#ffc46b;--sun2:#ff8f5a;--coral:#ff7b6b;--mint:#62e0b6;--sky:#86c8ff;--r:22px;--nav:74px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 520px at 100% -8%,rgba(255,170,100,.30),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(134,200,255,.12),transparent 60%),
  linear-gradient(170deg,#1d1b40 0%,var(--bg) 45%,#120f26 100%) fixed;overflow-x:hidden}
/* lighting: one warm light source, the sunrise at the top right. Every highlight faces it, every shadow falls away to the bottom left */
:root{--sy:0}
body::before{content:"";position:fixed;inset:-10% -30% auto auto;width:120%;height:80%;pointer-events:none;z-index:0;
  background:linear-gradient(118deg,transparent 38%,rgba(255,214,150,.09) 46%,transparent 54%),linear-gradient(128deg,transparent 52%,rgba(255,200,140,.06) 58%,transparent 64%);
  mask-image:linear-gradient(205deg,#000 5%,transparent 60%);-webkit-mask-image:linear-gradient(205deg,#000 5%,transparent 60%);
  transform:translateY(calc(var(--sy) * -0.12px))}
body::after{content:"";position:fixed;right:-140px;top:-160px;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,226,170,.38) 0%,rgba(255,170,100,.16) 35%,transparent 70%);transform:translateY(calc(var(--sy) * -0.06px))}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
button{cursor:pointer;border:0;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(var(--nav) + 40px)}
.top{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 72%,#ffe2a8 0 22%,#ffb05e 23% 36%,transparent 37%),linear-gradient(180deg,#3b2f6e,#21194a);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),-4px 6px 14px rgba(0,0,0,.35)}
.top .grow{min-width:0}
.top b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:600}
.lv i{font-style:normal;background:linear-gradient(180deg,#ffe3a3,#ffb45f);color:#3a1d0b;border-radius:7px;padding:1px 7px;font-weight:800}
.xpbar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px;width:150px;max-width:100%}
.xpbar u{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%),linear-gradient(90deg,var(--sun),var(--sun2));border-radius:9px}
.icb{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icb svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:-10px 16px 26px -16px rgba(6,4,18,.75),inset 0 1px 0 rgba(255,236,200,.08)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(205deg,rgba(255,226,180,.13),transparent 38%);mix-blend-mode:screen}
.hero{background:linear-gradient(155deg,rgba(255,170,100,.20),rgba(134,110,255,.10) 55%,rgba(255,255,255,.04));border-color:rgba(255,220,170,.22)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.big{font-size:34px;font-weight:850;letter-spacing:-.02em;line-height:1.1}
.gold{background:linear-gradient(180deg,#fff2c9,var(--sun) 55%,var(--sun2));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--mut)}.dim{color:var(--dim)}.pos{color:var(--mint)}.neg{color:var(--coral)}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 4px 10px}
.h h2{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.h button,.link{color:var(--sun);font-weight:700;font-size:15px;padding:12px 8px;margin:-12px -8px;min-height:44px}
.note{font-size:14px;color:var(--mut);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:15px;font-weight:800;font-size:15px;color:#3a1d0b;
  background:linear-gradient(205deg,rgba(255,255,255,.5),transparent 42%),linear-gradient(180deg,#ffdc96,#ffa65f);box-shadow:0 5px 0 #c4642f,-6px 14px 20px -8px rgba(255,140,80,.45);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4642f}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(205deg,rgba(255,255,255,.45),transparent 42%),linear-gradient(180deg,#8ff0cc,#3fcf9c);color:#06341f;box-shadow:0 5px 0 #219067}
.btn.red{background:linear-gradient(205deg,rgba(255,255,255,.4),transparent 42%),linear-gradient(180deg,#ff9e92,#f2606a);color:#3d0710;box-shadow:0 5px 0 #a73848}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px;min-height:44px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--card2);color:var(--mut);white-space:nowrap}
.chip.sun{background:rgba(255,196,107,.18);color:var(--sun)}.chip.mint{background:rgba(98,224,182,.16);color:var(--mint)}.chip.sky{background:rgba(134,200,255,.16);color:var(--sky)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:rgba(0,0,0,.2);border-radius:15px;padding:10px 12px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.stat b{font-size:18px;font-weight:800}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:850;font-size:22px;line-height:1}
.ring .c small{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-top:3px}
.fut{margin-top:14px;padding:12px 14px;border-radius:15px;background:rgba(0,0,0,.22);font-size:15px;line-height:1.45}
.fut span{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin-bottom:3px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.banner .e{font-size:24px;line-height:1}
.banner b{display:block}
.banner.sun{border-color:rgba(255,196,107,.45);background:linear-gradient(160deg,rgba(255,196,107,.16),var(--card))}
.banner.sky{border-color:rgba(134,200,255,.4);background:linear-gradient(160deg,rgba(134,200,255,.13),var(--card))}
.q{padding:16px}
.q-top{display:flex;gap:12px;align-items:flex-start}
.q-e{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.q-top b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.q-top small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.plan{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.plan:first-of-type{margin-top:12px}
.plan .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.plan .t em{font-style:normal;color:var(--mut)}
.plan .t b{font-weight:700}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14)}
.dots i.on{background:radial-gradient(circle at 65% 30%,#d9fff0 0 18%,var(--mint) 45%);box-shadow:0 0 0 3px rgba(98,224,182,.15)}
.tick{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:900;color:#06341f;
  background:linear-gradient(205deg,rgba(255,255,255,.5),transparent 45%),linear-gradient(180deg,#8ff0cc,#3fcf9c);box-shadow:0 4px 0 #219067,-5px 10px 14px -8px rgba(6,4,18,.7)}
.tick:active{transform:translateY(2px);box-shadow:0 2px 0 #219067}
.tick.done{background:rgba(98,224,182,.18);color:var(--mint);box-shadow:none;font-size:20px}
.undo{width:44px;height:44px;border-radius:11px;background:var(--card2);color:var(--dim);display:grid;place-items:center;flex:none;font-size:15px}
.x{width:44px;height:44px;border-radius:11px;color:var(--dim);display:grid;place-items:center;flex:none;background:var(--card2)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);border:1px solid var(--line);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7)}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--mut);font-size:13px}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.empty{text-align:center;color:var(--mut);padding:26px 18px}
.empty .e{font-size:38px;margin-bottom:8px}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area{padding:14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line);min-height:96px;text-align:left;position:relative}
.area .e{font-size:22px}
.area b{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:4px 0 4px}
.area p{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.area p.dim{font-style:italic}
.letter{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line)}
.letter .seal{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:radial-gradient(circle at 35% 30%,#ffb39b,#d9534f 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.letter.ready{border-color:rgba(255,196,107,.5);background:linear-gradient(160deg,rgba(255,196,107,.14),var(--card))}
.sprint{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;margin-top:14px}
.sprint i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--mut)}
.sprint i.up{background:rgba(98,224,182,.35);color:#dffbf0}
.sprint i.strong{background:linear-gradient(180deg,#ffd895,#ff9f5e);color:#3a1d0b}
.sprint i.now{outline:2px solid var(--ink);outline-offset:1px}

.year{display:grid;grid-template-columns:24px repeat(13,minmax(0,1fr));gap:4px;margin-top:12px;align-items:center}
.year .ql{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.04em}
.year i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:var(--dim)}
.year i{position:relative}.year i.up{background:rgba(98,224,182,.4)}.year i.strong{background:#ffb867}.year i.strong{color:#3a1d0b}.year i.up{color:#dffbf0}.year i.fresh{box-shadow:inset 0 0 0 2px var(--sky)}
.year i.future{background:rgba(255,255,255,.03)}.year i.now{outline:2px solid var(--ink);outline-offset:1px}
.navr{display:flex;align-items:center;gap:10px}
.arw{width:44px;height:44px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:800;color:var(--ink);display:grid;place-items:center;flex:none}
.arw[disabled]{opacity:.28;pointer-events:none}
.navr .mid{flex:1;min-width:0;text-align:center}
.navr .mid b{display:block;font-size:17px;font-weight:800}
.navr .mid small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.lapflow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-weight:800}
.lapflow span{padding:8px 12px;border-radius:12px;background:var(--card2);font-size:14px}
.lapflow span.nx{background:rgba(255,196,107,.18);color:var(--sun)}
.goal{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%;min-height:48px}
.goal:first-of-type{border-top:0}
.goal .ck{width:30px;height:30px;border-radius:9px;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none;font-weight:900;font-size:15px;color:#06341f}
.goal.done .ck{background:var(--mint);border-color:var(--mint)}
.goal.done .gt{text-decoration:line-through;color:var(--mut)}
.goal .gt{flex:1;min-width:0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.yc{margin-bottom:12px}
.yc.now{border-color:rgba(255,196,107,.55);background:linear-gradient(160deg,rgba(255,196,107,.12),var(--card))}
.yc.past{opacity:.82}
.yc .yh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.yc .yh b{font-size:17px;font-weight:800}
.laps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line)}
.badge .e{font-size:30px;line-height:1.1}
.badge b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.badge small{display:block;font-size:12px;color:var(--mut);margin-top:3px;line-height:1.3}
.badge.off .e{opacity:.35;filter:grayscale(1)}.badge.off b{color:var(--mut)}.badge.off small{color:var(--mut)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));height:var(--nav);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;background:rgba(22,20,48,.86);border:1px solid var(--line);border-radius:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20;box-shadow:-10px 18px 36px rgba(0,0,0,.45)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--dim);height:100%;min-width:0;white-space:nowrap}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--sun)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,20,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2a2253,#1b1838);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet h3{font-size:22px;font-weight:850;margin-bottom:4px}
.sheet .sub{color:var(--mut);margin-bottom:12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
label.f{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:14px 2px 6px;letter-spacing:.03em}
.in{width:100%;padding:14px 15px;border-radius:15px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;font-size:16px}
.in:focus{border-color:rgba(255,196,107,.7);box-shadow:0 0 0 3px rgba(255,196,107,.15)}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{padding:9px 12px;min-height:46px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.cat.on{background:rgba(255,196,107,.18);border-color:rgba(255,196,107,.6);color:#ffe2ad}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--ink)}
.tip{margin-top:10px;padding:11px 13px;border-radius:13px;background:rgba(134,200,255,.12);border:1px solid rgba(134,200,255,.3);font-size:14px;line-height:1.4}
.tip b{color:var(--sky)}
.count{display:flex;align-items:center;gap:10px}
.count button{width:44px;height:44px;border-radius:13px;background:var(--card2);font-size:20px;font-weight:800}
.count b{min-width:28px;text-align:center;font-size:20px}
/* onboarding */
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:10px 4px 30px}
.ob h1{font-size:40px;line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:18px 0 12px}
.ob h2{font-size:28px;line-height:1.1;font-weight:850;letter-spacing:-.02em;margin:8px 0 8px}
.ob .sub{color:var(--mut);font-size:16px;margin-bottom:6px}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps i{height:6px;flex:1;border-radius:9px;background:rgba(255,255,255,.12)}
.steps i.on{background:linear-gradient(90deg,var(--sun),var(--sun2))}
.sunart{width:140px;height:110px;position:relative;margin:4px 0}
.sunart::before{content:"";position:absolute;left:20px;right:20px;bottom:24px;height:84px;border-radius:84px 84px 0 0;
  background:radial-gradient(circle at 50% 100%,#fff3cf 0 30%,#ffc46b 46%,#ff8f5a 70%,transparent 72%)}
.sunart::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffe2a8,transparent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:90;background:#fff6e6;color:#2b1a08;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 28px);animation:fade .2s}
.toast em{font-style:normal;color:#c2541f}

  background:#fff;color:#1b1b2b;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:16px;font-size:15px;line-height:1.4}

@media(max-width:370px){.big{font-size:30px}.ring{width:92px;height:92px}.areas{grid-template-columns:1fr}.ob h1{font-size:34px}nav button{font-size:11px}}

<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script id="qfx-engine">
/* Quest FX: sounds and seasonal themes, shared by every Quest app.
   One source file. build.py copies it into each app between the qfx markers and replaces the old copy.
   Sounds are made in code (no files), so it all works offline. Prefs are kept per app in localStorage[KEY + ".fx"]. */
const QFX = (() => {
  "use strict";
  /* ───── sound engine ───── */
  let ctx = null, out = null, lastPlay = -1e9;
  function ac(){
    if(ctx) return ctx;
    try{ if(navigator.audioSession) navigator.audioSession.type = "ambient"; }catch(e){}
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return null;
    try{ ctx = new A(); }catch(e){ return null; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = .5; out.connect(comp); comp.connect(ctx.destination);
    return ctx;
  }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(f, o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .005, d = o.d || .2, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if(o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || f*.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + a + d + .05); }
    env(g, t, a, o.g || .3, d); osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + d + .05); }
  let nbuf = null;
  function noise(o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .003, d = o.d || .2;
    if(!nbuf){ nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const x = nbuf.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = Math.random()*2 - 1; }
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.f || 2000, t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d); f.Q.value = o.q || 1; const g = c.createGain(); env(g, t, a, o.g || .3, d);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + a + d + .05); }
  const metal = (base, o) => { o = o || {}; [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(base*m, {at:o.at, g:(o.g || .18)/(i + 1), d:(o.d || .5)/(1 + i*.6)})); };
  const chord = (fs, o) => { o = o || {}; fs.forEach((f, i) => tone(f, {at:(o.at || 0) + i*(o.step || 0), type:o.type || "triangle", g:o.g || .12, d:o.d || .5, a:o.a})); };
  const bell = (f, o) => { o = o || {}; tone(f, {at:o.at, g:o.g || .14, d:o.d || 1.1}); tone(f*2.01, {at:o.at, g:(o.g || .14)*.4, d:(o.d || 1.1)*.6}); tone(f*3.02, {at:o.at, g:(o.g || .14)*.18, d:(o.d || 1.1)*.35}); };
  const pluck = (f, o) => { o = o || {}; tone(f, {at:o.at, type:"triangle", g:o.g || .16, d:o.d || .28}); tone(f*2, {at:o.at, g:(o.g || .16)*.25, d:(o.d || .28)*.5}); };
  const coin = (o) => { o = o || {}; const f = o.f || 1900; tone(f, {at:o.at, type:"square", g:(o.g || .05), d:.05}); tone(f*1.34, {at:(o.at || 0) + .06, type:"square", g:(o.g || .05), d:.22}); };
  const B = {tone, noise, metal, chord, bell, pluck, coin};

  /* default sounds; each app passes its own set, which wins */
  const BASE = {
    tap: b => { b.noise({f:2600, q:2, g:.05, d:.03}); b.tone(880, {d:.035, g:.03}); },
    xp: b => b.chord([784, 1175], {step:.05, type:"sine", g:.1, d:.25}),
    big: b => { b.chord([523, 659, 784, 1047], {step:.07, g:.11, d:.6}); b.noise({type:"highpass", f:7000, g:.04, d:.5, at:.25}); },
    badge: b => { b.chord([1319, 1760, 2637], {step:.06, type:"sine", g:.07, d:.35}); b.metal(1046, {at:.18, g:.05, d:.7}); },
    level: b => { b.chord([392, 523, 659, 784, 1047, 1319], {step:.065, g:.09, d:.45}); b.tone(1568, {at:.42, d:1, g:.06}); },
    done: b => b.chord([659, 988], {step:.06, type:"sine", g:.1, d:.3}),
    del: b => b.tone(240, {to:110, d:.16, g:.16, type:"triangle"}),
    undo: b => b.tone(700, {to:420, d:.12, g:.08, type:"triangle"})
  };
  const FESTIVE = new Set(["xp", "big", "badge", "level", "done"]);
  /* a little extra on rewards during an occasion */
  const ACCENT = {
    bells: b => { [0, .07, .14, .21].forEach(t => b.noise({type:"highpass", f:7200, q:1, g:.07, d:.06, at:.08 + t})); b.metal(2600, {at:.1, g:.05, d:.5}); },
    firework: b => { b.noise({type:"lowpass", f:900, g:.14, d:.18, at:.05}); for(let i = 0; i < 6; i++) b.noise({type:"highpass", f:5000 + Math.random()*3000, g:.05, d:.04, at:.22 + i*.05 + Math.random()*.03}); },
    spooky: b => b.tone(420, {to:210, d:.7, g:.06, vib:5, vibAmt:12, at:.08, a:.05}),
    harp: b => [880, 1109, 1319, 1760].forEach((f, i) => b.pluck(f, {at:.08 + i*.05, g:.07})),
    gong: b => b.metal(110, {at:.05, g:.14, d:1.4}),
    lantern: b => [587, 622, 740, 784].forEach((f, i) => b.pluck(f*2, {at:.08 + i*.07, g:.06, d:.4})),
    sparkle: b => [2093, 2637, 3136].forEach((f, i) => b.tone(f, {at:.08 + i*.05, g:.04, d:.25})),
    chirp: b => { b.tone(3000, {to:4400, d:.07, g:.05, at:.08}); b.tone(3200, {to:4600, d:.07, g:.05, at:.2}); },
    whistle: b => [1568, 1760, 1568, 1976].forEach((f, i) => b.tone(f, {at:.08 + i*.06, g:.05, d:.08})),
    warm: b => b.chord([392, 494, 587], {at:.08, type:"sine", g:.05, d:.6})
  };

  /* ───── occasions ───── */
  const D = (y, m, d) => new Date(y, m - 1, d);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const nthDow = (y, m, dow, n) => { const f = D(y, m, 1), first = 1 + (dow - f.getDay() + 7) % 7; return D(y, m, first + (n - 1)*7); };
  const lastDow = (y, m, dow) => { const l = D(y, m + 1, 0); return D(y, m, l.getDate() - (l.getDay() - dow + 7) % 7); };
  function easter(y){ const a = y % 19, b = Math.floor(y/100), c = y % 100, d = Math.floor(b/4), e = b % 4, f = Math.floor((b + 8)/25), g = Math.floor((b - f + 1)/3),
    h = (19*a + b - d - g + 15) % 30, i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l)/451),
    mo = Math.floor((h + l - 7*m + 114)/31), da = (h + l - 7*m + 114) % 31 + 1; return D(y, mo, da); }
  /* moving dates, checked against published calendars in Nov 2026. Lunar dates can shift a day by moon sighting,
     so the windows are a little wide. Add new years here once a year. */
  const T = {
    ramadan: {2027:[2,8], 2028:[1,28], 2029:[1,16], 2030:[1,5], 2031:[12,16]},
    ramadanB: {2030:[12,26]},
    fitr: {2027:[3,9], 2028:[2,26], 2029:[2,14], 2030:[2,4], 2031:[1,24]},
    adha: {2027:[5,16], 2028:[5,5], 2029:[4,24], 2030:[4,13], 2031:[4,2]},
    diwali: {2026:[11,8], 2027:[10,29], 2028:[10,17], 2029:[11,5], 2030:[10,26], 2031:[11,14]},
    holi: {2027:[3,22], 2028:[3,11], 2029:[3,1], 2030:[3,20], 2031:[3,9]},
    lny: {2027:[2,6], 2028:[1,26], 2029:[2,13], 2030:[2,3], 2031:[1,23]},
    hanukkah: {2026:[12,4], 2027:[12,24], 2028:[12,12], 2029:[12,1], 2030:[12,20], 2031:[12,9]}
  };
  const fromT = (k, y) => T[k][y] ? D(y, T[k][y][0], T[k][y][1]) : null;
  const R = () => { try{ const l = (navigator.languages && navigator.languages[0]) || navigator.language || ""; const m = l.match(/[-_]([A-Za-z]{2})\b/); return m ? m[1].toUpperCase() : ""; }catch(e){ return ""; } };
  /* order = priority when two occasions overlap (first wins) */
  const OCC = [
    {id:"newyear", name:"New Year", e:"✨", hi:"Happy New Year! 🎆", fx:["✨","✨","💫","⭐"], mv:"burst", glow:"255,215,110", acc:"firework",
      win:y => [[D(y - 1, 12, 27), D(y, 1, 2)], [D(y, 12, 27), D(y + 1, 1, 2)]]},
    {id:"valentine", name:"Valentine's Day", e:"💕", hi:"Happy Valentine's Day 💕", fx:["💕","❤️","💗","✨"], mv:"rise", glow:"255,120,160", acc:"harp",
      win:y => [[D(y, 2, 10), D(y, 2, 14)]]},
    {id:"stpatrick", name:"St Patrick's Day", e:"☘️", hi:"Happy St Patrick's Day ☘️", fx:["☘️","🍀","✨"], mv:"fall", glow:"90,200,120", acc:"whistle",
      win:y => [[D(y, 3, 15), D(y, 3, 17)]]},
    {id:"mothers", name:"Mother's Day", e:"💐", hi:"Happy Mother's Day 💐", fx:["💐","🌷","🌸","💕"], mv:"fall", glow:"255,150,190", acc:"harp",
      win:y => { const d = ["GB","IE"].includes(R()) ? add(easter(y), -21) : nthDow(y, 5, 0, 2); return [[add(d, -2), d]]; }},
    {id:"fathers", name:"Father's Day", e:"👔", hi:"Happy Father's Day ⭐", fx:["⭐","👔","🎉"], mv:"fall", glow:"110,170,255", acc:"warm",
      win:y => { const d = ["AU","NZ"].includes(R()) ? nthDow(y, 9, 0, 1) : nthDow(y, 6, 0, 3); return [[add(d, -2), d]]; }},
    {id:"july4", name:"4th of July", e:"✨", hi:"Happy 4th of July! 🎆", fx:["✨","⭐","💫"], mv:"burst", glow:"120,160,255", acc:"firework", only:["US"],
      win:y => [[D(y, 7, 2), D(y, 7, 4)]]},
    {id:"pkday", name:"Independence Day (Pakistan)", e:"🌙", hi:"Happy Independence Day 🌙⭐", fx:["🌙","⭐","✨"], mv:"burst", glow:"80,190,120", acc:"firework", only:["PK"],
      win:y => [[D(y, 8, 12), D(y, 8, 14)]]},
    {id:"inday", name:"Independence Day (India)", e:"✨", hi:"Happy Independence Day 🎆", fx:["✨","✨","🪁"], mv:"burst", glow:"255,170,90", acc:"firework", only:["IN"],
      win:y => [[D(y, 8, 13), D(y, 8, 15)]]},
    {id:"bonfire", name:"Bonfire Night", e:"💫", hi:"Happy Bonfire Night 🎇", fx:["💫","✨","🔥","✨"], mv:"burst", glow:"255,140,60", acc:"firework", only:["GB"],
      win:y => [[D(y, 11, 3), D(y, 11, 5)]]},
    {id:"thanksgiving", name:"Thanksgiving", e:"🍂", hi:"Happy Thanksgiving 🍂", fx:["🍂","🍁","🥧"], mv:"fall", glow:"230,140,60", acc:"warm", only:["US","CA"],
      win:y => { const d = R() === "CA" ? nthDow(y, 10, 1, 2) : nthDow(y, 11, 4, 4); return [[add(d, -3), d]]; }},
    {id:"holi", name:"Holi", e:"🎨", hi:"Happy Holi! 🎨", fx:["🟣","🟡","🟢","🔵","🩷"], mv:"burst", glow:"240,110,200", acc:"sparkle",
      win:y => { const d = fromT("holi", y); return d ? [[add(d, -1), add(d, 1)]] : []; }},
    {id:"diwali", name:"Diwali", e:"🪔", hi:"Happy Diwali 🪔", fx:["🪔","✨","💫"], mv:"float", glow:"255,190,80", acc:"sparkle",
      win:y => { const d = fromT("diwali", y); return d ? [[add(d, -2), add(d, 2)]] : []; }},
    {id:"lny", name:"Lunar New Year", e:"🧧", hi:"Happy Lunar New Year 🧧", fx:["🧧","🏮","✨","✨"], mv:"float", glow:"230,60,60", acc:"gong",
      win:y => { const d = fromT("lny", y); return d ? [[add(d, -1), add(d, 6)]] : []; }},
    {id:"easter", name:"Easter", e:"🐣", hi:"Happy Easter 🐣", fx:["🥚","🐣","🌷","🌼"], mv:"fall", glow:"170,220,120", acc:"chirp",
      win:y => { const d = easter(y); return [[add(d, -3), add(d, 1)]]; }},
    {id:"fitr", name:"Eid al-Fitr", e:"🌙", hi:"Eid Mubarak! 🌙", fx:["🌙","⭐","✨","🏮"], mv:"float", glow:"120,200,170", acc:"lantern",
      win:y => { const d = fromT("fitr", y); return d ? [[d, add(d, 2)]] : []; }},
    {id:"adha", name:"Eid al-Adha", e:"🌙", hi:"Eid Mubarak! 🌙", fx:["🌙","⭐","✨","🏮"], mv:"float", glow:"120,200,170", acc:"lantern",
      win:y => { const d = fromT("adha", y); return d ? [[add(d, -1), add(d, 3)]] : []; }},
    {id:"halloween", name:"Halloween", e:"🎃", hi:"Happy Halloween 🎃", fx:["🎃","🦇","🍂","👻"], mv:"float", glow:"255,130,40", acc:"spooky",
      win:y => [[D(y, 10, 24), D(y, 10, 31)]]},
    {id:"christmas", name:"Christmas", e:"🎄", hi:"Merry Christmas! 🎄", fx:["❄️","❄️","✨","❄️"], mv:"fall", glow:"120,200,255", acc:"bells",
      win:y => [[D(y, 12, 1), D(y, 12, 26)]]},
    {id:"hanukkah", name:"Hanukkah", e:"🕎", hi:"Happy Hanukkah 🕎", fx:["✨","⭐","🕯️"], mv:"float", glow:"110,160,255", acc:"sparkle",
      win:y => { const d = fromT("hanukkah", y); return d ? [[d, add(d, 8)]] : []; }},
    {id:"ramadan", name:"Ramadan", e:"🌙", hi:"Ramadan Mubarak 🌙", fx:["🌙","⭐","🏮","✨"], mv:"float", glow:"120,180,200", acc:"lantern",
      win:y => { const out = []; ["ramadan", "ramadanB"].forEach(k => { const s = fromT(k, y); if(!s) return;
        const nx = OCC_FITR_AFTER(s); out.push([s, add(nx, -1)]); }); return out; }}
  ];
  /* Ramadan runs until the day before the next Eid al-Fitr */
  function OCC_FITR_AFTER(s){ for(let y = s.getFullYear(); y <= s.getFullYear() + 1; y++){ const f = fromT("fitr", y); if(f && f > s) return f; } return add(s, 30); }
  const dayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function activeOn(date, prefs){ const t = dayOf(date), y = t.getFullYear(), reg = R();
    for(const o of OCC){ if(prefs && prefs.off[o.id]) continue; if(o.only && !o.only.includes(reg)) continue;
      for(const yy of [y - 1, y]) for(const [a, b] of o.win(yy)) if(t >= dayOf(a) && t <= dayOf(b)) return {o, start:dayOf(a), end:dayOf(b)}; }
    return null; }
  function nextOf(o, from){ const t = dayOf(from); for(let y = t.getFullYear() - 1; y <= t.getFullYear() + 2; y++){ const w = o.win(y).map(([a, b]) => [dayOf(a), dayOf(b)]).filter(([, b]) => b >= t).sort((p, q) => p[0] - q[0]); if(w.length) return w[0]; } return null; }

  /* ───── prefs ───── */
  let K = "", P = {sound:true, season:true, off:{}, seen:{}}, theme = BASE, cfg = {};
  function loadP(){ try{ const p = JSON.parse(localStorage.getItem(K) || "null"); if(p && typeof p === "object"){
      P.sound = p.sound !== false; P.season = p.season !== false; P.off = p.off && typeof p.off === "object" ? p.off : {}; P.seen = p.seen && typeof p.seen === "object" ? p.seen : {}; } }catch(e){} }
  function saveP(){ try{ localStorage.setItem(K, JSON.stringify(P)); }catch(e){} }
  const now = () => api._now ? new Date(api._now) : new Date();

  /* ───── season layer ───── */
  let cur = null;
  function current(){ return P.season ? activeOn(now(), P) : null; }
  function paint(){ const a = api._force ? {o:OCC.find(o => o.id === api._force)} : current(), id = a && a.o ? a.o.id : "";
    if(id === (cur && cur.id) && document.getElementById("qfx-sky")) return;
    cur = a && a.o ? a.o : null; const old = document.getElementById("qfx-sky"); if(old) old.remove();
    document.documentElement.dataset.season = id; if(!cur) return;
    const sky = document.createElement("div"); sky.id = "qfx-sky"; sky.setAttribute("aria-hidden", "true");
    sky.style.setProperty("--qfx-glow", cur.glow);
    { const n = 12; for(let i = 0; i < n; i++){ const s = document.createElement("i"); s.textContent = cur.fx[i % cur.fx.length];
      s.className = "qfx-" + cur.mv; s.style.left = (4 + (i*83 % 92)) + "%"; s.style.fontSize = (11 + (i*7 % 8)) + "px";
      s.style.animationDuration = (9 + (i*37 % 8)) + "s"; s.style.animationDelay = (-(i*29 % 14)) + "s"; if(cur.mv !== "fall" && cur.mv !== "rise") s.style.top = (6 + (i*47 % 80)) + "%";
      sky.appendChild(s); } }
    document.body.appendChild(sky);
    const seenKey = cur.id + "-" + (a.start ? a.start.getFullYear() : now().getFullYear());
    if(!api._force && !P.seen[seenKey]){ P.seen[seenKey] = 1; Object.keys(P.seen).forEach(k => { if(!k.endsWith(String(now().getFullYear())) && !k.endsWith(String(now().getFullYear() - 1))) delete P.seen[k]; }); saveP(); greet(cur); } }
  function greet(o){ const old = document.getElementById("qfx-hi"); if(old) old.remove();
    const h = document.createElement("div"); h.id = "qfx-hi"; h.setAttribute("role", "status");
    h.innerHTML = `<span class="qfx-hi-e" aria-hidden="true">${o.e}</span><span class="qfx-hi-t"><b>${o.hi}</b><small>Your ${o.name} theme is on. Change it in Settings.</small></span><button type="button" class="qfx-hi-x" aria-label="Close">✕</button>`;
    document.body.appendChild(h); h.querySelector("button").onclick = () => h.remove(); setTimeout(() => h.remove(), 8000); }

  /* ───── settings sheet ───── */
  const fmt = d => d.toLocaleDateString(undefined, {day:"numeric", month:"short"});
  function list(){ const t = now(), reg = R(); return OCC.filter(o => !o.only || o.only.includes(reg)).map(o => ({o, w:nextOf(o, t)})).filter(x => x.w).sort((a, b) => a.w[0] - b.w[0]); }
  function openSettings(){ close(); const a = current(), wrap = document.createElement("div"); wrap.id = "qfx-set";
    const sw = (id, on, label, sub) => `<div class="qfx-row"><div class="qfx-tx"><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</div><button type="button" class="qfx-sw ${on ? "on" : ""}" role="switch" aria-checked="${on}" data-qfx="${id}" aria-label="${label}"><i></i></button></div>`;
    wrap.innerHTML = `<div class="qfx-panel" role="dialog" aria-modal="true" aria-label="Sounds and seasonal themes"><h3>Sounds and themes</h3>
      ${sw("sound", P.sound, "Sounds", "Taps, rewards and celebrations. Your phone's silent switch still mutes them.")}
      ${sw("season", P.season, "Seasonal themes", a ? `On now: ${a.o.e} ${a.o.name}` : "Decorations switch on by themselves on special days.")}
      ${P.season ? `<div class="qfx-h">Occasions</div><div class="qfx-list">${list().map(({o, w}) => sw("occ:" + o.id, !P.off[o.id], `${o.e} ${o.name}`,
        (+w[0] === +w[1] ? fmt(w[0]) : fmt(w[0]) + " to " + fmt(w[1])) + (a && a.o.id === o.id ? " · on now" : ""))).join("")}</div>
        <p class="qfx-note">Some dates follow the moon and can move by a day where you live.</p>` : ""}
      <button type="button" class="qfx-done" data-qfx="close">Done</button></div>`;
    wrap.addEventListener("click", e => { if(e.target === wrap) close(); });

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${f >= 1 ? "#62e0b6" : "url(#rg)"}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}"/></svg>`; }

/* ───────── views ───────── */
let tab = "week";
const NAV = [["week","This week"],["quests","Quests"],["future","Future me"],["map","Map"]];

  if(!S.ready){ n.style.display = "none"; return; } n.style.display = "";
  n.innerHTML = NAV.map(([k,l]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}>${I[k]}${l}</button>`).join(""); }

/* This week */
function freshReason(){ const t = today(), d = parse(t), r = [];
  if(t === weekKey(t)) r.push("a new week"); if(d.getDate() === 1) r.push("a new month"); if(t.slice(5) === "01-01") r.push("a new year");
  if(S.settings.bday && t.slice(5) === S.settings.bday) r.push("your birthday");
  return r; }
function sprintDone(){ return S.sprint.start && weekNo(curWeek()) > 12; }
function weekView(){
  const k = curWeek(), n = weekNo(k), qs = activeQ(), tgt = weekTarget(), done = weekDone(k), w = peek(k);
  if(!S.sprint.start || n < 1) return waitView();
  if(n > 12) return sprintEndView();
  const vis = Object.entries(S.vision).filter(([,v]) => v && v.trim()); const pick = vis.length ? vis[(n - 1) % vis.length] : null;
  const fr = freshReason(), t = today(), y = +t.slice(0,4), sj = secondFridayJan(y), qd = Math.abs(daysBetween(t, sj)) <= 2 && t.slice(5,7) === "01";
  const prevK = addDays(k, -7), prevEmpty = weekNo(prevK) >= 1 && !shownUp(prevK) && !shownUp(k);
  return `
  <section class="card hero"><div class="row" style="align-items:flex-start"><div class="grow">
    <div class="lbl">${yearTag(lapYr(S.sprint.start))} · Lap ${lapOf({start:S.sprint.start})} · Week ${n} of 12</div>
    <div class="big" style="margin-top:6px">${weekRange(k)}</div>
    <div class="muted" style="margin-top:4px;font-size:14px">Week ${woy(k)} of ${weeksOfYear(yrOf(k)).length} in ${yrOf(k)}</div>
    <div class="muted" style="margin-top:4px">${tgt ? `${done} of ${tgt} actions this week` : "Add an if-then plan to a quest"}</div></div>
    <div class="ring">${ring(tgt ? done/tgt : 0)}<div class="c">${tgt ? Math.round(done/tgt*100) : 0}%<small>this week</small></div></div></div>
    ${pick ? `<div class="fut"><span>${areaOf(pick[0])[1]} Future you, 5 years from now</span>${esc(pick[1])}</div>` : ""}</section>
  ${qd ? `<section class="card banner sun"><div class="e">🛡️</div><div><b>${t === sj ? "Today is" : t < sj ? "Friday is" : "This week had"} "Quitter's Day"</b><p class="note">It's around when lots of people drop their resolutions. You're still here. One small tick today keeps it that way.</p></div></section>` : ""}
  ${fr.length && !qd ? `<section class="card banner sky"><div class="e">🌅</div><div><b>Fresh start: it's ${fr.join(" and ")}</b><p class="note">A good day to start again, whatever last week looked like.</p></div></section>` : ""}
  ${prevEmpty ? `<section class="card banner sky"><div class="e">🌱</div><div><b>Last week was empty. That's fine.</b><p class="note">Nothing is lost. Start this week small: tick just one thing.</p>
    <button class="btn sm ghost" data-act="fresh" style="margin-top:10px">Make this week easier</button></div></section>` : ""}
  ${qs.length ? qs.map(questCard).join("") : `<div class="card empty"><div class="e">🧭</div>No active quests.<br><br><button class="btn sm" data-act="addQuest">${I.plus} Add a quest</button></div>`}
  ${goalsCard(lapYr(S.sprint.start))}
  ${checkCard(k, w)}
  <div style="text-align:center;margin-top:6px"><button class="link" data-act="fresh">Rough week? Start fresh</button></div>`;
}
function questCard(q){ const k = curWeek(), w = peek(k), a = areaOf(q.area);

    ${q.plans.length ? q.plans.map(p => { const c = Math.min(p.per, +w.ticks[p.id] || 0), full = c >= p.per;
      return `<div class="plan"><div class="t"><em>When</em> <b>${esc(p.when)}</b><br><em>I will</em> <b>${esc(p.then)}</b>
        <div class="dots" aria-label="${c} of ${p.per} this week">${Array.from({length:p.per}, (_,i) => `<i class="${i < c ? "on" : ""}"></i>`).join("")}</div></div>

function checkCard(k, w){
