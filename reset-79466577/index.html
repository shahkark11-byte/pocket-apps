<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Reset Quest</title>
<style>
:root{--bg:#141833;--bg2:#251c43;--ink:#f7f1e8;--mut:#b9b2cc;--dim:#8a83a3;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --sun:#ffc46b;--sun2:#ff8f5a;--coral:#ff7b6b;--mint:#62e0b6;--sky:#86c8ff;--r:22px;--nav:74px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 520px at 100% -8%,rgba(255,170,100,.30),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(134,200,255,.12),transparent 60%),
  linear-gradient(170deg,#1d1b40 0%,var(--bg) 45%,#120f26 100%) fixed;overflow-x:hidden}
/* lighting: one warm light source, the sunrise at the top right. Every highlight faces it, every shadow falls away to the bottom left */
:root{--sy:0}
body::before{content:"";position:fixed;inset:-10% -30% auto auto;width:120%;height:80%;pointer-events:none;z-index:0;
  background:linear-gradient(118deg,transparent 38%,rgba(255,214,150,.09) 46%,transparent 54%),linear-gradient(128deg,transparent 52%,rgba(255,200,140,.06) 58%,transparent 64%);
  mask-image:linear-gradient(205deg,#000 5%,transparent 60%);-webkit-mask-image:linear-gradient(205deg,#000 5%,transparent 60%);
  transform:translateY(calc(var(--sy) * -0.12px))}
body::after{content:"";position:fixed;right:-140px;top:-160px;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,226,170,.38) 0%,rgba(255,170,100,.16) 35%,transparent 70%);transform:translateY(calc(var(--sy) * -0.06px))}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
button{cursor:pointer;border:0;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(var(--nav) + 40px)}
.top{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 72%,#ffe2a8 0 22%,#ffb05e 23% 36%,transparent 37%),linear-gradient(180deg,#3b2f6e,#21194a);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),-4px 6px 14px rgba(0,0,0,.35)}
.top .grow{min-width:0}
.top b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:600}
.lv i{font-style:normal;background:linear-gradient(180deg,#ffe3a3,#ffb45f);color:#3a1d0b;border-radius:7px;padding:1px 7px;font-weight:800}
.xpbar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px;width:150px;max-width:100%}
.xpbar u{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%),linear-gradient(90deg,var(--sun),var(--sun2));border-radius:9px}
.icb{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icb svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:-10px 16px 26px -16px rgba(6,4,18,.75),inset 0 1px 0 rgba(255,236,200,.08)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(205deg,rgba(255,226,180,.13),transparent 38%);mix-blend-mode:screen}
.hero{background:linear-gradient(155deg,rgba(255,170,100,.20),rgba(134,110,255,.10) 55%,rgba(255,255,255,.04));border-color:rgba(255,220,170,.22)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.big{font-size:34px;font-weight:850;letter-spacing:-.02em;line-height:1.1}
.gold{background:linear-gradient(180deg,#fff2c9,var(--sun) 55%,var(--sun2));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--mut)}.dim{color:var(--dim)}.pos{color:var(--mint)}.neg{color:var(--coral)}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 4px 10px}
.h h2{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.h button,.link{color:var(--sun);font-weight:700;font-size:15px;padding:12px 8px;margin:-12px -8px;min-height:44px}
.note{font-size:14px;color:var(--mut);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:15px;font-weight:800;font-size:15px;color:#3a1d0b;
  background:linear-gradient(205deg,rgba(255,255,255,.5),transparent 42%),linear-gradient(180deg,#ffdc96,#ffa65f);box-shadow:0 5px 0 #c4642f,-6px 14px 20px -8px rgba(255,140,80,.45);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4642f}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(205deg,rgba(255,255,255,.45),transparent 42%),linear-gradient(180deg,#8ff0cc,#3fcf9c);color:#06341f;box-shadow:0 5px 0 #219067}
.btn.red{background:linear-gradient(205deg,rgba(255,255,255,.4),transparent 42%),linear-gradient(180deg,#ff9e92,#f2606a);color:#3d0710;box-shadow:0 5px 0 #a73848}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px;min-height:44px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--card2);color:var(--mut);white-space:nowrap}
.chip.sun{background:rgba(255,196,107,.18);color:var(--sun)}.chip.mint{background:rgba(98,224,182,.16);color:var(--mint)}.chip.sky{background:rgba(134,200,255,.16);color:var(--sky)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:rgba(0,0,0,.2);border-radius:15px;padding:10px 12px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.stat b{font-size:18px;font-weight:800}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:850;font-size:22px;line-height:1}
.ring .c small{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-top:3px}
.fut{margin-top:14px;padding:12px 14px;border-radius:15px;background:rgba(0,0,0,.22);font-size:15px;line-height:1.45}
.fut span{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin-bottom:3px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.banner .e{font-size:24px;line-height:1}
.banner b{display:block}
.banner.sun{border-color:rgba(255,196,107,.45);background:linear-gradient(160deg,rgba(255,196,107,.16),var(--card))}
.banner.sky{border-color:rgba(134,200,255,.4);background:linear-gradient(160deg,rgba(134,200,255,.13),var(--card))}
.q{padding:16px}
.q-top{display:flex;gap:12px;align-items:flex-start}
.q-e{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.q-top b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.q-top small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.plan{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.plan:first-of-type{margin-top:12px}
.plan .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.plan .t em{font-style:normal;color:var(--mut)}
.plan .t b{font-weight:700}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14)}
.dots i.on{background:radial-gradient(circle at 65% 30%,#d9fff0 0 18%,var(--mint) 45%);box-shadow:0 0 0 3px rgba(98,224,182,.15)}
.tick{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:900;color:#06341f;
  background:linear-gradient(205deg,rgba(255,255,255,.5),transparent 45%),linear-gradient(180deg,#8ff0cc,#3fcf9c);box-shadow:0 4px 0 #219067,-5px 10px 14px -8px rgba(6,4,18,.7)}
.tick:active{transform:translateY(2px);box-shadow:0 2px 0 #219067}
.tick.done{background:rgba(98,224,182,.18);color:var(--mint);box-shadow:none;font-size:20px}
.undo{width:44px;height:44px;border-radius:11px;background:var(--card2);color:var(--dim);display:grid;place-items:center;flex:none;font-size:15px}
.x{width:44px;height:44px;border-radius:11px;color:var(--dim);display:grid;place-items:center;flex:none;background:var(--card2)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);border:1px solid var(--line);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7)}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--mut);font-size:13px}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.empty{text-align:center;color:var(--mut);padding:26px 18px}
.empty .e{font-size:38px;margin-bottom:8px}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area{padding:14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line);min-height:96px;text-align:left;position:relative}
.area .e{font-size:22px}
.area b{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:4px 0 4px}
.area p{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.area p.dim{font-style:italic}
.letter{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line)}
.letter .seal{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:radial-gradient(circle at 35% 30%,#ffb39b,#d9534f 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.letter.ready{border-color:rgba(255,196,107,.5);background:linear-gradient(160deg,rgba(255,196,107,.14),var(--card))}
.sprint{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;margin-top:14px}
.sprint i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--mut)}
.sprint i.up{background:rgba(98,224,182,.35);color:#dffbf0}
.sprint i.strong{background:linear-gradient(180deg,#ffd895,#ff9f5e);color:#3a1d0b}
.sprint i.now{outline:2px solid var(--ink);outline-offset:1px}

.year{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin-top:12px}
.year i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.07)}
.year i{position:relative}.year i.up{background:rgba(98,224,182,.4)}.year i.strong{background:#ffb867}.year i.strong::after{content:"";position:absolute;inset:35%;border-radius:50%;background:#3a1d0b}.year i.fresh{box-shadow:inset 0 0 0 2px var(--sky)}
.year i.future{background:rgba(255,255,255,.03)}.year i.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:18px;background:linear-gradient(205deg,rgba(255,226,180,.07),transparent 40%),var(--card);box-shadow:-8px 12px 20px -14px rgba(6,4,18,.7);border:1px solid var(--line)}
.badge .e{font-size:30px;line-height:1.1}
.badge b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.badge small{display:block;font-size:12px;color:var(--mut);margin-top:3px;line-height:1.3}
.badge.off .e{opacity:.35;filter:grayscale(1)}.badge.off b{color:var(--mut)}.badge.off small{color:var(--mut)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));height:var(--nav);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;background:rgba(22,20,48,.86);border:1px solid var(--line);border-radius:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20;box-shadow:-10px 18px 36px rgba(0,0,0,.45)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--dim);height:100%;min-width:0;white-space:nowrap}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--sun)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,20,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2a2253,#1b1838);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet h3{font-size:22px;font-weight:850;margin-bottom:4px}
.sheet .sub{color:var(--mut);margin-bottom:12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
label.f{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:14px 2px 6px;letter-spacing:.03em}
.in{width:100%;padding:14px 15px;border-radius:15px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;font-size:16px}
.in:focus{border-color:rgba(255,196,107,.7);box-shadow:0 0 0 3px rgba(255,196,107,.15)}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{padding:9px 12px;min-height:46px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.cat.on{background:rgba(255,196,107,.18);border-color:rgba(255,196,107,.6);color:#ffe2ad}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--ink)}
.tip{margin-top:10px;padding:11px 13px;border-radius:13px;background:rgba(134,200,255,.12);border:1px solid rgba(134,200,255,.3);font-size:14px;line-height:1.4}
.tip b{color:var(--sky)}
.count{display:flex;align-items:center;gap:10px}
.count button{width:44px;height:44px;border-radius:13px;background:var(--card2);font-size:20px;font-weight:800}
.count b{min-width:28px;text-align:center;font-size:20px}
/* onboarding */
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:10px 4px 30px}
.ob h1{font-size:40px;line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:18px 0 12px}
.ob h2{font-size:28px;line-height:1.1;font-weight:850;letter-spacing:-.02em;margin:8px 0 8px}
.ob .sub{color:var(--mut);font-size:16px;margin-bottom:6px}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps i{height:6px;flex:1;border-radius:9px;background:rgba(255,255,255,.12)}
.steps i.on{background:linear-gradient(90deg,var(--sun),var(--sun2))}
.sunart{width:140px;height:110px;position:relative;margin:4px 0}
.sunart::before{content:"";position:absolute;left:20px;right:20px;bottom:24px;height:84px;border-radius:84px 84px 0 0;
  background:radial-gradient(circle at 50% 100%,#fff3cf 0 30%,#ffc46b 46%,#ff8f5a 70%,transparent 72%)}
.sunart::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffe2a8,transparent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:90;background:#fff6e6;color:#2b1a08;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 28px);animation:fade .2s}
.toast em{font-style:normal;color:#c2541f}
.rescue-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:460px;z-index:95;
  background:#fff;color:#1b1b2b;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:16px;font-size:15px;line-height:1.4}
.rescue-bar b{display:block;font-size:16px;margin-bottom:4px}
.rescue-bar .rb{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.rescue-bar button{border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;background:#ececf2;color:#1b1b2b}
.rescue-bar button.p{background:#1b1b2b;color:#fff}
@media(max-width:370px){.big{font-size:30px}.ring{width:92px;height:92px}.areas{grid-template-columns:1fr}.ob h1{font-size:34px}nav button{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#dust{display:none}body::before,body::after{transform:none!important}}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
"use strict";
/* ───────── storage ───────── */
const KEY = "resetquest.v1", RESCUE = KEY + ".rescue";
const blank = () => ({v:1, hero:null, step:0, ready:false, review:{}, vision:{}, word:"", who:"",
  quests:[], sprint:{start:"", n:1, history:[]}, weeks:{}, letters:[], restarts:[], xp:0, badges:{}, caps:{}, flags:{},
  settings:{ws:1, bday:""}});
let S, RESCUED = null;
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const isD = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
function normalize(){
  ["quests","letters","restarts"].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; S[k] = S[k].filter(isObj); });
  ["review","vision","weeks","badges","caps","flags"].forEach(k => { if(!isObj(S[k])) S[k] = {}; });

  return `<section class="card hero"><div class="row"><div class="grow"><div class="lbl">This year's quests</div><div class="big" style="margin-top:6px">${activeQ().length} <span class="muted" style="font-size:18px;font-weight:700">of 3 active</span></div>
    <div class="muted" style="margin-top:4px">Fewer goals, done properly, beat a long list.</div></div>
    <button class="btn" data-act="addQuest" ${activeQ().length >= 3 ? "disabled" : ""}>${I.plus} Quest</button></div></section>
  ${act.length ? act.map(q => { const a = areaOf(q.area), ks = S.sprint.start ? Array.from({length:12}, (_,i) => addDays(S.sprint.start, i*7)) : [];
    const hits = ks.filter(k => q.plans.some(p => (+peek(k).ticks[p.id] || 0) > 0)).length;
    return `<section class="card q"><div class="q-top"><div class="q-e">${a[1]}</div><div class="grow"><b>${esc(q.title)}</b><small>${esc(a[2])}${q.status === "paused" ? " · paused" : ""}</small></div>
      <button class="x" data-act="editQuest" data-id="${q.id}" aria-label="Edit ${esc(q.title)}">✎</button></div>

      ${q.target ? `<p class="note" style="margin-top:6px"><b style="color:var(--ink)">12-week target:</b> ${esc(q.target)}</p>` : ""}
      <p class="note" style="margin-top:6px">${q.plans.length} if-then plan${q.plans.length === 1 ? "" : "s"} · worked on in ${hits} of ${Math.max(0, Math.min(12, weekNo(curWeek())))} weeks</p>
      <div class="actions" style="margin-top:12px">${q.status === "paused" ? `<button class="btn sm ghost" data-act="resumeQ" data-id="${q.id}">Resume</button>` : `<button class="btn sm ghost" data-act="pauseQ" data-id="${q.id}">Pause</button>`}
        <button class="btn sm mint" data-act="doneQ" data-id="${q.id}">Complete</button></div></section>`; }).join("")

  ${done.length ? `<div class="h"><h2>Completed</h2></div><div class="list">${done.map(q => `<div class="item"><div class="emo">🏆</div><div class="grow"><b>${esc(q.title)}</b><small>Completed ${q.doneOn ? fmt(q.doneOn,{day:"numeric",month:"short",year:"numeric"}) : ""}</small></div>
    <button class="btn sm ghost" data-act="reopenQ" data-id="${q.id}">Reopen</button></div>`).join("")}</div>` : ""}`; }

    <div class="actions"><button class="btn sm ghost" data-act="editVision">Edit Future Me</button></div></section>
  <div class="h"><h2>In 5 years</h2><button data-act="editVision">Edit</button></div>

      <small class="muted" style="font-size:13px">Written ${fmt(l.written)} · ${l.opened ? "opened " + fmt(l.opened) : "opens " + fmt(l.unlock,{day:"numeric",month:"short",year:"numeric"})}</small></div>
      ${ready || l.opened ? `<button class="btn sm${ready ? "" : " ghost"}" data-act="openLetter" data-id="${l.id}">${ready ? "Open" : "Read"}</button>` : `<span class="chip">${daysBetween(t, l.unlock)}d</span>`}</div>`; }).join("")}</div>`
    : `<div class="card empty"><div class="e">✉️</div>Write a note to yourself and seal it until a date you choose.</div>`}
  <div class="h"><h2>Look back</h2><button data-act="review">${rv ? "Edit" : "Start"}</button></div>

    ${rv.drop ? `<p class="note" style="margin-top:6px"><b style="color:var(--ink)">Leaving behind:</b> ${esc(rv.drop)}</p>` : ""}</section>`

/* Map */
function mapView(){ const k = curWeek(), y = +today().slice(0,4), ys = weekKey(iso(new Date(y,0,1)));
  const yearWeeks = []; for(let d = ys; +d.slice(0,4) <= y && yearWeeks.length < 53; d = addDays(d,7)) yearWeeks.push(d);
  const freshSet = new Set(S.restarts.map(r => weekKey(r.date)));
  const st = S.sprint.start, ks = st ? Array.from({length:12}, (_,i) => addDays(st, i*7)) : [];
  const up = shownWeeks().length, got = BADGES.filter(b => S.badges[b[0]]).length;
  return `<section class="card hero"><div class="lbl">Sprint ${S.sprint.n} · 12 weeks</div>
    <div class="big" style="margin-top:6px">${st ? `${ks.filter(shownUp).length} <span class="muted" style="font-size:18px;font-weight:700">of 12 weeks shown up</span>` : "Not started"}</div>
    ${st ? `<div class="sprint">${ks.map((x,i) => `<i class="${strong(x) ? "strong" : shownUp(x) ? "up" : ""}${x === k ? " now" : ""}">${i+1}</i>`).join("")}</div>` : ""}
    <div class="stats"><div class="stat"><small>Weeks shown up</small><b>${up}</b></div><div class="stat"><small>Actions</small><b>${totalTicks()}</b></div><div class="stat"><small>Comebacks</small><b>${S.restarts.length}</b></div></div></section>
  <div class="h"><h2>${y} at a glance</h2></div>
  <section class="card"><div class="year">${yearWeeks.map(x => `<i class="${x > k ? "future" : strong(x) ? "strong" : shownUp(x) ? "up" : ""}${freshSet.has(x) ? " fresh" : ""}${x === k ? " now" : ""}" title="${fmt(x)}"></i>`).join("")}</div>
    <div class="legend"><span><i style="background:rgba(98,224,182,.4)"></i>Showed up</span><span><i style="background:#ffb867"></i>Every plan done</span><span><i style="box-shadow:inset 0 0 0 2px var(--sky)"></i>Fresh start</span></div>
    <p class="note" style="margin-top:10px">Empty weeks are just empty. Nothing is taken away.</p></section>
  <div class="h"><h2>Badges</h2><span class="muted" style="font-size:14px">${got} of ${BADGES.length}</span></div>
  <div class="badges">${BADGES.map(b => `<div class="badge${S.badges[b[0]] ? "" : " off"}"><div class="e">${b[1]}</div><b>${b[2]}</b><small>${S.badges[b[0]] ? "Earned " + fmt(S.badges[b[0]]) : b[3]}</small></div>`).join("")}</div>`; }

/* ───────── sheets ───────── */
function sheet(html, mount){ closeSheet(); const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener("click", e => { if(e.target === bg) closeSheet(); });
  document.body.appendChild(bg); mount && mount(bg); return bg; }
function closeSheet(){ const s = document.getElementById("sheet"); if(s) s.remove(); }
const val = (r, s) => { const e = r.querySelector(s); return e ? e.value.trim() : ""; };
const AVOID = /\b(stop|quit|quitting|no more|don'?t|do not|avoid|less|cut out|cut down|give up|never|without)\b/i;
const avoidTip = t => AVOID.test(t) ? `<div class="tip"><b>Tip:</b> goals about <i>starting</i> something tend to stick better than goals about stopping. Try turning it around: "Stop takeaways" → "Cook at home 4 nights a week".</div>` : "";
function questForm(q){ const e = !!q; q = q || {title:"", area:"health", why:"", target:"", plans:[]};
  let area = q.area; const plans = q.plans.map(p => ({...p}));
  sheet(`<h3>${e ? "Edit quest" : "New quest"}</h3><p class="sub">Something to <b>start</b> doing this year.</p>
    <label class="f" for="qt">Quest</label><input class="in" id="qt" maxlength="60" value="${esc(q.title)}" placeholder="Walk more, read every night, save for a deposit">
    <div id="tipBox">${avoidTip(q.title)}</div>
    <label class="f">Life area</label><div class="cats" id="ac">${AREAS.map(a => `<button class="cat${a[0] === area ? " on" : ""}" data-a="${a[0]}">${a[1]} ${a[2]}</button>`).join("")}</div>
    <label class="f" for="qw">Why it matters to you</label><input class="in" id="qw" maxlength="90" value="${esc(q.why)}" placeholder="So I have energy for my kids">
    <label class="f" for="qg">12-week target (optional)</label><input class="in" id="qg" maxlength="80" value="${esc(q.target)}" placeholder="Walk 3 times a week, every week">
    <label class="f">If-then plans</label><div id="pl"></div>
    <button class="btn sm ghost full" id="addP" style="margin-top:10px">${I.plus} Add an if-then plan</button>
    <div class="actions">${e ? `<button class="btn red" id="del">Delete</button>` : `<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">Save</button></div>`, root => {
    const drawP = () => { root.querySelector("#pl").innerHTML = plans.length ? plans.map((p,i) => `<div class="card" style="padding:14px;margin-bottom:10px">
        <label class="f" style="margin-top:0">When…</label><input class="in" data-i="${i}" data-k="when" maxlength="60" value="${esc(p.when)}" placeholder="I get home from work">
        <label class="f">I will…</label><input class="in" data-i="${i}" data-k="then" maxlength="60" value="${esc(p.then)}" placeholder="put my trainers on and walk 20 minutes">
        <div class="row" style="margin-top:12px"><span class="grow note">Times per week</span><div class="count"><button data-m="${i}" aria-label="Fewer">−</button><b>${p.per}</b><button data-pl="${i}" aria-label="More">+</button></div>
        <button class="x" data-rm="${i}" aria-label="Remove plan">✕</button></div></div>`).join("")
        : `<p class="note">Plans like "When I get home, I will walk 20 minutes" make a goal much more likely to happen.</p>`;
      root.querySelectorAll("#pl input").forEach(inp => inp.oninput = () => { plans[+inp.dataset.i][inp.dataset.k] = inp.value; });
      root.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const p = plans[+b.dataset.m]; p.per = Math.max(1, p.per - 1); drawP(); });
      root.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => { const p = plans[+b.dataset.pl]; p.per = Math.min(7, p.per + 1); drawP(); });
      root.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { plans.splice(+b.dataset.rm, 1); drawP(); }); };
    drawP();
    root.querySelector("#qt").oninput = ev => { root.querySelector("#tipBox").innerHTML = avoidTip(ev.target.value); };
    root.querySelectorAll("#ac .cat").forEach(b => b.onclick = () => { area = b.dataset.a; root.querySelectorAll("#ac .cat").forEach(x => x.classList.toggle("on", x === b)); });
    root.querySelector("#addP").onclick = () => { if(plans.length >= 3) return toast("Three plans per quest is plenty"); plans.push({id:uid(), when:"", then:"", per:3}); drawP(); };
    root.querySelector("#ok").onclick = () => { const title = clampTxt(val(root,"#qt"), 60); if(!title) return toast("Give your quest a name");
      const ps = plans.map(p => ({id:p.id || uid(), when:clampTxt(p.when, 60), then:clampTxt(p.then, 60), per:p.per})).filter(p => p.when && p.then);
      if(plans.some(p => (p.when.trim() || p.then.trim()) && !(p.when.trim() && p.then.trim()))) return toast("Fill in both parts of each plan, or remove it");
      const o = {title, area, why:clampTxt(val(root,"#qw"), 90), target:clampTxt(val(root,"#qg"), 80), plans:ps};
      if(e) Object.assign(q, o); else { if(activeQ().length >= 3) return toast("Three active quests at most. Pause or complete one first."); S.quests.push({id:uid(), status:"active", created:today(), ...o}); }
      if(sum(S.quests.map(x => x.plans.length)) >= 3) award("planner"); save(); closeSheet(); render(); };
    if(e) root.querySelector("#del").onclick = () => { if(!confirm(`Delete "${q.title}"? Its ticks stay in your map.`)) return; S.quests = S.quests.filter(x => x.id !== q.id); save(); closeSheet(); render(); };
  }); }
function checkinForm(){ const k = curWeek(), w = wk(k), c = w.check || {feel:"", good:"", hard:"", next:""}; let feel = c.feel;
  sheet(`<h3>Weekly check-in</h3><p class="sub">Two minutes. Honest answers, no grades.</p>
    <label class="f">How was this week?</label><div class="cats" id="fc">${FEELS.map(f => `<button class="cat${f[0] === feel ? " on" : ""}" data-f="${f[0]}">${f[1]} ${f[2]}</button>`).join("")}</div>
    <label class="f" for="cg">What went well?</label><input class="in" id="cg" maxlength="120" value="${esc(c.good)}" placeholder="Walked 3 evenings">
    <label class="f" for="ch">What got in the way?</label><input class="in" id="ch" maxlength="120" value="${esc(c.hard)}" placeholder="Late shifts on Thursday">
    <label class="f" for="cn">One thing for next week</label><input class="in" id="cn" maxlength="120" value="${esc(c.next)}" placeholder="Walk at lunch on shift days">
    <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="ok">Save</button></div>`, root => {
    root.querySelectorAll("#fc .cat").forEach(b => b.onclick = () => { feel = b.dataset.f; root.querySelectorAll("#fc .cat").forEach(x => x.classList.toggle("on", x === b)); });
    root.querySelector("#ok").onclick = () => { if(!feel) return toast("Pick how the week was");

      if(first && !w.checkXp){ w.checkXp = true; save(); gain(20, "Weekly check-in"); award("checkin1"); if(checkins() >= 4) award("checkin4"); if(shownWeeks().length >= 4) award("weeks4"); } };
  }); }
function freshForm(){ const k = curWeek(), prevK = addDays(k, -7), prevEmpty = weekNo(prevK) >= 1 && !shownUp(prevK);
  const qs = activeQ(), all = qs.flatMap(q => q.plans.map(p => ({q, p, per:p.per})));
  sheet(`<h3>Start fresh</h3><p class="sub">Rough weeks happen to everyone. Nothing you've done is lost. Let's make this week doable.</p>
    ${all.length ? `<label class="f">Make plans smaller this week (optional)</label><div class="list">${all.map((x,i) => `<div class="item"><div class="grow"><b>${esc(x.p.then)}</b><small>${esc(x.q.title)}</small></div>
      <div class="count"><button data-m="${i}" aria-label="Fewer">−</button><b id="pc${i}">${x.per}</b><button data-pl="${i}" aria-label="More">+</button></div></div>`).join("")}</div>
      <p class="note" style="margin-top:8px">Times per week. You can raise them again any time in Quests.</p>` : ""}
    <label class="f" for="fn">What got in the way? (optional)</label><input class="in" id="fn" maxlength="120" placeholder="Ill for a few days">
    <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="ok">Start fresh</button></div>`, root => {
    root.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const x = all[+b.dataset.m]; x.per = Math.max(1, x.per - 1); root.querySelector("#pc"+b.dataset.m).textContent = x.per; });
    root.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => { const x = all[+b.dataset.pl]; x.per = Math.min(7, x.per + 1); root.querySelector("#pc"+b.dataset.pl).textContent = x.per; });
    root.querySelector("#ok").onclick = () => { all.forEach(x => { x.p.per = x.per; }); if(!peek(k).fresh) S.restarts.push({date:today(), note:clampTxt(val(root,"#fn"),120)}); wk(k).fresh = true; save(); closeSheet(); render();
      if(prevEmpty && !peek(k).comebackXp){ wk(k).comebackXp = true; save(); gain(15, "Comeback. Welcome back"); award("comeback"); } else toast("Fresh start. One small step at a time."); };
  }); }

  sheet(`<h3>Future Me</h3><p class="sub">Picture yourself 5 years from now. Write it as if it's already true.</p>
    <label class="f" for="vw">In 5 years, I'm someone who…</label><input class="in" id="vw" maxlength="120" value="${esc(S.who)}" placeholder="keeps promises to myself and has room to breathe">

const PH = {money:"Debt-free, with three months of savings", health:"Walking every day and sleeping well", work:"Doing work I'm proud of, with a qualification", people:"Close to my family and a few good friends",
  mind:"Calmer, reading every week", faith:"Praying regularly and giving back", home:"A tidy home I love coming back to", fun:"Travelling once a year"};

  let pick = opts.find(o => o[0] === "1y") ? "1y" : opts[0][0];
  sheet(`<h3>Letter to future you</h3><p class="sub">Write to the person reading this later. It stays sealed until the date you pick.</p>
    <textarea class="in" id="lt" maxlength="2000" style="min-height:160px" placeholder="Dear future me, right now I'm…"></textarea>

    root.querySelectorAll("#lo .cat").forEach(b => b.onclick = () => { pick = b.dataset.o; root.querySelectorAll("#lo .cat").forEach(x => x.classList.toggle("on", x === b)); });
    root.querySelector("#ok").onclick = () => { const txt = clampTxt(root.querySelector("#lt").value, 2000); if(txt.length < 10) return toast("Write a little more first");

(function(){ const rm = matchMedia("(prefers-reduced-motion: reduce)"); if(rm.matches) return;

  function pwaLater(){ pwaSet(String(Date.now())); pwaHide(); }
  function pwaEl(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function pwaBtn(label, cls, fn){ var b = pwaEl("button", "pwa-btn" + (cls ? " " + cls : ""), label); b.type = "button"; b.addEventListener("click", fn); return b; }
  var SHARE = '<svg class="pwa-share" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b6ef3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
  function pwaRender(){
    pwaHide();
    var card = pwaEl("div", "pwa-card"); card.setAttribute("role", "dialog"); card.setAttribute("aria-label", "Add " + NAME + " to your home screen");
    var row = pwaEl("div", "pwa-row"), img = pwaEl("img", "pwa-icon"); img.src = "icon-180.png"; img.alt = "";
    var box = pwaEl("div"); box.appendChild(pwaEl("p", "pwa-title", "Add " + NAME + " to your home screen"));
    var t = pwaEl("p", "pwa-text"), btns = pwaEl("div", "pwa-btns");
    if (isIOS) {
      if (/CriOS|FxiOS|EdgiOS/.test(ua)) t.textContent = "Open this link in Safari, then tap Share and Add to Home Screen.";
      else t.innerHTML = 'Tap the Share button ' + SHARE + ', then Add to Home Screen. It opens like an app and works offline.';
    } else if (pwaDeferred) {
      t.textContent = "Install it to open like an app, even with no internet.";
      btns.appendChild(pwaBtn("Install app", "pwa-primary", function(){
        var ev = pwaDeferred; pwaDeferred = null;
        try { ev.prompt(); ev.userChoice.then(function(c){ if (c && c.outcome === "accepted") pwaDone(); else pwaRender(); }); } catch(e) { pwaRender(); }
      }));
    } else {
      t.textContent = "Tap the ⋮ menu, then Install app or Add to Home screen.";
    }
    box.appendChild(t); row.appendChild(img); row.appendChild(box); card.appendChild(row);
    btns.appendChild(pwaBtn("Later", "", pwaLater)); btns.appendChild(pwaBtn("Got it", isAndroid && pwaDeferred ? "" : "pwa-primary", pwaDone));
    card.appendChild(btns); document.body.appendChild(card); pwaCard = card;
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); pwaDeferred = e; if (pwaShown && pwaCard) pwaRender(); });
  window.addEventListener("appinstalled", pwaDone);
  var v = pwaGet();
  if (v === "done") return;
  if (v && Date.now() - Number(v) < 3 * DAY) return;
  setTimeout(function(){ if (pwaGet() === "done") return; pwaShown = true; pwaRender(); }, 2500);
})();
