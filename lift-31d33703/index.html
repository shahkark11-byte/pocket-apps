/* One overhead lamp, top left. Every highlight sits on a top-left edge and every shadow falls to the bottom right. */
:root{
  --c0:#121315;--c1:#191b1e;--c2:#212429;--c3:#2b2f35;--c4:#373c44;--edge:rgba(255,255,255,.09);--line:#0a0b0c;
  --chalk:#eef1f3;--mute:#a0a9b3;--teal:#35e0c5;--teal2:#1fb7a0;--tealink:#04211d;--red:#ff5a47;--red2:#c93a2b;--steel:#8fa3b5;--lamp:#fff3d6;
  --shade:rgba(0,0,0,.55);--nav:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Barlow',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;color:var(--chalk);background:var(--c0);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(70% 38% at 18% -6%,rgba(255,243,214,.16),transparent 70%),
   radial-gradient(90% 50% at 100% 112%,rgba(0,0,0,.5),transparent 70%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .62  0 0 0 0 .66  0 0 0 .5 0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.16'/></svg>"),
   linear-gradient(180deg,#1b1d20 0,#151618 60%,#101112 100%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(var(--nav) + 52px);position:relative;z-index:1}
h1,h2,h3,.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--mute);font-size:16px}
.note{color:var(--mute);font-size:16px;margin:8px 2px 0}
.grow{flex:1;min-width:0}
b,strong{font-weight:700}
/* header scene */
.scene{position:relative;height:170px;margin:0 -14px;overflow:hidden;border-bottom:1px solid #000;background:#16181b}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tools{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;z-index:3}
.pill{min-width:48px;height:48px;border-radius:10px;background:linear-gradient(160deg,#30343b,#22252a);border:1px solid #0a0b0c;box-shadow:inset 1px 1px 0 var(--edge),3px 4px 0 rgba(0,0,0,.45);display:grid;place-items:center;color:var(--chalk)}
.pill svg{width:24px;height:24px}
.who{position:absolute;right:14px;bottom:12px;left:46%;display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;z-index:2;text-align:right}
.who .nm{min-width:0}
.who b{display:block;font-family:'Barlow Condensed';font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.03em;text-shadow:2px 2px 0 #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:#d3d9df;font-size:16px;font-weight:600;text-shadow:1px 1px 0 #000}
.lvl{font-family:'Barlow Condensed';font-weight:700;font-size:22px;background:var(--teal);color:var(--tealink);padding:4px 10px;border-radius:8px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),3px 3px 0 #000;white-space:nowrap}
.xpwrap{margin:12px 0 4px}
.xpbar{height:14px;border-radius:7px;background:#0b0c0d;border:1px solid #000;box-shadow:inset 0 2px 3px rgba(0,0,0,.7);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(180deg,#7ff2de,var(--teal) 45%,var(--teal2));border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.xpcap{display:flex;justify-content:space-between;color:var(--mute);font-size:16px;margin-top:4px;font-weight:600}
/* plates */
.card{position:relative;background:linear-gradient(160deg,#2a2d33,#202328);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;box-shadow:inset 1px 1px 0 var(--edge),6px 8px 14px -8px var(--shade)}
.card.hot{border-left:4px solid var(--teal)}
.card.boss{border-left:4px solid var(--red)}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 6px}
.h h2{font-size:24px}
.h .link,.link{color:var(--teal);font-weight:700;font-size:16px;min-height:44px;padding:0 6px;font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.hr{height:1px;background:rgba(255,255,255,.08);margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:9px;font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;
  background:linear-gradient(180deg,#5ff0d8,var(--teal) 55%,var(--teal2));color:var(--tealink);border:1px solid #0a0b0c;box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),3px 4px 0 rgba(0,0,0,.5)}
.btn:active{transform:translate(2px,3px);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),1px 1px 0 rgba(0,0,0,.5)}
.btn.ghost{background:linear-gradient(160deg,#30343b,#24272c);color:var(--chalk);box-shadow:inset 1px 1px 0 var(--edge),3px 4px 0 rgba(0,0,0,.45)}
.btn.red{background:linear-gradient(180deg,#ff8070,var(--red) 55%,var(--red2));color:#2a0804}
.btn.sm{min-height:44px;font-size:18px;padding:0 14px}
.btn.full{width:100%}
.btn svg{width:22px;height:22px}
/* forms */
label.f{display:block;font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:18px;color:var(--mute);margin:14px 0 4px}
.in{width:100%;min-height:50px;border-radius:8px;border:1px solid #000;background:#101113;color:var(--chalk);padding:0 12px;font-size:18px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
textarea.in{padding:10px 12px;min-height:80px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#0f1012;border:1px solid #000;border-radius:10px;padding:4px}
.seg button{min-height:46px;border-radius:7px;font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#4a515b,#383d45);color:var(--chalk);box-shadow:inset 1px 1px 0 rgba(255,255,255,.14),2px 3px 0 rgba(0,0,0,.45)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.sw:first-of-type{border-top:0}
.tog{width:64px;height:44px;flex:none;border-radius:20px;background:#0f1012;border:1px solid #000;box-shadow:inset 0 2px 3px rgba(0,0,0,.7);position:relative}
.tog i{position:absolute;left:4px;top:6px;width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,#5d646e,#3b4047);box-shadow:inset 1px 1px 0 rgba(255,255,255,.25),2px 2px 0 rgba(0,0,0,.5);transition:transform .15s}
.tog[aria-checked="true"]{background:#0e3a34}.tog[aria-checked="true"] i{transform:translateX(24px);background:linear-gradient(160deg,#7ff2de,var(--teal2))}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:linear-gradient(180deg,#1b1d21,#121315);border-top:1px solid #000;box-shadow:inset 0 1px 0 var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;max-width:140px;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;position:relative}
#nav button svg{width:26px;height:26px}
#nav button.on{color:var(--teal)}
#nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--teal);box-shadow:0 0 12px var(--teal)}
/* resume bar */
.resume{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));z-index:29;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:10px;background:linear-gradient(160deg,#0f4a41,#0b332d);border:1px solid #000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.15),4px 6px 0 rgba(0,0,0,.45)}
.resume b{font-family:'Barlow Condensed';font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.resume small{display:block;color:#b6e9e0;font-size:16px;line-height:1.1}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(5,6,7,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;overflow-x:hidden;background:linear-gradient(170deg,#2b2e34,#1e2125);color:var(--chalk);border:1px solid #000;border-bottom:0;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:inset 1px 1px 0 var(--edge)}
.sheet h3{font-size:30px;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid #000}}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 12px}
.toast{background:#f1f3f4;color:#121315;border:1px solid #000;padding:10px 14px;border-radius:10px;font-weight:600;font-size:16px;max-width:100%;box-shadow:inset 1px 1px 0 #fff,4px 5px 0 rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;animation:pop .25s}
.toast.pr{background:var(--red);color:#2a0804}
@keyframes pop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.banner{display:flex;align-items:center;gap:10px;background:#2a2410;border:1px solid #000;border-left:4px solid #e3b341;border-radius:8px;padding:8px 8px 8px 12px;margin:10px 0 0;font-size:16px;font-weight:600}
.banner button{min-height:44px;padding:0 12px;border-radius:7px;background:#3c3417;font-weight:700}
.rescue-bar{position:fixed;left:10px;right:10px;bottom:10px;z-index:90;max-width:540px;margin:0 auto;background:#fff1ee;color:#2a0804;border:2px solid #000;border-radius:10px;padding:12px 14px;font-size:16px;box-shadow:4px 6px 0 rgba(0,0,0,.5)}
.rescue-bar b{display:block;font-size:18px}.rescue-bar .rb{display:flex;gap:8px;margin-top:10px}.rescue-bar button{min-height:44px;padding:0 14px;border-radius:7px;background:#ffd6cf;font-weight:700}.rescue-bar button.p{background:#2a0804;color:#fff}
/* start */
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;border-radius:12px;font-size:32px}
.big svg{width:30px;height:30px}
.week{display:flex;align-items:center;gap:14px}
.ringw{width:92px;height:92px;flex:none;position:relative}
.ringw svg{width:100%;height:100%}
.ringw div{position:absolute;inset:0;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:30px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat div{background:#14161a;border:1px solid #000;border-radius:8px;padding:8px 6px;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.stat b{display:block;font-family:'Barlow Condensed';font-size:28px;line-height:1.05}
.stat span{color:var(--mute);font-size:16px}
.rt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.rt:first-child{border-top:0}
.rt .nm{font-family:'Barlow Condensed';font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.empty{text-align:center;padding:20px 8px}
.empty h3{font-size:26px;margin-bottom:6px}
.empty .btn{margin-top:14px}
/* workout */
.wh{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.wh h1{font-size:30px;line-height:1.05}
.clock{font-family:'Barlow Condensed';font-weight:700;font-size:30px;color:var(--teal);font-variant-numeric:tabular-nums}
.ex{padding:12px 12px 14px}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh h3{font-size:28px;line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere}
.last{margin:6px 0 4px;padding:8px 10px;border-radius:8px;background:#14161a;border:1px solid #000;color:#cfd6dc;font-size:16px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.last b{color:var(--teal);font-family:'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;font-size:17px}
.set{margin-top:10px;padding:10px;border-radius:10px;background:#181a1e;border:1px solid #000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.05)}
.set.done{background:#0f2a26;border-color:#06241f}
.sh{display:flex;align-items:center;gap:6px}
.sh .n{font-family:'Barlow Condensed';font-weight:700;font-size:22px;text-transform:uppercase;min-width:52px}
.tagb{min-height:44px;padding:0 10px;border-radius:7px;background:#262a30;border:1px solid #000;font-family:'Barlow Condensed';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);box-shadow:inset 1px 1px 0 var(--edge)}
.tagb.w{color:#ffd37a}
.ib{flex:none;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.ib svg{width:22px;height:22px}
.tick{width:68px;height:68px;border-radius:16px;margin-left:auto;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#2b2f35,#1d2024);border:3px solid #4a515b;box-shadow:inset 1px 1px 0 var(--edge),3px 4px 0 rgba(0,0,0,.5);color:transparent}
.tick svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tick[aria-pressed="true"]{background:linear-gradient(160deg,#7ff2de,var(--teal) 50%,var(--teal2));border-color:#0a0b0c;color:var(--tealink);box-shadow:inset 2px 2px 0 rgba(255,255,255,.55),3px 4px 0 rgba(0,0,0,.5)}
.tick:active{transform:translate(2px,3px)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stp .lb{font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:2px}
.stp .c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;height:54px;border-radius:9px;background:#0f1012;border:1px solid #000;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);overflow:hidden}
.stp .c button{font-family:'Barlow Condensed';font-size:30px;font-weight:700;color:var(--chalk);background:linear-gradient(160deg,#30343b,#24272c);box-shadow:inset 1px 1px 0 var(--edge)}
.stp .c button:active{background:#3a3f47}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:28px;color:var(--chalk);padding:0}
.stp input:focus{outline:2px solid var(--teal);outline-offset:-2px}
.sdone{display:flex;align-items:center;gap:8px}
.sdone .t{flex:1;min-width:0}
.sdone .t b{font-family:'Barlow Condensed';font-size:26px;text-transform:uppercase}
.sdone .t small{color:var(--mute);font-size:16px;display:block}
.restbar{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));z-index:31;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:10px;background:linear-gradient(160deg,#30343b,#1e2125);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--edge),4px 6px 0 rgba(0,0,0,.5)}
.restbar .cd{font-size:34px;color:var(--teal);min-width:84px;font-variant-numeric:tabular-nums}
.restbar .btn{min-height:46px;font-size:18px;padding:0 12px}
/* history */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.card.calc{margin-left:-14px;margin-right:-14px;border-radius:0;padding:14px 6px;border-left:0;border-right:0}
.cal .dw{text-align:center;color:var(--mute);font-weight:700;font-size:16px;font-family:'Barlow Condensed'}
.cal button,.cal span.e{height:44px;border-radius:7px;background:#14161a;border:1px solid #000;font-weight:700;font-size:17px;color:#bcc4cc;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.cal span.e{background:transparent;border-color:transparent;box-shadow:none}
.cal button.w{background:linear-gradient(160deg,#1d6a5d,#124d43);color:#e9fffb;box-shadow:inset 1px 1px 0 rgba(255,255,255,.2)}
.cal button.w2{background:linear-gradient(160deg,#35e0c5,#1fb7a0);color:var(--tealink)}
.cal button.t{outline:2px solid var(--chalk);outline-offset:-2px}
.leg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:16px;margin-top:8px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px}
.hi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-top:1px solid rgba(255,255,255,.07);min-height:64px}
.hi:first-child{border-top:0}
.hi .dt{flex:none;width:56px;text-align:center;font-family:'Barlow Condensed';font-weight:700;line-height:1;text-transform:uppercase}
.hi .dt b{display:block;font-size:30px}.hi .dt span{color:var(--mute);font-size:16px}
.hi .nm{font-family:'Barlow Condensed';font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.hi small{color:var(--mute);font-size:16px;display:block}
/* records */
.bh{display:flex;gap:12px;align-items:center}
.bh svg.bs{width:64px;height:64px;flex:none}
.bh h3{font-size:26px;line-height:1.05}
.hp{height:12px;border-radius:6px;background:#0b0c0d;border:1px solid #000;overflow:hidden;margin-top:8px;box-shadow:inset 0 2px 3px rgba(0,0,0,.7)}
.hp i{display:block;height:100%;background:linear-gradient(180deg,#ff8a7a,var(--red) 50%,var(--red2))}
.big2{font-family:'Barlow Condensed';font-weight:700;font-size:34px;line-height:1;text-transform:uppercase}
.est{display:inline-block;color:#ffd37a;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:#262a30;border:1px solid #000;font-weight:700;font-size:16px;box-shadow:inset 1px 1px 0 var(--edge)}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--tealink)}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:linear-gradient(160deg,#2a2d33,#202328);border:1px solid #000;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:inset 1px 1px 0 var(--edge),4px 5px 10px -6px var(--shade);color:var(--chalk)}
.badge .oc{width:62px;height:62px;margin:0 auto 6px;display:grid;place-items:center}
.badge .oc svg{width:100%;height:100%}
.badge b{display:block;font-family:'Barlow Condensed';font-size:22px;text-transform:uppercase;line-height:1.05}
.badge small{display:block;color:var(--mute);font-size:16px;line-height:1.2;margin-top:2px}
.badge.lock{filter:grayscale(1);opacity:.62}
.xplist{padding-left:20px;display:grid;gap:8px}
.xplist li{font-size:16px}
.levelup{text-align:center}
.pwa-card{font-size:16px !important;background:#22252a !important;color:#eef1f3 !important;border:1px solid #000;border-radius:12px !important}
.pwa-title,.pwa-text{color:#eef1f3 !important;font-size:16px !important}
.pwa-btn{background:#383d45 !important;color:#eef1f3 !important;min-height:44px}
.pwa-btn.pwa-primary{background:#35e0c5 !important;color:#04211d !important}
/* ───── v1.1: bumper plates, rubber floor, chalk, and motion for every action ───── */
:root{--bR:#d8342b;--bB:#2563c9;--bY:#e8b21c;--bG:#2f9a4a;--bW:#e9ecef;--bS:#9aa7b3}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;z-index:0;opacity:.55;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 0 1px,transparent 1.5px) 0 0/9px 9px,
             radial-gradient(circle at 70% 60%,rgba(53,224,197,.05) 0 1px,transparent 1.6px) 0 0/13px 13px,
             linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(0,0,0,.45) calc(25% - 1px) 25%,transparent 25%) 0 0/100% 100%,
             linear-gradient(180deg,transparent,rgba(0,0,0,.35));
  -webkit-mask:linear-gradient(180deg,transparent,#000 40%);mask:linear-gradient(180deg,transparent,#000 40%)}
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.chalk{position:absolute;width:var(--s,8px);height:var(--s,8px);margin:calc(var(--s,8px) / -2) 0 0 calc(var(--s,8px) / -2);border-radius:50%;background:#f6f6f2;box-shadow:0 0 6px rgba(255,255,255,.6);animation:puff .75s cubic-bezier(.15,.7,.35,1) forwards}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.floatxp{position:absolute;font-family:'Barlow Condensed';font-weight:700;font-size:30px;color:#7ff2de;text-shadow:2px 2px 0 #000,0 0 14px rgba(53,224,197,.6);animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}18%{transform:translate(-50%,-90%) scale(1.25);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.tick.slam{animation:slam .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes slam{0%{transform:scale(.7)}40%{transform:scale(1.22) rotate(-6deg)}70%{transform:scale(.94) rotate(2deg)}100%{transform:none}}
.set.flash{animation:setflash .8s ease-out}
@keyframes setflash{0%{box-shadow:0 0 0 0 rgba(53,224,197,.75)}100%{box-shadow:0 0 0 16px rgba(53,224,197,0)}}
.tick.undo{animation:undo .3s ease-out}
@keyframes undo{0%{transform:scale(1)}40%{transform:scale(.82)}100%{transform:none}}
.set.new{animation:slidein .38s cubic-bezier(.2,1.2,.4,1)}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.card.drop{animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-46px) rotate(-1.5deg);opacity:0}60%{transform:translateY(5px);opacity:1}100%{transform:none}}
.app.enter>*{animation:rise .34s cubic-bezier(.2,.9,.3,1) both}
.app.enter>*:nth-child(2){animation-delay:.03s}.app.enter>*:nth-child(3){animation-delay:.06s}.app.enter>*:nth-child(4){animation-delay:.09s}.app.enter>*:nth-child(5){animation-delay:.12s}.app.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.app.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.ov{position:fixed;inset:0;z-index:75;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.ov .stamp{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:.95;color:#fff;text-shadow:3px 3px 0 #000}
.ov.pr{background:radial-gradient(circle,rgba(216,52,43,.35),rgba(0,0,0,0) 65%);animation:ovfade 1.9s forwards}
.ov.pr .stamp{font-size:58px;padding:10px 20px;border:5px solid #fff;border-radius:10px;background:var(--bR);box-shadow:6px 7px 0 #000;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.ov.pr .stamp small{display:block;font-size:24px;letter-spacing:.02em;margin-top:4px}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.6);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes ovfade{0%,75%{opacity:1}100%{opacity:0}}
.ov.lift{background:rgba(8,9,10,.55);animation:ovfade 1.25s forwards}
.ov.lift svg{width:min(78vw,360px);overflow:visible}
.ov.lift .barg{animation:press 1s cubic-bezier(.3,.1,.2,1) both}
@keyframes press{0%{transform:translateY(60px)}35%{transform:translateY(64px)}75%{transform:translateY(-18px)}100%{transform:translateY(-12px)}}
.ov.lift .go{font-family:'Barlow Condensed';font-weight:700;font-size:64px;fill:#fff;stroke:#000;stroke-width:3;paint-order:stroke;animation:goin .9s .25s cubic-bezier(.2,1.6,.4,1) both}
@keyframes goin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.ov.done{animation:ovfade 2.6s forwards}
.ov.done .disc{position:absolute;top:-40px;width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(circle,#111 0 18%,var(--c) 19% 100%);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35);animation:fall var(--t) cubic-bezier(.3,.1,.6,1) var(--dl) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) rotate(var(--r))}}
.ov.done .stamp{font-size:54px;animation:stamp2 .6s cubic-bezier(.2,1.6,.4,1) both;padding:8px 18px;background:var(--teal);color:var(--tealink);text-shadow:none;border:4px solid #000;border-radius:10px;box-shadow:6px 7px 0 #000}
@keyframes stamp2{0%{transform:scale(2.2) rotate(6deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
.ov.lvl{animation:ovfade 2.4s forwards;background:rgba(8,9,10,.62)}
.ov.lvl .rays{position:absolute;width:120vmin;height:120vmin;border-radius:50%;background:radial-gradient(circle,rgba(53,224,197,.45),rgba(53,224,197,.12) 35%,transparent 62%);animation:spin 2.4s ease-out both}
@keyframes spin{from{transform:rotate(0) scale(.6)}to{transform:rotate(70deg) scale(1)}}
.ov.lvl .stamp{position:relative;font-size:30px;animation:goin .7s cubic-bezier(.2,1.6,.4,1) both}
.ov.lvl .stamp b{display:block;font-size:110px;line-height:.9;color:var(--teal)}
.rring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.rring circle{fill:none;stroke-width:5}
.restbar.hurry .cd{animation:beat .5s ease-in-out infinite alternate;color:#ffd37a}
@keyframes beat{to{transform:scale(1.12)}}
.restbar.over{animation:flashbar .6s 3}
@keyframes flashbar{50%{background:#0e3a34;box-shadow:0 0 0 4px var(--teal)}}
/* plate calculator */
.platebar{width:100%;height:auto;display:block;margin:6px 0 2px}
.platebar .pl{animation:plateL .42s cubic-bezier(.2,1.4,.4,1) both}
.platebar .pr2{animation:plateR .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes plateL{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes plateR{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchips span{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:18px;background:#14161a;border:1px solid #000;font-weight:700;font-size:16px}
.pchips i{width:14px;height:14px;border-radius:50%;border:2px solid #000;display:inline-block}
/* charts */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .ln{fill:none;stroke:var(--teal);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .1s ease-out forwards}
.chart .area{fill:url(#cg);opacity:0;animation:fadein .6s .8s forwards}
.chart .dt{fill:#0f1012;stroke:var(--teal);stroke-width:2.5;opacity:0;animation:popin .3s cubic-bezier(.2,1.6,.4,1) forwards}
.chart .dt.pr{stroke:var(--bR);fill:var(--bR)}
.chart text{fill:var(--mute);font-size:12px;font-family:'Barlow'}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.chart .dt{transform-box:fill-box;transform-origin:center}
/* starter plans */
.plan{display:block;width:100%;text-align:left}
.plan svg{width:30px;height:30px;flex:none;color:var(--teal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.plan .pt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.plan .pt span{font-size:16px;color:#cfd6dc;background:#14161a;border:1px solid #000;border-radius:6px;padding:3px 8px}
.card.casc{animation:drop .55s cubic-bezier(.3,1.5,.5,1) both}
/* body weight */
.bwrow{display:flex;align-items:center;gap:12px}
.bwnum{font-family:'Barlow Condensed';font-weight:700;font-size:40px;line-height:1}
.bwnum small{font-size:20px;color:var(--mute);margin-left:4px}
.delta{font-weight:700;font-size:16px}
.dial{width:120px;height:70px;display:block;margin:6px auto 0}
.dial .needle{transform-origin:60px 62px;animation:needle 1s cubic-bezier(.3,1.6,.4,1) both}
@keyframes needle{0%{transform:rotate(-80deg)}100%{transform:rotate(var(--a))}}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;min-height:96px}
.tool svg{width:30px;height:30px;color:var(--teal)}
.tool b{font-family:'Barlow Condensed';font-size:22px;text-transform:uppercase;line-height:1.05}
.tool small{color:var(--mute);font-size:16px;line-height:1.2}
.badgepop{animation:badgepop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes badgepop{0%{transform:scale(.4) rotateY(180deg);opacity:0}100%{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
html.reduce *{animation:none !important;transition:none !important}
@media(max-width:360px){.ex{padding:8px 8px 12px}.set{padding:8px}.tick{width:64px;height:64px}.sh .n{min-width:46px}.sh{gap:4px}.who{left:40%}.who b{font-size:24px}.btn{font-size:20px;padding:0 12px}.bgrid{gap:8px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="bars"></div>
<nav id="nav" aria-label="Main"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script id="qfx-engine">
/* Quest FX: sounds and seasonal themes, shared by every Quest app.
   One source file. build.py copies it into each app between the qfx markers and replaces the old copy.
   Sounds are made in code (no files), so it all works offline. Prefs are kept per app in localStorage[KEY + ".fx"]. */
const QFX = (() => {
  "use strict";
  /* ───── sound engine ───── */
  let ctx = null, out = null, lastPlay = -1e9;
  function ac(){
    if(ctx) return ctx;
    try{ if(navigator.audioSession) navigator.audioSession.type = "ambient"; }catch(e){}
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return null;
    try{ ctx = new A(); }catch(e){ return null; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = .5; out.connect(comp); comp.connect(ctx.destination);
    return ctx;
  }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(f, o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .005, d = o.d || .2, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if(o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || f*.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + a + d + .05); }
    env(g, t, a, o.g || .3, d); osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + d + .05); }
  let nbuf = null;
  function noise(o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .003, d = o.d || .2;
    if(!nbuf){ nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const x = nbuf.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = Math.random()*2 - 1; }
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.f || 2000, t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d); f.Q.value = o.q || 1; const g = c.createGain(); env(g, t, a, o.g || .3, d);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + a + d + .05); }
  const metal = (base, o) => { o = o || {}; [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(base*m, {at:o.at, g:(o.g || .18)/(i + 1), d:(o.d || .5)/(1 + i*.6)})); };
  const chord = (fs, o) => { o = o || {}; fs.forEach((f, i) => tone(f, {at:(o.at || 0) + i*(o.step || 0), type:o.type || "triangle", g:o.g || .12, d:o.d || .5, a:o.a})); };
  const bell = (f, o) => { o = o || {}; tone(f, {at:o.at, g:o.g || .14, d:o.d || 1.1}); tone(f*2.01, {at:o.at, g:(o.g || .14)*.4, d:(o.d || 1.1)*.6}); tone(f*3.02, {at:o.at, g:(o.g || .14)*.18, d:(o.d || 1.1)*.35}); };
  const pluck = (f, o) => { o = o || {}; tone(f, {at:o.at, type:"triangle", g:o.g || .16, d:o.d || .28}); tone(f*2, {at:o.at, g:(o.g || .16)*.25, d:(o.d || .28)*.5}); };
  const coin = (o) => { o = o || {}; const f = o.f || 1900; tone(f, {at:o.at, type:"square", g:(o.g || .05), d:.05}); tone(f*1.34, {at:(o.at || 0) + .06, type:"square", g:(o.g || .05), d:.22}); };
  const B = {tone, noise, metal, chord, bell, pluck, coin};

  /* default sounds; each app passes its own set, which wins */
  const BASE = {
    tap: b => { b.noise({f:2600, q:2, g:.05, d:.03}); b.tone(880, {d:.035, g:.03}); },
    xp: b => b.chord([784, 1175], {step:.05, type:"sine", g:.1, d:.25}),
    big: b => { b.chord([523, 659, 784, 1047], {step:.07, g:.11, d:.6}); b.noise({type:"highpass", f:7000, g:.04, d:.5, at:.25}); },
    badge: b => { b.chord([1319, 1760, 2637], {step:.06, type:"sine", g:.07, d:.35}); b.metal(1046, {at:.18, g:.05, d:.7}); },
    level: b => { b.chord([392, 523, 659, 784, 1047, 1319], {step:.065, g:.09, d:.45}); b.tone(1568, {at:.42, d:1, g:.06}); },
    done: b => b.chord([659, 988], {step:.06, type:"sine", g:.1, d:.3}),
    del: b => b.tone(240, {to:110, d:.16, g:.16, type:"triangle"}),
    undo: b => b.tone(700, {to:420, d:.12, g:.08, type:"triangle"})
  };
  const FESTIVE = new Set(["xp", "big", "badge", "level", "done"]);
  /* a little extra on rewards during an occasion */
  const ACCENT = {
    bells: b => { [0, .07, .14, .21].forEach(t => b.noise({type:"highpass", f:7200, q:1, g:.07, d:.06, at:.08 + t})); b.metal(2600, {at:.1, g:.05, d:.5}); },
    firework: b => { b.noise({type:"lowpass", f:900, g:.14, d:.18, at:.05}); for(let i = 0; i < 6; i++) b.noise({type:"highpass", f:5000 + Math.random()*3000, g:.05, d:.04, at:.22 + i*.05 + Math.random()*.03}); },
    spooky: b => b.tone(420, {to:210, d:.7, g:.06, vib:5, vibAmt:12, at:.08, a:.05}),
    harp: b => [880, 1109, 1319, 1760].forEach((f, i) => b.pluck(f, {at:.08 + i*.05, g:.07})),
    gong: b => b.metal(110, {at:.05, g:.14, d:1.4}),
    lantern: b => [587, 622, 740, 784].forEach((f, i) => b.pluck(f*2, {at:.08 + i*.07, g:.06, d:.4})),
    sparkle: b => [2093, 2637, 3136].forEach((f, i) => b.tone(f, {at:.08 + i*.05, g:.04, d:.25})),
    chirp: b => { b.tone(3000, {to:4400, d:.07, g:.05, at:.08}); b.tone(3200, {to:4600, d:.07, g:.05, at:.2}); },
    whistle: b => [1568, 1760, 1568, 1976].forEach((f, i) => b.tone(f, {at:.08 + i*.06, g:.05, d:.08})),
    warm: b => b.chord([392, 494, 587], {at:.08, type:"sine", g:.05, d:.6})
  };

  /* ───── occasions ───── */
  const D = (y, m, d) => new Date(y, m - 1, d);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const nthDow = (y, m, dow, n) => { const f = D(y, m, 1), first = 1 + (dow - f.getDay() + 7) % 7; return D(y, m, first + (n - 1)*7); };
  const lastDow = (y, m, dow) => { const l = D(y, m + 1, 0); return D(y, m, l.getDate() - (l.getDay() - dow + 7) % 7); };
  function easter(y){ const a = y % 19, b = Math.floor(y/100), c = y % 100, d = Math.floor(b/4), e = b % 4, f = Math.floor((b + 8)/25), g = Math.floor((b - f + 1)/3),
    h = (19*a + b - d - g + 15) % 30, i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l)/451),
    mo = Math.floor((h + l - 7*m + 114)/31), da = (h + l - 7*m + 114) % 31 + 1; return D(y, mo, da); }
  /* moving dates, checked against published calendars in Nov 2026. Lunar dates can shift a day by moon sighting,
     so the windows are a little wide. Add new years here once a year. */
  const T = {
    ramadan: {2027:[2,8], 2028:[1,28], 2029:[1,16], 2030:[1,5], 2031:[12,16]},
    ramadanB: {2030:[12,26]},
    fitr: {2027:[3,9], 2028:[2,26], 2029:[2,14], 2030:[2,4], 2031:[1,24]},
    adha: {2027:[5,16], 2028:[5,5], 2029:[4,24], 2030:[4,13], 2031:[4,2]},
    diwali: {2026:[11,8], 2027:[10,29], 2028:[10,17], 2029:[11,5], 2030:[10,26], 2031:[11,14]},
    holi: {2027:[3,22], 2028:[3,11], 2029:[3,1], 2030:[3,20], 2031:[3,9]},
    lny: {2027:[2,6], 2028:[1,26], 2029:[2,13], 2030:[2,3], 2031:[1,23]},
    hanukkah: {2026:[12,4], 2027:[12,24], 2028:[12,12], 2029:[12,1], 2030:[12,20], 2031:[12,9]}
  };
  const fromT = (k, y) => T[k][y] ? D(y, T[k][y][0], T[k][y][1]) : null;
  const R = () => { try{ const l = (navigator.languages && navigator.languages[0]) || navigator.language || ""; const m = l.match(/[-_]([A-Za-z]{2})\b/); return m ? m[1].toUpperCase() : ""; }catch(e){ return ""; } };
  /* order = priority when two occasions overlap (first wins) */
  const OCC = [
    {id:"newyear", name:"New Year", e:"✨", hi:"Happy New Year! 🎆", fx:["✨","✨","💫","⭐"], mv:"burst", glow:"255,215,110", acc:"firework",
      win:y => [[D(y - 1, 12, 27), D(y, 1, 2)], [D(y, 12, 27), D(y + 1, 1, 2)]]},
    {id:"valentine", name:"Valentine's Day", e:"💕", hi:"Happy Valentine's Day 💕", fx:["💕","❤️","💗","✨"], mv:"rise", glow:"255,120,160", acc:"harp",
      win:y => [[D(y, 2, 10), D(y, 2, 14)]]},
    {id:"stpatrick", name:"St Patrick's Day", e:"☘️", hi:"Happy St Patrick's Day ☘️", fx:["☘️","🍀","✨"], mv:"fall", glow:"90,200,120", acc:"whistle",
      win:y => [[D(y, 3, 15), D(y, 3, 17)]]},
    {id:"mothers", name:"Mother's Day", e:"💐", hi:"Happy Mother's Day 💐", fx:["💐","🌷","🌸","💕"], mv:"fall", glow:"255,150,190", acc:"harp",
      win:y => { const d = ["GB","IE"].includes(R()) ? add(easter(y), -21) : nthDow(y, 5, 0, 2); return [[add(d, -2), d]]; }},
    {id:"fathers", name:"Father's Day", e:"👔", hi:"Happy Father's Day ⭐", fx:["⭐","👔","🎉"], mv:"fall", glow:"110,170,255", acc:"warm",
      win:y => { const d = ["AU","NZ"].includes(R()) ? nthDow(y, 9, 0, 1) : nthDow(y, 6, 0, 3); return [[add(d, -2), d]]; }},
    {id:"july4", name:"4th of July", e:"✨", hi:"Happy 4th of July! 🎆", fx:["✨","⭐","💫"], mv:"burst", glow:"120,160,255", acc:"firework", only:["US"],
      win:y => [[D(y, 7, 2), D(y, 7, 4)]]},
    {id:"pkday", name:"Independence Day (Pakistan)", e:"🌙", hi:"Happy Independence Day 🌙⭐", fx:["🌙","⭐","✨"], mv:"burst", glow:"80,190,120", acc:"firework", only:["PK"],
      win:y => [[D(y, 8, 12), D(y, 8, 14)]]},
    {id:"inday", name:"Independence Day (India)", e:"✨", hi:"Happy Independence Day 🎆", fx:["✨","✨","🪁"], mv:"burst", glow:"255,170,90", acc:"firework", only:["IN"],
      win:y => [[D(y, 8, 13), D(y, 8, 15)]]},
    {id:"bonfire", name:"Bonfire Night", e:"💫", hi:"Happy Bonfire Night 🎇", fx:["💫","✨","🔥","✨"], mv:"burst", glow:"255,140,60", acc:"firework", only:["GB"],
      win:y => [[D(y, 11, 3), D(y, 11, 5)]]},
    {id:"thanksgiving", name:"Thanksgiving", e:"🍂", hi:"Happy Thanksgiving 🍂", fx:["🍂","🍁","🥧"], mv:"fall", glow:"230,140,60", acc:"warm", only:["US","CA"],
      win:y => { const d = R() === "CA" ? nthDow(y, 10, 1, 2) : nthDow(y, 11, 4, 4); return [[add(d, -3), d]]; }},
    {id:"holi", name:"Holi", e:"🎨", hi:"Happy Holi! 🎨", fx:["🟣","🟡","🟢","🔵","🩷"], mv:"burst", glow:"240,110,200", acc:"sparkle",
      win:y => { const d = fromT("holi", y); return d ? [[add(d, -1), add(d, 1)]] : []; }},
    {id:"diwali", name:"Diwali", e:"🪔", hi:"Happy Diwali 🪔", fx:["🪔","✨","💫"], mv:"float", glow:"255,190,80", acc:"sparkle",
      win:y => { const d = fromT("diwali", y); return d ? [[add(d, -2), add(d, 2)]] : []; }},
    {id:"lny", name:"Lunar New Year", e:"🧧", hi:"Happy Lunar New Year 🧧", fx:["🧧","🏮","✨","✨"], mv:"float", glow:"230,60,60", acc:"gong",
      win:y => { const d = fromT("lny", y); return d ? [[add(d, -1), add(d, 6)]] : []; }},
    {id:"easter", name:"Easter", e:"🐣", hi:"Happy Easter 🐣", fx:["🥚","🐣","🌷","🌼"], mv:"fall", glow:"170,220,120", acc:"chirp",
      win:y => { const d = easter(y); return [[add(d, -3), add(d, 1)]]; }},
    {id:"fitr", name:"Eid al-Fitr", e:"🌙", hi:"Eid Mubarak! 🌙", fx:["🌙","⭐","✨","🏮"], mv:"float", glow:"120,200,170", acc:"lantern",
      win:y => { const d = fromT("fitr", y); return d ? [[d, add(d, 2)]] : []; }},
    {id:"adha", name:"Eid al-Adha", e:"🌙", hi:"Eid Mubarak! 🌙", fx:["🌙","⭐","✨","🏮"], mv:"float", glow:"120,200,170", acc:"lantern",
      win:y => { const d = fromT("adha", y); return d ? [[add(d, -1), add(d, 3)]] : []; }},
    {id:"halloween", name:"Halloween", e:"🎃", hi:"Happy Halloween 🎃", fx:["🎃","🦇","🍂","👻"], mv:"float", glow:"255,130,40", acc:"spooky",
      win:y => [[D(y, 10, 24), D(y, 10, 31)]]},
    {id:"christmas", name:"Christmas", e:"🎄", hi:"Merry Christmas! 🎄", fx:["❄️","❄️","✨","❄️"], mv:"fall", glow:"120,200,255", acc:"bells",
      win:y => [[D(y, 12, 1), D(y, 12, 26)]]},
    {id:"hanukkah", name:"Hanukkah", e:"🕎", hi:"Happy Hanukkah 🕎", fx:["✨","⭐","🕯️"], mv:"float", glow:"110,160,255", acc:"sparkle",
      win:y => { const d = fromT("hanukkah", y); return d ? [[d, add(d, 8)]] : []; }},
    {id:"ramadan", name:"Ramadan", e:"🌙", hi:"Ramadan Mubarak 🌙", fx:["🌙","⭐","🏮","✨"], mv:"float", glow:"120,180,200", acc:"lantern",
      win:y => { const out = []; ["ramadan", "ramadanB"].forEach(k => { const s = fromT(k, y); if(!s) return;
        const nx = OCC_FITR_AFTER(s); out.push([s, add(nx, -1)]); }); return out; }}
  ];
  /* Ramadan runs until the day before the next Eid al-Fitr */
  function OCC_FITR_AFTER(s){ for(let y = s.getFullYear(); y <= s.getFullYear() + 1; y++){ const f = fromT("fitr", y); if(f && f > s) return f; } return add(s, 30); }
  const dayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function activeOn(date, prefs){ const t = dayOf(date), y = t.getFullYear(), reg = R();
    for(const o of OCC){ if(prefs && prefs.off[o.id]) continue; if(o.only && !o.only.includes(reg)) continue;
      for(const yy of [y - 1, y]) for(const [a, b] of o.win(yy)) if(t >= dayOf(a) && t <= dayOf(b)) return {o, start:dayOf(a), end:dayOf(b)}; }
    return null; }
  function nextOf(o, from){ const t = dayOf(from); for(let y = t.getFullYear() - 1; y <= t.getFullYear() + 2; y++){ const w = o.win(y).map(([a, b]) => [dayOf(a), dayOf(b)]).filter(([, b]) => b >= t).sort((p, q) => p[0] - q[0]); if(w.length) return w[0]; } return null; }

  /* ───── prefs ───── */
  let K = "", P = {sound:true, season:true, off:{}, seen:{}}, theme = BASE, cfg = {};
  function loadP(){ try{ const p = JSON.parse(localStorage.getItem(K) || "null"); if(p && typeof p === "object"){
      P.sound = p.sound !== false; P.season = p.season !== false; P.off = p.off && typeof p.off === "object" ? p.off : {}; P.seen = p.seen && typeof p.seen === "object" ? p.seen : {}; } }catch(e){} }
  function saveP(){ try{ localStorage.setItem(K, JSON.stringify(P)); }catch(e){} }
  const now = () => api._now ? new Date(api._now) : new Date();

  /* ───── season layer ───── */
  let cur = null;
  function current(){ return P.season ? activeOn(now(), P) : null; }
  function paint(){ const a = api._force ? {o:OCC.find(o => o.id === api._force)} : current(), id = a && a.o ? a.o.id : "";
    if(id === (cur && cur.id) && document.getElementById("qfx-sky")) return;
    cur = a && a.o ? a.o : null; const old = document.getElementById("qfx-sky"); if(old) old.remove();
    document.documentElement.dataset.season = id; if(!cur) return;
    const sky = document.createElement("div"); sky.id = "qfx-sky"; sky.setAttribute("aria-hidden", "true");
    sky.style.setProperty("--qfx-glow", cur.glow);
    { const n = 12; for(let i = 0; i < n; i++){ const s = document.createElement("i"); s.textContent = cur.fx[i % cur.fx.length];
      s.className = "qfx-" + cur.mv; s.style.left = (4 + (i*83 % 92)) + "%"; s.style.fontSize = (11 + (i*7 % 8)) + "px";
      s.style.animationDuration = (9 + (i*37 % 8)) + "s"; s.style.animationDelay = (-(i*29 % 14)) + "s"; if(cur.mv !== "fall" && cur.mv !== "rise") s.style.top = (6 + (i*47 % 80)) + "%";
      sky.appendChild(s); } }
    document.body.appendChild(sky);
    const seenKey = cur.id + "-" + (a.start ? a.start.getFullYear() : now().getFullYear());
    if(!api._force && !P.seen[seenKey]){ P.seen[seenKey] = 1; Object.keys(P.seen).forEach(k => { if(!k.endsWith(String(now().getFullYear())) && !k.endsWith(String(now().getFullYear() - 1))) delete P.seen[k]; }); saveP(); greet(cur); } }
  function greet(o){ const old = document.getElementById("qfx-hi"); if(old) old.remove();
    const h = document.createElement("div"); h.id = "qfx-hi"; h.setAttribute("role", "status");
    h.innerHTML = `<span class="qfx-hi-e" aria-hidden="true">${o.e}</span><span class="qfx-hi-t"><b>${o.hi}</b><small>Your ${o.name} theme is on. Change it in Settings.</small></span><button type="button" class="qfx-hi-x" aria-label="Close">✕</button>`;

    if(bar){ bar.classList.toggle("hurry", left > 0 && left <= 5000); if(left <= 0) bar.classList.add("over"); }

    if(UI.rest && UI.rest.done && Date.now() - UI.rest.done > 6000){ UI.rest = null; renderBars(); } }
}

function backBar(t, to){ return `<div class="h" style="margin-top:14px"><button data-act="nav" data-t="${to || "start"}" class="link" aria-label="Back">← Back</button><h2>${t}</h2></div>`; }

/* ---- Start ---- */
const weekSessions = () => { const w = weekOf(today()); return S.work.filter(x => isSession(x) && weekOf(x.date) === w); };

    <div class="grow"><h3 style="font-size:24px">This week</h3><p class="sub">${ws.length >= goal ? "Weekly goal reached." : ws.length ? `${goal - ws.length} more to reach your goal of ${goal}.` : `Your goal is ${goal} sessions. A quiet week costs nothing.`}</p></div></div>
    <div class="stat"><div><b>${ws.length}</b><span>Sessions</span></div><div><b>${sets}</b><span>Sets</span></div><div><b>${xpOn(today())}</b><span>XP today</span></div></div></div>`;

/* ---- records: every lift has a boss ---- */
const bestDayOf = (id) => { const ex = exOf(id), R = recs()[id]; let b = null; chrono().forEach(w => { if(w.date !== R.last) return; w.entries.forEach(e => { if(e.ex !== id) return; e.sets.forEach(s => { if(isPay(s, ex) && (!b || cmpSet(s, b, ex) > 0)) b = s; }); }); }); return b; };
function bossCard(id){
  const ex = exOf(id), R = recs()[id], b = R.best, lb = bestDayOf(id), n = R.events.length;
  const pct = !lb ? 0 : ex.kind === "r" ? lb.r / b.r : lb.w / b.w, show = Math.max(4, Math.min(100, Math.round(pct * 100)));

/* ───────────────────────── v1.1: plate calculator ───────────────────────── */
const PLATES = {kg:[25,20,15,10,5,2.5,1.25], lb:[45,35,25,10,5,2.5]};
const PLATE_H = {kg:[96,96,84,72,54,42,34], lb:[96,88,76,62,48,38]};
const BARS = {kg:[20,15,10], lb:[45,35,25]};
const barNow = () => unit() === "lb" ? S.settings.barLb : S.settings.barKg;
function plateMath(total){ const list = PLATES[unit()], bar = barNow(); let side = (total - bar) / 2; const out = [];
  if(side < 0) return {bar, side:0, out, left:0, under:true};
  for(let i = 0; i < list.length; i++){ while(side >= list[i] - 1e-9){ out.push(i); side = Math.round((side - list[i]) * 1000) / 1000; } }
  return {bar, side:(total - bar) / 2, out, left: Math.round(side * 2 * 1000) / 1000, under:false}; }
function plateSVG(m){ const u = unit(), H = PLATE_H[u], list = PLATES[u]; let xl = 66, xr = 234, l = "", r = "";
  m.out.forEach((idx, n) => { const h = H[idx], w = idx < 2 ? 14 : idx < 4 ? 12 : 9, c = PLATE_COL[idx], y = 60 - h / 2, dl = `animation-delay:${n * 85}ms`;
    l += `<g class="pl" style="${dl}"><rect x="${xl - w}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}" stroke="#000" stroke-width="2.5"/><path d="M${xl - w + 3} ${y + 4}v${h - 8}" stroke="rgba(255,255,255,.45)" stroke-width="2"/></g>`;
    r += `<g class="pr2" style="${dl}"><rect x="${xr}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}" stroke="#000" stroke-width="2.5"/><path d="M${xr + 3} ${y + 4}v${h - 8}" stroke="rgba(255,255,255,.45)" stroke-width="2"/></g>`;
    xl -= w + 1.5; xr += w + 1.5; });
  return `<svg class="platebar" viewBox="0 0 300 120" role="img" aria-label="Each side: ${m.out.length ? m.out.map(i => list[i]).join(", ") + " " + u : "just the bar"}">
    <rect x="70" y="56" width="160" height="8" rx="2" fill="#8e99a4" stroke="#000" stroke-width="2"/><path d="M80 60h140" stroke="#5f6a75" stroke-width="2" stroke-dasharray="2 3"/>
    <rect x="2" y="53" width="70" height="14" rx="3" fill="#aab4be" stroke="#000" stroke-width="2.5"/><rect x="228" y="53" width="70" height="14" rx="3" fill="#aab4be" stroke="#000" stroke-width="2.5"/>
    <path d="M5 56h64M231 56h64" stroke="#fff" stroke-width="1.5" opacity=".55"/>
    <rect x="66" y="47" width="8" height="26" rx="2" fill="#35e0c5" stroke="#000" stroke-width="2"/><rect x="226" y="47" width="8" height="26" rx="2" fill="#35e0c5" stroke="#000" stroke-width="2"/>
    ${l}${r}</svg>`; }
function plateSheet(start){
  const u = unit(); let total = Math.max(0, +start || 0); if(!total) total = barNow() + (u === "lb" ? 90 : 40);
  sheet(`<h3>Plate calculator</h3><p class="sub">What to load on each side of the bar.</p>
    <div class="stp" style="margin-top:12px"><div class="lb">Total weight (${u})</div><div class="c"><button data-pc="-1" aria-label="Less weight">−</button>
      <input id="pcT" inputmode="decimal" autocomplete="off" aria-label="Total weight in ${u}" value="${trim(total, 2)}"><button data-pc="1" aria-label="More weight">+</button></div></div>

/* ───────────────────────── v1.1: progress charts ───────────────────────── */
function lineChart(pts, label, fmt, prSet){
  if(pts.length < 2) return `<p class="note">Do this lift in ${2 - pts.length} more session${pts.length === 1 ? "" : "s"} and your progress chart appears here.</p>`;
  const W = 320, H = 150, L = 58, R = 10, T = 12, B = 26, xs = pts.map((p, i) => i), ys = pts.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys); if(hi === lo){ hi += 1; lo -= 1; } const pad = (hi - lo) * .12; lo -= pad; hi += pad;
  const X = i => L + (W - L - R) * (pts.length === 1 ? .5 : i / (pts.length - 1)), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const area = d + ` L${X(pts.length - 1).toFixed(1)} ${H - B} L${X(0).toFixed(1)} ${H - B}Z`;
  const step = Math.max(1, Math.ceil(pts.length / 24));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: from ${fmt(pts[0].v)} to ${fmt(pts[pts.length - 1].v)}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35e0c5" stop-opacity=".32"/><stop offset="1" stop-color="#35e0c5" stop-opacity="0"/></linearGradient></defs>
    <path d="M${L} ${T}V${H - B}H${W - R}" stroke="rgba(255,255,255,.12)" fill="none"/>
    <text x="${L - 6}" y="${Y(Math.max(...ys)) + 4}" text-anchor="end">${fmt(Math.max(...ys))}</text><text x="${L - 6}" y="${Y(Math.min(...ys)) + 4}" text-anchor="end">${fmt(Math.min(...ys))}</text>
    <text x="${L}" y="${H - 6}">${fmtDate(pts[0].d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].d)}</text>
    <path class="area" d="${area}"/><path class="ln" pathLength="1" d="${d}"/>

  if(t.dataset && t.dataset.sid && t.dataset.f){ const f = findSet(t.dataset.sid); if(!f) return; const raw = t.value.replace(",", ".");
    if(t.dataset.f === "w"){ const v = parseFloat(raw); if(isFinite(v) && v >= 0) f.s.w = Math.min(5000, fromDisp(v)); else if(raw === "") f.s.w = 0; }
    else { const v = parseInt(raw, 10); f.s.r = isFinite(v) && v >= 0 ? Math.min(999, v) : 0; } save(); return; }
  if(t.id === "wnote"){ const w = workOf(UI.wid); if(w){ w.note = t.value.slice(0,2000); save(); } }
  if(t.id === "rn"){ const r = S.routines.find(x => x.id === UI.rid); if(r){ r.name = t.value.slice(0,60) || "Routine"; save(); } }
  if(t.id === "sn"){ if(S.hero){ S.hero.name = t.value.trim().slice(0,24) || S.hero.name; save(); } }
  if(t.id === "exq"){ UI.exq = t.value; const pl = document.getElementById("pl"); if(pl) pl.innerHTML = pickList(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset && t.dataset.sid && t.dataset.f){ const f = findSet(t.dataset.sid); if(!f) return; t.value = t.dataset.f === "w" ? fmtW(f.s.w) : String(f.s.r); commit(true); }
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.matches && e.target.matches("input[data-sid]")) e.target.blur(); });

/* floating dust in the lamp light: 24 slow specks, paused when hidden or when reduce motion is on */
let dustRAF = 0, dustP = null;
function dustInit(){
  const c = document.getElementById("dust"); if(!c) return; cancelAnimationFrame(dustRAF);
  if(document.documentElement.classList.contains("reduce")) return;
  const w = c.width = c.clientWidth, h = c.height = c.clientHeight; if(!w) return; const ctx = c.getContext("2d");
  dustP = dustP || Array.from({length:24}, () => ({x:Math.random()*.6, y:Math.random(), r:.8 + Math.random()*1.3, vx:.00002 + Math.random()*.00004, vy:.00003 + Math.random()*.00006, a:.25 + Math.random()*.45}));
  const step = () => { if(document.hidden || !document.body.contains(c)) return; ctx.clearRect(0,0,w,h);
    dustP.forEach(p => { p.x += p.vx*16; p.y += p.vy*16; if(p.y > .78){ p.y = .1; p.x = .12 + Math.random()*.2; } if(p.x > .6) p.x = .1; ctx.globalAlpha = p.a; ctx.fillStyle = "#fff3d6"; ctx.beginPath(); ctx.arc(p.x*w, p.y*h, p.r, 0, 6.3); ctx.fill(); });
    dustRAF = requestAnimationFrame(step); }; step();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && S && S.hero && !(document.activeElement && document.activeElement.tagName === "INPUT")) render(); });
setInterval(tickClocks, 500);

/* ───────────────────────── sample data: built with the same code paths as real use ───────────────────────── */
function demo(name){
  const keep = S && S.settings ? Object.assign(DEFAULTS(), S.settings) : DEFAULTS(), nm = name || (S && S.hero && S.hero.name) || "Sam";
  let seed = 4242; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  S = blank(); S.settings = keep; S.hero = {name:nm}; S.sample = true;
  const mk = (n, k) => { const e = {id:uid(), name:n, kind:k, hidden:false}; S.ex.push(e); return e; };
  const sq = mk("Squat","w"), bp = mk("Bench press","w"), dl = mk("Deadlift","w"), oh = mk("Overhead press","w"), rw = mk("Barbell row","w"), rd = mk("Romanian deadlift","w"),
        lp = mk("Lat pulldown","w"), cu = mk("Dumbbell curl","w"), tp = mk("Triceps pushdown","w"), pu = mk("Pull-up","r");
  const rt = (n, items) => { const r = {id:uid(), name:n, items:items.map(([e,s]) => ({ex:e.id, sets:s}))}; S.routines.push(r); return r; };
  const push = rt("Push day", [[bp,3],[oh,3],[tp,3]]), pull = rt("Pull day", [[dl,3],[rw,3],[lp,3],[pu,3],[cu,3]]), legs = rt("Leg day", [[sq,4],[rd,3]]);
  const base = {[sq.id]:80,[bp.id]:57.5,[dl.id]:100,[oh.id]:37.5,[rw.id]:52.5,[rd.id]:70,[lp.id]:50,[cu.id]:12,[tp.id]:27.5,[pu.id]:0};
  const step = {[sq.id]:2.5,[bp.id]:2.5,[dl.id]:5,[oh.id]:1.25,[rw.id]:2.5,[rd.id]:2.5,[lp.id]:2.5,[cu.id]:1,[tp.id]:2.5,[pu.id]:0}, reps0 = {[pu.id]:5};
  const compound = new Set([sq.id, bp.id, dl.id, oh.id, rw.id, rd.id]), warm = new Set([sq.id, bp.id, dl.id]);
  const t0 = today(), mon = weekOf(t0), plan = []; const WEEKS = 17;
  for(let wk = WEEKS; wk >= 0; wk--){
    if(wk === 9 || wk === 8) continue;
    const m = addDays(mon, -7*wk);
    [[0,push],[2,pull],[4,legs],[5,push]].forEach(([off, r], i) => { const d = addDays(m, off); if(d >= t0) return; if(i === 3 && rnd() > .3) return; if(i < 3 && rnd() < .2 && !(wk === 0)) return; plan.push([d, r]); });
  }
  const reps = {}; plan.forEach(([d, r]) => {
    const w = {id:uid(), date:d, start:parse(d).getTime() + (17*60 + Math.floor(rnd()*70))*6e4, end:0, name:r.name, note:"", routineId:r.id, finished:true, entries:[]};
    w.end = w.start + (52 + Math.floor(rnd()*26))*6e4;
    r.items.forEach(it => { const e = {id:uid(), ex:it.ex, sets:[]}; w.entries.push(e); const compoundLift = compound.has(it.ex), isReps = it.ex === pu.id;
      if(rnd() < .42 && step[it.ex]) base[it.ex] += step[it.ex]; if(isReps && rnd() < .4) reps0[it.ex] = Math.min(12, (reps0[it.ex] || 5) + 1);
      const wt = base[it.ex], top = compoundLift ? 5 : 10;
      if(warm.has(it.ex)) e.sets.push({id:uid(), w:Math.round(wt*.6/2.5)*2.5, r:5, done:true, t:"w"});
      for(let i = 0; i < it.sets; i++){ const r2 = isReps ? Math.max(1, (reps0[it.ex] || 5) - (i > 1 ? 1 : 0)) : top - (i > 0 && rnd() < .5 ? 1 : 0) - (i > 1 && rnd() < .5 ? 1 : 0); e.sets.push({id:uid(), w:wt, r:r2, done:true, t:""}); } });
    S.work.push(w); reconcile(); checkBadges(d);
  });
  S.body = []; let bw = 78.4; for(let k = 16; k >= 0; k--){ if(k % 2 && k > 1) continue; bw += (rnd() - .62) * .5; S.body.push({d:addDays(t0, -k * 4), w:Math.round(bw * 10) / 10}); }
  S.lvlSeen = levelOf(totalXP()); save();
}

load(); applyMotion(); render(); if(!S.hero) onboarding(); if(RESCUED !== null) rescueBanner();
