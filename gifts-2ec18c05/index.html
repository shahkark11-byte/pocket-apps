:root{--paper:#fbf4ea;--card:#fffdf9;--ink:#2b1d1a;--ink2:#5b4a44;--mut:#9a8780;--line:#eadfce;--gold:#b88a2e;--gold2:#e6c37a;
  --t1:#7a1f3d;--t2:#c94f6d;--t3:#f6dfe3;--shadow:0 1px 0 rgba(43,29,26,.04),0 14px 34px -16px rgba(122,31,61,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(circle at 20% 10%,rgba(201,79,109,.08),transparent 40%),radial-gradient(circle at 90% 80%,rgba(184,138,46,.08),transparent 40%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.serif{font-family:'Fraunces',Georgia,serif}.hand{font-family:'Caveat',cursive}
.app{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:44px;height:44px}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:-.01em}
.brand b i{font-weight:400;color:var(--t1)}
.ib{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.ib.on{background:var(--ink);color:var(--paper)}
h1.page{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.05}
h1.page i{font-weight:400;color:var(--t1)}
.sub{color:var(--mut);margin:6px 0 18px}
/* occasion cards */
.occ{position:relative;border-radius:24px;padding:20px;color:#fff;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;min-height:168px;
  display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.occ .art{position:absolute;right:84px;bottom:-34px;width:150px;height:150px;opacity:.55;z-index:-1}
.occ .ribbon{position:absolute;left:62%;top:0;bottom:0;width:18px;background:rgba(255,255,255,.18);z-index:-1}
.occ .ribbon::after{content:"";position:absolute;left:-100vw;right:-100vw;top:46%;height:18px;background:rgba(255,255,255,.18)}
.occ h3{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.05}
.occ .when{font-size:14px;opacity:.9;margin-top:4px}
.occ .count{position:absolute;top:18px;right:18px;text-align:center;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:16px;padding:8px 12px;min-width:66px}
.occ .count b{display:block;font-family:'Fraunces',Georgia,serif;font-size:28px;line-height:1}
.occ .count small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.meter{height:8px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:#fff;border-radius:6px}
.occ .stats{display:flex;justify-content:space-between;font-size:14px;opacity:.95}
.pipe{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pipe span{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:999px}
/* tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px 22px 22px 6px;padding:16px 16px 14px 30px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.tag:hover{transform:translateY(-2px) rotate(-.4deg)}
.tag::before{content:"";position:absolute;left:11px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}

.tag .nm{font-family:'Caveat',cursive;font-size:30px;line-height:1;font-weight:700;color:var(--t1)}
.tag .rel{font-size:13px;color:var(--mut)}
.tag .bud{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:10px}
.tag .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.tag .bar i{display:block;height:100%;background:var(--t2);border-radius:4px}
.tag .bar i.over{background:#c0392b}
.gl{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.gi{display:flex;align-items:center;gap:8px;font-size:14px}
.gi .st{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:none;border:1.5px solid var(--line);color:#fff}
.st.idea{border-style:dashed}.st.bought{background:var(--gold);border-color:var(--gold)}.st.wrapped{background:var(--t2);border-color:var(--t2)}.st.given{background:#2e7d5b;border-color:#2e7d5b}
.gi .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .p{color:var(--mut);font-variant-numeric:tabular-nums}
.peek .gi .t,.peek .peekable{filter:blur(6px);transition:filter .2s}.peek .tag:hover .gi .t{filter:blur(0)}
.peek .p,.peek .money{filter:blur(5px)}
/* list */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-weight:700}
.check.on{background:var(--gold);border-color:var(--gold)}
.item b{font-weight:600;display:block}.item small{color:var(--mut);font-size:13px}
.store{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;margin:18px 4px 6px;display:flex;justify-content:space-between}
.store span{font-family:'Outfit',sans-serif;font-size:14px;color:var(--mut);font-weight:500}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .e{font-size:44px;margin-bottom:8px}
.empty .serif{font-size:22px;color:var(--ink);margin-bottom:4px}
/* event header */
.ehead{border-radius:26px;padding:22px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);isolation:isolate}
.ehead .art{position:absolute;right:-10px;top:-10px;width:190px;height:190px;z-index:-1;opacity:.95}
.ehead h2{font-family:'Fraunces',Georgia,serif;font-size:32px;font-weight:600;line-height:1.05;letter-spacing:-.01em;max-width:70%}
.ehead .big{font-family:'Fraunces',Georgia,serif;font-size:56px;font-weight:600;line-height:1;margin-top:14px}
.ehead .big small{font-family:'Outfit',sans-serif;font-size:16px;font-weight:500;opacity:.9;margin-left:6px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kp div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.kp small{display:block;font-size:12px;opacity:.85}.kp b{font-size:18px}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--ink);padding:6px;border-radius:20px;z-index:20;box-shadow:0 18px 40px -12px rgba(43,29,26,.6)}
nav button{color:rgba(255,255,255,.6);padding:11px 16px;border-radius:15px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}

/* buttons + modal */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--t1);color:#fff;box-shadow:0 8px 20px -8px rgba(122,31,61,.6)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.danger{background:transparent;color:#b3261e;border:1px solid #e8b4b0;box-shadow:none}
.bg{position:fixed;inset:0;background:rgba(43,29,26,.4);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;overflow-x:hidden;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:700px){.bg{align-items:center}.modal{border-radius:26px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h3{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em}
.modal .sub{margin:4px 0 12px}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.inp{width:100%;min-width:0;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--paper);font-size:16px;outline:none}
.inp:focus{border-color:var(--t2);box-shadow:0 0 0 3px rgba(201,79,109,.15)}
textarea.inp{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>*{min-width:0}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.types button{border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2)}
.types button span{font-size:22px}
.types button.on{border-color:var(--t1);background:var(--t3);color:var(--t1)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.steps button{padding:9px 4px;border-radius:11px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.steps button.on{color:#fff}.steps button.on.idea{background:var(--mut);border-color:var(--mut)}.steps button.on.bought{background:var(--gold);border-color:var(--gold)}
.steps button.on.wrapped{background:var(--t2);border-color:var(--t2)}.steps button.on.given{background:#2e7d5b;border-color:#2e7d5b}
.gift-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.gift-row:last-child{border-bottom:0}
.gift-row b{font-weight:600}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.toast{max-width:92vw;text-align:center;position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:13px;font-weight:600;z-index:70;animation:up .25s,out .3s 2.3s forwards}
@keyframes out{to{opacity:0}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:80;pointer-events:none;border-radius:2px}
.hero{text-align:center;padding:5vh 10px 10px}
.hero svg.box{width:170px;height:170px;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.hero h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(36px,8vw,54px);font-weight:600;letter-spacing:-.02em;line-height:1}
.hero h1 i{font-weight:400;color:var(--t1)}
.hero p{color:var(--ink2);font-size:17px;max-width:420px;margin:14px auto 22px;line-height:1.5}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--t3);color:var(--t1)}
@media(max-width:420px){.tags{grid-template-columns:1fr}.occ h3{font-size:23px}.ehead .big{font-size:46px}nav button{padding:11px 12px}}
</style>

<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
"use strict";
const KEY = "giftplanner.v1";
const blank = () => ({v:1, cur:"", events:[], people:[], gifts:[], peek:false});
let S; try{ S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); }catch(e){ S = blank(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device"); } };
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const days = s => Math.round((parse(s) - parse(today()))/864e5);
const fd = (s,o={weekday:"short",day:"numeric",month:"short"}) => parse(s).toLocaleDateString(undefined,o);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = a => a.reduce((t,x)=>t+(+x||0),0);
function guessCur(){ try{ const r = (Intl.DateTimeFormat().resolvedOptions().locale||"en-US").split("-")[1]||"US"; return {GB:"GBP",CA:"CAD",AU:"AUD",NZ:"NZD",IN:"INR",PK:"PKR",AE:"AED",SA:"SAR",IE:"EUR",DE:"EUR",FR:"EUR",ES:"EUR",ZA:"ZAR",SG:"SGD",MY:"MYR"}[r]||"USD"; }catch(e){ return "USD"; } }
if(!S.cur) S.cur = guessCur();
const money = (n, whole) => { try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur,minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(+n||0); }catch(e){ return (+n||0).toFixed(2); } };

/* occasion themes: colours + a small piece of art each */
const TYPES = {
 christmas:{n:"Christmas", e:"🎄", g:["#1f4d3a","#2f6b4f"], art:`<path d="M75 12l30 46H90l24 34H96l26 36H28l26-36H36l24-34H45z" fill="#fff" opacity=".22"/><circle cx="75" cy="12" r="7" fill="#f6d27a"/><circle cx="62" cy="70" r="4" fill="#ff8a8a"/><circle cx="92" cy="96" r="4" fill="#f6d27a"/><circle cx="70" cy="110" r="4" fill="#ff8a8a"/>`},
 eid:{n:"Eid", e:"🌙", g:["#0f5257","#16767a"], art:`<path d="M105 30a42 42 0 1 0 18 70A36 36 0 1 1 105 30z" fill="#f6d27a" opacity=".85"/><path d="M40 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff" opacity=".8"/><path d="M60 100l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff" opacity=".7"/>`},
 birthday:{n:"Birthday", e:"🎂", g:["#c94f6d","#e07a8f"], art:`<rect x="40" y="70" width="80" height="50" rx="8" fill="#fff" opacity=".3"/><rect x="40" y="70" width="80" height="12" rx="6" fill="#fff" opacity=".5"/><rect x="58" y="48" width="6" height="22" rx="3" fill="#fff"/><rect x="77" y="44" width="6" height="26" rx="3" fill="#fff"/><rect x="96" y="48" width="6" height="22" rx="3" fill="#fff"/><path d="M61 40q4 4 0 8-4-4 0-8M80 36q4 4 0 8-4-4 0-8M99 40q4 4 0 8-4-4 0-8" fill="#f6d27a"/>`},
 diwali:{n:"Diwali", e:"🪔", g:["#b5451b","#e07b24"], art:`<path d="M40 96q40 30 80 0q-6 22-40 22t-40-22z" fill="#f6d27a" opacity=".85"/><path d="M80 52q14 18 0 36q-14-18 0-36z" fill="#fff6c9"/><circle cx="40" cy="40" r="3" fill="#fff"/><circle cx="118" cy="56" r="3" fill="#fff"/>`},
 hanukkah:{n:"Hanukkah", e:"🕎", g:["#22427a","#3561a8"], art:`<path d="M80 30l26 46H54z M80 92L54 46h52z" fill="none" stroke="#fff" stroke-width="5" opacity=".7"/>`},
 wedding:{n:"Wedding", e:"💍", g:["#8a6d3b","#b8945a"], art:`<circle cx="66" cy="80" r="26" fill="none" stroke="#fff" stroke-width="6" opacity=".6"/><circle cx="96" cy="80" r="26" fill="none" stroke="#f6d27a" stroke-width="6" opacity=".8"/>`},
 baby:{n:"Baby", e:"🍼", g:["#4a7fa8","#7aa7cc"], art:`<path d="M50 70a30 30 0 0 0 60 0z" fill="#fff" opacity=".35"/><circle cx="80" cy="56" r="18" fill="#fff" opacity=".45"/>`},
 valentine:{n:"Valentine's", e:"💝", g:["#a8243f","#d9415f"], art:`<path d="M80 120S36 92 36 62a22 22 0 0 1 44-6 22 22 0 0 1 44 6c0 30-44 58-44 58z" fill="#fff" opacity=".3"/>`},
 mothers:{n:"Mother's Day", e:"💐", g:["#9b4f87","#c27bb0"], art:`<circle cx="80" cy="60" r="14" fill="#f6d27a"/><circle cx="62" cy="52" r="12" fill="#fff" opacity=".5"/><circle cx="98" cy="52" r="12" fill="#fff" opacity=".5"/><circle cx="66" cy="74" r="12" fill="#fff" opacity=".5"/><circle cx="94" cy="74" r="12" fill="#fff" opacity=".5"/>`},
 fathers:{n:"Father's Day", e:"👔", g:["#33506b","#4f7091"], art:`<path d="M64 40h32l-6 14 12 52-22 16-22-16 12-52z" fill="#fff" opacity=".35"/>`},
 graduation:{n:"Graduation", e:"🎓", g:["#2d3561","#4a5596"], art:`<path d="M80 40l50 22-50 22-50-22z" fill="#fff" opacity=".45"/><path d="M54 74v20q26 16 52 0V74" fill="#fff" opacity=".3"/>`},
 other:{n:"Other", e:"🎁", g:["#7a1f3d","#c94f6d"], art:""}};
const T = k => TYPES[k] || TYPES.other;
const boxArt = (c1="#c94f6d", c2="#7a1f3d") => `<svg class="box" viewBox="0 0 160 160"><rect x="26" y="62" width="108" height="80" rx="10" fill="${c1}"/><rect x="18" y="46" width="124" height="26" rx="8" fill="${c2}"/>
  <rect x="72" y="46" width="16" height="96" fill="#f6d27a"/><path d="M80 46c-20-30-46-14-30 0zM80 46c20-30 46-14 30 0z" fill="none" stroke="#f6d27a" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="80" cy="46" r="8" fill="#e6b44c"/></svg>`;
const STATES = [["idea","Idea"],["bought","Bought"],["wrapped","Wrapped"],["given","Given"]];
const stIcon = s => ({idea:"", bought:"✓", wrapped:"♥", given:"★"})[s];

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2700); }
function confetti(){ const cols = ["#c94f6d","#f6d27a","#2e7d5b","#7a1f3d","#4a7fa8"]; for(let i=0;i<70;i++){ const c = document.createElement("div"); c.className = "confetti";
  c.style.left = Math.random()*100 + "vw"; c.style.background = cols[i%cols.length]; document.body.appendChild(c);
  c.animate([{transform:`translateY(0) rotate(0)`},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:1800+Math.random()*1600,easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish = () => c.remove(); } }
function modal(html, mount){ close(); const bg = document.createElement("div"); bg.className = "bg"; bg.id = "modal"; bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("mousedown", e => { if(e.target === bg) close(); }); document.body.appendChild(bg); mount && mount(bg.querySelector(".modal")); }
function close(){ document.getElementById("modal")?.remove(); }
document.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
const v = (r,s) => r.querySelector(s).value.trim();

/* ── data helpers ── */
const person = id => S.people.find(p=>p.id===id);
const evGifts = ev => S.gifts.filter(g=>g.eventId===ev.id);
function evStats(ev){ const gs = evGifts(ev); const budget = ev.recips.length ? sum(ev.recips.map(r=>r.budget)) : (ev.budget||0);
  const spent = sum(gs.filter(g=>g.status!=="idea").map(g=>g.price)); const planned = sum(gs.map(g=>g.price));
  const by = s => gs.filter(g=>g.status===s).length; const done = ev.recips.filter(r => { const mine = gs.filter(g=>g.personId===r.personId); return mine.length && mine.every(g=>g.status==="given"); }).length;
  return {gs, budget, spent, planned, idea:by("idea"), bought:by("bought"), wrapped:by("wrapped"), given:by("given"), people:ev.recips.length, done}; }
const upcoming = () => [...S.events].sort((a,b) => (days(a.date) < 0) - (days(b.date) < 0) || (days(a.date) < 0 ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)));

/* ── views ── */
let view = {tab:"home", ev:null};
function render(){ const app = document.getElementById("app"); document.body.classList.toggle("peek", !!S.peek);
  if(!S.events.length && !S.people.length && view.tab==="home"){ app.innerHTML = topBar() + welcome(); nav(); return; }
  app.innerHTML = topBar() + (view.ev ? eventView(S.events.find(e=>e.id===view.ev)) : {home, shop, people}[view.tab]()); nav(); }
function topBar(){ return `<header class="top"><div class="brand">${boxArt().replace('class="box"','class="logo"')}<b>Gift <i>Planner</i></b></div>
  <div class="row" style="gap:8px"><button class="ib ${S.peek?"on":""}" data-a="peek" title="Peek-proof mode">${S.peek?"🙈":"👀"}</button><button class="ib" data-a="settings" title="Settings">⚙︎</button></div></header>`; }
function nav(){ document.getElementById("nav").innerHTML = [["home","🎁 Occasions"],["shop","🛍️ Shopping"],["people","👥 People"]].map(([k,l]) =>
  `<button class="${view.tab===k && !view.ev?"on":""}" data-tab="${k}">${l}</button>`).join(""); }
function welcome(){ return `<div class="hero">${boxArt()}<h1>Every gift,<br><i>sorted.</i></h1>
  <p>Plan Christmas, Eid, birthdays and every occasion in between. Who you are buying for, what you have got, and how much is left in the budget.</p>
  <button class="btn" data-a="newEvent" style="padding:15px 26px">Plan my first occasion</button><div style="margin-top:14px"><button class="btn ghost sm" data-a="demo">See it with sample gifts</button></div></div>`; }
function occCard(ev){ const t = T(ev.type), s = evStats(ev), d = days(ev.date); const f = s.budget ? Math.min(1, s.spent/s.budget) : 0;
  return `<div class="occ" data-ev="${ev.id}" style="background:linear-gradient(135deg,${t.g[0]},${t.g[1]})"><div class="ribbon"></div><svg class="art" viewBox="0 0 160 160">${t.art}</svg>
    <div><h3>${esc(ev.name)}</h3><div class="when">${t.e} ${fd(ev.date,{weekday:"long",day:"numeric",month:"long"})}</div></div>
    <div class="count"><b>${d < 0 ? "✓" : d}</b><small>${d < 0 ? "past" : d===1 ? "day" : "days"}</small></div>
    <div><div class="meter"><i style="width:${f*100}%"></i></div>
      <div class="stats"><span class="money">${money(s.spent,true)} of ${money(s.budget,true)}</span><span>${s.people} ${s.people===1?"person":"people"}</span></div>
      <div class="pipe"><span>${s.idea} ideas</span><span>${s.bought} bought</span><span>${s.wrapped} wrapped</span><span>${s.given} given</span></div></div></div>`; }
function home(){ const evs = upcoming(); const next = evs.filter(e=>days(e.date)>=0), past = evs.filter(e=>days(e.date)<0);
  return `<h1 class="page">Your <i>occasions</i></h1><p class="sub">${next.length ? `Next up: ${esc(next[0].name)} in ${days(next[0].date)} day${days(next[0].date)===1?"":"s"}.` : "Nothing coming up. Add an occasion to start planning."}</p>
  ${next.map(occCard).join("")}<button class="btn ghost" data-a="newEvent" style="width:100%;padding:16px;border-style:dashed">+ Add an occasion</button>
  ${past.length ? `<h2 class="serif" style="font-size:20px;margin:26px 4px 12px">Past occasions</h2>${past.map(occCard).join("")}` : ""}`; }
function eventView(ev){ if(!ev){ view.ev = null; return home(); } const t = T(ev.type), s = evStats(ev), d = days(ev.date);
  const left = s.budget - s.spent;
  return `<button class="back" data-a="backHome">← All occasions</button>
  <section class="ehead" style="background:linear-gradient(135deg,${t.g[0]},${t.g[1]})"><svg class="art" viewBox="0 0 160 160">${t.art}</svg>
    <div class="row"><h2 class="grow">${esc(ev.name)}</h2><button class="ib" data-a="editEvent" style="background:rgba(255,255,255,.2);border:0;color:#fff">✎</button></div>
    <div style="opacity:.9;margin-top:4px">${t.e} ${fd(ev.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
    <div class="big">${d < 0 ? "Done" : d===0 ? "Today!" : d}<small>${d > 0 ? (d===1?"day to go":"days to go") : ""}</small></div>
    <div class="kp"><div><small>Budget</small><b class="money">${money(s.budget,true)}</b></div><div><small>Spent</small><b class="money">${money(s.spent,true)}</b></div>
      <div><small>${left < 0 ? "Over by" : "Left"}</small><b class="money">${money(Math.abs(left),true)}</b></div></div></section>
  <div class="row" style="margin:0 4px 12px"><h2 class="serif grow" style="font-size:22px">Gift list</h2><button class="btn sm" data-a="addRecip">+ Person</button></div>
  ${ev.recips.length ? `<div class="tags">${ev.recips.map(r => { const p = person(r.personId); if(!p) return ""; const gs = s.gs.filter(g=>g.personId===p.id);
     const sp = sum(gs.filter(g=>g.status!=="idea").map(g=>g.price)); const f = r.budget ? sp/r.budget : 0;
     return `<div class="tag" data-a="openRecip" data-id="${p.id}"><div class="nm">${esc(p.name)}</div><div class="rel">${esc(p.rel||"")}</div>
       <div class="gl">${gs.length ? gs.map(g=>`<div class="gi"><span class="st ${g.status}">${stIcon(g.status)}</span><span class="t">${esc(g.idea)}</span><span class="p">${g.price?money(g.price):""}</span></div>`).join("")
         : `<div class="gi" style="color:var(--mut)"><span class="st idea"></span><span class="t">No ideas yet, tap to add</span></div>`}</div>
       <div class="bud"><span class="money">${money(sp)} of ${money(r.budget,true)}</span><span>${gs.length && gs.every(g=>g.status==="given") ? "🎉 Done" : ""}</span></div>
       <div class="bar"><i class="${f>1?"over":""}" style="width:${Math.min(100,f*100)}%"></i></div></div>`; }).join("")}</div>`
   : `<div class="card empty"><div class="e">🏷️</div><div class="serif">Who are you buying for?</div>Add people and give each one a budget.</div>`}`; }
function shop(){ const ids = new Set(S.events.filter(e=>days(e.date)>=0).map(e=>e.id)); const todo = S.gifts.filter(g=>ids.has(g.eventId) && g.status==="idea");
  const got = S.gifts.filter(g=>ids.has(g.eventId) && g.status==="bought").slice(-6);
  const by = {}; todo.forEach(g => (by[g.store || "Anywhere"] = by[g.store || "Anywhere"] || []).push(g));
  return `<h1 class="page">Shopping <i>list</i></h1><p class="sub">${todo.length ? `${todo.length} gift${todo.length===1?"":"s"} still to buy · about <span class="money">${money(sum(todo.map(g=>g.price)),true)}</span>` : "Everything is bought. Time to wrap."}</p>
  ${Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([st,list]) => `<div class="store">${esc(st)}<span class="money">${money(sum(list.map(g=>g.price)))}</span></div>
    <div class="card" style="padding:4px 16px">${list.map(g => { const p = person(g.personId), ev = S.events.find(e=>e.id===g.eventId);
      return `<div class="item"><button class="check" data-a="buy" data-id="${g.id}" aria-label="Mark bought"></button><div class="grow"><b class="peekable">${esc(g.idea)}</b><small>for ${esc(p?.name||"")} · ${esc(ev?.name||"")}</small></div>
      <span class="p money">${g.price?money(g.price):""}</span>${g.link?`<a href="${esc(g.link)}" target="_blank" rel="noopener" class="ib" style="width:34px;height:34px;box-shadow:none">↗</a>`:""}</div>`; }).join("")}</div>`).join("")}
  ${!todo.length ? `<div class="card empty"><div class="e">🛍️</div><div class="serif">Nothing left to buy</div>Ideas you add to anyone's gift list show up here, grouped by shop.</div>` : ""}
  ${got.length ? `<div class="store">Recently bought</div><div class="card" style="padding:4px 16px">${got.map(g=>`<div class="item"><button class="check on" data-a="unbuy" data-id="${g.id}">✓</button>
    <div class="grow"><b class="peekable" style="text-decoration:line-through;color:var(--mut)">${esc(g.idea)}</b><small>for ${esc(person(g.personId)?.name||"")}</small></div><span class="p money">${money(g.price)}</span></div>`).join("")}</div>` : ""}`; }
function people(){ const list = [...S.people].sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="row"><h1 class="page grow">Your <i>people</i></h1><button class="btn sm" data-a="newPerson">+ Person</button></div>
  <p class="sub">Sizes, likes, and everything you have ever given them, so you never repeat a gift.</p>
  ${list.length ? `<div class="tags">${list.map(p => { const gs = S.gifts.filter(g=>g.personId===p.id && g.status!=="idea");
    return `<div class="tag" data-a="personSheet" data-id="${p.id}"><div class="nm">${esc(p.name)}</div><div class="rel">${esc(p.rel||"")}${p.bday?` · birthday ${fd(p.bday,{day:"numeric",month:"short"})}`:""}</div>
      ${p.notes?`<div class="note" style="margin-top:8px">${esc(p.notes).slice(0,90)}</div>`:""}<div class="bud"><span>${gs.length} gift${gs.length===1?"":"s"} given or bought</span></div></div>`; }).join("")}</div>`
   : `<div class="card empty"><div class="e">👥</div><div class="serif">No one here yet</div>People you add to an occasion appear here too.</div>`}`; }

/* ── forms ── */
function eventForm(ev){ const e = !!ev; ev = ev || {name:"", type:"christmas", date:"", recips:[]}; let ty = ev.type;
  const guess = k => { const y = new Date().getFullYear(); const n = {christmas:`${y}-12-25`, valentine:`${y+1}-02-14`}[k]; return n && days(n) >= 0 ? n : n ? n.replace(String(y), String(y+1)) : ""; };
  modal(`<h3>${e ? "Edit occasion" : "New occasion"}</h3><p class="sub">What are you planning for?</p>
    <div class="types">${Object.entries(TYPES).map(([k,t])=>`<button class="${k===ty?"on":""}" data-ty="${k}"><span>${t.e}</span>${t.n}</button>`).join("")}</div>
    <label class="f">Name</label><input class="inp" id="n" placeholder="Christmas ${new Date().getFullYear()}" value="${esc(ev.name)}">
    <label class="f">Date</label><input class="inp" type="date" id="d" value="${ev.date || guess(ty)}">
    <div class="acts">${e ? `<button class="btn danger" id="del">Delete</button>` : `<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">${e ? "Save" : "Create"}</button></div>`, m => {
      m.querySelectorAll("[data-ty]").forEach(b => b.onclick = () => { ty = b.dataset.ty; m.querySelectorAll("[data-ty]").forEach(x=>x.classList.toggle("on", x===b));
        const n = m.querySelector("#n"); if(!e && (!n.value || Object.values(TYPES).some(t => n.value.startsWith(t.n)))) n.value = ty==="other" ? "" : `${T(ty).n} ${new Date().getFullYear()}`;
        const g = guess(ty); if(g && !e) m.querySelector("#d").value = g; });
      m.querySelector("#ok").onclick = () => { const n = v(m,"#n") || T(ty).n, d = v(m,"#d"); if(!d) return toast("Pick a date");
        if(e) Object.assign(ev, {name:n, type:ty, date:d}); else { const id = uid(); S.events.push({id, name:n, type:ty, date:d, recips:[]}); view = {tab:"home", ev:id}; }
        save(); close(); render(); };
      if(e) m.querySelector("#del").onclick = () => { if(!confirm(`Delete ${ev.name} and its gift list?`)) return; S.events = S.events.filter(x=>x.id!==ev.id); S.gifts = S.gifts.filter(g=>g.eventId!==ev.id); view.ev = null; save(); close(); render(); };
    }); }
function recipForm(ev){ const avail = S.people.filter(p => !ev.recips.some(r=>r.personId===p.id));
  modal(`<h3>Add a person</h3><p class="sub">Who is on the list for ${esc(ev.name)}?</p>
    ${avail.length ? `<label class="f">Someone you have already added</label><select class="inp" id="ex"><option value="">New person…</option>${avail.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>` : ""}
    <div id="newp"><label class="f">Name</label><input class="inp" id="n" placeholder="Mum">
      <label class="f">Relationship (optional)</label><input class="inp" id="r" placeholder="Family, friend, teacher…"></div>
    <label class="f">Budget for this person</label><input class="inp" id="b" inputmode="decimal" placeholder="${money(50,true)}">
    <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="ok">Add to list</button></div>`, m => {
      const ex = m.querySelector("#ex"); if(ex) ex.onchange = () => m.querySelector("#newp").style.display = ex.value ? "none" : "";
      m.querySelector("#ok").onclick = () => { let pid = ex && ex.value; if(!pid){ const n = v(m,"#n"); if(!n) return toast("Add a name"); pid = uid(); S.people.push({id:pid, name:n, rel:v(m,"#r"), notes:""}); }
        ev.recips.push({personId:pid, budget:num(v(m,"#b"))}); save(); close(); render(); };
    }); }
function recipSheet(ev, pid){ const p = person(pid), r = ev.recips.find(x=>x.personId===pid); const gs = S.gifts.filter(g=>g.eventId===ev.id && g.personId===pid);
  const past = S.gifts.filter(g=>g.personId===pid && g.eventId!==ev.id && g.status!=="idea").slice(-4);
  modal(`<div class="row"><div class="grow"><div class="hand" style="font-size:40px;line-height:1;color:var(--t1);font-weight:700">${esc(p.name)}</div><div class="sub" style="margin:2px 0 0">${esc(ev.name)} · budget <span class="money">${money(r.budget,true)}</span></div></div>
    <button class="btn ghost sm" id="bud">Budget</button></div>
    ${p.notes ? `<div class="card" style="margin:14px 0 0;padding:12px 14px;box-shadow:none;background:var(--paper)"><div class="note"><b>Notes:</b> ${esc(p.notes)}</div></div>` : ""}
    <div style="margin-top:12px">${gs.map(g => `<div class="gift-row"><div class="grow"><b class="peekable">${esc(g.idea)}</b><div class="note">${g.store?esc(g.store)+" · ":""}<span class="money">${g.price?money(g.price):"no price yet"}</span></div>
      <div class="steps">${STATES.map(([k,l])=>`<button class="${g.status===k?"on "+k:""}" data-st="${k}" data-g="${g.id}">${l}</button>`).join("")}</div></div>
      <button class="ib" data-eg="${g.id}" style="box-shadow:none;width:36px;height:36px">✎</button></div>`).join("") || `<p class="note" style="padding:8px 0">No gifts yet. Add an idea, even a vague one.</p>`}</div>
    <div class="card" style="margin-top:14px;padding:14px;box-shadow:none;background:var(--paper)"><label class="f" style="margin-top:0">New gift idea</label><input class="inp" id="i" placeholder="Cosy slippers, size 6">
      <div class="two" style="margin-top:8px"><input class="inp" id="p" inputmode="decimal" placeholder="Price"><input class="inp" id="s" placeholder="Shop"></div>
      <button class="btn" id="add" style="width:100%;margin-top:10px">+ Add idea</button></div>
    ${past.length ? `<label class="f">Given before</label>${past.map(g=>`<div class="note">• ${esc(g.idea)} (${esc(S.events.find(e=>e.id===g.eventId)?.name||"")})</div>`).join("")}` : ""}
    <div class="acts"><button class="btn danger" id="rm">Remove from list</button><button class="btn ghost" data-close>Done</button></div>`, m => {
      m.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { const g = S.gifts.find(x=>x.id===b.dataset.g); g.status = b.dataset.st; save(); render(); recipSheet(ev, pid); celebrate(ev); });
      m.querySelectorAll("[data-eg]").forEach(b => b.onclick = () => giftEdit(S.gifts.find(x=>x.id===b.dataset.eg), () => recipSheet(ev, pid)));
      m.querySelector("#add").onclick = () => { const i = v(m,"#i"); if(!i) return m.querySelector("#i").focus();
        S.gifts.push({id:uid(), eventId:ev.id, personId:pid, idea:i, price:num(v(m,"#p")), store:v(m,"#s"), link:"", status:"idea"}); save(); render(); recipSheet(ev, pid); };
      m.querySelector("#bud").onclick = () => { const b = prompt(`Budget for ${p.name}`, r.budget); if(b !== null){ r.budget = num(b); save(); render(); recipSheet(ev, pid); } };
      m.querySelector("#rm").onclick = () => { if(!confirm(`Take ${p.name} off this list? Their gift ideas for it are removed too.`)) return;
        ev.recips = ev.recips.filter(x=>x.personId!==pid); S.gifts = S.gifts.filter(g=>!(g.eventId===ev.id && g.personId===pid)); save(); close(); render(); };
    }); }
function giftEdit(g, back){ modal(`<h3>Edit gift</h3><label class="f">Gift</label><input class="inp" id="i" value="${esc(g.idea)}">
  <div class="two"><div><label class="f">Price</label><input class="inp" id="p" inputmode="decimal" value="${g.price||""}"></div><div><label class="f">Shop</label><input class="inp" id="s" value="${esc(g.store||"")}"></div></div>
  <label class="f">Link (optional)</label><input class="inp" id="l" placeholder="https://" value="${esc(g.link||"")}">
  <div class="acts"><button class="btn danger" id="del">Delete</button><button class="btn" id="ok">Save</button></div>`, m => {
    m.querySelector("#ok").onclick = () => { const l = v(m,"#l"); Object.assign(g, {idea:v(m,"#i")||g.idea, price:num(v(m,"#p")), store:v(m,"#s"), link:/^https?:\/\//i.test(l) ? l : ""}); save(); render(); back(); };
    m.querySelector("#del").onclick = () => { S.gifts = S.gifts.filter(x=>x.id!==g.id); save(); render(); back(); }; }); }
function personForm(p){ const e = !!p; p = p || {name:"", rel:"", notes:"", bday:""};
  modal(`<h3>${e ? "Edit person" : "Add a person"}</h3><label class="f">Name</label><input class="inp" id="n" value="${esc(p.name)}" placeholder="Grandad">
    <div class="two"><div><label class="f">Relationship</label><input class="inp" id="r" value="${esc(p.rel)}" placeholder="Family"></div><div><label class="f">Birthday</label><input class="inp" type="date" id="b" value="${p.bday||""}"></div></div>
    <label class="f">Sizes, likes, dislikes</label><textarea class="inp" id="t" placeholder="Shoe 9 · loves gardening · no chocolate">${esc(p.notes)}</textarea>
    ${e ? `<label class="f">Gift history</label>${S.gifts.filter(g=>g.personId===p.id && g.status!=="idea").map(g=>`<div class="note">• ${esc(g.idea)} · ${esc(S.events.find(x=>x.id===g.eventId)?.name||"")}</div>`).join("") || `<div class="note">Nothing yet.</div>`}` : ""}
    <div class="acts">${e ? `<button class="btn danger" id="del">Delete</button>` : `<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">Save</button></div>`, m => {
      m.querySelector("#ok").onclick = () => { const n = v(m,"#n"); if(!n) return toast("Add a name"); const o = {name:n, rel:v(m,"#r"), notes:v(m,"#t"), bday:v(m,"#b")};
        if(e) Object.assign(p, o); else S.people.push({id:uid(), ...o}); save(); close(); render(); };
      if(e) m.querySelector("#del").onclick = () => { if(!confirm(`Delete ${p.name} and all their gifts?`)) return; S.people = S.people.filter(x=>x.id!==p.id); S.gifts = S.gifts.filter(g=>g.personId!==p.id);
        S.events.forEach(ev => ev.recips = ev.recips.filter(r=>r.personId!==p.id)); save(); close(); render(); };
    }); }
function celebrate(ev){ const s = evStats(ev); if(s.people && s.done === s.people && !ev.celebrated){ ev.celebrated = true; save(); confetti(); toast("Every gift given. All wrapped up!"); } }
function settings(){ modal(`<h3>Settings</h3><p class="sub">Your lists are saved on this device only.</p>
  <label class="f">Currency</label><select class="inp" id="c">${["USD","GBP","EUR","CAD","AUD","NZD","INR","PKR","AED","SAR","ZAR","SGD","MYR"].map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select>
  <label class="f">Peek-proof mode</label><p class="note">Tap the eye at the top to blur gift names and prices when someone is looking over your shoulder.</p>
  <label class="f">Your data</label><div class="two"><button class="btn ghost sm" id="ex">⇩ Backup file</button><button class="btn ghost sm" id="im">⇧ Restore backup</button></div>
  <div class="two" style="margin-top:10px"><button class="btn ghost sm" id="demo">Load sample gifts</button><button class="btn danger sm" id="wipe">Erase everything</button></div>
  <div class="acts"><button class="btn" id="ok">Done</button></div>`, m => {
    m.querySelector("#ok").onclick = () => { S.cur = v(m,"#c"); save(); close(); render(); };
    m.querySelector("#ex").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download = `gift-planner-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("Backup downloaded"); };
    m.querySelector("#im").onclick = () => document.getElementById("imp").click();
    m.querySelector("#demo").onclick = () => { if(confirm("Replace everything with sample gifts?")){ demo(); close(); render(); } };
    m.querySelector("#wipe").onclick = () => { if(confirm("Erase every list? Download a backup first if you want to keep it.")){ localStorage.removeItem(KEY); S = blank(); S.cur = guessCur(); view = {tab:"home", ev:null}; close(); render(); } };
  }); }
document.getElementById("imp").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(d.v!==1 || !Array.isArray(d.events)) throw 0; S = Object.assign(blank(), d); save(); close(); render(); toast("Backup restored"); }catch(err){ toast("That is not a Gift Planner backup"); } }; r.readAsText(f); e.target.value = ""; };
function demo(){ S = blank(); S.cur = guessCur(); const y = new Date().getFullYear(); const next = (m,d) => { const s = `${y}-${pad(m)}-${pad(d)}`; return days(s) >= 0 ? s : `${y+1}-${pad(m)}-${pad(d)}`; };
  const P = (n,r,notes) => { const id = uid(); S.people.push({id, name:n, rel:r, notes}); return id; };
  const mum = P("Mum","Family","Size 12 · loves candles and gardening"), dad = P("Dad","Family","Coffee snob · football"), sis = P("Hana","Sister","Reads everything · no perfume"),
        lily = P("Lily","Niece, age 7","Obsessed with unicorns"), sam = P("Mr Patel","Teacher",""), zee = P("Zara","Best friend","Collects mugs");
  const xmas = uid(), eid = uid(), bday = uid();
  S.events.push({id:xmas, name:`Christmas ${y}`, type:"christmas", date:next(12,25), recips:[{personId:mum,budget:60},{personId:dad,budget:60},{personId:sis,budget:40},{personId:lily,budget:30},{personId:sam,budget:15}]});
  S.events.push({id:bday, name:"Zara's 30th", type:"birthday", date:iso(new Date(Date.now()+12*864e5)), recips:[{personId:zee,budget:45}]});
  S.events.push({id:eid, name:"Eid al-Fitr", type:"eid", date:next(3,10), recips:[{personId:lily,budget:25},{personId:sis,budget:30}]});
  const G = (ev,p,i,pr,st,shop) => S.gifts.push({id:uid(), eventId:ev, personId:p, idea:i, price:pr, store:shop||"", link:"", status:st});
  G(xmas,mum,"Hand-poured candle set",28,"wrapped","Etsy"); G(xmas,mum,"Gardening gloves",14,"bought","Garden centre");
  G(xmas,dad,"Pour-over coffee kit",42,"bought","Amazon"); G(xmas,dad,"Club scarf",18,"idea","Club shop");
  G(xmas,sis,"Hardback of the year's big novel",22,"idea","Bookshop"); G(xmas,sis,"Reading light",15,"idea","Amazon");
  G(xmas,lily,"Unicorn craft kit",19,"idea","Toy shop"); G(xmas,sam,"Thank-you card and chocolates",12,"idea","Supermarket");
  G(bday,zee,"Custom name mug",24,"bought","Etsy"); G(bday,zee,"Birthday dinner out",0,"idea","");
  G(eid,lily,"Eid money envelope",20,"idea",""); G(eid,sis,"Silk scarf",28,"idea","Etsy");
  save(); }

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ view = {tab:tb.dataset.tab, ev:null}; render(); scrollTo({top:0}); return; }
  const ec = e.target.closest("[data-ev]"); if(ec){ view.ev = ec.dataset.ev; render(); scrollTo({top:0}); return; }
  if(e.target.closest("[data-close]")) return close();
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a, id = b.dataset.id; const ev = S.events.find(x=>x.id===view.ev);
  if(a==="newEvent") eventForm(); else if(a==="editEvent") eventForm(ev); else if(a==="backHome"){ view.ev = null; render(); }
  else if(a==="addRecip") recipForm(ev); else if(a==="openRecip") recipSheet(ev, id);
  else if(a==="newPerson") personForm(); else if(a==="personSheet") personForm(person(id));
  else if(a==="buy"){ S.gifts.find(g=>g.id===id).status = "bought"; save(); render(); toast("Bought. Nice."); }
  else if(a==="unbuy"){ S.gifts.find(g=>g.id===id).status = "idea"; save(); render(); }
  else if(a==="peek"){ S.peek = !S.peek; save(); render(); toast(S.peek ? "Peek-proof on. Gifts are blurred." : "Peek-proof off"); }
  else if(a==="settings") settings(); else if(a==="demo"){ demo(); render(); toast("Sample gifts loaded"); }
});
render();
</script>
</body>
</html>
