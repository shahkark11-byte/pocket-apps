<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f4ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seller Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Seller Quest</title>
<style>
:root{
  --bg:#f7f4ed;--paper:#fffdf8;--paper2:#f3ede1;--ink:#24201a;--mut:#665d4f;--line:rgba(90,70,30,.14);
  --gold:#e5a01d;--gold2:#c98410;--gold3:#8a5a00;--pos:#2f7a4f;--neg:#b5452f;--navy:#2c3440;
  --shadow:rgba(90,65,20,.16);--nav:72px;--r:18px;--sy:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-size:16px;line-height:1.45;background:var(--bg);overflow-x:hidden}
/* honey studio: one soft lamp from the top right. Highlights face it, shadows fall down and left */
.wash{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(90% 60% at 96% -6%,rgba(255,226,150,.55),rgba(255,236,190,.22) 40%,transparent 66%),
             radial-gradient(80% 60% at -8% 108%,rgba(90,65,20,.14),transparent 70%),var(--bg)}
.paper{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(90,65,20,.07) .6px,transparent .8px),radial-gradient(rgba(255,255,255,.7) .6px,transparent .8px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 4px}
.bloom{position:fixed;right:-18%;top:-14%;width:72vw;height:72vw;max-width:520px;max-height:520px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,214,120,.38),rgba(255,214,120,0) 68%);transform:translateY(calc(var(--sy) * -0.06px))}
@media (prefers-reduced-motion:no-preference){.bloom{animation:breathe 9s ease-in-out infinite}@keyframes breathe{50%{opacity:.72}}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.card{position:relative;background:linear-gradient(200deg,var(--paper),var(--paper2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;
  box-shadow:inset 0 1px 0 #fff,-6px 10px 22px var(--shadow)}
.card::before{content:"";position:absolute;left:30%;right:0;top:0;height:2px;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(229,160,29,.55))}
.card>*{position:relative}
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(200deg,#fff6dc,#f2d48c);box-shadow:inset 0 1px 0 #fff,-4px 6px 12px var(--shadow)}
.top b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:#3a2600;background:linear-gradient(180deg,#f7c75a,var(--gold));padding:2px 8px;border-radius:7px;margin-right:6px}
.xpbar{height:6px;border-radius:4px;background:rgba(90,65,20,.12);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),#f5c45a);border-radius:4px}
.icb{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(200deg,#fffaf0,#efe6d4);box-shadow:inset 0 1px 0 #fff,-3px 5px 10px var(--shadow);color:var(--mut)}
.icb svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--mut)}
.small{font-size:14px}
.h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 0}
.h h2{font-size:21px}
.h button,.link{color:var(--gold3);font-weight:700;font-size:15px;min-height:44px;padding:0 4px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;color:#2a1c00;
  background:linear-gradient(180deg,#f6c457,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),-3px 5px 12px rgba(160,105,10,.28)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.ghost{color:var(--ink);background:linear-gradient(200deg,#fffaf0,#efe6d4);box-shadow:inset 0 1px 0 #fff,-3px 5px 10px var(--shadow)}
.btn.dark{color:#fff7e6;background:linear-gradient(180deg,#3b4552,var(--navy));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),-3px 5px 12px rgba(30,35,45,.3)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.big{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.gold{background:linear-gradient(180deg,#d18e12,#a96a00 60%,#7d4f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:#fffbf2;border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{display:block;font-size:12.5px;color:var(--mut)}
.goal{height:10px;border-radius:6px;background:rgba(90,65,20,.12);overflow:hidden;margin-top:12px}
.goal i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold2),#f5c45a)}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:16px}
.weeknav b{flex:1;text-align:center;font-size:17px}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-height:58px;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .e{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#fff5de;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mut);font-size:13px}
.item .v{text-align:right;flex:none}
.item .v b{display:block}.item .v small{display:block;font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(181,69,47,.12);color:var(--neg);margin-left:4px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
.bar .tr{height:10px;border-radius:6px;background:rgba(90,65,20,.1);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3b4552,#6a7684)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:15px;background:#fffbf2;border:1.5px solid var(--line);color:var(--ink)}
.chip.on{background:rgba(229,160,29,.18);border-color:var(--gold);color:#5a3a00}
.in,select.in,textarea.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fffefa;padding:10px 12px;font:inherit;color:var(--ink)}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(229,160,29,.18)}
label.f{display:block;font-size:14px;font-weight:700;margin:16px 2px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.two label.f,.three label.f{margin-top:12px}
.note{font-size:14px;color:var(--mut);margin:10px 2px 0}
.brk{margin-top:10px;border-top:1px dashed var(--line)}
.brk div{display:flex;justify-content:space-between;padding:7px 2px;font-size:15px;border-bottom:1px dashed var(--line)}
.brk div.tot{font-weight:800;font-size:17px;border-bottom:0}
.res{margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(200deg,#fff6dc,#f8e6b8);border:1px solid rgba(229,160,29,.35)}
.res .big{font-size:30px}
.tog{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left;margin-top:10px}
.tog .sw{width:50px;height:30px;border-radius:15px;background:rgba(90,65,20,.2);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:-1px 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tog[aria-checked=true] .sw{background:var(--gold)}.tog[aria-checked=true] .sw::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:700;background:#fffbf2;border:1.5px solid var(--line)}
.stepper b{min-width:34px;text-align:center;font-size:18px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:15px;background:#fffbf2;border:1px solid var(--line)}
.badge .e{font-size:28px}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge small{display:block;font-size:12px;color:var(--mut);line-height:1.25;margin-top:2px}
.badge.off .e{filter:grayscale(1);opacity:.35}
.empty{text-align:center;color:var(--mut);padding:24px 14px}
.empty .e{font-size:38px;margin-bottom:6px}
table.rep{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.rep th,table.rep td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
table.rep th:first-child,table.rep td:first-child{text-align:left}
table.rep tr.tot td{font-weight:800;border-bottom:0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));height:var(--nav);z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);border-radius:22px;background:rgba(255,252,244,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,-8px 14px 30px rgba(90,65,20,.22)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--gold3)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(40,30,15,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(190deg,#fffdf8,#f3ede1);border-radius:24px 24px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(40,30,15,.25)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(90,65,20,.25);margin:0 auto 14px}
.sheet h3{font-size:23px}
.sheet .sub{color:var(--mut);margin:6px 0 0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);
  background:#24201a;color:#fff6e4;padding:12px 16px;border-radius:13px;font-weight:600;box-shadow:-4px 8px 20px rgba(30,20,10,.35)}
.toast em{font-style:normal;color:#ffd27a}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.steps i{width:28px;height:6px;border-radius:3px;background:rgba(90,65,20,.15)}.steps i.on{background:var(--gold)}
.hero-ill{width:150px;height:150px;margin:0 auto 10px;display:block}
.rescue-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:70;max-width:536px;margin:0 auto;background:#fff3e6;border:2px solid var(--neg);border-radius:16px;padding:14px}
@media (prefers-reduced-motion:reduce){.bloom{display:none}}
</style>
</head>
<body>
<div class="wash"></div><div class="paper"></div><div class="bloom"></div>
<main id="app"></main>
<nav id="nav" aria-label="Main"></nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script id="qfx-engine">
/* Quest FX: sounds and seasonal themes, shared by every Quest app.
   One source file. build.py copies it into each app between the qfx markers and replaces the old copy.
   Sounds are made in code (no files), so it all works offline. Prefs are kept per app in localStorage[KEY + ".fx"]. */
const QFX = (() => {
  "use strict";
  /* ───── sound engine ───── */
  let ctx = null, out = null, lastPlay = -1e9;
  function ac(){
    if(ctx) return ctx;
    try{ if(navigator.audioSession) navigator.audioSession.type = "ambient"; }catch(e){}
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return null;
    try{ ctx = new A(); }catch(e){ return null; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = .5; out.connect(comp); comp.connect(ctx.destination);
    return ctx;
  }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(f, o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .005, d = o.d || .2, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if(o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || f*.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + a + d + .05); }
    env(g, t, a, o.g || .3, d); osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + d + .05); }
  let nbuf = null;
  function noise(o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .003, d = o.d || .2;
    if(!nbuf){ nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const x = nbuf.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = Math.random()*2 - 1; }
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.f || 2000, t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d); f.Q.value = o.q || 1; const g = c.createGain(); env(g, t, a, o.g || .3, d);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + a + d + .05); }
  const metal = (base, o) => { o = o || {}; [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(base*m, {at:o.at, g:(o.g || .18)/(i + 1), d:(o.d || .5)/(1 + i*.6)})); };
  const chord = (fs, o) => { o = o || {}; fs.forEach((f, i) => tone(f, {at:(o.at || 0) + i*(o.step || 0), type:o.type || "triangle", g:o.g || .12, d:o.d || .5, a:o.a})); };
  const bell = (f, o) => { o = o || {}; tone(f, {at:o.at, g:o.g || .14, d:o.d || 1.1}); tone(f*2.01, {at:o.at, g:(o.g || .14)*.4, d:(o.d || 1.1)*.6}); tone(f*3.02, {at:o.at, g:(o.g || .14)*.18, d:(o.d || 1.1)*.35}); };
  const pluck = (f, o) => { o = o || {}; tone(f, {at:o.at, type:"triangle", g:o.g || .16, d:o.d || .28}); tone(f*2, {at:o.at, g:(o.g || .16)*.25, d:(o.d || .28)*.5}); };
  const coin = (o) => { o = o || {}; const f = o.f || 1900; tone(f, {at:o.at, type:"square", g:(o.g || .05), d:.05}); tone(f*1.34, {at:(o.at || 0) + .06, type:"square", g:(o.g || .05), d:.22}); };
  const B = {tone, noise, metal, chord, bell, pluck, coin};

  /* default sounds; each app passes its own set, which wins */
  const BASE = {
    tap: b => { b.noise({f:2600, q:2, g:.05, d:.03}); b.tone(880, {d:.035, g:.03}); },
    xp: b => b.chord([784, 1175], {step:.05, type:"sine", g:.1, d:.25}),
    big: b => { b.chord([523, 659, 784, 1047], {step:.07, g:.11, d:.6}); b.noise({type:"highpass", f:7000, g:.04, d:.5, at:.25}); },
    badge: b => { b.chord([1319, 1760, 2637], {step:.06, type:"sine", g:.07, d:.35}); b.metal(1046, {at:.18, g:.05, d:.7}); },
    level: b => { b.chord([392, 523, 659, 784, 1047, 1319], {step:.065, g:.09, d:.45}); b.tone(1568, {at:.42, d:1, g:.06}); },
    done: b => b.chord([659, 988], {step:.06, type:"sine", g:.1, d:.3}),
    del: b => b.tone(240, {to:110, d:.16, g:.16, type:"triangle"}),
    undo: b => b.tone(700, {to:420, d:.12, g:.08, type:"triangle"})
  };
  const FESTIVE = new Set(["xp", "big", "badge", "level", "done"]);
  /* a little extra on rewards during an occasion */
  const ACCENT = {
    bells: b => { [0, .07, .14, .21].forEach(t => b.noise({type:"highpass", f:7200, q:1, g:.07, d:.06, at:.08 + t})); b.metal(2600, {at:.1, g:.05, d:.5}); },
    firework: b => { b.noise({type:"lowpass", f:900, g:.14, d:.18, at:.05}); for(let i = 0; i < 6; i++) b.noise({type:"highpass", f:5000 + Math.random()*3000, g:.05, d:.04, at:.22 + i*.05 + Math.random()*.03}); },
    spooky: b => b.tone(420, {to:210, d:.7, g:.06, vib:5, vibAmt:12, at:.08, a:.05}),
    harp: b => [880, 1109, 1319, 1760].forEach((f, i) => b.pluck(f, {at:.08 + i*.05, g:.07})),
    gong: b => b.metal(110, {at:.05, g:.14, d:1.4}),
    lantern: b => [587, 622, 740, 784].forEach((f, i) => b.pluck(f*2, {at:.08 + i*.07, g:.06, d:.4})),
    sparkle: b => [2093, 2637, 3136].forEach((f, i) => b.tone(f, {at:.08 + i*.05, g:.04, d:.25})),
    chirp: b => { b.tone(3000, {to:4400, d:.07, g:.05, at:.08}); b.tone(3200, {to:4600, d:.07, g:.05, at:.2}); },
    whistle: b => [1568, 1760, 1568, 1976].forEach((f, i) => b.tone(f, {at:.08 + i*.06, g:.05, d:.08})),
    warm: b => b.chord([392, 494, 587], {at:.08, type:"sine", g:.05, d:.6})
  };

  /* ───── occasions ───── */
  const D = (y, m, d) => new Date(y, m - 1, d);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const nthDow = (y, m, dow, n) => { const f = D(y, m, 1), first = 1 + (dow - f.getDay() + 7) % 7; return D(y, m, first + (n - 1)*7); };
  const lastDow = (y, m, dow) => { const l = D(y, m + 1, 0); return D(y, m, l.getDate() - (l.getDay() - dow + 7) % 7); };
  function easter(y){ const a = y % 19, b = Math.floor(y/100), c = y % 100, d = Math.floor(b/4), e = b % 4, f = Math.floor((b + 8)/25), g = Math.floor((b - f + 1)/3),
    h = (19*a + b - d - g + 15) % 30, i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l)/451),
    mo = Math.floor((h + l - 7*m + 114)/31), da = (h + l - 7*m + 114) % 31 + 1; return D(y, mo, da); }
  /* moving dates, checked against published calendars in Nov 2026. Lunar dates can shift a day by moon sighting,
     so the windows are a little wide. Add new years here once a year. */
  const T = {
    ramadan: {2027:[2,8], 2028:[1,28], 2029:[1,16], 2030:[1,5], 2031:[12,16]},
    ramadanB: {2030:[12,26]},
    fitr: {2027:[3,9], 2028:[2,26], 2029:[2,14], 2030:[2,4], 2031:[1,24]},
    adha: {2027:[5,16], 2028:[5,5], 2029:[4,24], 2030:[4,13], 2031:[4,2]},

function feeParts(src, price, qty, ship, off){
  const f = S.settings.fees, tot = price * qty + ship, P = p => tot * p / 100;
  if(src === "etsy"){ const out = [["Listing", f.eL * qty], ["Transaction", P(f.eT)], ["Payment processing", P(f.eP) + f.eF]];
    if(f.eR) out.push(["Regulatory", P(f.eR)]); if(off) out.push(["Offsite Ads", P(f.eO)]); return out.map(([a, b]) => [a, r2(b)]); }
