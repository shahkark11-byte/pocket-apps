:root{
  --bg1:#140d33;--bg2:#24145c;--ink:#f5f1ff;--mut:#b4a9d9;--dim:#7d72a8;
  --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --gold:#ffc94a;--gold2:#ff9f43;--mint:#4be3a5;--coral:#ff6b7a;--violet:#9b7bff;--sky:#5ec8ff;
  --r:22px;--nav:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#3b1f8f 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#0f4a6b 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 44%,#ffe9a8 50%,transparent 51%),
  radial-gradient(1px 1px at 34% 62%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 86%,#cfc2ff 50%,transparent 51%),
  radial-gradient(1px 1px at 6% 78%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 46% 30%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 94% 90%,#fff 50%,transparent 51%);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:620px;margin:0 auto;padding:18px 16px calc(var(--nav) + 40px);position:relative}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ava{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffd76a,#ff8f4a);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(255,160,60,.35),inset 0 -3px 0 rgba(0,0,0,.15);flex:none;overflow:hidden}
.ava svg{width:48px;height:48px}
.ava-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava.photo{background:none;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(255,160,60,.35)}
.who{flex:1;min-width:0}
.who b{font-size:19px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:13px;font-weight:500}
.xpbar{height:9px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--sky));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.lvl{font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--gold);color:#3a2300;padding:3px 8px;border-radius:8px;margin-right:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.h h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.h button,.link{color:var(--gold);font-weight:600;font-size:14px}
.h button{min-height:44px;min-width:44px;margin:-13px 0;padding:0 2px}
.muted{color:var(--mut)}.dim{color:var(--dim)}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gold{background:linear-gradient(180deg,#fff1b8,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{color:var(--coral)}.pos{color:var(--mint)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,#ffd76a,#ffb238);color:#3a2300;box-shadow:0 6px 0 #b9741a,0 10px 24px rgba(255,170,60,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b9741a}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#7ff0c3,#2fcf8d);color:#073a26;box-shadow:0 6px 0 #1d8f5f}
.btn.red{background:linear-gradient(180deg,#ff8f9a,#f0566a);color:#3a0710;box-shadow:0 6px 0 #a3283a}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px;min-height:44px}
.btn.full{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
/* hero stat */
.hero{padding:22px;overflow:hidden;background:linear-gradient(150deg,rgba(155,123,255,.25),rgba(94,200,255,.08));border-color:rgba(255,255,255,.18)}
.hero .lbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut);line-height:1.15}
.ring .c b{display:block;font-size:24px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:rgba(0,0,0,.18);border-radius:16px;padding:11px 12px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.stat b{font-size:17px}
/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.item b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);font-size:13px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{width:44px;height:44px;border-radius:10px;color:var(--dim);display:grid;place-items:center;flex:none}
.x:hover{background:var(--card2);color:var(--coral)}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap}
.chip.late{background:rgba(255,107,122,.2);color:#ff9aa5}.chip.soon{background:rgba(255,201,74,.18);color:var(--gold)}
.chip.ok{background:rgba(75,227,165,.16);color:var(--mint)}.chip.later{background:var(--card2);color:var(--mut)}
.done b{text-decoration:line-through;color:var(--dim)}
.empty{text-align:center;padding:26px 16px;color:var(--mut)}
.empty .e{font-size:38px;margin-bottom:8px}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(588px,calc(100% - 24px));height:var(--nav);
  display:grid;grid-template-columns:1.25fr 1.25fr 66px 1fr 1fr 1fr 1fr;align-items:center;background:rgba(24,15,62,.82);border:1px solid var(--line);
  border-radius:26px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20;box-shadow:0 18px 40px rgba(0,0,0,.4)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--dim);height:100%;min-width:0;white-space:nowrap}
nav button svg{width:24px;height:24px}
nav .nl-s{display:none}
@media(max-width:400px){nav .nl-l{display:none}nav .nl-s{display:inline}}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--gold);filter:drop-shadow(0 0 8px rgba(255,201,74,.6))}
nav .fab{position:relative}
nav .fab span{width:60px;height:60px;border-radius:20px;margin-top:-34px;display:grid;place-items:center;
  background:linear-gradient(180deg,#ffd76a,#ffb238);color:#3a2300;box-shadow:0 6px 0 #b9741a,0 14px 30px rgba(255,170,60,.45)}
nav .fab span svg{width:30px;height:30px}
@media(max-width:380px){nav{width:calc(100% - 16px);grid-template-columns:1fr 1fr 54px 1fr 1fr 1fr 1fr}nav .fab span{width:54px;height:54px}}
/* forms */
.sheet-bg{position:fixed;inset:0;background:rgba(8,4,24,.62);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s}
.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2a1b66,#1a1044);border:1px solid var(--line);border-bottom:0;
  border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.2,1)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.sheet h3{font-size:22px;font-weight:800;margin-bottom:4px}
.sheet p.sub{color:var(--mut);margin-bottom:16px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 2px 6px;letter-spacing:.03em}
.in{width:100%;padding:14px 15px;border-radius:15px;background:rgba(0,0,0,.25);border:1px solid var(--line);outline:none;font-size:16px}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,74,.18)}
.in.huge{font-size:40px;font-weight:800;text-align:center;padding:16px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}.in{min-width:0}.sheet{overflow-x:hidden}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{padding:9px 12px;min-height:44px;min-width:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.cat.on{background:rgba(255,201,74,.18);border-color:var(--gold);color:#ffe7a6}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;min-height:44px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
/* bosses */
.boss{display:flex;gap:14px;align-items:center}
.boss svg.m{width:86px;height:86px;flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.hp{height:14px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;margin:8px 0 6px;border:1px solid rgba(255,255,255,.08)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9f43);border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.target{position:absolute;top:-10px;right:16px;background:var(--coral);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:8px}
.slain{opacity:.55}.slain .hp i{background:var(--mint)}
/* castle view */
.castle{position:relative;margin-top:16px;padding:18px 14px 0;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 60% at 78% 0%,rgba(255,170,90,.32),transparent 60%),linear-gradient(180deg,#2a1d4d 0%,#1b1436 55%,#130e27 100%);
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),-8px 16px 34px rgba(0,0,0,.35)}
.castle .rays{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 200deg at 82% -6%,rgba(255,210,140,.07) 0 4deg,transparent 4deg 11deg);mix-blend-mode:screen}
.freedom{position:relative;text-align:center;margin:0 auto 4px;max-width:270px}
.freedom .flag{display:inline-block;background:linear-gradient(180deg,#fff3c4,#ffc94a 60%,#ff9f43);color:#3a2300;font-weight:900;font-size:13px;letter-spacing:.08em;
  padding:7px 14px;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),-3px 5px 12px rgba(0,0,0,.35)}
.freedom small{display:block;color:#e9dcff;font-size:13px;margin-top:6px}
.dragon{position:relative;display:flex;flex-direction:column;align-items:center}
.dragon svg{width:150px;height:118px;filter:drop-shadow(-6px 10px 12px rgba(0,0,0,.45))}
.dragon.down svg{filter:grayscale(.7) brightness(.8) drop-shadow(-6px 10px 12px rgba(0,0,0,.45));transform:rotate(-8deg) translateY(8px)}
.tower{width:86%;margin:0 auto;position:relative}
.floor{position:relative;margin:0 auto;padding:12px 14px 12px;border-radius:6px 6px 4px 4px;color:#f4eefe;
  background:linear-gradient(180deg,#6a5d86,#4d4266);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25),-6px 8px 14px rgba(0,0,0,.35);
  background-image:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.08)),repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.18) 46px 48px),linear-gradient(180deg,#6a5d86,#4d4266)}
.floor+.floor{margin-top:6px}
.floor.crown::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;
  background:linear-gradient(90deg,#6a5d86 0 14%,transparent 14% 22%,#6a5d86 22% 36%,transparent 36% 44%,#6a5d86 44% 56%,transparent 56% 64%,#6a5d86 64% 78%,transparent 78% 86%,#6a5d86 86%)}
.floor.dragonfloor::before{background:linear-gradient(90deg,#7a4a6e 0 14%,transparent 14% 22%,#7a4a6e 22% 36%,transparent 36% 44%,#7a4a6e 44% 56%,transparent 56% 64%,#7a4a6e 64% 78%,transparent 78% 86%,#7a4a6e 86%)}
.floor.dragonfloor{background-image:linear-gradient(180deg,rgba(255,80,90,.22),rgba(0,0,0,.1)),repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.18) 46px 48px),linear-gradient(180deg,#7a4a6e,#53334f)}
.floor.next{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px var(--coral),0 0 22px rgba(255,107,122,.45),-6px 8px 14px rgba(0,0,0,.35)}
.floor.next .tag{position:absolute;right:10px;top:-9px;background:var(--coral);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px}
.floor .fl{display:flex;align-items:center;gap:10px}
.floor .fl .n{flex:1;min-width:0}
.floor .fl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floor .fl small{display:block;font-size:12.5px;color:#d9cff0}
.floor .btn.sm{min-width:44px;min-height:44px}
.floor .lv{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;background:rgba(0,0,0,.28);color:#ffe7a6}
.floor .hp{height:8px;margin:8px 0 0}
.rubble{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 0 2px}
.rubble span{font-size:12.5px;font-weight:700;color:#bff5dc;background:rgba(75,227,165,.14);border:1px solid rgba(75,227,165,.3);padding:5px 9px;border-radius:999px}
.gate{position:relative;height:74px;margin:8px -14px 0;background:linear-gradient(180deg,#3a3152,#2a2340);border-top:2px solid rgba(255,255,255,.08);display:flex;align-items:flex-end;justify-content:center}
.gate .door{width:58px;height:58px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#1a1430,#0d0a1c);box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.gate .you{position:absolute;left:18%;bottom:8px;font-size:30px;filter:drop-shadow(-3px 4px 4px rgba(0,0,0,.5))}
.gate .you small{display:block;font-size:12px;font-weight:800;color:#ffe7a6;text-align:center;margin-top:-2px}
.goblins{display:flex;flex-direction:column;gap:10px}
.gob{display:flex;align-items:center;gap:12px}
.gob svg{width:46px;height:46px;flex:none;filter:drop-shadow(-3px 5px 6px rgba(0,0,0,.35))}
.gob .d{flex:none;text-align:right;font-size:13px}
.gob .d b{display:block;font-size:15px}
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.defs button{background:var(--card2);border-radius:16px;padding:12px 8px;text-align:center;min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.defs .e{font-size:22px}.defs b{display:block;font-size:17px;margin-top:4px}.defs small{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.25}
@media (prefers-reduced-motion:no-preference){
  .dragon:not(.down) svg{animation:dhover 3.6s ease-in-out infinite}
  .dragon:not(.down) .wing{transform-origin:50% 60%;animation:flap 1.8s ease-in-out infinite}
  .gob svg{animation:sneak 2.8s ease-in-out infinite}
  @keyframes dhover{50%{transform:translateY(-5px)}}
  @keyframes flap{50%{transform:scaleY(.82)}}
  @keyframes sneak{0%,100%{transform:translateX(0)}50%{transform:translateX(3px) rotate(3deg)}}
}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.dmg{position:fixed;font-weight:900;font-size:30px;color:#ff5c70;text-shadow:0 3px 0 #5a0b18;pointer-events:none;z-index:60;animation:dmg 1.1s forwards}
@keyframes dmg{to{transform:translateY(-70px) scale(1.3);opacity:0}}
/* vault */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.goal{text-align:center;padding:16px 12px}
.goal .ring{width:96px;height:96px;margin:0 auto 10px}
.goal .ring .c{font-size:28px}
.jail{display:grid;gap:12px}
.cell{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 6px,transparent 6px 26px),var(--card);border:1px solid var(--line)}
.cell.free{background:linear-gradient(135deg,rgba(75,227,165,.2),rgba(94,200,255,.1));border-color:rgba(75,227,165,.45)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{text-align:center;padding:14px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.medal{width:70px;height:70px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc94a 45%,#d98a1c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 8px 18px rgba(255,180,60,.3)}
.badge.lock .medal{background:radial-gradient(circle at 35% 30%,#5a4d8a,#3a2f66);filter:grayscale(1);box-shadow:none;opacity:.6}
.badge b{font-size:14px;display:block}.badge small{font-size:12px;color:var(--mut)}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--sky))}
/* toast + fx */
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(20,12,50,.92);border:1px solid rgba(255,201,74,.5);padding:10px 16px;border-radius:14px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .35s cubic-bezier(.2,.9,.3,1.4),tout .4s 2.4s forwards;display:flex;gap:8px;align-items:center}
.toast em{font-style:normal;color:var(--gold)}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}@keyframes tout{to{transform:translateY(-14px);opacity:0}}
.coin{position:fixed;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc94a 50%,#d98a1c);z-index:65;pointer-events:none}
.levelup{text-align:center;padding:10px 0}
.levelup .n{font-size:96px;font-weight:900;line-height:1}
.ava-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ava-pick button{aspect-ratio:1;border-radius:18px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;min-width:0;padding:0}
.ava-pick button.on{border-color:var(--gold);background:rgba(255,201,74,.15)}
.ava-pick svg{width:80%;height:80%}
.ava-pick .ph{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut)}
.ava-pick .ph svg{width:26px;height:26px}
.ava-pick img{width:100%;height:100%;object-fit:cover;display:block}
.hp-photo{display:flex;align-items:center;gap:12px;margin-top:10px}
.hp-photo .note{margin-top:0;flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--card2)}.dots i.on{background:var(--gold);width:22px;border-radius:5px}
.title-art{font-size:44px;font-weight:900;line-height:.9;letter-spacing:-.02em;text-align:center;margin:8px 0 12px}
.title-art span{display:block;color:var(--gold)}
.note{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.45}
.splash{position:fixed;inset:0 0 45% 0;pointer-events:none}
.splash .float{position:absolute;animation:bob 4s ease-in-out infinite}
.splash .float svg{width:100%;height:100%}
.splash .f1{width:150px;height:150px;left:50%;top:14%;margin-left:-75px}
.splash .f2{width:84px;height:84px;left:8%;top:6%;animation-delay:-1.3s;opacity:.85}
.splash .f3{width:96px;height:96px;right:6%;top:30%;animation-delay:-2.6s;opacity:.85}
.sp-coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc94a 50%,#d98a1c);
  box-shadow:0 0 18px rgba(255,201,74,.6);animation:bob 3s ease-in-out infinite}
.sp-coin.c1{left:22%;top:38%}.sp-coin.c2{right:24%;top:10%;animation-delay:-1s;width:16px;height:16px}
.sp-coin.c3{left:12%;top:52%;animation-delay:-2s;width:14px;height:14px}.sp-coin.c4{right:14%;top:60%;animation-delay:-.5s}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
/* no-spend calendar */
.ns-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.ns-stats b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.ns-stats small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.ns-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}
.ns-head b{font-size:16px;font-weight:700}
.ns-head button{width:44px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;line-height:1}
.ns-head button[disabled]{opacity:.35;pointer-events:none}
.ns-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ns-w{text-align:center;font-size:12px;font-weight:700;color:var(--dim);padding-bottom:2px}
.ns-d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;gap:2px}
.ns-d i{display:block;width:4px;height:4px;border-radius:50%;background:transparent}
.ns-d.sp i{background:var(--dim)}
.ns-d.on{background:var(--mint);opacity:.85;color:#073a26;font-weight:800}
.ns-d.now{outline:2px solid var(--gold);outline-offset:-2px}
.ns-d.fut{opacity:.35}
.ns-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ns-badges .pill.off{opacity:.4}
/* essentials allowances */
.al-row{display:block;width:100%;text-align:left;color:inherit;margin-bottom:10px;padding:14px 16px}
.al-top{display:flex;align-items:center;gap:10px}
.al-e{font-size:20px;flex:none}
.al-n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 8px}
.al-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.al-bar i.over{background:var(--coral)}
.al-sub{font-size:13px}
.al-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.al-head .link,.tl{display:inline-flex;align-items:center;min-height:44px;margin:-13px 0;vertical-align:middle}
.al-head b{font-weight:700}

<script id="qfx-engine">
/* Quest FX: sounds and seasonal themes, shared by every Quest app.
   One source file. build.py copies it into each app between the qfx markers and replaces the old copy.
   Sounds are made in code (no files), so it all works offline. Prefs are kept per app in localStorage[KEY + ".fx"]. */
const QFX = (() => {
  "use strict";
  /* ───── sound engine ───── */
  let ctx = null, out = null, lastPlay = -1e9;
  function ac(){
    if(ctx) return ctx;
    try{ if(navigator.audioSession) navigator.audioSession.type = "ambient"; }catch(e){}
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return null;
    try{ ctx = new A(); }catch(e){ return null; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = .5; out.connect(comp); comp.connect(ctx.destination);
    return ctx;
  }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(f, o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .005, d = o.d || .2, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if(o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || f*.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + a + d + .05); }
    env(g, t, a, o.g || .3, d); osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + d + .05); }
  let nbuf = null;
  function noise(o){ o = o || {}; const c = ctx, t = c.currentTime + (o.at || 0), a = o.a || .003, d = o.d || .2;
    if(!nbuf){ nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const x = nbuf.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = Math.random()*2 - 1; }
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.f || 2000, t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d); f.Q.value = o.q || 1; const g = c.createGain(); env(g, t, a, o.g || .3, d);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + a + d + .05); }
  const metal = (base, o) => { o = o || {}; [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(base*m, {at:o.at, g:(o.g || .18)/(i + 1), d:(o.d || .5)/(1 + i*.6)})); };
  const chord = (fs, o) => { o = o || {}; fs.forEach((f, i) => tone(f, {at:(o.at || 0) + i*(o.step || 0), type:o.type || "triangle", g:o.g || .12, d:o.d || .5, a:o.a})); };
  const bell = (f, o) => { o = o || {}; tone(f, {at:o.at, g:o.g || .14, d:o.d || 1.1}); tone(f*2.01, {at:o.at, g:(o.g || .14)*.4, d:(o.d || 1.1)*.6}); tone(f*3.02, {at:o.at, g:(o.g || .14)*.18, d:(o.d || 1.1)*.35}); };
  const pluck = (f, o) => { o = o || {}; tone(f, {at:o.at, type:"triangle", g:o.g || .16, d:o.d || .28}); tone(f*2, {at:o.at, g:(o.g || .16)*.25, d:(o.d || .28)*.5}); };
  const coin = (o) => { o = o || {}; const f = o.f || 1900; tone(f, {at:o.at, type:"square", g:(o.g || .05), d:.05}); tone(f*1.34, {at:(o.at || 0) + .06, type:"square", g:(o.g || .05), d:.22}); };
  const B = {tone, noise, metal, chord, bell, pluck, coin};

  /* default sounds; each app passes its own set, which wins */
  const BASE = {
    tap: b => { b.noise({f:2600, q:2, g:.05, d:.03}); b.tone(880, {d:.035, g:.03}); },
    xp: b => b.chord([784, 1175], {step:.05, type:"sine", g:.1, d:.25}),
    big: b => { b.chord([523, 659, 784, 1047], {step:.07, g:.11, d:.6}); b.noise({type:"highpass", f:7000, g:.04, d:.5, at:.25}); },
    badge: b => { b.chord([1319, 1760, 2637], {step:.06, type:"sine", g:.07, d:.35}); b.metal(1046, {at:.18, g:.05, d:.7}); },
    level: b => { b.chord([392, 523, 659, 784, 1047, 1319], {step:.065, g:.09, d:.45}); b.tone(1568, {at:.42, d:1, g:.06}); },
    done: b => b.chord([659, 988], {step:.06, type:"sine", g:.1, d:.3}),
    del: b => b.tone(240, {to:110, d:.16, g:.16, type:"triangle"}),
    undo: b => b.tone(700, {to:420, d:.12, g:.08, type:"triangle"})
  };
  const FESTIVE = new Set(["xp", "big", "badge", "level", "done"]);
  /* a little extra on rewards during an occasion */
  const ACCENT = {
    bells: b => { [0, .07, .14, .21].forEach(t => b.noise({type:"highpass", f:7200, q:1, g:.07, d:.06, at:.08 + t})); b.metal(2600, {at:.1, g:.05, d:.5}); },
    firework: b => { b.noise({type:"lowpass", f:900, g:.14, d:.18, at:.05}); for(let i = 0; i < 6; i++) b.noise({type:"highpass", f:5000 + Math.random()*3000, g:.05, d:.04, at:.22 + i*.05 + Math.random()*.03}); },
    spooky: b => b.tone(420, {to:210, d:.7, g:.06, vib:5, vibAmt:12, at:.08, a:.05}),
    harp: b => [880, 1109, 1319, 1760].forEach((f, i) => b.pluck(f, {at:.08 + i*.05, g:.07})),
    gong: b => b.metal(110, {at:.05, g:.14, d:1.4}),
    lantern: b => [587, 622, 740, 784].forEach((f, i) => b.pluck(f*2, {at:.08 + i*.07, g:.06, d:.4})),
    sparkle: b => [2093, 2637, 3136].forEach((f, i) => b.tone(f, {at:.08 + i*.05, g:.04, d:.25})),
    chirp: b => { b.tone(3000, {to:4400, d:.07, g:.05, at:.08}); b.tone(3200, {to:4600, d:.07, g:.05, at:.2}); },
    whistle: b => [1568, 1760, 1568, 1976].forEach((f, i) => b.tone(f, {at:.08 + i*.06, g:.05, d:.08})),
    warm: b => b.chord([392, 494, 587], {at:.08, type:"sine", g:.05, d:.6})
  };

  /* ───── occasions ───── */
  const D = (y, m, d) => new Date(y, m - 1, d);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const nthDow = (y, m, dow, n) => { const f = D(y, m, 1), first = 1 + (dow - f.getDay() + 7) % 7; return D(y, m, first + (n - 1)*7); };
  const lastDow = (y, m, dow) => { const l = D(y, m + 1, 0); return D(y, m, l.getDate() - (l.getDay() - dow + 7) % 7); };
  function easter(y){ const a = y % 19, b = Math.floor(y/100), c = y % 100, d = Math.floor(b/4), e = b % 4, f = Math.floor((b + 8)/25), g = Math.floor((b - f + 1)/3),
    h = (19*a + b - d - g + 15) % 30, i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l)/451),
    mo = Math.floor((h + l - 7*m + 114)/31), da = (h + l - 7*m + 114) % 31 + 1; return D(y, mo, da); }
  /* moving dates, checked against published calendars in Nov 2026. Lunar dates can shift a day by moon sighting,
     so the windows are a little wide. Add new years here once a year. */
  const T = {

function period(){

  const t = today(); let next = S.pay.next, rolled = false;

  const allow = S.allowances.map(a => { const used = sum(S.spends.filter(s=>inP(s.date,p) && s.cat === a.cat).map(s=>s.amt));
    return {a, used, left: a.amt - used, over: Math.max(0, used - a.amt)}; });
  const allowSet = sum(S.allowances.map(a=>a.amt));
  const income = sum(S.incomes.filter(x=>inP(x.date,p)).map(x=>x.amt));
  const budget = payFor(p.start) + income - billsDue - minsDue - saveSet - allowSet;
  const covered = new Set(S.allowances.map(a=>a.cat));

function readPhoto(file){ return new Promise((res, rej) => {
  const bad = () => { toast("That picture could not be opened","⚠️"); rej(new Error("photo")); };
  if(!file || (file.type && !/^image\//.test(file.type))) return bad();
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { try{ const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h); if(!s) throw 0;
      const c = document.createElement("canvas"); c.width = c.height = 192;
      c.getContext("2d").drawImage(im, (w - s)/2, (h - s)/2, s, s, 0, 0, 192, 192);
      res(c.toDataURL("image/jpeg", 0.85)); }
    catch(e){ bad(); } finally{ URL.revokeObjectURL(url); } };
  im.onerror = () => { URL.revokeObjectURL(url); bad(); };
  im.src = url; }); }
/* st = {avatar, skin, photo}; edits st in place and redraws itself inside box */
function heroPicker(box, st, onChange){
  const draw = () => {
    const isPhoto = st.avatar === "photo";
    box.innerHTML = `<div class="ava-pick">${["knight","wizard","rogue","ranger"].map(k=>`<button type="button" class="${k===st.avatar?"on":""}" data-k="${k}" aria-label="${k}">${avatar(k, st.skin)}</button>`).join("")}
      <button type="button" class="${isPhoto?"on":""}" data-photo aria-label="Your photo">${st.photo ? `<img src="${st.photo}" alt="">` : `<span class="ph">${I.cam}Photo</span>`}</button></div>
      <input type="file" accept="image/*" hidden data-file>
      ${isPhoto ? `<div class="hp-photo"><p class="note">Your photo stays on this device. It is never uploaded.</p><button type="button" class="btn ghost sm" data-rm>Remove photo</button></div>`
        : `<label class="f">Skin tone</label><div class="cats">${SKIN.map(s=>`<button type="button" class="cat ${s===st.skin?"on":""}" data-s="${s}" style="width:46px;height:40px;background:${s}"></button>`).join("")}</div>`}`;
    const changed = () => { draw(); onChange && onChange(); };
    const file = box.querySelector("[data-file]");
    box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { st.avatar = b.dataset.k; changed(); });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.skin = b.dataset.s; changed(); });
    box.querySelector("[data-photo]").onclick = () => { if(st.photo && !isPhoto){ st.avatar = "photo"; changed(); } else file.click(); };
    file.onchange = () => { const f = file.files[0]; file.value = ""; if(!f) return;
      readPhoto(f).then(url => { st.photo = url; st.avatar = "photo"; changed(); }).catch(()=>{}); };
    const rm = box.querySelector("[data-rm]"); if(rm) rm.onclick = () => { st.photo = ""; st.avatar = "knight"; changed(); };
  };
  draw(); }

let nsMonth = "";
function nsRuns(){
  const ks = Object.keys(S.noSpend).filter(k=>S.noSpend[k]).sort(); let best = 0, run = 0, prev = "";
  ks.forEach(k => { run = prev && addDays(prev,1) === k ? run + 1 : 1; if(run > best) best = run; prev = k; });
  const t = today(); let d = S.noSpend[t] ? t : addDays(t,-1), cur = 0;
  while(S.noSpend[d]){ cur++; d = addDays(d,-1); }
  return {cur, best};
}

function payoff(strategy, extra){
  const ds = S.debts.filter(d=>d.bal>0).map(d=>({id:d.id, bal:d.bal, apr:d.apr, min:d.min}));
  if(!ds.length) return {months:0, interest:0, order:[], done:{}};
  const order = [...ds].sort((a,b)=> strategy==="avalanche" ? b.apr - a.apr || a.bal - b.bal : a.bal - b.bal || b.apr - a.apr).map(d=>d.id);
  const pool0 = sum(ds.map(d=>d.min)) + (+extra||0); let m = 0, interest = 0; const done = {};
  while(ds.some(d=>d.bal>0.005) && m < 600){ m++; let pool = pool0;
    ds.forEach(d => { if(d.bal>0){ const i = d.bal*d.apr/1200; interest += i; d.bal += i; } });
    ds.forEach(d => { if(d.bal>0){ const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; } });
    for(const id of order){ const d = ds.find(x=>x.id===id); if(d.bal>0 && pool>0){ const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    ds.forEach(d => { if(d.bal<=0.005 && !done[d.id]) done[d.id] = m; });
    if(pool0 <= sum(ds.filter(d=>d.bal>0).map(d=>d.bal*d.apr/1200)) && m > 1) return {months:Infinity, interest, order, done}; }
  return {months:m, interest, order, done};
}

const fyReady = () => { if(!S.future || !S.split || typeof S.future !== "object" || typeof S.split !== "object" || !("give" in (S.settings || {}))) normalize(); };
const PAYM = {weekly:52/12, biweekly:26/12, fourweekly:13/12, monthly:1};
const monthlyPay = () => round2((+S.pay.amount || 0) * (PAYM[S.pay.freq] || 1));
function avgMonthlySpend(){ const from = iso(new Date(Date.now() - 90*864e5)); const s = sum(S.spends.filter(x => x.date >= from).map(x => x.amt)); return round2(s / 3); }
function fyBase(){ const f = S.future; return f.save !== null ? +f.save : Math.min(round2(monthlyPay() * 0.3), Math.max(0, round2(monthlyPay() - avgMonthlySpend() - sum(S.bills.map(b => +b.amt || 0))))); }
function fyStart(){ const f = S.future; return f.start !== null ? +f.start : round2(sum(S.goals.map(g => +g.saved || 0))); }
function fyCalc(){ const f = S.future, base = fyBase(), cut = avgMonthlySpend() * f.cut/100, put = Math.max(0, base + f.extra + cut);
  const rows = []; let p = fyStart(), q = fyStart();
  for(let y = 1; y <= 30; y++){ const grow = Math.pow(1 + f.rise/100, y - 1);
    p = p * (1 + f.growth/100) + put * 12 * grow; q = q * (1 + f.growth/100) + base * 12;
    rows.push({y, pot:p, now:q, inc:monthlyPay() * 12 * grow}); }
  return {base, cut, put, rows, at:rows[f.years - 1]}; }
function fyChart(rows, years){ const W = 320, H = 150, max = Math.max(1, ...rows.map(r => r.pot)), x = i => 8 + i*(W-16)/29, y = v => H - 10 - v/max*(H - 24);
  const line = k => rows.map((r,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Your pot over 30 years">
    <path d="${line("now")}" fill="none" stroke="var(--muted,#8a8aa0)" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="${line("pot")}" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="${x(years-1)}" x2="${x(years-1)}" y1="8" y2="${H-10}" stroke="var(--mint,#4ade80)" stroke-width="1.5"/>
    <circle cx="${x(years-1)}" cy="${y(rows[years-1].pot)}" r="5" fill="var(--mint,#4ade80)"/></svg>`; }
function fyNumbers(){ const c = fyCalc(), f = S.future;

  return `<section class="card hero" style="padding:18px">

/* how many paychecks a normal calendar month has; anything beyond that is a "bonus paycheck" */
const PERMONTH = {weekly:4, biweekly:2, fourweekly:1, monthly:1};
const PERYEAR = {weekly:52, biweekly:26, fourweekly:13, monthly:12};
const perYear = () => PERYEAR[S.pay.freq] || 12;
function isBonus(date){
  if(S.pay.freq === "monthly" || !PERMONTH[S.pay.freq]) return false;
  const ym = date.slice(0,7); let n = 1, d = date;
  for(let i=0;i<8;i++){ d = retreat(d); if(d.slice(0,7) !== ym) break; n++; }
  return n > PERMONTH[S.pay.freq];
}
/* what a paycheck is worth: an amount you entered, else the bonus amount on a bonus paycheck, else the usual amount */
function payFor(date){
  const o = S.payPlan && S.payPlan.over && S.payPlan.over[date];
  if(o && isFinite(o.amt) && o.amt >= 0) return o.amt;
  if(S.payPlan && S.payPlan.bonus > 0 && isBonus(date)) return S.payPlan.bonus;
  return S.pay.amount;
}
/* every paycheck from the current one to 12 months later */
function paychecks(){ const p = period(); if(!p) return []; const out = []; let d = p.start; const stop = addDays(p.start, 364);
  while(d < stop && out.length < 80){ out.push(d); d = advance(d); } return out; }
const findBill = id => S.bills.find(b=>b.id===id) || S.ybills.find(b=>b.id===id);
const billCycle = b => b.month ? "yearly" : "monthly";
function yOcc(b, p){ const out = []; const y0 = parse(p.start).getFullYear(), y1 = parse(p.end).getFullYear();
  for(let y=y0; y<=y1; y++){ const o = iso(new Date(y, b.month-1, Math.min(b.day, dim(y, b.month-1)))); if(inP(o,p)) out.push(o); } return out; }
/* the bills that belong to one paycheck. A bill you moved to an earlier paycheck counts there and nowhere else. */
function billsForPeriod(p, isCur){
  const mv = S.payPlan.moves, out = [];
  const add = (b,d) => { const k = b.id+"|"+d; if(mv[k] && mv[k] !== p.start) return; out.push({b, d, paid: !!S.billPaid[k]}); };
  S.bills.forEach(b => occurrences(b.day,p).forEach(d => add(b,d)));
  S.ybills.forEach(b => yOcc(b,p).forEach(d => add(b,d)));
  Object.keys(mv).forEach(k => { const i = k.indexOf("|"), id = k.slice(0,i), d = k.slice(i+1); const b = findBill(id); if(!b) return; const paid = !!S.billPaid[k];
    if(mv[k] === p.start){ if(!inP(d,p)) out.push({b, d, paid, early:true}); }
    else if(isCur && mv[k] < p.start && d >= p.start && !paid) out.push({b, d, paid:false, early:true, carry:true}); });
  out.sort((a,b) => a.d < b.d ? -1 : 1);
  return out;
}

  const paid = S.impulses.filter(i => i.status === "skipped" && i.doneOn === t && i.xp > 0).length;
  const before = lootStats().filled;
  x.status = "skipped"; x.doneOn = t; x.early = early; x.xp = paid < LETGO_CAP ? LETGO_XP : 0;
  S.savedByWaiting = round2(S.savedByWaiting + x.price); save(); render();
  keptSheet(x); confetti(); coins(16); QFX.play("letgo");

function undoLetGo(id){ const x = S.impulses.find(i=>i.id===id); if(!x || x.status !== "skipped") return;

const BAGS = [100,250,500,1000,2500,5000,10000,25000,50000,100000];

  const inM = all.filter(x => x.doneOn.slice(0,7) === ym), inY = all.filter(x => x.doneOn.slice(0,4) === yr);
  let filled = 0; while(filled < BAGS.length && tot >= BAGS[filled]*mul) filled++;
  const top = filled >= BAGS.length, size = BAGS[Math.min(filled, BAGS.length-1)]*mul, prev = filled && !top ? BAGS[filled-1]*mul : 0;

const RFQ = [["daily","☀️","Every day"],["weekly","📅","Every week"],["monthly","🗓️","Every month"]];
const RXP = {daily:3, weekly:8, monthly:15}, RCAP = 40, GOAL_XP = 40;
const GEMO = ["🎯","🛟","💳","🏃","🏡","✈️","🎓","💍","🚗","🌱","🕋","👶","🛍️","💼"];
function weekStart(s){ const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
const rKey = (r, d) => { d = d || today(); return r.freq === "daily" ? d : r.freq === "weekly" ? "w" + weekStart(d) : "m" + d.slice(0,7); };
const rDone = (r, d) => !!S.rlog[r.id + "|" + rKey(r, d)];
function rHist(r){ const t = today(), n = r.freq === "daily" ? 7 : r.freq === "weekly" ? 4 : 3, out = [];
  for(let i = n-1; i >= 0; i--){ const d = r.freq === "daily" ? addDays(t, -i) : r.freq === "weekly" ? addDays(t, -7*i) : addMonths(t.slice(0,7) + "-01", -i, 1); out.push(rDone(r, d)); }
  return out; }
function rTick(id){ const r = S.routine.find(x=>x.id===id); if(!r) return; const k = r.id + "|" + rKey(r), t = today();
  if(S.rlog[k]){ const back = +S.rlog[k].xp || 0; delete S.rlog[k]; save(); render(); takeXP(back); return; }
  const used = sum(Object.values(S.rlog).filter(e => e.d === t).map(e => +e.xp || 0)), xp = Math.max(0, Math.min(RXP[r.freq], RCAP - used));
  S.rlog[k] = {d:t, xp}; save(); render(); if(xp) gain(xp, r.name); else toast("Ticked. Routine XP is maxed for today.","🧭");
  if(Object.keys(S.rlog).length >= 20) award("routine20");
  const due = S.routine; if(due.length > 1 && due.every(x => rDone(x))) setTimeout(() => { coins(20); toast("Whole money routine done. Nice work!","🧭"); }, 700); }
function goalDone(id){ const g = S.mgoals.find(x=>x.id===id); if(!g) return; const t = today();
  if(g.done){ const back = g.xp; g.done = ""; g.xp = 0; save(); render(); takeXP(back); return; }
  const paid = S.mgoals.filter(x => x.done === t && x.xp > 0).length; g.done = t; g.xp = paid < 3 ? GOAL_XP : 0; save(); render();
  confetti(90); QFX.play("big"); if(g.xp) gain(g.xp, `Goal reached: ${g.name}`); else toast("Goal reached!","🏁"); }
function routineDueNow(){ return S.routine.filter(r => !rDone(r)); }

let ppOff = 0;

  for(let i = 0; i < Math.abs(off); i++) s = off < 0 ? retreat(s) : advance(s);
  return {start:s, end:advance(s)}; }
function ppLabel(off){ return off === 0 ? "This paycheck" : off === -1 ? "Last paycheck" : off === 1 ? "Next paycheck" : off < 0 ? `${-off} paychecks ago` : `In ${off} paychecks`; }

  return `${fmtDate(p.start, sameY ? {day:"numeric", month:"short"} : {day:"numeric", month:"short", year:"numeric"})} – ${fmtDate(last, {day:"numeric", month:"short", year:"numeric"})}`; }

function notesView(){ const open = S.notes.filter(n => !n.done), done = S.notes.filter(n => n.done);

/* ── savings challenges: 52 or 26 tiles, tap one when you have put that money aside ── */
const CH_TILE_XP = 10, CH_TILES_DAY = 3, CH_WIN_XP = 100;
function chAmts(c){ const n = c.weeks, tri = n*(n+1)/2, out = [];
  for(let i = 1; i <= n; i++) out.push(round2(c.style === "even" ? c.target/n : c.target*i/tri));
  out[n-1] = round2(c.target - sum(out.slice(0, n-1))); return out; }
function chStats(c){ const a = chAmts(c), ks = Object.keys(c.done).map(Number), saved = round2(sum(ks.map(k => a[k-1])));
  let next = 0; for(let i = 1; i <= c.weeks; i++) if(!c.done[i]){ next = i; break; }
  return {a, n:ks.length, saved, frac: c.target > 0 ? saved/c.target : 0, next}; }
function chCard(c){ const s = chStats(c);
  return `<section class="card ch ${c.won ? "won" : ""}"><div class="row" style="align-items:center">${bagArt(s.frac, 84)}
    <div class="grow"><div class="lbl">${c.weeks}-week challenge</div><b style="font-size:18px">${esc(c.name)}</b>
      <div class="gold" style="font-size:24px;font-weight:800">${cash(s.saved)} <span class="muted" style="font-size:14px;font-weight:600">of ${cash(c.target)}</span></div>
      <small class="muted">${s.n} of ${c.weeks} tiles${c.won ? ` · 🏆 Complete ${fmtDate(c.won)}` : ""}</small></div>
    <button class="x" data-act="chEdit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">✎</button></div>
    ${s.next ? `<button class="btn full mint" style="margin-top:12px" data-act="chTile" data-id="${c.id}" data-v="${s.next}">Next up: tile ${s.next} · put in ${money(s.a[s.next-1])}</button>` : ""}
    <div class="ch-grid" role="list">${s.a.map((amt, i) => { const k = i+1, d = c.done[k];
      return `<button class="ch-t ${d ? "on" : ""}" role="listitem" data-act="chTile" data-id="${c.id}" data-v="${k}" aria-pressed="${!!d}" aria-label="Tile ${k}, ${money(amt)}${d ? ", done" : ""}"><small>${k}</small>${cash(amt)}</button>`; }).join("")}</div></section>`; }
function chalView(){ return `<section class="card hero" style="padding:16px 18px"><div class="row"><div class="grow"><div class="lbl">Savings challenges</div><b style="font-size:20px">52-week and 26-week quests</b>
    <small class="muted" style="display:block;font-size:13px;margin-top:2px">Pick a total. Each paycheck, put a tile's amount aside and tap it. The tile greys out and the money drops into your challenge bag.</small></div></div>
    <button class="btn full" style="margin-top:12px" data-act="chAdd">${I.plus} Start a challenge</button></section>
  ${S.chals.length ? S.chals.map(chCard).join("") : `<div class="card empty"><div class="e">🪙</div>The classic 52-week challenge starts small and grows a little each time. Or split your total into even amounts.</div>`}
  <p class="note" style="margin:8px 6px 0">+${CH_TILE_XP} XP a tile (up to ${CH_TILES_DAY} tiles a day) and +${CH_WIN_XP} XP when you finish. Undo a tile and its XP goes back. This tracks the money you put aside, it doesn't move any money.</p>`; }
function chForm(c){ const e = !!c; let weeks = e ? c.weeks : 52, style = e ? c.style : "grow";
  sheet(`<h3>${e ? "Edit challenge" : "New savings challenge"}</h3>
    <label class="f" for="cn">Name</label><input class="in" id="cn" maxlength="40" value="${e ? esc(c.name) : ""}" placeholder="Christmas fund">
    <label class="f" for="ct">How much do you want to save?</label><input class="in huge" id="ct" inputmode="decimal" value="${e ? c.target : ""}" placeholder="${money(1378, 0)}">
    <label class="f">Length</label><div class="seg" id="cw">${[52,26].map(w => `<button class="${weeks===w?"on":""}" data-w="${w}">${w} tiles</button>`).join("")}</div>
    <label class="f">Amounts</label><div class="seg" id="cs"><button class="${style==="grow"?"on":""}" data-s="grow">Grows each time</button><button class="${style==="even"?"on":""}" data-s="even">Same each time</button></div>
    <p class="note" id="cp" style="margin:10px 2px 0"></p>
    ${e && Object.keys(c.done).length ? `<p class="note" style="margin:6px 2px 0">You've ticked tiles already, so the length and amounts stay as they are.</p>` : ""}
    <div class="actions">${e ? `<button class="btn ghost red-t" id="del">Delete</button>` : `<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="ok">${e ? "Save" : "Start the quest"}</button></div>`, root => {
      const locked = e && Object.keys(c.done).length > 0;
      const prev = () => { const t = num(val(root, "#ct")); const a = t > 0 ? chAmts({weeks, style, target:t}) : null;
        root.querySelector("#cp").textContent = a ? (style === "even" ? `${weeks} tiles of about ${money(a[0])}.` : `Starts at ${money(a[0])} and ends at ${money(a[weeks-1])}.`) : "Type a total to see the tile amounts."; };
      if(locked){ root.querySelectorAll("#cw button, #cs button").forEach(b => b.disabled = true); root.querySelector("#ct").disabled = true; }
      root.querySelectorAll("#cw button").forEach(b => b.onclick = () => { weeks = +b.dataset.w; root.querySelectorAll("#cw button").forEach(x => x.classList.toggle("on", x === b)); prev(); });
      root.querySelectorAll("#cs button").forEach(b => b.onclick = () => { style = b.dataset.s; root.querySelectorAll("#cs button").forEach(x => x.classList.toggle("on", x === b)); prev(); });
      root.querySelector("#ct").oninput = prev; prev();
      root.querySelector("#ok").onclick = () => { const name = val(root, "#cn").trim().slice(0, 40) || `${weeks}-week challenge`, t = num(val(root, "#ct"));
        if(!locked && !(t >= weeks*0.01)) return toast("Type the total you want to save","🪙");
        if(e){ c.name = name; if(!locked){ c.target = t; c.weeks = weeks; c.style = style; } } else S.chals.push({id:uid(), name, weeks, style, target:t, start:today(), done:{}, won:"", wonXp:0});
        save(); closeSheet(); render(); if(!e){ QFX.play("big"); toast("Challenge started","🪙"); } };
      const d = root.querySelector("#del"); if(d) d.onclick = () => { if(!confirm(`Delete ${c.name}? Its XP goes back.`)) return;
        const back = sum(Object.values(c.done).map(x => x.xp)) + (c.wonXp || 0); S.chals = S.chals.filter(x => x.id !== c.id); save(); closeSheet(); render(); takeXP(back); QFX.play("del"); }; }); }
function chTileForm(c, k){ const a = chAmts(c)[k-1], d = c.done[k];
  sheet(d ? `<h3>Tile ${k}</h3><p class="sub">You ticked this on ${fmtDate(d.d)}. Take ${money(a)} back out of the challenge bag?</p>
      <div class="actions"><button class="btn ghost" data-close>Keep it</button><button class="btn red" id="ok">Undo tile</button></div>`
    : `<h3>Tile ${k} · ${money(a)}</h3><p class="sub">Put ${money(a)} aside in your savings, then tick it off here.</p>
      <div class="actions"><button class="btn ghost" data-close>Not yet</button><button class="btn mint" id="ok">I put it aside ✓</button></div>`, root => {
    root.querySelector("#ok").onclick = () => { closeSheet(); chToggle(c, k); }; }); }
function chToggle(c, k){ const t = today();
  if(c.done[k]){ const back = (c.done[k].xp || 0) + (c.won ? c.wonXp || 0 : 0); delete c.done[k]; if(c.won){ c.won = ""; c.wonXp = 0; } save(); render(); takeXP(back); QFX.play("undo"); return; }
  const paidToday = sum(S.chals.map(x => Object.values(x.done).filter(v => v.d === t && v.xp > 0).length));
  c.done[k] = {d:t, xp: paidToday < CH_TILES_DAY ? CH_TILE_XP : 0}; QFX.play("xp"); coins(10);
  const s = chStats(c);
  if(s.n >= c.weeks && !c.won){ c.won = t; c.wonXp = CH_WIN_XP; save(); render(); confetti(160); QFX.play("big");
    setTimeout(() => sheet(`<div class="levelup"><div style="font-size:60px">🏆</div><h3>${esc(c.name)} complete!</h3><p class="sub">You saved ${money(c.target)}, one tile at a time.</p>
      <div class="actions"><button class="btn full" data-close>Amazing</button></div></div>`), 500);
    gain(c.done[k].xp + CH_WIN_XP, "Savings challenge complete"); return; }
  save(); render(); if(c.done[k].xp) gain(c.done[k].xp, `Tile ${k} saved`); else toast(`Tile ${k} saved`, "🪙"); }

function ppActs(act, id, a){ const v = a.dataset.v;
  if(act === "ppNav"){ ppOff = v === "0" ? 0 : Math.max(-26, Math.min(26, ppOff + +v)); render(); }
  else if(act === "ppIncome"){ closeSheet(); incomeForm(v); }
  else if(act === "noteAdd") noteForm(); else if(act === "noteEdit") noteForm(S.notes.find(n => n.id === id));
  else if(act === "noteTick"){ const n = S.notes.find(x => x.id === id); if(!n) return true; n.done = !n.done; save(); render(); QFX.play(n.done ? "done" : "undo"); }
  else if(act === "noteClear"){ S.notes = S.notes.filter(n => !n.done); save(); render(); }
  else if(act === "chAdd") chForm(); else if(act === "chEdit") chForm(S.chals.find(c => c.id === id));
  else if(act === "chTile"){ const c = S.chals.find(x => x.id === id); if(c) chTileForm(c, +v); }
  else return false;
  return true; }

  S.subs.push({id:"u9", name:"Meal box", amt:24, cycle:"monthly", next:D(11), day:parse(D(11)).getDate(), cat:"other", status:"cancelled", cancelledOn:D(-5), created:D(-90), reviewed:"", sample:true});

  const p = period();
  if(p){ S.bills.forEach(b => occurrences(b.day,p).forEach(d => { if(b.name === "Phone" || b.name === "Streaming") S.billPaid[b.id+"|"+d] = d; }));
    const q = {start:p.end, end:advance(p.end)}; const ins = S.bills.find(b=>b.name==="Car insurance");
    occurrences(ins.day,q).forEach(d => { S.payPlan.moves[ins.id+"|"+d] = p.start; }); }
  S.lastPeriodStart = ""; save();
}

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ tab = tb.dataset.tab; closeSheet(); render(); scrollTo({top:0,behavior:"smooth"}); return; }

  else if(act === "delIncome"){ S.incomes = S.incomes.filter(x=>x.id!==id);

  else if(act === "checkin"){ if(S.checkins[t]) return; S.checkins[t] = true; const y = addDays(t,-1);
    S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best, S.streak.n); save(); render();
    gain(10 + Math.min(20, S.streak.n), `Day ${S.streak.n} check-in`); if(S.streak.n >= 3) award("checkin3"); if(S.streak.n >= 7) award("streak7"); if(S.streak.n >= 30) award("streak30"); }
  else if(act === "nospend"){ if(S.noSpend[t] || S.spends.some(s=>s.date===t)) return; S.noSpend[t] = true; save(); render(); gain(25, "No-spend day");
    award("nospend"); if(Object.keys(S.noSpend).length >= 5) award("nospend5"); }

  else if(act === "strike") strikeForm(S.debts.find(d=>d.id===id));
  else if(act === "bossView"){ bossView = a.dataset.v === "castle" ? "castle" : "list"; render(); }
  else if(act === "strat"){ S.settings.strategy = a.dataset.v; save(); render(); }
  else if(act === "addGoal") goalForm(); else if(act === "editGoal") goalForm(S.goals.find(g=>g.id===id));
  else if(act === "deposit") depositForm(S.goals.find(g=>g.id===id));
  else if(act === "addImpulse") impulseForm();
  else if(act === "letgo") letGo(id);
  else if(act === "buyit"){ const x = S.impulses.find(i=>i.id===id); if(!x || x.status !== "waiting") return; x.status = "bought"; x.doneOn = t;
    S.spends.push({id:uid(), amt:x.price, cat:"shopping", note:x.name, date:t, t:Date.now()}); if(S.noSpend[t]) delete S.noSpend[t]; save(); render(); toast("Bought after a cool-off. That is a planned purchase.","🛍️"); }
  else if(act === "nsPrev"){ nsMonth = addMonths((nsMonth || t.slice(0,7)) + "-01", -1, 1).slice(0,7); render(); }
  else if(act === "nsNext"){ const m = addMonths((nsMonth || t.slice(0,7)) + "-01", 1, 1).slice(0,7); nsMonth = m >= t.slice(0,7) ? "" : m; render(); }
  else if(act === "badges") badgesView(); else if(act === "settings") settings();
});
document.addEventListener("change", e => { if(e.target.id === "extra"){ S.settings.extra = num(e.target.value); save(); render(); } });
setInterval(() => { document.querySelectorAll(".timer[data-rel]").forEach(el => { const left = +el.dataset.rel - Date.now();
  if(left <= 0){ render(); return; } el.textContent = fmtLeft(left); }); }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && S.hero) render(); });

load(); render(); if(RESCUED !== null) rescueBanner();
