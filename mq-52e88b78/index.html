:root{
  --bg1:#140d33;--bg2:#24145c;--ink:#f5f1ff;--mut:#b4a9d9;--dim:#7d72a8;
  --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --gold:#ffc94a;--gold2:#ff9f43;--mint:#4be3a5;--coral:#ff6b7a;--violet:#9b7bff;--sky:#5ec8ff;
  --r:22px;--nav:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#3b1f8f 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#0f4a6b 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 44%,#ffe9a8 50%,transparent 51%),
  radial-gradient(1px 1px at 34% 62%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 86%,#cfc2ff 50%,transparent 51%),
  radial-gradient(1px 1px at 6% 78%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 46% 30%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 94% 90%,#fff 50%,transparent 51%);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:620px;margin:0 auto;padding:18px 16px calc(var(--nav) + 40px);position:relative}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ava{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffd76a,#ff8f4a);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(255,160,60,.35),inset 0 -3px 0 rgba(0,0,0,.15);flex:none;overflow:hidden}
.ava svg{width:48px;height:48px}
.ava-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava.photo{background:none;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(255,160,60,.35)}
.who{flex:1;min-width:0}
.who b{font-size:19px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:13px;font-weight:500}
.xpbar{height:9px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--sky));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.lvl{font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--gold);color:#3a2300;padding:3px 8px;border-radius:8px;margin-right:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.h h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.h button,.link{color:var(--gold);font-weight:600;font-size:14px}
.muted{color:var(--mut)}.dim{color:var(--dim)}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gold{background:linear-gradient(180deg,#fff1b8,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{color:var(--coral)}.pos{color:var(--mint)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,#ffd76a,#ffb238);color:#3a2300;box-shadow:0 6px 0 #b9741a,0 10px 24px rgba(255,170,60,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b9741a}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#7ff0c3,#2fcf8d);color:#073a26;box-shadow:0 6px 0 #1d8f5f}
.btn.red{background:linear-gradient(180deg,#ff8f9a,#f0566a);color:#3a0710;box-shadow:0 6px 0 #a3283a}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
/* hero stat */

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.item b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc94a 45%,#d98a1c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 8px 18px rgba(255,180,60,.3)}
.badge.lock .medal{background:radial-gradient(circle at 35% 30%,#5a4d8a,#3a2f66);filter:grayscale(1);box-shadow:none;opacity:.6}

/* bars */

  box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .35s cubic-bezier(.2,.9,.3,1.4),tout .4s 2.4s forwards;display:flex;gap:8px;align-items:center}

.coin{position:fixed;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc94a 50%,#d98a1c);z-index:65;pointer-events:none}

.ava-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.ava-pick button.on{border-color:var(--gold);background:rgba(255,201,74,.15)}
.ava-pick svg{width:80%;height:80%}
.ava-pick .ph{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut)}

.hp-photo{display:flex;align-items:center;gap:12px;margin-top:10px}
.hp-photo .note{margin-top:0;flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--card2)}.dots i.on{background:var(--gold);width:22px;border-radius:5px}
.title-art{font-size:44px;font-weight:900;line-height:.9;letter-spacing:-.02em;text-align:center;margin:8px 0 12px}
.title-art span{display:block;color:var(--gold)}
.note{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.45}
.splash{position:fixed;inset:0 0 45% 0;pointer-events:none}
.splash .float{position:absolute;animation:bob 4s ease-in-out infinite}
.splash .float svg{width:100%;height:100%}
.splash .f1{width:150px;height:150px;left:50%;top:14%;margin-left:-75px}
.splash .f2{width:84px;height:84px;left:8%;top:6%;animation-delay:-1.3s;opacity:.85}
.splash .f3{width:96px;height:96px;right:6%;top:30%;animation-delay:-2.6s;opacity:.85}
.sp-coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc94a 50%,#d98a1c);
  box-shadow:0 0 18px rgba(255,201,74,.6);animation:bob 3s ease-in-out infinite}
.sp-coin.c1{left:22%;top:38%}.sp-coin.c2{right:24%;top:10%;animation-delay:-1s;width:16px;height:16px}
.sp-coin.c3{left:12%;top:52%;animation-delay:-2s;width:14px;height:14px}.sp-coin.c4{right:14%;top:60%;animation-delay:-.5s}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
@media(max-width:380px){.big{font-size:44px}.ring{width:100px;height:100px}.stats{gap:6px}.stat{padding:9px}}

<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
"use strict";
/* ───────────────────────── storage ───────────────────────── */
const KEY = "moneyquest.v1";
const blank = () => ({v:1, hero:null, cur:"USD", pay:{freq:"monthly", amount:0, next:"", anchor:1},
  bills:[], billPaid:{}, spends:[], debts:[], debtLog:[], goals:[], goalLog:[], impulses:[],
  xp:0, streak:{last:"", n:0, best:0}, badges:{}, checkins:{}, noSpend:{}, savedByWaiting:0,
  settings:{strategy:"snowball", extra:0}, lastPeriodStart:""});
let S;
function load(){ try{ S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); }catch(e){ S = blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device","⚠️"); } }
const uid = () => Math.random().toString(36).slice(2,10);

/* ───────────────────────── dates ───────────────────────── */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dim = (y,m) => new Date(y, m+1, 0).getDate();
function addMonths(s, n, anchor){ const d = parse(s); const y = d.getFullYear(), m = d.getMonth()+n;
  const t = new Date(y, m, 1); const day = Math.min(anchor || d.getDate(), dim(t.getFullYear(), t.getMonth()));
  return iso(new Date(t.getFullYear(), t.getMonth(), day)); }
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmtDate = (s, o={day:"numeric", month:"short"}) => parse(s).toLocaleDateString(undefined, o);
const STEP = {weekly:7, biweekly:14, fourweekly:28};
const advance = s => S.pay.freq==="monthly" ? addMonths(s,1,S.pay.anchor) : addDays(s, STEP[S.pay.freq]);
const retreat = s => S.pay.freq==="monthly" ? addMonths(s,-1,S.pay.anchor) : addDays(s, -STEP[S.pay.freq]);

/* ───────────────────────── money ───────────────────────── */
const CURS = [["USD","US dollar"],["GBP","British pound"],["EUR","Euro"],["CAD","Canadian dollar"],["AUD","Australian dollar"],
  ["NZD","New Zealand dollar"],["INR","Indian rupee"],["PKR","Pakistani rupee"],["AED","UAE dirham"],["SAR","Saudi riyal"],
  ["ZAR","South African rand"],["SGD","Singapore dollar"],["MYR","Malaysian ringgit"],["NGN","Nigerian naira"],["PHP","Philippine peso"]];
function money(n, dp){ n = +n || 0; const whole = dp===0 || (dp===undefined && Math.abs(n) >= 1000);
  try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur,maximumFractionDigits:whole?0:2,minimumFractionDigits:whole?0:2}).format(n); }
  catch(e){ return (n<0?"-":"") + Math.abs(n).toFixed(whole?0:2); } }
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = a => a.reduce((t,x)=>t+(+x||0),0);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ───────────────────────── pay period engine ───────────────────────── */
function period(){
  if(!S.pay.next) return null;
  const t = today(); let next = S.pay.next, rolled = false;
  while(next <= t){ next = advance(next); rolled = true; }
  if(rolled){ const oldStart = S.lastPeriodStart; S.pay.next = next; const start = retreat(next);
    if(oldStart && oldStart !== start) onRollover(oldStart);
    S.lastPeriodStart = start; save(); }
  const start = retreat(next);
  if(!S.lastPeriodStart){ S.lastPeriodStart = start; save(); }
  return {start, end:next};
}
const inP = (d,p) => d >= p.start && d < p.end;
function occurrences(day, p){ // every date with this day-of-month inside [start,end)
  const out = []; let d = parse(p.start); d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = parse(p.end);
  while(d < end){ const o = iso(new Date(d.getFullYear(), d.getMonth(), Math.min(day, dim(d.getFullYear(), d.getMonth()))));
    if(inP(o,p)) out.push(o); d = new Date(d.getFullYear(), d.getMonth()+1, 1); }
  return out;
}
function plan(p){
  p = p || period(); if(!p) return null;
  const bills = []; S.bills.forEach(b => occurrences(b.day,p).forEach(d => bills.push({b, d, paid: !!S.billPaid[b.id+"|"+d]})));
  bills.sort((a,b) => a.d < b.d ? -1 : 1);
  const mins = []; S.debts.filter(d => d.bal > 0).forEach(d => occurrences(d.day||1,p).forEach(o => mins.push({d, o, amt: Math.min(d.min, d.bal)})));
  const live = S.goals.filter(g => g.saved < g.target);
  const billsDue = sum(bills.map(x=>x.b.amt)), minsDue = sum(mins.map(x=>x.amt)), saveSet = sum(live.map(g=>g.perPay||0));
  const budget = S.pay.amount - billsDue - minsDue - saveSet;
  const spent = sum(S.spends.filter(s=>inP(s.date,p)).map(s=>s.amt));
  const debtPaid = sum(S.debtLog.filter(l=>inP(l.date,p)).map(l=>l.amt));
  const deposits = sum(S.goalLog.filter(l=>inP(l.date,p)).map(l=>l.amt));
  const extra = Math.max(0, debtPaid - minsDue) + Math.max(0, deposits - saveSet);
  const left = budget - spent - extra;
  const daysLeft = Math.max(1, daysBetween(today(), p.end));
  const length = Math.max(1, daysBetween(p.start, p.end));
  return {p, bills, mins, billsDue, minsDue, saveSet, budget, spent, extra, left, daysLeft, length, perDay: left/daysLeft};
}
function onRollover(start){ // the period that just ended
  const end = advance(start); const pl = plan({start, end});
  if(pl && S.hero && pl.left >= 0 && pl.budget > 0){ setTimeout(()=>{ gain(100, "Payday reached in the green"); award("survivor"); }, 600); }
}

/* ───────────────────────── XP, levels, badges ───────────────────────── */
const TITLES = ["Coin Squire","Penny Scout","Budget Apprentice","Ledger Ranger","Thrift Knight","Vault Warden","Gold Sentinel","Debt Hunter","Treasury Mage","Money Paladin","Fortune Lord","Legend of the Ledger"];
const lvlOf = xp => Math.floor((Math.sqrt(1 + 8*xp/120) - 1)/2) + 1;
const xpAt = l => 120*(l-1)*l/2;
const titleOf = l => TITLES[Math.min(TITLES.length-1, Math.floor((l-1)/2))];
const BADGES = [
  ["first_step","👣","First Step","Log your first spend"],
  ["checkin3","🔥","Kindling","3-day check-in streak"],
  ["streak7","⚡","On Fire","7-day check-in streak"],
  ["streak30","🌋","Unstoppable","30-day check-in streak"],
  ["bill5","📜","Quest Clearer","Clear 5 bills"],
  ["first_blood","🗡️","First Strike","Hit a debt boss"],
  ["boss_down","🏆","Boss Slayer","Defeat a debt boss"],
  ["loot","💎","Loot Goblin","First savings deposit"],
  ["goal","👑","Treasure Claimed","Complete a savings goal"],
  ["jail1","🔒","Jailer","Let one impulse buy go"],
  ["jail10","🛡️","Iron Will","Let 10 impulse buys go"],
  ["nospend","🌙","Quiet Day","Your first no-spend day"],
  ["nospend5","🌌","Silent Week","Five no-spend days"],
  ["survivor","🌅","Payday Survivor","Reach payday in the green"],
  ["lvl5","⭐","Rising Star","Reach level 5"],
  ["lvl10","🌟","Living Legend","Reach level 10"]];
function gain(n, why){
  const before = lvlOf(S.xp); S.xp += n; const after = lvlOf(S.xp); save();
  toast(`<em>+${n} XP</em> ${esc(why)}`, "✨"); coins(Math.min(14, 4 + Math.round(n/10)));
  if(after > before){ if(after >= 5) award("lvl5"); if(after >= 10) award("lvl10"); setTimeout(()=>levelUp(after), 700); }
  renderTop();
}
function award(id){ if(S.badges[id]) return; S.badges[id] = today(); save();
  const b = BADGES.find(x=>x[0]===id); if(b) setTimeout(()=>toast(`Badge unlocked: <em>${b[2]}</em>`, b[1]), 900); }

/* ───────────────────────── icons + art ───────────────────────── */
const I = {
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 spend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/></svg>',
 quests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h10a3 3 0 013 3v13a2 2 0 01-2 2H7a3 3 0 01-3-3V5"/><path d="M4 5a2 2 0 104 0v13"/><path d="M11 9h5M11 13h5"/></svg>',
 boss:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>',
 vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7-5 7 5v10a2 2 0 01-2 2H7a2 2 0 01-2-2z"/><circle cx="12" cy="14" r="3"/><path d="M12 11v-1"/></svg>',

const MON = ["#ff5c70","#9b7bff","#ff9f43","#36c3a0","#5ec8ff","#f06bd6"];
function monster(i, hp){ const c = MON[i % MON.length]; const k = i % 3; const sad = hp <= 0;
  const horns = k===0 ? `<path d="M26 34l-8-20 18 12M74 34l8-20-18 12" fill="#ffe9a8"/>`

       <path d="M30 41l14 5M70 41l-14 5" stroke="#2b1a4a" stroke-width="3.5" stroke-linecap="round"/>`;
  const mouth = sad ? `<path d="M40 76q10-8 20 0" stroke="#2b1a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    : `<path d="M34 70q16 14 32 0z" fill="#2b1a4a"/><path d="M40 70l3 5 3-5M54 70l3 5 3-5" fill="#fff"/>`;
  return `<svg class="m" viewBox="0 0 100 100"><path d="M18 60q-2-34 32-36t32 36q2 26-32 28T18 60z" fill="${c}"/>
    <path d="M24 66q6 18 26 18t26-18" fill="rgba(0,0,0,.12)"/>${horns}${eyes}${mouth}
    <circle cx="20" cy="62" r="6" fill="${c}"/><circle cx="80" cy="62" r="6" fill="${c}"/></svg>`; }
function ring(frac, color, size=118, stroke=12){ const r = (size - stroke)/2, c = 2*Math.PI*r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>`; }

function toast(html, icon="✨"){ const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${icon}</span><span>${html}</span>`;
  document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(), 2900); }
function coins(n, x, y){ x = x ?? innerWidth/2; y = y ?? innerHeight*0.35;
  for(let i=0;i<n;i++){ const c = document.createElement("div"); c.className = "coin"; c.style.left = x+"px"; c.style.top = y+"px"; document.body.appendChild(c);
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*90;
    c.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d - 40}px) scale(.6)`,opacity:1,offset:.6},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 120}px) scale(.3)`,opacity:0}],{duration:900+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => c.remove(); } }
function damage(n, el){ const r = el.getBoundingClientRect(); const d = document.createElement("div"); d.className = "dmg"; d.textContent = "-" + money(n, 0);
  d.style.left = (r.left + r.width/2 - 30) + "px"; d.style.top = (r.top + 10) + "px"; document.body.appendChild(d); setTimeout(()=>d.remove(), 1100);
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function sheet(html, onMount){ const old = document.getElementById("sheet"); closeSheet(); const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  if(old) bg.style.animation = "none";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${old ? 'style="animation:none"' : ""}>${html}</div>`;
  bg.addEventListener("click", e => { if(e.target === bg) closeSheet(); }); document.body.appendChild(bg);
  const f = bg.querySelector("input:not([type=hidden])"); if(f && innerWidth > 700) setTimeout(()=>f.focus(), 250);
  onMount && onMount(bg); return bg; }
function closeSheet(){ const s = document.getElementById("sheet"); if(s) s.remove(); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
const val = (root, sel) => root.querySelector(sel).value.trim();

/* ───────────────────────── hero picker (photo stays on the device) ───────────────────────── */
function readPhoto(file){ return new Promise((res, rej) => {
  const bad = () => { toast("That picture could not be opened","⚠️"); rej(new Error("photo")); };
  if(!file || (file.type && !/^image\//.test(file.type))) return bad();
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { try{ const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h); if(!s) throw 0;
      const c = document.createElement("canvas"); c.width = c.height = 192;
      c.getContext("2d").drawImage(im, (w - s)/2, (h - s)/2, s, s, 0, 0, 192, 192);
      res(c.toDataURL("image/jpeg", 0.85)); }
    catch(e){ bad(); } finally{ URL.revokeObjectURL(url); } };
  im.onerror = () => { URL.revokeObjectURL(url); bad(); };
  im.src = url; }); }
/* st = {avatar, skin, photo}; edits st in place and redraws itself inside box */
function heroPicker(box, st, onChange){
  const draw = () => {
    const isPhoto = st.avatar === "photo";
    box.innerHTML = `<div class="ava-pick">${["knight","wizard","rogue","ranger"].map(k=>`<button type="button" class="${k===st.avatar?"on":""}" data-k="${k}" aria-label="${k}">${avatar(k, st.skin)}</button>`).join("")}
      <button type="button" class="${isPhoto?"on":""}" data-photo aria-label="Your photo">${st.photo ? `<img src="${st.photo}" alt="">` : `<span class="ph">${I.cam}Photo</span>`}</button></div>
      <input type="file" accept="image/*" hidden data-file>
      ${isPhoto ? `<div class="hp-photo"><p class="note">Your photo stays on this device. It is never uploaded.</p><button type="button" class="btn ghost sm" data-rm>Remove photo</button></div>`
        : `<label class="f">Skin tone</label><div class="cats">${SKIN.map(s=>`<button type="button" class="cat ${s===st.skin?"on":""}" data-s="${s}" style="width:46px;height:40px;background:${s}"></button>`).join("")}</div>`}`;
    const changed = () => { draw(); onChange && onChange(); };
    const file = box.querySelector("[data-file]");
    box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { st.avatar = b.dataset.k; changed(); });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.skin = b.dataset.s; changed(); });
    box.querySelector("[data-photo]").onclick = () => { if(st.photo && !isPhoto){ st.avatar = "photo"; changed(); } else file.click(); };
    file.onchange = () => { const f = file.files[0]; file.value = ""; if(!f) return;
      readPhoto(f).then(url => { st.photo = url; st.avatar = "photo"; changed(); }).catch(()=>{}); };
    const rm = box.querySelector("[data-rm]"); if(rm) rm.onclick = () => { st.photo = ""; st.avatar = "knight"; changed(); };
  };
  draw(); }

function payoff(strategy, extra){
  const ds = S.debts.filter(d=>d.bal>0).map(d=>({id:d.id, bal:d.bal, apr:d.apr, min:d.min}));
  if(!ds.length) return {months:0, interest:0, order:[], done:{}};
  const order = [...ds].sort((a,b)=> strategy==="avalanche" ? b.apr - a.apr || a.bal - b.bal : a.bal - b.bal || b.apr - a.apr).map(d=>d.id);
  const pool0 = sum(ds.map(d=>d.min)) + (+extra||0); let m = 0, interest = 0; const done = {};
  while(ds.some(d=>d.bal>0.005) && m < 600){ m++; let pool = pool0;
    ds.forEach(d => { if(d.bal>0){ const i = d.bal*d.apr/1200; interest += i; d.bal += i; } });
    ds.forEach(d => { if(d.bal>0){ const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; } });
    for(const id of order){ const d = ds.find(x=>x.id===id); if(d.bal>0 && pool>0){ const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    ds.forEach(d => { if(d.bal<=0.005 && !done[d.id]) done[d.id] = m; });
    if(pool0 <= sum(ds.filter(d=>d.bal>0).map(d=>d.bal*d.apr/1200)) && m > 1) return {months:Infinity, interest, order, done}; }
  return {months:m, interest, order, done};
}
const monthsOut = m => { const d = new Date(); d.setMonth(d.getMonth()+m); return d.toLocaleDateString(undefined,{month:"short",year:"numeric"}); };

function jailCell(x){ const rel = x.added + x.hours*36e5, left = rel - Date.now(), free = left <= 0;

    <small class="muted">${money(x.price)} · ${free ? "Cooling-off done. Still want it?" : "released in"}</small>
    ${free ? "" : `<div class="timer" data-rel="${rel}">${h}h ${pad(m)}m</div>`}</div>
    ${free ? `<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm mint" data-act="letgo" data-id="${x.id}">Let go</button>
       <button class="btn sm ghost" data-act="buyit" data-id="${x.id}">Buy</button></div>`
     : `<button class="x" data-act="letgo" data-id="${x.id}" title="Let it go now">✓</button>`}</div>`; }

      root.querySelector("#ok").onclick = () => { const nx = val(root,"#nx"); if(!nx) return toast("Pick your next payday","📅");
        S.hero.name = val(root,"#hn") || S.hero.name; S.cur = val(root,"#cur");
        S.hero.avatar = hs.avatar; S.hero.skin = hs.skin; if(hs.photo) S.hero.photo = hs.photo; else delete S.hero.photo;
        S.pay = {freq:val(root,"#fq"), amount:num(val(root,"#am")), next:nx, anchor:parse(nx).getDate()}; S.lastPeriodStart = "";
        save(); closeSheet(); render(); toast("Saved","✅"); };
      root.querySelector("#ex").onclick = exportData;
      root.querySelector("#im").onclick = () => document.getElementById("importFile").click();
      root.querySelector("#demo").onclick = () => { if(confirm("Replace everything with sample data?")){ demo(); closeSheet(); render(); } };
      root.querySelector("#reset").onclick = () => { if(confirm("Erase everything and start a new quest? Export a backup first if you want to keep it.")){ localStorage.removeItem(KEY); load(); closeSheet(); render(); } };
    });
}
function exportData(){ const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `money-quest-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved","💾"); }
document.getElementById("importFile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d || d.v !== 1 || !("xp" in d)) throw 0; S = Object.assign(blank(), d); save(); closeSheet(); render(); toast("Backup restored","✅"); }
    catch(err){ toast("That file is not a Money Quest backup","⚠️"); } }; r.readAsText(f); e.target.value = ""; };

/* ───────────────────────── onboarding ───────────────────────── */
const OB = {name:"", avatar:"knight", skin:SKIN[0], photo:"", cur:"", freq:"monthly", amount:"", next:""};
function guessCur(){ try{ const r = (Intl.DateTimeFormat().resolvedOptions().locale || "en-US").split("-")[1] || "US";
  return {US:"USD",GB:"GBP",CA:"CAD",AU:"AUD",NZ:"NZD",IN:"INR",PK:"PKR",AE:"AED",SA:"SAR",ZA:"ZAR",SG:"SGD",MY:"MYR",NG:"NGN",PH:"PHP",IE:"EUR",DE:"EUR",FR:"EUR",ES:"EUR",IT:"EUR",NL:"EUR"}[r] || "USD"; }catch(e){ return "USD"; } }
function onboarding(step){
  const dots = `<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>`;
  if(step === 0) return sheet(`<div class="onb">${dots}<div style="text-align:center;font-size:64px">🗺️</div><div class="title-art">MONEY<span>QUEST</span></div>
    <p class="muted" style="text-align:center;margin-bottom:6px">The budget that plays like a game. Bills become quests, debts become bosses, savings become treasure.</p>
    <label class="f">What should we call you, hero?</label><input class="in" id="n" maxlength="24" value="${esc(OB.name)}" placeholder="Your name">
    <div class="actions"><button class="btn ghost" id="demo">Try sample data</button><button class="btn" id="ok">Begin</button></div></div>`, root => {
      root.querySelector("#ok").onclick = () => { OB.name = val(root,"#n") || "Hero"; onboarding(1); };
      root.querySelector("#demo").onclick = () => { demo(); closeSheet(); render(); toast("Sample adventure loaded. Start over any time in Settings.","🧪"); };
      bgLock(root); });
  if(step === 1) return sheet(`<div class="onb">${dots}<h3>Choose your hero</h3><p class="sub">Just for fun. You can change this later.</p>
    <div id="hp"></div>
    <div class="actions"><button class="btn ghost" id="back">Back</button><button class="btn" id="ok">Next</button></div></div>`, root => {
      heroPicker(root.querySelector("#hp"), OB);
      root.querySelector("#back").onclick = () => onboarding(0); root.querySelector("#ok").onclick = () => onboarding(2); bgLock(root); });
  if(step === 2){ OB.cur = OB.cur || guessCur(); if(!OB.next) OB.next = addDays(today(), 14);
    return sheet(`<div class="onb">${dots}<h3>Your paycheck</h3><p class="sub">Money Quest plans one paycheck at a time, so it always knows what is safe to spend until the next one.</p>
    <div class="two"><div><label class="f">Currency</label><select class="in" id="cur">${CURS.map(([c,n])=>`<option value="${c}" ${c===OB.cur?"selected":""}>${c} · ${n}</option>`).join("")}</select></div>
      <div><label class="f">I get paid</label><select class="in" id="fq">${[["weekly","Weekly"],["biweekly","Every 2 weeks"],["fourweekly","Every 4 weeks"],["monthly","Monthly"]].map(([v,l])=>`<option value="${v}" ${v===OB.freq?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="two"><div><label class="f">Take-home pay</label><input class="in" id="am" inputmode="decimal" value="${OB.amount}" placeholder="After tax"></div>
      <div><label class="f">Next payday</label><input class="in" id="nx" type="date" value="${OB.next}"></div></div>
    <p class="note">Paid irregularly? Use your usual amount. You can change it any time.</p>
    <div class="actions"><button class="btn ghost" id="back">Back</button><button class="btn" id="ok">Next</button></div></div>`, root => {
      root.querySelector("#back").onclick = () => onboarding(1);
      root.querySelector("#ok").onclick = () => { OB.cur = val(root,"#cur"); OB.freq = val(root,"#fq"); OB.amount = num(val(root,"#am")); OB.next = val(root,"#nx");
        if(OB.amount <= 0) return toast("Add your take-home pay","💰"); if(!OB.next || OB.next <= today()) return toast("Pick a payday after today","📅"); onboarding(3); };
      bgLock(root); }); }
  if(step === 3) return sheet(`<div class="onb">${dots}<div style="text-align:center;font-size:64px">⚔️</div><h3 style="text-align:center">Your quest begins</h3>
    <p class="sub" style="text-align:center">Next: add your bills, then any debts. Log spends with the gold button. Check in daily to build your streak.</p>
    <div class="actions"><button class="btn full" id="ok">Enter the world</button></div></div>`, root => {
      root.querySelector("#ok").onclick = () => { S = blank(); S.hero = {name:OB.name, avatar:OB.avatar, skin:OB.skin, created:today()}; if(OB.photo) S.hero.photo = OB.photo; S.cur = OB.cur;
        S.pay = {freq:OB.freq, amount:OB.amount, next:OB.next, anchor:parse(OB.next).getDate()}; save(); closeSheet(); tab = "quests"; render(); gain(50, "Quest started"); };
      bgLock(root); });
}
function bgLock(root){ root.onclick = e => e.stopPropagation(); }

/* ───────────────────────── sample data ───────────────────────── */
function demo(){
  const t = today(), D = n => addDays(t, n);
  S = blank(); S.hero = {name:"Sam", avatar:"wizard", skin:SKIN[1], created:D(-40)}; S.cur = guessCur();
  S.pay = {freq:"monthly", amount:2850, next:D(12), anchor:parse(D(12)).getDate()};
  const day = n => parse(D(n)).getDate();
  S.bills = [{id:"b1",name:"Rent",amt:1150,day:day(-17),emoji:"🏠",auto:true},{id:"b2",name:"Phone",amt:42,day:day(-9),emoji:"📱"},
    {id:"b3",name:"Internet",amt:39.99,day:day(2),emoji:"🌐"},{id:"b4",name:"Car insurance",amt:96,day:day(5),emoji:"🚗"},
    {id:"b5",name:"Streaming",amt:15.99,day:day(-3),emoji:"📺"},{id:"b6",name:"Gym",amt:29,day:day(9),emoji:"🏋️"}];
  S.billPaid = {["b1|"+D(-17)]:D(-17), ["b2|"+D(-9)]:D(-9), ["b5|"+D(-3)]:D(-3)};
  S.debts = [{id:"d1",name:"Credit card",bal:2870,start:3240,apr:24.9,min:95,day:day(-2)},{id:"d2",name:"Car loan",bal:7420,start:9800,apr:6.9,min:260,day:day(4)},
    {id:"d3",name:"Store card",bal:0,start:640,apr:29.9,min:35,day:day(6)},{id:"d4",name:"Pay-later plan",bal:210,start:360,apr:0,min:30,day:day(7)}];
  S.debtLog = [{id:"l1",debtId:"d1",amt:120,date:D(-2)}];
  S.goals = [{id:"g1",name:"Emergency fund",target:1000,saved:640,perPay:100,emoji:"🛟"},{id:"g2",name:"Summer trip",target:1200,saved:310,perPay:60,emoji:"✈️"},
    {id:"g3",name:"New laptop",target:900,saved:900,perPay:0,emoji:"💻"}];
  const sp = [[-17,"groceries",64.2,"Weekly shop"],[-15,"food",12.5,"Lunch"],[-14,"transport",45,"Fuel"],[-12,"fun",18,"Cinema"],[-10,"groceries",58.9,"Weekly shop"],
    [-8,"shopping",34.99,"Shoes"],[-6,"food",9.8,"Coffee and cake"],[-5,"health",14.2,"Pharmacy"],[-3,"groceries",71.35,"Big shop"],[-2,"gifts",25,"Birthday card and gift"],
    [-1,"transport",40,"Fuel"],[0,"food",6.4,"Coffee"]];
  S.spends = sp.map(([d,c,a,n],i)=>({id:"s"+i, amt:a, cat:c, note:n, date:D(d), t:i}));
  S.impulses = [{id:"i1",name:"Noise-cancelling headphones",price:129,added:Date.now()-6*36e5,hours:24,status:"waiting"},
    {id:"i2",name:"Mechanical keyboard",price:89,added:Date.now()-50*36e5,hours:48,status:"waiting"},
    {id:"i3",name:"Third water bottle",price:32,added:Date.now()-90*36e5,hours:24,status:"skipped"}];
  S.savedByWaiting = 32; S.xp = 1460; S.streak = {last:D(-1), n:6, best:11};
  for(let i=1;i<=6;i++) S.checkins[D(-i)] = true; S.noSpend = {[D(-4)]:true, [D(-7)]:true, [D(-11)]:true};
  ["first_step","checkin3","streak7","bill5","first_blood","boss_down","loot","goal","jail1","nospend"].forEach((b,i)=> S.badges[b] = D(-30+i*3));
  S.lastPeriodStart = ""; save();
}

/* ───────────────────────── actions ───────────────────────── */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ tab = tb.dataset.tab; closeSheet(); render(); scrollTo({top:0,behavior:"smooth"}); return; }
  if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const a = e.target.closest("[data-act]"); if(!a) return; const id = a.dataset.id, act = a.dataset.act, t = today();
  if(act === "addSpend") spendForm();
  else if(act === "addBill") billForm(); else if(act === "editBill") billForm(S.bills.find(b=>b.id===id));
  else if(act === "pay"){ S.billPaid[id+"|"+a.dataset.d] = t; save(); render(); const late = a.dataset.d < t;
    gain(late ? 10 : 20, late ? "Bill cleared" : "Bill cleared on time"); if(Object.keys(S.billPaid).length >= 5) award("bill5"); }
  else if(act === "unpay"){ delete S.billPaid[id+"|"+a.dataset.d]; save(); render(); }
  else if(act === "delSpend"){ S.spends = S.spends.filter(s=>s.id!==id); save(); render(); }
  else if(act === "checkin"){ if(S.checkins[t]) return; S.checkins[t] = true; const y = addDays(t,-1);
    S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best, S.streak.n); save(); render();
    gain(10 + Math.min(20, S.streak.n), `Day ${S.streak.n} check-in`); if(S.streak.n >= 3) award("checkin3"); if(S.streak.n >= 7) award("streak7"); if(S.streak.n >= 30) award("streak30"); }
  else if(act === "nospend"){ if(S.noSpend[t] || S.spends.some(s=>s.date===t)) return; S.noSpend[t] = true; save(); render(); gain(25, "No-spend day");
    award("nospend"); if(Object.keys(S.noSpend).length >= 5) award("nospend5"); }
  else if(act === "addDebt") debtForm(); else if(act === "editDebt") debtForm(S.debts.find(d=>d.id===id));
  else if(act === "strike") strikeForm(S.debts.find(d=>d.id===id));
  else if(act === "strat"){ S.settings.strategy = a.dataset.v; save(); render(); }
  else if(act === "addGoal") goalForm(); else if(act === "editGoal") goalForm(S.goals.find(g=>g.id===id));
  else if(act === "deposit") depositForm(S.goals.find(g=>g.id===id));
  else if(act === "addImpulse") impulseForm();
  else if(act === "letgo"){ const x = S.impulses.find(i=>i.id===id); x.status = "skipped"; S.savedByWaiting += x.price; save(); render();
    gain(30, `Let go of ${x.name}`); award("jail1"); if(S.impulses.filter(i=>i.status==="skipped").length >= 10) award("jail10"); }
  else if(act === "buyit"){ const x = S.impulses.find(i=>i.id===id); x.status = "bought";
    S.spends.push({id:uid(), amt:x.price, cat:"shopping", note:x.name, date:t, t:Date.now()}); if(S.noSpend[t]) delete S.noSpend[t]; save(); render(); toast("Bought after a cool-off. That is a planned purchase.","🛍️"); }
  else if(act === "badges") badgesView(); else if(act === "settings") settings();
});
document.addEventListener("change", e => { if(e.target.id === "extra"){ S.settings.extra = num(e.target.value); save(); render(); } });
setInterval(() => { document.querySelectorAll(".timer[data-rel]").forEach(el => { const left = +el.dataset.rel - Date.now();
  if(left <= 0){ render(); return; } el.textContent = `${Math.floor(left/36e5)}h ${pad(Math.floor(left%36e5/6e4))}m`; }); }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && S.hero) render(); });

load(); render();
</script>
</body>
</html>
