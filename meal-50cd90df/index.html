<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4ead9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Meal Quest</title>
<style>
:root{
  --bg:#f4ead9;--paper:#fffdf8;--paper2:#f7eee1;--ink:#2b211b;--mut:#6b5d52;--line:rgba(120,80,40,.14);
  --terra:#c4502f;--terra2:#e0704f;--sage:#5f8752;--sage2:#7ea86f;--mustard:#d99a26;--plum:#7d4a63;
  --shadow:rgba(120,80,40,.16);--nav:72px;--r:20px;--sy:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-size:16px;line-height:1.45;background:var(--bg);overflow-x:hidden}
/* morning window light from the top left. Every highlight faces it, every shadow falls down and right */
.light{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 70% at 10% -10%,rgba(255,250,232,.97),rgba(255,244,214,.5) 38%,transparent 64%),
             radial-gradient(90% 60% at 108% 112%,rgba(120,80,40,.20),transparent 70%),var(--bg)}
.panes{position:fixed;left:-12%;top:-6%;width:78%;height:62vh;pointer-events:none;z-index:0;opacity:.55;
  transform:translateY(calc(var(--sy) * -0.08px)) skewX(-16deg);
  background:linear-gradient(90deg,transparent 0 47%,rgba(150,105,60,.10) 47% 50%,transparent 50%),
             linear-gradient(0deg,transparent 0 46%,rgba(150,105,60,.10) 46% 49%,transparent 49%),
             radial-gradient(60% 60% at 40% 40%,rgba(255,255,240,.65),transparent 72%);
  -webkit-mask:linear-gradient(160deg,#000 30%,transparent 85%);mask:linear-gradient(160deg,#000 30%,transparent 85%)}
.ray{position:fixed;left:-30%;top:-20%;width:120%;height:90vh;pointer-events:none;z-index:0;
  background:linear-gradient(118deg,transparent 38%,rgba(255,236,190,.28) 46%,transparent 54%,transparent 60%,rgba(255,236,190,.18) 64%,transparent 70%);
  transform:translateY(calc(var(--sy) * -0.04px))}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0;letter-spacing:-.01em}
.card{position:relative;background:linear-gradient(160deg,var(--paper),var(--paper2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;
  box-shadow:inset 0 1px 0 #fff,6px 10px 22px var(--shadow)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.75),transparent 32%)}
.card>*{position:relative}
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(160deg,#fff7ea,#f1dcc3);box-shadow:inset 0 1px 0 #fff,4px 6px 12px var(--shadow)}
.top .grow{min-width:0}
.top b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,var(--sage2),var(--sage));padding:2px 8px;border-radius:7px;margin-right:6px}
.xpbar{height:6px;border-radius:4px;background:rgba(120,80,40,.12);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mustard),#f0c060);border-radius:4px}
.icb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#fffaf2,#f1e3d0);box-shadow:inset 0 1px 0 #fff,3px 5px 10px var(--shadow);color:var(--mut)}
.icb svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--mut)}
.small{font-size:14px}
.h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 0}
.h h2{font-size:22px}
.h button,.link{color:var(--terra);font-weight:700;font-size:15px;min-height:44px;padding:0 4px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,var(--terra2),var(--terra));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),3px 5px 12px rgba(150,60,30,.28)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:13px}
.btn.ghost{color:var(--ink);background:linear-gradient(160deg,#fffaf2,#f1e3d0);box-shadow:inset 0 1px 0 #fff,3px 5px 10px var(--shadow)}
.btn.sage{background:linear-gradient(180deg,var(--sage2),var(--sage));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),3px 5px 12px rgba(60,90,50,.28)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav b{flex:1;text-align:center;font-size:17px}
.big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;font-weight:700;line-height:1.1}
.tonight{display:flex;gap:14px;align-items:center}
.plate{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 34% 30%,#fff,#f3e7d6 58%,#e5d2b8);box-shadow:inset -3px -4px 8px rgba(120,80,40,.15),inset 2px 2px 3px #fff,5px 8px 14px var(--shadow)}
.day{padding:12px 12px 6px}
.day.today{box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(217,154,38,.6),6px 10px 22px var(--shadow)}
.dayh{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.dayh b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:19px}
.dayh .tag{font-size:12px;font-weight:800;color:#8a5a00;background:rgba(217,154,38,.2);padding:2px 8px;border-radius:7px}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px dashed var(--line);padding:4px}
.slot:first-of-type{border-top:0}
.slot .sl{width:66px;flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.slot .pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;min-height:44px;font-weight:600}
.slot .pick span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pick.empty{color:var(--terra);font-weight:700}
.slot .pick small{color:var(--mut);font-weight:500;font-size:13px;flex:none}
.ck{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid rgba(95,135,82,.45);color:transparent;background:#fffaf2}
.ck svg{width:22px;height:22px}
.ck.on{background:linear-gradient(180deg,var(--sage2),var(--sage));border-color:var(--sage);color:#fff;box-shadow:2px 4px 8px rgba(60,90,50,.3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:15px;background:#fffaf2;border:1.5px solid var(--line);color:var(--ink)}
.chip.on{background:rgba(196,80,47,.12);border-color:var(--terra);color:#8f3418}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.rcard{text-align:left;padding:14px;border-radius:18px;background:linear-gradient(160deg,var(--paper),var(--paper2));border:1px solid var(--line);
  box-shadow:inset 0 1px 0 #fff,5px 8px 16px var(--shadow);min-height:132px;display:flex;flex-direction:column;gap:6px;position:relative}
.rcard .e{font-size:32px}
.rcard b{font-size:16px;line-height:1.2}
.rcard small{color:var(--mut);font-size:13px;margin-top:auto}
.rcard .fav{position:absolute;right:10px;top:10px;font-size:16px}
.in,select.in,textarea.in{width:100%;min-height:48px;border-radius:13px;border:1.5px solid var(--line);background:#fffefb;padding:10px 12px;font:inherit;color:var(--ink)}
textarea.in{min-height:110px;resize:vertical}
.in:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px rgba(196,80,47,.15)}
label.f{display:block;font-size:14px;font-weight:700;margin:16px 2px 6px;color:var(--ink)}
.note{font-size:14px;color:var(--mut);margin:10px 2px 0}
.aisle{margin-top:18px}
.aisle h3{font-size:17px;display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.got .t b{text-decoration:line-through;color:var(--mut)}
.item.have{opacity:.6}
.have-b{min-height:44px;padding:0 10px;border-radius:11px;font-size:13px;font-weight:700;color:var(--mut);background:#fbf3e6;border:1px solid var(--line);flex:none}
.have-b.on{color:#2f5a25;background:rgba(95,135,82,.15);border-color:rgba(95,135,82,.4)}
.cost{font-weight:700;font-size:15px;flex:none;min-width:52px;text-align:right}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:#fffaf2;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:13px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 2px 0;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--sage2),var(--sage));min-height:3px}
.bars .b i.over{background:linear-gradient(180deg,var(--terra2),var(--terra))}
.bars .b small{font-size:12px;color:var(--mut)}
.bars .line{position:absolute;left:0;right:0;border-top:2px dashed rgba(217,154,38,.8)}
.sp{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-height:56px}
.sp:first-child{border-top:0}
.sp .e{font-size:22px;width:30px;text-align:center}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut);flex:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:#fffaf2;border:1px solid var(--line)}
.badge .e{font-size:28px}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge small{display:block;font-size:12px;color:var(--mut);line-height:1.25;margin-top:2px}
.badge.off .e{filter:grayscale(1);opacity:.35}
.empty{text-align:center;color:var(--mut);padding:26px 16px}
.empty .e{font-size:40px;margin-bottom:6px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));height:var(--nav);z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);border-radius:24px;background:rgba(255,251,244,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,8px 14px 30px rgba(120,80,40,.22)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--terra)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(60,40,25,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(170deg,#fffdf8,#f6ecde);border-radius:26px 26px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(60,40,25,.25)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(120,80,40,.25);margin:0 auto 14px}
.sheet h3{font-size:24px}
.sheet .sub{color:var(--mut);margin:6px 0 0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.ingr{display:grid;grid-template-columns:1fr 70px;gap:8px;padding:10px;border-radius:14px;background:#fffaf2;border:1px solid var(--line);margin-top:8px}
.ingr .full{grid-column:1/-1}
.ingr .r3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 44px;gap:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:700;background:#fffaf2;border:1.5px solid var(--line)}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.list-r{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:46vh;overflow:auto}
.pickr{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:6px 10px;border-radius:13px;background:#fffaf2;border:1px solid var(--line)}
.pickr .e{font-size:22px}
.pickr small{color:var(--mut);font-size:13px;margin-left:auto;flex:none}
.ol{margin:8px 0 0;padding-left:22px}.ol li{margin:6px 0}
.ul{margin:8px 0 0;padding:0;list-style:none}.ul li{display:flex;gap:8px;padding:7px 2px;border-top:1px solid var(--line)}.ul li:first-child{border-top:0}
.ul li b{min-width:86px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);
  background:#2b211b;color:#fff6ea;padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:4px 8px 20px rgba(40,25,15,.35)}
.toast em{font-style:normal;color:#ffd27a}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.ob .big{font-size:34px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.steps i{width:28px;height:6px;border-radius:3px;background:rgba(120,80,40,.15)}.steps i.on{background:var(--terra)}
.hero-ill{width:150px;height:150px;margin:0 auto 10px;display:block}
.rescue-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:70;max-width:536px;margin:0 auto;background:#fff3ec;border:2px solid var(--terra);border-radius:16px;padding:14px}
.pic{display:inline-block;object-fit:cover;flex:none;vertical-align:middle;border-radius:8px;box-shadow:2px 3px 6px rgba(120,80,40,.18)}
.slot .pic{width:28px;height:28px;border-radius:8px}
.rcard .pic{width:64px;height:64px;border-radius:14px}
.plate .pic{width:100%;height:100%;border-radius:50%}
.pickr .pic{width:34px;height:34px;border-radius:9px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:15px}
.logo{overflow:hidden}
.photo-tile{display:flex;align-items:center;gap:12px;margin-top:10px}
.photo-tile img{width:72px;height:72px;border-radius:14px;object-fit:cover;box-shadow:3px 5px 10px rgba(120,80,40,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){#dust,.ray,.panes{display:none}}
</style>
</head>
<body>
<div class="light"></div><div class="panes"></div><div class="ray"></div><canvas id="dust" aria-hidden="true"></canvas>
<main id="app"></main>
<nav id="nav" aria-label="Main"></nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<script>
"use strict";
/* ───────── data ───────── */
const KEY = "mealquest.v1", RESCUE = KEY + ".rescue";
const AISLES = [["P","🥕","Fruit and veg"],["M","🥩","Meat and fish"],["D","🧀","Dairy and chilled"],["B","🍞","Bread and bakery"],["T","🥫","Tins and jars"],
  ["G","🍚","Pasta, rice and dry"],["F","🧊","Frozen"],["S","🥤","Snacks and drinks"],["H","🧽","Household"],["O","🛒","Other"]];
const UNITS = ["x","g","kg","ml","l","tsp","tbsp","tin","pack","clove","bunch","cup"];
const WHOLE = ["x","tin","pack","bunch","clove"];
const SLOTS = [["b","Breakfast"],["l","Lunch"],["d","Dinner"]];
const EMOJI = ["🍝","🍛","🌶️","🥘","🐟","🥢","🌮","🍲","🥔","🍳","🥣","🥪","🥗","🍕","🍔","🍜","🥧","🍗","🥙","🍚"];
const TAGS = ["Quick","Budget","Veggie","Batch","Breakfast","Lunchbox"];
const CURS = ["£","$","€","A$","C$","NZ$","R","₹"];
const blank = () => ({v:1, hero:null, ready:false, step:0, settings:{cur:"£", budget:60, people:2, slots:{b:false, l:true, d:true}, ws:1},
  recipes:[], plan:{}, lists:{}, spend:[], wbud:{}, photo:"", xp:0, badges:{}, caps:{}, flags:{}, sample:false});
let S, RESCUED = null;
const isObj = o => o && typeof o === "object" && !Array.isArray(o);
const isD = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
const num = (v, d, lo, hi) => { v = +v; return isFinite(v) && v >= lo && v <= hi ? v : d; };
const str = (v, n) => String(v == null ? "" : v).slice(0, n);
function normIng(i){ return {id: typeof i.id === "string" ? i.id : uid(), name: str(i.name, 60).trim() || "Item", qty: num(i.qty, 1, 0, 100000),
  unit: UNITS.includes(i.unit) ? i.unit : "x", aisle: AISLES.some(a => a[0] === i.aisle) ? i.aisle : "O", cost: num(i.cost, 0, 0, 100000)}; }
function normalize(){
  const B = blank(); S.v = 1;
  ["recipes","spend"].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; S[k] = S[k].filter(isObj); });
  ["plan","lists","wbud","badges","caps","flags"].forEach(k => { if(!isObj(S[k])) S[k] = {}; });
  if(!isObj(S.settings)) S.settings = {}; const st = S.settings;
  st.cur = CURS.includes(st.cur) ? st.cur : "£"; st.budget = num(st.budget, 60, 0, 100000); st.people = Math.round(num(st.people, 2, 1, 20)); st.ws = st.ws === 0 ? 0 : 1;
  if(!isObj(st.slots)) st.slots = Object.assign({}, B.settings.slots); SLOTS.forEach(([k]) => st.slots[k] = !!st.slots[k]); if(!SLOTS.some(([k]) => st.slots[k])) st.slots.d = true;
  if(S.hero !== null && (!isObj(S.hero) || typeof S.hero.name !== "string")) S.hero = {name:"Friend"};
  S.ready = !!S.ready && !!S.hero; S.step = Math.round(num(S.step, 0, 0, 3)); S.xp = Math.max(0, Math.round(num(S.xp, 0, 0, 1e9))); S.sample = !!S.sample;
  S.recipes = S.recipes.map(r => ({id: typeof r.id === "string" ? r.id : uid(), name: str(r.name, 60).trim() || "Recipe", emoji: EMOJI.includes(r.emoji) ? r.emoji : "🍲",
    serves: Math.round(num(r.serves, 4, 1, 50)), mins: Math.round(num(r.mins, 0, 0, 1440)), tags: Array.isArray(r.tags) ? r.tags.filter(t => TAGS.includes(t)) : [],
    ing: Array.isArray(r.ing) ? r.ing.filter(isObj).map(normIng) : [], steps: str(r.steps, 4000), fav: !!r.fav, own: !!r.own, made: Math.round(num(r.made, 0, 0, 1e6)), photo: okPhoto(r.photo)}));
  S.photo = okPhoto(S.photo);
  Object.keys(S.plan).forEach(d => { const day = S.plan[d]; if(!isD(d) || !isObj(day)){ delete S.plan[d]; return; }
    Object.keys(day).forEach(k => { const s = day[k]; if(!SLOTS.some(x => x[0] === k) || !isObj(s) || !["r","left","out"].includes(s.k)){ delete day[k]; return; }
      if(s.k === "r" && !S.recipes.some(r => r.id === s.rid)){ delete day[k]; return; }
      s.n = Math.round(num(s.n, st.people, 1, 50)); s.c = !!s.c; s.p = !!s.p; });
    if(!Object.keys(day).length) delete S.plan[d]; });
  Object.keys(S.lists).forEach(w => { const l = S.lists[w]; if(!isD(w) || !isObj(l)){ delete S.lists[w]; return; }
    ["have","got"].forEach(k => { if(!isObj(l[k])) l[k] = {}; });
    l.extra = Array.isArray(l.extra) ? l.extra.filter(isObj).map(e => ({id: typeof e.id === "string" ? e.id : uid(), name: str(e.name, 60).trim() || "Item",

    rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));

/* ───────── dates and money ───────── */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const weekStart = s => { const d = parse(s), ws = S.settings.ws, k = (d.getDay() - ws + 7) % 7; d.setDate(d.getDate() - k); return iso(d); };
const monOf = s => { const d = parse(s), k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return iso(d); };
const fkey = ws => monOf(addDays(ws, 3));   /* the same key whichever day the week starts, so switching it never pays twice */
const days7 = ws => Array.from({length:7}, (_, i) => addDays(ws, i));
const dname = (s, o) => parse(s).toLocaleDateString(undefined, o || {weekday:"short", day:"numeric"});
const wrange = ws => { const a = parse(ws), b = parse(addDays(ws, 6)), m = d => d.toLocaleDateString(undefined, {month:"short"});
  return m(a) === m(b) ? `${m(a)} ${a.getDate()}–${b.getDate()}` : `${m(a)} ${a.getDate()} – ${m(b)} ${b.getDate()}`; };
const money = n => { n = +n || 0; const neg = n < 0; n = Math.abs(n); const s = n >= 1000 ? Math.round(n).toLocaleString() : n.toFixed(2); return (neg ? "−" : "") + S.settings.cur + s; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtQ = q => String(Math.round(q * 100) / 100);
const unitTxt = (q, u) => u === "x" ? fmtQ(q) : `${fmtQ(q)} ${u}${(["tin","pack","clove","bunch","cup"].includes(u) && q !== 1) ? "s" : ""}`;
const recOf = id => S.recipes.find(r => r.id === id);
const recCost = (r, n) => r.ing.reduce((a, i) => a + i.cost, 0) * (n || r.serves) / r.serves;
const weekBudget = ws => { const k = fkey(ws); return k in S.wbud ? +S.wbud[k] : S.settings.budget; };
const spendIn = ws => { const e = addDays(ws, 7); return S.spend.filter(x => x.date >= ws && x.date < e); };

/* ───────── XP, levels, badges ───────── */
const lvlOf = xp => Math.floor((Math.sqrt(1 + 8 * xp / 100) - 1) / 2) + 1;
const xpAt = l => 50 * l * (l - 1);
const TITLES = ["Toast Maker","Pan Starter","Home Cook","Batch Boss","Spice Ranger","Kitchen Captain","Head Chef","Feast Master"];
const BADGES = [
  ["first_plan","📝","First plan","Plan your first meal"], ["full_week","🗓️","Week sorted","Plan every dinner in a week"],
  ["first_cook","🍳","First cook","Cook a planned meal"], ["cook10","👩‍🍳","Home cook","Cook 10 planned meals"], ["cook50","🔥","Kitchen hero","Cook 50 planned meals"],
  ["cookweek","⭐","Cooked all week","Cook 5 planned dinners in one week"], ["recipe5","📖","Recipe box","Save 5 of your own recipes"], ["recipe15","📚","Cookbook","Save 15 of your own recipes"],
  ["shop1","🧺","List done","Tick off a whole shopping list"], ["budget1","💰","Under budget","Finish a week under your food budget"],
  ["budget3","🏆","Steady hands","3 weeks under your food budget"], ["leftover5","🥡","No waste","Plan leftovers 5 times"]];
function toast(html, ms){ document.querySelectorAll(".toast").forEach(e => e.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = html; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }
function gain(n, why){ const b = lvlOf(S.xp); S.xp = Math.max(0, S.xp + n); save(); const a = lvlOf(S.xp);
  if(n > 0) toast(`+${n} XP <em>${esc(why)}</em>`); if(a > b) setTimeout(() => toast(`Level ${a}! You're a <em>${TITLES[Math.min(a, TITLES.length) - 1]}</em>`, 3200), 1400); }
function award(id){ if(S.badges[id]) return; S.badges[id] = today(); save(); const b = BADGES.find(x => x[0] === id); if(b) setTimeout(() => toast(`${b[1]} Badge: <em>${esc(b[2])}</em>`, 3000), 900); }
function capOk(key, max){ const t = today(); let c = S.caps[key]; if(!isObj(c) || c.day !== t) c = S.caps[key] = {day:t, n:0}; if(c.n >= max) return false; c.n++; return true; }
function capBack(key){ const c = S.caps[key]; if(isObj(c) && c.day === today() && c.n > 0) c.n--; }
const cookedCount = () => { let n = 0; Object.values(S.plan).forEach(d => Object.values(d).forEach(s => { if(s.k === "r" && s.c) n++; })); return n; };
function checkBadges(){
  const own = S.recipes.filter(r => r.own).length, cooked = cookedCount(); let left = 0;
  Object.values(S.plan).forEach(d => Object.values(d).forEach(s => { if(s.k === "left") left++; }));
  if(Object.keys(S.plan).length) award("first_plan"); if(cooked >= 1) award("first_cook"); if(cooked >= 10) award("cook10"); if(cooked >= 50) award("cook50");
  if(own >= 5) award("recipe5"); if(own >= 15) award("recipe15"); if(left >= 5) award("leftover5");
}
/* once a week has ended: under budget pays once, if you logged a shop and cooked at least 3 planned meals */
function settleWeeks(){
  const cur = weekStart(today()), seen = new Set();
  S.spend.forEach(x => { const ws = weekStart(x.date); if(ws >= cur || seen.has(ws)) return; seen.add(ws);
    const k = "ub|" + fkey(ws); if(S.flags[k]) return;
    const sp = spendIn(ws), shops = sp.filter(x => x.kind === "shop").length, tot = sp.reduce((a, x) => a + x.amt, 0);
    const cooked = days7(ws).reduce((a, d) => a + Object.values(S.plan[d] || {}).filter(s => s.k === "r" && s.c).length, 0);
    if(shops && cooked >= 3 && tot <= weekBudget(ws)){ S.flags[k] = today(); const n = Object.keys(S.flags).filter(f => f.startsWith("ub|")).length;
      gain(50, `${wrange(ws)} under budget`); award("budget1"); if(n >= 3) award("budget3"); } });
}

/* ───────── shopping list: built from the week's plan, same items added together ───────── */
function buildList(ws){
  const map = {}, L = S.lists[ws] || {have:{}, got:{}, extra:[]};
  days7(ws).forEach(d => Object.values(S.plan[d] || {}).forEach(s => { if(s.k !== "r") return; const r = recOf(s.rid); if(!r) return; const f = s.n / r.serves;
    r.ing.forEach(i => { const k = i.name.toLowerCase().trim() + "|" + i.unit; const m = map[k] || (map[k] = {k, name:i.name, unit:i.unit, aisle:i.aisle, qty:0, cost:0, from:[]});
      m.qty += i.qty * f; m.cost += i.cost * f; if(!m.from.includes(r.name)) m.from.push(r.name); }); }));
  const items = Object.values(map).map(m => Object.assign(m, {have: !!L.have[m.k], got: !!L.got[m.k]}));
  return {items, extra:L.extra, L};
}
function listFor(ws){ return S.lists[ws] || (S.lists[ws] = {have:{}, got:{}, extra:[]}); }
const estShop = ws => { const {items, extra} = buildList(ws); return items.filter(i => !i.have).reduce((a, i) => a + i.cost, 0) + extra.reduce((a, e) => a + e.cost, 0); };
