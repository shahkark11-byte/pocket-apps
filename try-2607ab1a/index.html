:root{
  --bg1:#140d33;--bg2:#24145c;--ink:#f5f1ff;--mut:#b4a9d9;--dim:#7d72a8;
  --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --gold:#ffc94a;--gold2:#ff9f43;--mint:#4be3a5;--coral:#ff6b7a;--violet:#9b7bff;--sky:#5ec8ff;
  --r:22px;--nav:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#3b1f8f 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#0f4a6b 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 44%,#ffe9a8 50%,transparent 51%),
  radial-gradient(1px 1px at 34% 62%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 86%,#cfc2ff 50%,transparent 51%),
  radial-gradient(1px 1px at 6% 78%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 46% 30%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 94% 90%,#fff 50%,transparent 51%);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:620px;margin:0 auto;padding:18px 16px calc(var(--nav) + 40px);position:relative}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ava{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffd76a,#ff8f4a);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(255,160,60,.35),inset 0 -3px 0 rgba(0,0,0,.15);flex:none;overflow:hidden}
.ava svg{width:48px;height:48px}
.ava-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava.photo{background:none;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(255,160,60,.35)}
.who{flex:1;min-width:0}
.who b{font-size:19px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:13px;font-weight:500}
.xpbar{height:9px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--sky));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.lvl{font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--gold);color:#3a2300;padding:3px 8px;border-radius:8px;margin-right:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.h h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.h button,.link{color:var(--gold);font-weight:600;font-size:14px}
.muted{color:var(--mut)}.dim{color:var(--dim)}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gold{background:linear-gradient(180deg,#fff1b8,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{color:var(--coral)}.pos{color:var(--mint)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,#ffd76a,#ffb238);color:#3a2300;box-shadow:0 6px 0 #b9741a,0 10px 24px rgba(255,170,60,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b9741a}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#7ff0c3,#2fcf8d);color:#073a26;box-shadow:0 6px 0 #1d8f5f}
.btn.red{background:linear-gradient(180deg,#ff8f9a,#f0566a);color:#3a0710;box-shadow:0 6px 0 #a3283a}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
/* hero stat */

<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
"use strict";
/* ───────────────────────── storage ───────────────────────── */
const KEY = "moneyquest.v1";
const blank = () => ({v:1, hero:null, cur:"USD", pay:{freq:"monthly", amount:0, next:"", anchor:1},
  bills:[], billPaid:{}, spends:[], debts:[], debtLog:[], goals:[], goalLog:[], impulses:[],
  xp:0, streak:{last:"", n:0, best:0}, badges:{}, checkins:{}, noSpend:{}, savedByWaiting:0,
  settings:{strategy:"snowball", extra:0}, lastPeriodStart:"", allowances:[]});
let S;
function load(){ try{ S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); }catch(e){ S = blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device","⚠️"); } }
const uid = () => Math.random().toString(36).slice(2,10);

/* ───────────────────────── dates ───────────────────────── */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dim = (y,m) => new Date(y, m+1, 0).getDate();
function addMonths(s, n, anchor){ const d = parse(s); const y = d.getFullYear(), m = d.getMonth()+n;
  const t = new Date(y, m, 1); const day = Math.min(anchor || d.getDate(), dim(t.getFullYear(), t.getMonth()));
  return iso(new Date(t.getFullYear(), t.getMonth(), day)); }
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmtDate = (s, o={day:"numeric", month:"short"}) => parse(s).toLocaleDateString(undefined, o);
const STEP = {weekly:7, biweekly:14, fourweekly:28};
const advance = s => S.pay.freq==="monthly" ? addMonths(s,1,S.pay.anchor) : addDays(s, STEP[S.pay.freq]);
const retreat = s => S.pay.freq==="monthly" ? addMonths(s,-1,S.pay.anchor) : addDays(s, -STEP[S.pay.freq]);

/* ───────────────────────── money ───────────────────────── */
const CURS = [["USD","US dollar"],["GBP","British pound"],["EUR","Euro"],["CAD","Canadian dollar"],["AUD","Australian dollar"],
  ["NZD","New Zealand dollar"],["INR","Indian rupee"],["PKR","Pakistani rupee"],["AED","UAE dirham"],["SAR","Saudi riyal"],
  ["ZAR","South African rand"],["SGD","Singapore dollar"],["MYR","Malaysian ringgit"],["NGN","Nigerian naira"],["PHP","Philippine peso"]];
function money(n, dp){ n = +n || 0; const whole = dp===0 || (dp===undefined && Math.abs(n) >= 1000);
  try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur,maximumFractionDigits:whole?0:2,minimumFractionDigits:whole?0:2}).format(n); }
  catch(e){ return (n<0?"-":"") + Math.abs(n).toFixed(whole?0:2); } }
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = a => a.reduce((t,x)=>t+(+x||0),0);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ───────────────────────── pay period engine ───────────────────────── */
function period(){
  if(!S.pay.next) return null;
  const t = today(); let next = S.pay.next, rolled = false;
  while(next <= t){ next = advance(next); rolled = true; }
  if(rolled){ const oldStart = S.lastPeriodStart; S.pay.next = next; const start = retreat(next);
    if(oldStart && oldStart !== start) onRollover(oldStart);
    S.lastPeriodStart = start; save(); }
  const start = retreat(next);
  if(!S.lastPeriodStart){ S.lastPeriodStart = start; save(); }
  return {start, end:next};
}
const inP = (d,p) => d >= p.start && d < p.end;
function occurrences(day, p){ // every date with this day-of-month inside [start,end)
  const out = []; let d = parse(p.start); d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = parse(p.end);
  while(d < end){ const o = iso(new Date(d.getFullYear(), d.getMonth(), Math.min(day, dim(d.getFullYear(), d.getMonth()))));
    if(inP(o,p)) out.push(o); d = new Date(d.getFullYear(), d.getMonth()+1, 1); }
  return out;
}
function plan(p){
  p = p || period(); if(!p) return null;
  const bills = []; S.bills.forEach(b => occurrences(b.day,p).forEach(d => bills.push({b, d, paid: !!S.billPaid[b.id+"|"+d]})));
  bills.sort((a,b) => a.d < b.d ? -1 : 1);
  const mins = []; S.debts.filter(d => d.bal > 0).forEach(d => occurrences(d.day||1,p).forEach(o => mins.push({d, o, amt: Math.min(d.min, d.bal)})));
  const live = S.goals.filter(g => g.saved < g.target);
  const billsDue = sum(bills.map(x=>x.b.amt)), minsDue = sum(mins.map(x=>x.amt)), saveSet = sum(live.map(g=>g.perPay||0));
  const daysLeft = Math.max(1, daysBetween(today(), p.end));
  const allow = S.allowances.map(a => { const used = sum(S.spends.filter(s=>inP(s.date,p) && s.cat === a.cat).map(s=>s.amt));
    return {a, used, left: a.amt - used, over: Math.max(0, used - a.amt)}; });
  const allowSet = sum(S.allowances.map(a=>a.amt));
  const budget = S.pay.amount - billsDue - minsDue - saveSet - allowSet;
  const covered = new Set(S.allowances.map(a=>a.cat));
  const spentFree = sum(S.spends.filter(s=>inP(s.date,p) && !covered.has(s.cat)).map(s=>s.amt));
  const spent = spentFree + sum(allow.map(x=>x.over)); // what came out of spending money
  const spentAll = sum(S.spends.filter(s=>inP(s.date,p)).map(s=>s.amt)); // everything logged
  const debtPaid = sum(S.debtLog.filter(l=>inP(l.date,p)).map(l=>l.amt));
  const deposits = sum(S.goalLog.filter(l=>inP(l.date,p)).map(l=>l.amt));
  const extra = Math.max(0, debtPaid - minsDue) + Math.max(0, deposits - saveSet);
  const left = budget - spent - extra;
  const length = Math.max(1, daysBetween(p.start, p.end));
  allow.forEach(x => x.perDay = Math.max(0, x.left)/daysLeft);
  return {p, bills, mins, billsDue, minsDue, saveSet, budget, spent, extra, left, daysLeft, length, perDay: left/daysLeft, allow, allowSet, spentAll};
}
function onRollover(start){ // the period that just ended
  const end = advance(start); const pl = plan({start, end});

function gain(n, why){

  toast(`<em>+${n} XP</em> ${esc(why)}`, "✨"); coins(Math.min(14, 4 + Math.round(n/10)));

function toast(html, icon="✨"){ const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${icon}</span><span>${html}</span>`;
  document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(), 2900); }
function coins(n, x, y){ x = x ?? innerWidth/2; y = y ?? innerHeight*0.35;
  for(let i=0;i<n;i++){ const c = document.createElement("div"); c.className = "coin"; c.style.left = x+"px"; c.style.top = y+"px"; document.body.appendChild(c);
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*90;
    c.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d - 40}px) scale(.6)`,opacity:1,offset:.6},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 120}px) scale(.3)`,opacity:0}],{duration:900+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => c.remove(); } }
function damage(n, el){ const r = el.getBoundingClientRect(); const d = document.createElement("div"); d.className = "dmg"; d.textContent = "-" + money(n, 0);
  d.style.left = (r.left + r.width/2 - 30) + "px"; d.style.top = (r.top + 10) + "px"; document.body.appendChild(d); setTimeout(()=>d.remove(), 1100);
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function sheet(html, onMount){ const old = document.getElementById("sheet"); closeSheet(); const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  if(old) bg.style.animation = "none";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${old ? 'style="animation:none"' : ""}>${html}</div>`;
  bg.addEventListener("click", e => { if(e.target === bg) closeSheet(); }); document.body.appendChild(bg);
  const f = bg.querySelector("input:not([type=hidden])"); if(f && innerWidth > 700) setTimeout(()=>f.focus(), 250);
  onMount && onMount(bg); return bg; }
function closeSheet(){ const s = document.getElementById("sheet"); if(s) s.remove(); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* ───────────────────────── hero picker (photo stays on the device) ───────────────────────── */
function readPhoto(file){ return new Promise((res, rej) => {
  const bad = () => { toast("That picture could not be opened","⚠️"); rej(new Error("photo")); };
  if(!file || (file.type && !/^image\//.test(file.type))) return bad();
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { try{ const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h); if(!s) throw 0;
      const c = document.createElement("canvas"); c.width = c.height = 192;
      c.getContext("2d").drawImage(im, (w - s)/2, (h - s)/2, s, s, 0, 0, 192, 192);
      res(c.toDataURL("image/jpeg", 0.85)); }
    catch(e){ bad(); } finally{ URL.revokeObjectURL(url); } };
  im.onerror = () => { URL.revokeObjectURL(url); bad(); };
  im.src = url; }); }
/* st = {avatar, skin, photo}; edits st in place and redraws itself inside box */
function heroPicker(box, st, onChange){
  const draw = () => {
    const isPhoto = st.avatar === "photo";
    box.innerHTML = `<div class="ava-pick">${["knight","wizard","rogue","ranger"].map(k=>`<button type="button" class="${k===st.avatar?"on":""}" data-k="${k}" aria-label="${k}">${avatar(k, st.skin)}</button>`).join("")}
      <button type="button" class="${isPhoto?"on":""}" data-photo aria-label="Your photo">${st.photo ? `<img src="${st.photo}" alt="">` : `<span class="ph">${I.cam}Photo</span>`}</button></div>
      <input type="file" accept="image/*" hidden data-file>
      ${isPhoto ? `<div class="hp-photo"><p class="note">Your photo stays on this device. It is never uploaded.</p><button type="button" class="btn ghost sm" data-rm>Remove photo</button></div>`
        : `<label class="f">Skin tone</label><div class="cats">${SKIN.map(s=>`<button type="button" class="cat ${s===st.skin?"on":""}" data-s="${s}" style="width:46px;height:40px;background:${s}"></button>`).join("")}</div>`}`;
    const changed = () => { draw(); onChange && onChange(); };
    const file = box.querySelector("[data-file]");
    box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { st.avatar = b.dataset.k; changed(); });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.skin = b.dataset.s; changed(); });
    box.querySelector("[data-photo]").onclick = () => { if(st.photo && !isPhoto){ st.avatar = "photo"; changed(); } else file.click(); };
    file.onchange = () => { const f = file.files[0]; file.value = ""; if(!f) return;
      readPhoto(f).then(url => { st.photo = url; st.avatar = "photo"; changed(); }).catch(()=>{}); };
    const rm = box.querySelector("[data-rm]"); if(rm) rm.onclick = () => { st.photo = ""; st.avatar = "knight"; changed(); };
  };
  draw(); }

function billRow(x){ const t = today(); const late = !x.paid && x.d < t, soon = !x.paid && !late && daysBetween(t, x.d) <= 3;

function nsRuns(){
  const ks = Object.keys(S.noSpend).filter(k=>S.noSpend[k]).sort(); let best = 0, run = 0, prev = "";
  ks.forEach(k => { run = prev && addDays(prev,1) === k ? run + 1 : 1; if(run > best) best = run; prev = k; });
  const t = today(); let d = S.noSpend[t] ? t : addDays(t,-1), cur = 0;
  while(S.noSpend[d]){ cur++; d = addDays(d,-1); }
  return {cur, best};

function payoff(strategy, extra){
  const ds = S.debts.filter(d=>d.bal>0).map(d=>({id:d.id, bal:d.bal, apr:d.apr, min:d.min}));
  if(!ds.length) return {months:0, interest:0, order:[], done:{}};
  const order = [...ds].sort((a,b)=> strategy==="avalanche" ? b.apr - a.apr || a.bal - b.bal : a.bal - b.bal || b.apr - a.apr).map(d=>d.id);
  const pool0 = sum(ds.map(d=>d.min)) + (+extra||0); let m = 0, interest = 0; const done = {};
  while(ds.some(d=>d.bal>0.005) && m < 600){ m++; let pool = pool0;
    ds.forEach(d => { if(d.bal>0){ const i = d.bal*d.apr/1200; interest += i; d.bal += i; } });
    ds.forEach(d => { if(d.bal>0){ const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; } });
    for(const id of order){ const d = ds.find(x=>x.id===id); if(d.bal>0 && pool>0){ const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    ds.forEach(d => { if(d.bal<=0.005 && !done[d.id]) done[d.id] = m; });
    if(pool0 <= sum(ds.filter(d=>d.bal>0).map(d=>d.bal*d.apr/1200)) && m > 1) return {months:Infinity, interest, order, done}; }
  return {months:m, interest, order, done};
}

/* ───────────────────────── actions ───────────────────────── */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ tab = tb.dataset.tab; closeSheet(); render(); scrollTo({top:0,behavior:"smooth"}); return; }
  if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const a = e.target.closest("[data-act]"); if(!a) return; const id = a.dataset.id, act = a.dataset.act, t = today();
  if(act === "addSpend") spendForm();
  else if(act === "addBill") billForm(); else if(act === "editBill") billForm(S.bills.find(b=>b.id===id));
  else if(act === "pay"){ S.billPaid[id+"|"+a.dataset.d] = t; save(); render(); const late = a.dataset.d < t;
    gain(late ? 10 : 20, late ? "Bill cleared" : "Bill cleared on time"); if(Object.keys(S.billPaid).length >= 5) award("bill5"); }
  else if(act === "unpay"){ delete S.billPaid[id+"|"+a.dataset.d]; save(); render(); }
  else if(act === "delSpend"){ S.spends = S.spends.filter(s=>s.id!==id); save(); render(); }
  else if(act === "checkin"){ if(S.checkins[t]) return; S.checkins[t] = true; const y = addDays(t,-1);
    S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best, S.streak.n); save(); render();
    gain(10 + Math.min(20, S.streak.n), `Day ${S.streak.n} check-in`); if(S.streak.n >= 3) award("checkin3"); if(S.streak.n >= 7) award("streak7"); if(S.streak.n >= 30) award("streak30"); }
  else if(act === "nospend"){ if(S.noSpend[t] || S.spends.some(s=>s.date===t)) return; S.noSpend[t] = true; save(); render(); gain(25, "No-spend day");
    award("nospend"); if(Object.keys(S.noSpend).length >= 5) award("nospend5"); }
  else if(act === "addAllow") allowForm(); else if(act === "editAllow") allowForm(S.allowances.find(x=>x.id===id));
  else if(act === "addDebt") debtForm(); else if(act === "editDebt") debtForm(S.debts.find(d=>d.id===id));
  else if(act === "strike") strikeForm(S.debts.find(d=>d.id===id));
  else if(act === "strat"){ S.settings.strategy = a.dataset.v; save(); render(); }
  else if(act === "addGoal") goalForm(); else if(act === "editGoal") goalForm(S.goals.find(g=>g.id===id));
  else if(act === "deposit") depositForm(S.goals.find(g=>g.id===id));
  else if(act === "addImpulse") impulseForm();
  else if(act === "letgo"){ const x = S.impulses.find(i=>i.id===id); x.status = "skipped"; S.savedByWaiting += x.price; save(); render();
    gain(30, `Let go of ${x.name}`); award("jail1"); if(S.impulses.filter(i=>i.status==="skipped").length >= 10) award("jail10"); }
  else if(act === "buyit"){ const x = S.impulses.find(i=>i.id===id); x.status = "bought";
    S.spends.push({id:uid(), amt:x.price, cat:"shopping", note:x.name, date:t, t:Date.now()}); if(S.noSpend[t]) delete S.noSpend[t]; save(); render(); toast("Bought after a cool-off. That is a planned purchase.","🛍️"); }
  else if(act === "nsPrev"){ nsMonth = addMonths((nsMonth || t.slice(0,7)) + "-01", -1, 1).slice(0,7); render(); }
  else if(act === "nsNext"){ const m = addMonths((nsMonth || t.slice(0,7)) + "-01", 1, 1).slice(0,7); nsMonth = m >= t.slice(0,7) ? "" : m; render(); }
  else if(act === "badges") badgesView(); else if(act === "settings") settings();
});
document.addEventListener("change", e => { if(e.target.id === "extra"){ S.settings.extra = num(e.target.value); save(); render(); } });
setInterval(() => { document.querySelectorAll(".timer[data-rel]").forEach(el => { const left = +el.dataset.rel - Date.now();
  if(left <= 0){ render(); return; } el.textContent = `${Math.floor(left/36e5)}h ${pad(Math.floor(left%36e5/6e4))}m`; }); }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && S.hero) render(); });

load(); render();
</script>

(function(){
  var DEMO_ID = "2607ab1a", LIMIT_MS = 1800000, EXPIRES = 1793554648000, BUY = "https://www.etsy.com/listing/4598845943", NAME = "Money Quest";
  var MIN_TXT = "30", DAYS_TXT = "2";
  var KEY = "mpc.demo." + DEMO_ID, first = Date.now(), ov = null, pill = null, timer = null;
  function getFirst(){
    try { var v = localStorage.getItem(KEY); if(v && !isNaN(+v)) return +v; } catch(e) {}
    try { localStorage.setItem(KEY, String(first)); } catch(e) {}
    return first;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function block(e){
    if(!ov || ov.contains(e.target)) return;
    e.stopPropagation(); e.preventDefault();
  }
  function lock(h, text){
    if(ov) return;
    if(timer){ clearInterval(timer); timer = null; }
    if(pill){ pill.remove(); pill = null; }
    ov = document.createElement("div"); ov.id = "mpc-demo-ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
    ov.innerHTML = '<div class="card"><h2>' + esc(h) + '</h2><p>' + esc(text) + '</p><a href="' + esc(BUY) + '" target="_top" rel="noopener">Get ' + esc(NAME) + ' on Etsy</a></div>';
    document.body.appendChild(ov);
    try { if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch(e) {}
    ["click","dblclick","mousedown","mouseup","pointerdown","pointerup","touchstart","touchend","touchmove","keydown","keyup","keypress","contextmenu","submit","wheel"].forEach(function(t){
      window.addEventListener(t, block, {capture: true, passive: false});
    });
    Array.prototype.forEach.call(document.body.children, function(c){ if(c !== ov) try { c.inert = true; } catch(e) {} });
  }
  function ended(){ lock("Your " + MIN_TXT + "-minute demo has ended", "Thanks for trying " + NAME + ". Get the full app from Mercer Planner Co on Etsy."); }
  function expired(){ lock("This demo link has expired", "Demo links last " + DAYS_TXT + " days. " + NAME + " is available from Mercer Planner Co on Etsy."); }
  function tick(){
    if(ov) return;
    var now = Date.now();
    if(now > EXPIRES){ expired(); return; }
    var left = LIMIT_MS - (now - first);
    if(left <= 0){ ended(); return; }
    if(!pill){ pill = document.createElement("div"); pill.id = "mpc-demo-pill"; document.body.appendChild(pill); }
    pill.textContent = "Demo · " + Math.ceil(left / 60000) + " min left";
    pill.className = left < 300000 ? "low" : "";
  }
  function start(){
    if(Date.now() > EXPIRES){ expired(); return; }
    first = getFirst();
    tick();
    if(!ov) timer = setInterval(tick, 15000);
    document.addEventListener("visibilitychange", tick);
  }
  start();
})();
